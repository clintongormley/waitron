<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="text-scale" content="scale" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/till/manifest.webmanifest" />
    <title>Waitron Till</title>
    <style>
      /* Room to scroll a field up to the top of what a keyboard drawn over the page leaves. */
      html {
        padding-bottom: var(--wt-keyboard-inset, 0px);
      }

      body {
        box-sizing: border-box;
        height: 100dvh;
        margin: 0;
        --wt-page-padding: 24px;
        padding: var(--wt-page-padding);
        background: var(--wt-color-bg);
        color: var(--wt-color-text);
        font-family: var(--wt-font-family);
        font-size: var(--wt-font-size-md);
        font-weight: var(--wt-font-weight-normal);
      }

      #app {
        height: 100%;
      }

      @media (max-width: 40rem) {
        body {
          --wt-page-padding: var(--wt-space-2);
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
