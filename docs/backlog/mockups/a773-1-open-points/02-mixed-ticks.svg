<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1240" viewBox="0 0 1600 1240" role="img" aria-labelledby="title desc"><title id="title">2 of 6. Can you select new and sent dishes together?</title><desc id="desc">On Table 4 you tick a new Croquetas, then tick a sent, held Entrecot. Grill allows changes after sending. You want to fire both. All options are proposals awaiting the owner.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#16181d}</style>
<rect x="0" y="0" width="1600" height="1240" rx="0" fill="#f7f7f8" stroke="#d6d9e0"/>
<text x="40" y="52" font-size="36" font-weight="700">2 of 6 · Can you select new and sent dishes together?</text>
<text x="40" y="96" font-size="23" font-weight="400" style="fill:#5c626e">On Table 4 you tick a new Croquetas, then tick a sent, held Entrecot. Grill allows changes after sending. You</text>
<text x="40" y="128" font-size="23" font-weight="400" style="fill:#5c626e">want to fire both.</text>
<text x="40" y="168" font-size="19" font-weight="400" style="fill:#8a5300">PROPOSALS · awaiting your answer · illustrative wording</text>
<rect x="40" y="206" width="740" height="960" rx="12" fill="#ffffff" stroke="#d6d9e0"/>
<text x="64" y="250" font-size="27" font-weight="700">A · One kind of selection at a time</text>
<text x="64" y="288" font-size="22" font-weight="400" style="fill:#5c626e">Plan proposal: ticking a sent dish unticks the new</text>
<text x="64" y="319" font-size="22" font-weight="400" style="fill:#5c626e">dish.</text>
<text x="68" y="365" font-size="27" font-weight="700">Table 4 · Bill 1</text>
<rect x="68" y="393" width="684" height="52" rx="8" fill="#f0f1f4" stroke="#d6d9e0"/>
<text x="84" y="427" font-size="24" font-weight="700">Fire now</text>
<rect x="68" y="445" width="684" height="60" rx="0" fill="#ffffff" stroke="#d6d9e0"/>
<rect x="84" y="462" width="26" height="26" rx="4" fill="#ffffff" stroke="#d6d9e0"/>
<text x="124" y="484" font-size="24" font-weight="400" style="fill:#16181d">1 × Croquetas</text>
<text x="598" y="483" font-size="19" font-weight="400" style="fill:#5c626e">new</text>
<rect x="68" y="523" width="684" height="52" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/>
<text x="84" y="557" font-size="24" font-weight="700">Group 3 · Mains</text>
<rect x="68" y="575" width="684" height="60" rx="0" fill="#e3ebfb" stroke="#d6d9e0"/>
<rect x="84" y="592" width="26" height="26" rx="4" fill="#1f6feb" stroke="#d6d9e0"/>
<text x="88" y="613" font-size="23" font-weight="700" style="fill:#ffffff">✓</text>
<text x="124" y="614" font-size="24" font-weight="400" style="fill:#5c626e">1 × Entrecot</text>
<text x="598" y="613" font-size="19" font-weight="400" style="fill:#5c626e">held</text>
<rect x="68" y="635" width="684" height="60" rx="0" fill="#ffffff" stroke="#d6d9e0"/>
<rect x="84" y="652" width="26" height="26" rx="4" fill="#ffffff" stroke="#d6d9e0"/>
<text x="124" y="674" font-size="24" font-weight="400" style="fill:#5c626e">1 × Merluza</text>
<text x="598" y="673" font-size="19" font-weight="400" style="fill:#5c626e">held</text>
<text x="68" y="747" font-size="23" font-weight="700">1 sent dish selected</text>
<rect x="68" y="778" width="170" height="52" rx="9" fill="#1f6feb" stroke="#d6d9e0"/>
<text x="86" y="812" font-size="23" font-weight="700" style="fill:#ffffff">Move to…</text>
<rect x="252" y="778" width="170" height="52" rx="9" fill="#1f6feb" stroke="#d6d9e0"/>
<text x="270" y="812" font-size="23" font-weight="700" style="fill:#ffffff">Fire</text>
<rect x="436" y="778" width="170" height="52" rx="9" fill="#1f6feb" stroke="#d6d9e0"/>
<text x="454" y="812" font-size="23" font-weight="700" style="fill:#ffffff">Send all</text>
<text x="68" y="906" font-size="22" font-weight="400" style="fill:#5c626e">The Croquetas stays unsent. Fire the Entrecot</text>
<text x="68" y="937" font-size="22" font-weight="400" style="fill:#5c626e">first, then tick and fire the Croquetas.</text>
<text x="68" y="1070" font-size="22" font-weight="400" style="fill:#5c626e">Two separate selections and presses.</text>
<rect x="820" y="206" width="740" height="960" rx="12" fill="#ffffff" stroke="#d6d9e0"/>
<text x="844" y="250" font-size="27" font-weight="700">B · Keep both selected</text>
<text x="844" y="288" font-size="22" font-weight="400" style="fill:#5c626e">Alternative: one press handles new and sent dishes</text>
<text x="844" y="319" font-size="22" font-weight="400" style="fill:#5c626e">together.</text>
<text x="848" y="365" font-size="27" font-weight="700">Table 4 · Bill 1</text>
<rect x="848" y="393" width="684" height="52" rx="8" fill="#f0f1f4" stroke="#d6d9e0"/>
<text x="864" y="427" font-size="24" font-weight="700">Fire now</text>
<rect x="848" y="445" width="684" height="60" rx="0" fill="#e3ebfb" stroke="#d6d9e0"/>
<rect x="864" y="462" width="26" height="26" rx="4" fill="#1f6feb" stroke="#d6d9e0"/>
<text x="868" y="483" font-size="23" font-weight="700" style="fill:#ffffff">✓</text>
<text x="904" y="484" font-size="24" font-weight="400" style="fill:#16181d">1 × Croquetas</text>
<text x="1378" y="483" font-size="19" font-weight="400" style="fill:#5c626e">new</text>
<rect x="848" y="523" width="684" height="52" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/>
<text x="864" y="557" font-size="24" font-weight="700">Group 3 · Mains</text>
<rect x="848" y="575" width="684" height="60" rx="0" fill="#e3ebfb" stroke="#d6d9e0"/>
<rect x="864" y="592" width="26" height="26" rx="4" fill="#1f6feb" stroke="#d6d9e0"/>
<text x="868" y="613" font-size="23" font-weight="700" style="fill:#ffffff">✓</text>
<text x="904" y="614" font-size="24" font-weight="400" style="fill:#5c626e">1 × Entrecot</text>
<text x="1378" y="613" font-size="19" font-weight="400" style="fill:#5c626e">held</text>
<rect x="848" y="635" width="684" height="60" rx="0" fill="#ffffff" stroke="#d6d9e0"/>
<rect x="864" y="652" width="26" height="26" rx="4" fill="#ffffff" stroke="#d6d9e0"/>
<text x="904" y="674" font-size="24" font-weight="400" style="fill:#5c626e">1 × Merluza</text>
<text x="1378" y="673" font-size="19" font-weight="400" style="fill:#5c626e">held</text>
<text x="848" y="747" font-size="23" font-weight="700">2 dishes selected · new + sent</text>
<rect x="848" y="778" width="170" height="52" rx="9" fill="#1f6feb" stroke="#d6d9e0"/>
<text x="866" y="812" font-size="23" font-weight="700" style="fill:#ffffff">Move to…</text>
<rect x="1032" y="778" width="170" height="52" rx="9" fill="#1f6feb" stroke="#d6d9e0"/>
<text x="1050" y="812" font-size="23" font-weight="700" style="fill:#ffffff">Fire</text>
<rect x="1216" y="778" width="170" height="52" rx="9" fill="#1f6feb" stroke="#d6d9e0"/>
<text x="1234" y="812" font-size="23" font-weight="700" style="fill:#ffffff">Send all</text>
<text x="848" y="906" font-size="22" font-weight="400" style="fill:#5c626e">Fire must send the new dish and release the sent</text>
<text x="848" y="937" font-size="22" font-weight="400" style="fill:#5c626e">dish. If one part is refused, the screen must</text>
<text x="848" y="968" font-size="22" font-weight="400" style="fill:#5c626e">explain what succeeded.</text>
<text x="848" y="1070" font-size="22" font-weight="400" style="fill:#5c626e">A simpler gesture, but more complicated recovery.</text>
<text x="40" y="1202" font-size="22" font-weight="400">Choose A (new or sent at a time) or B (keep a mixed selection and handle it in one action).</text>
</svg>