<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1240" viewBox="0 0 1600 1240" role="img" aria-labelledby="title desc"><title id="title">4 of 6. Where does “changes after sending” apply?</title><desc id="desc">Table 4 · Group 3 holds Entrecot at Grill and dessert wine at Bar. You want to move a sent dish. A756 will give each station its own setting. All options are proposals awaiting the owner.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#16181d}</style>
<rect x="0" y="0" width="1600" height="1240" rx="0" fill="#f7f7f8" stroke="#d6d9e0"/>
<text x="40" y="52" font-size="36" font-weight="700">4 of 6 · Where does “changes after sending” apply?</text>
<text x="40" y="96" font-size="23" font-weight="400" style="fill:#5c626e">Table 4 · Group 3 holds Entrecot at Grill and dessert wine at Bar. You want to move a sent dish. A756 will</text>
<text x="40" y="128" font-size="23" font-weight="400" style="fill:#5c626e">give each station its own setting.</text>
<text x="40" y="168" font-size="19" font-weight="400" style="fill:#8a5300">PROPOSALS · awaiting your answer · illustrative wording</text>
<rect x="40" y="206" width="740" height="960" rx="12" fill="#ffffff" stroke="#d6d9e0"/>
<text x="64" y="250" font-size="27" font-weight="700">A · One venue setting until A756</text>
<text x="64" y="288" font-size="22" font-weight="400" style="fill:#5c626e">Plan proposal: keep the shared setting during</text>
<text x="64" y="319" font-size="22" font-weight="400" style="fill:#5c626e">A773-1.</text>
<text x="68" y="365" font-size="27" font-weight="700">Table 4 · Bill 1</text>
<rect x="68" y="393" width="684" height="52" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/>
<text x="84" y="427" font-size="24" font-weight="700">Group 3 · Mains, Drinks</text>
<rect x="68" y="445" width="684" height="60" rx="0" fill="#ffffff" stroke="#d6d9e0"/>
<rect x="84" y="462" width="26" height="26" rx="4" fill="#ffffff" stroke="#d6d9e0"/>
<text x="124" y="484" font-size="24" font-weight="400" style="fill:#5c626e">1 × Entrecot</text>
<text x="598" y="483" font-size="19" font-weight="400" style="fill:#5c626e">Grill · held</text>
<rect x="68" y="505" width="684" height="60" rx="0" fill="#ffffff" stroke="#d6d9e0"/>
<rect x="84" y="522" width="26" height="26" rx="4" fill="#ffffff" stroke="#d6d9e0"/>
<text x="124" y="544" font-size="24" font-weight="400" style="fill:#5c626e">1 × Dessert wine</text>
<text x="598" y="543" font-size="19" font-weight="400" style="fill:#5c626e">Bar · held</text>
<rect x="68" y="630" width="684" height="52" rx="8" fill="#f0f1f4" stroke="#d6d9e0"/>
<text x="84" y="664" font-size="24" font-weight="700">Kitchen settings · proposed order</text>
<rect x="68" y="682" width="684" height="60" rx="0" fill="#ffffff" stroke="#d6d9e0"/>
<text x="84" y="721" font-size="24" font-weight="400" style="fill:#16181d">Changes after sending</text>
<text x="598" y="720" font-size="19" font-weight="400" style="fill:#5c626e">ON</text>
<rect x="68" y="742" width="684" height="60" rx="0" fill="#ffffff" stroke="#d6d9e0"/>
<text x="84" y="781" font-size="24" font-weight="400" style="fill:#16181d">Applies to Grill and Bar</text>
<text x="68" y="882" font-size="22" font-weight="400" style="fill:#5c626e">With the shared setting on, both dishes have</text>
<text x="68" y="913" font-size="22" font-weight="400" style="fill:#5c626e">ticks. Turning it off removes both ticks. A line</text>
<text x="68" y="944" font-size="22" font-weight="400" style="fill:#5c626e">no station makes remains selectable.</text>
<text x="68" y="1062" font-size="22" font-weight="400" style="fill:#5c626e">Temporary arrangement: one setting for the venue.</text>
<rect x="820" y="206" width="740" height="960" rx="12" fill="#ffffff" stroke="#d6d9e0"/>
<text x="844" y="250" font-size="27" font-weight="700">B · Station settings come first</text>
<text x="844" y="288" font-size="22" font-weight="400" style="fill:#5c626e">Alternative: wait for A756 before enabling sent-</text>
<text x="844" y="319" font-size="22" font-weight="400" style="fill:#5c626e">line selection.</text>
<text x="848" y="365" font-size="27" font-weight="700">Table 4 · Bill 1</text>
<rect x="848" y="393" width="684" height="52" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/>
<text x="864" y="427" font-size="24" font-weight="700">Group 3 · Mains, Drinks</text>
<rect x="848" y="445" width="684" height="60" rx="0" fill="#ffffff" stroke="#d6d9e0"/>
<rect x="864" y="462" width="26" height="26" rx="4" fill="#ffffff" stroke="#d6d9e0"/>
<text x="904" y="484" font-size="24" font-weight="400" style="fill:#5c626e">1 × Entrecot</text>
<text x="1378" y="483" font-size="19" font-weight="400" style="fill:#5c626e">Grill · held</text>
<rect x="848" y="505" width="684" height="60" rx="0" fill="#ffffff" stroke="#d6d9e0"/>
<text x="864" y="544" font-size="24" font-weight="400" style="fill:#5c626e">1 × Dessert wine</text>
<text x="1378" y="543" font-size="19" font-weight="400" style="fill:#5c626e">Bar · held</text>
<rect x="848" y="630" width="684" height="52" rx="8" fill="#f0f1f4" stroke="#d6d9e0"/>
<text x="864" y="664" font-size="24" font-weight="700">Kitchen settings · proposed order</text>
<rect x="848" y="682" width="684" height="60" rx="0" fill="#ffffff" stroke="#d6d9e0"/>
<text x="864" y="721" font-size="24" font-weight="400" style="fill:#16181d">Grill · changes after sending</text>
<text x="1378" y="720" font-size="19" font-weight="400" style="fill:#5c626e">ON</text>
<rect x="848" y="742" width="684" height="60" rx="0" fill="#ffffff" stroke="#d6d9e0"/>
<text x="864" y="781" font-size="24" font-weight="400" style="fill:#16181d">Bar · changes after sending</text>
<text x="1378" y="780" font-size="19" font-weight="400" style="fill:#5c626e">OFF</text>
<text x="848" y="882" font-size="22" font-weight="400" style="fill:#5c626e">After A756, the Entrecot has a tick; the Bar wine</text>
<text x="848" y="913" font-size="22" font-weight="400" style="fill:#5c626e">does not. Until then, leave sent-line selection</text>
<text x="848" y="944" font-size="22" font-weight="400" style="fill:#5c626e">out of A773-1.</text>
<text x="848" y="1062" font-size="22" font-weight="400" style="fill:#5c626e">Per-station control arrives before this feature.</text>
<text x="40" y="1202" font-size="22" font-weight="400">Choose A (use the shared setting temporarily) or B (wait for station settings before sent-line selection).</text>
</svg>