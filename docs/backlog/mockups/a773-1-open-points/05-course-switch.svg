<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1240" viewBox="0 0 1600 1240" role="img" aria-labelledby="title desc"><title id="title">5 of 6. Where do you change “Held until fired”?</title><desc id="desc">For Table 4, new Croquetas (Starters) go to Fire now; new Solomillo (Mains) goes to a held group. You want to change which courses wait. A756 will give Courses its own page. All options are proposals awaiting the owner.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#16181d}</style>
<rect x="0" y="0" width="1600" height="1240" rx="0" fill="#f7f7f8" stroke="#d6d9e0"/>
<text x="40" y="52" font-size="36" font-weight="700">5 of 6 · Where do you change “Held until fired”?</text>
<text x="40" y="96" font-size="23" font-weight="400" style="fill:#5c626e">For Table 4, new Croquetas (Starters) go to Fire now; new Solomillo (Mains) goes to a held group. You want to</text>
<text x="40" y="128" font-size="23" font-weight="400" style="fill:#5c626e">change which courses wait. A756 will give Courses its own page.</text>
<text x="40" y="168" font-size="19" font-weight="400" style="fill:#8a5300">PROPOSALS · awaiting your answer · illustrative wording</text>
<rect x="40" y="206" width="740" height="960" rx="12" fill="#ffffff" stroke="#d6d9e0"/>
<text x="64" y="250" font-size="27" font-weight="700">A · Put it in the existing course list</text>
<text x="64" y="288" font-size="22" font-weight="400" style="fill:#5c626e">Plan proposal: use the current list, then move it</text>
<text x="64" y="319" font-size="22" font-weight="400" style="fill:#5c626e">with A756.</text>
<text x="68" y="365" font-size="27" font-weight="700">Table 4 · Bill 1</text>
<rect x="68" y="393" width="684" height="52" rx="8" fill="#f0f1f4" stroke="#d6d9e0"/>
<text x="84" y="427" font-size="24" font-weight="700">Fire now · 1 × Croquetas</text>
<rect x="68" y="459" width="684" height="52" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/>
<text x="84" y="493" font-size="24" font-weight="700">Group 3 · Mains · 1 × Solomillo</text>
<rect x="68" y="572" width="684" height="52" rx="8" fill="#f0f1f4" stroke="#d6d9e0"/>
<text x="84" y="606" font-size="24" font-weight="700">Kitchen · Courses</text>
<text x="84" y="666" font-size="23" font-weight="700">Course</text>
<text x="362" y="666" font-size="23" font-weight="700">Held until fired</text>
<rect x="68" y="692" width="684" height="60" rx="0" fill="#ffffff" stroke="#d6d9e0"/>
<text x="84" y="731" font-size="24" font-weight="400" style="fill:#16181d">Starters</text>
<text x="598" y="730" font-size="19" font-weight="400" style="fill:#5c626e">No</text>
<rect x="68" y="752" width="684" height="60" rx="0" fill="#ffffff" stroke="#d6d9e0"/>
<text x="84" y="791" font-size="24" font-weight="400" style="fill:#16181d">Mains</text>
<text x="598" y="790" font-size="19" font-weight="400" style="fill:#5c626e">Yes</text>
<rect x="68" y="812" width="684" height="60" rx="0" fill="#ffffff" stroke="#d6d9e0"/>
<text x="84" y="851" font-size="24" font-weight="400" style="fill:#16181d">Desserts</text>
<text x="598" y="850" font-size="19" font-weight="400" style="fill:#5c626e">Yes</text>
<rect x="592" y="705" width="100" height="34" rx="17" fill="#5c626e" stroke="#d6d9e0"/>
<rect x="597" y="710" width="24" height="24" rx="12" fill="#ffffff" stroke="#d6d9e0"/>
<text x="634" y="729" font-size="19" font-weight="700" style="fill:#ffffff">No</text>
<rect x="592" y="765" width="100" height="34" rx="17" fill="#1f6feb" stroke="#d6d9e0"/>
<rect x="658" y="770" width="24" height="24" rx="12" fill="#ffffff" stroke="#d6d9e0"/>
<text x="604" y="789" font-size="19" font-weight="700" style="fill:#ffffff">Yes</text>
<rect x="592" y="825" width="100" height="34" rx="17" fill="#1f6feb" stroke="#d6d9e0"/>
<rect x="658" y="830" width="24" height="24" rx="12" fill="#ffffff" stroke="#d6d9e0"/>
<text x="604" y="849" font-size="19" font-weight="700" style="fill:#ffffff">Yes</text>
<text x="68" y="938" font-size="22" font-weight="400" style="fill:#5c626e">Edit here now. A756 moves the same setting to its</text>
<text x="68" y="969" font-size="22" font-weight="400" style="fill:#5c626e">new Courses page. This switch is built only on</text>
<text x="68" y="1000" font-size="22" font-weight="400" style="fill:#5c626e">the unlanded A773-1 branch and can still change.</text>
<text x="68" y="1103" font-size="22" font-weight="400" style="fill:#5c626e">The table list above is context, not a second</text>
<text x="68" y="1134" font-size="22" font-weight="400" style="fill:#5c626e">editor.</text>
<rect x="820" y="206" width="740" height="960" rx="12" fill="#ffffff" stroke="#d6d9e0"/>
<text x="844" y="250" font-size="27" font-weight="700">B · Wait for the Courses page</text>
<text x="844" y="288" font-size="22" font-weight="400" style="fill:#5c626e">Alternative: ship the setting with A756’s dedicated</text>
<text x="844" y="319" font-size="22" font-weight="400" style="fill:#5c626e">page.</text>
<text x="848" y="365" font-size="27" font-weight="700">Table 4 · Bill 1</text>
<rect x="848" y="393" width="684" height="52" rx="8" fill="#f0f1f4" stroke="#d6d9e0"/>
<text x="864" y="427" font-size="24" font-weight="700">Fire now · 1 × Croquetas</text>
<rect x="848" y="459" width="684" height="52" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/>
<text x="864" y="493" font-size="24" font-weight="700">Group 3 · Mains · 1 × Solomillo</text>
<rect x="848" y="572" width="684" height="52" rx="8" fill="#f0f1f4" stroke="#d6d9e0"/>
<text x="864" y="606" font-size="24" font-weight="700">Products and menus · Courses</text>
<text x="864" y="666" font-size="23" font-weight="700">Course</text>
<text x="1142" y="666" font-size="23" font-weight="700">Held until fired</text>
<rect x="848" y="692" width="684" height="60" rx="0" fill="#ffffff" stroke="#d6d9e0"/>
<text x="864" y="731" font-size="24" font-weight="400" style="fill:#16181d">Starters</text>
<text x="1378" y="730" font-size="19" font-weight="400" style="fill:#5c626e">No</text>
<rect x="848" y="752" width="684" height="60" rx="0" fill="#ffffff" stroke="#d6d9e0"/>
<text x="864" y="791" font-size="24" font-weight="400" style="fill:#16181d">Mains</text>
<text x="1378" y="790" font-size="19" font-weight="400" style="fill:#5c626e">Yes</text>
<rect x="848" y="812" width="684" height="60" rx="0" fill="#ffffff" stroke="#d6d9e0"/>
<text x="864" y="851" font-size="24" font-weight="400" style="fill:#16181d">Desserts</text>
<text x="1378" y="850" font-size="19" font-weight="400" style="fill:#5c626e">Yes</text>
<rect x="1372" y="705" width="100" height="34" rx="17" fill="#5c626e" stroke="#d6d9e0"/>
<rect x="1377" y="710" width="24" height="24" rx="12" fill="#ffffff" stroke="#d6d9e0"/>
<text x="1414" y="729" font-size="19" font-weight="700" style="fill:#ffffff">No</text>
<rect x="1372" y="765" width="100" height="34" rx="17" fill="#1f6feb" stroke="#d6d9e0"/>
<rect x="1438" y="770" width="24" height="24" rx="12" fill="#ffffff" stroke="#d6d9e0"/>
<text x="1384" y="789" font-size="19" font-weight="700" style="fill:#ffffff">Yes</text>
<rect x="1372" y="825" width="100" height="34" rx="17" fill="#1f6feb" stroke="#d6d9e0"/>
<rect x="1438" y="830" width="24" height="24" rx="12" fill="#ffffff" stroke="#d6d9e0"/>
<text x="1384" y="849" font-size="19" font-weight="700" style="fill:#ffffff">Yes</text>
<text x="848" y="938" font-size="22" font-weight="400" style="fill:#5c626e">Edit here once A756 lands. Defer the new switch</text>
<text x="848" y="969" font-size="22" font-weight="400" style="fill:#5c626e">rather than exposing it on the existing list</text>
<text x="848" y="1000" font-size="22" font-weight="400" style="fill:#5c626e">first.</text>
<text x="848" y="1103" font-size="22" font-weight="400" style="fill:#5c626e">The table list above is context, not a second</text>
<text x="848" y="1134" font-size="22" font-weight="400" style="fill:#5c626e">editor.</text>
<text x="40" y="1202" font-size="22" font-weight="400">Choose A (existing list first) or B (introduce the setting on A756’s Courses page).</text>
</svg>