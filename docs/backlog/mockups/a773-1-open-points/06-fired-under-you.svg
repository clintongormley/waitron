<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1240" viewBox="0 0 1600 1240" role="img" aria-labelledby="title desc"><title id="title">6 of 6. Someone else fired the group you were adding to</title><desc id="desc">On Table 4, Group 3 · Mains holds 2 Entrecot. Your new Solomillo is arranged to join it. Another waiter fires Group 3 just before your Send all. All options are proposals awaiting the owner.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#16181d}</style>
<rect x="0" y="0" width="1600" height="1240" rx="0" fill="#f7f7f8" stroke="#d6d9e0"/>
<text x="40" y="52" font-size="36" font-weight="700">6 of 6 · Someone else fired the group you were adding to</text>
<text x="40" y="96" font-size="23" font-weight="400" style="fill:#5c626e">On Table 4, Group 3 · Mains holds 2 Entrecot. Your new Solomillo is arranged to join it. Another waiter fires</text>
<text x="40" y="128" font-size="23" font-weight="400" style="fill:#5c626e">Group 3 just before your Send all.</text>
<text x="40" y="168" font-size="19" font-weight="400" style="fill:#8a5300">PROPOSALS · awaiting your answer · illustrative wording</text>
<rect x="40" y="206" width="740" height="960" rx="12" fill="#ffffff" stroke="#d6d9e0"/>
<text x="64" y="250" font-size="27" font-weight="700">A · Move it, then ask you to send again</text>
<text x="64" y="288" font-size="22" font-weight="400" style="fill:#5c626e">Plan proposal: move Solomillo to Fire now, with a</text>
<text x="64" y="319" font-size="22" font-weight="400" style="fill:#5c626e">notice.</text>
<text x="68" y="365" font-size="27" font-weight="700">Table 4 · Bill 1</text>
<rect x="68" y="393" width="684" height="52" rx="8" fill="#f0f1f4" stroke="#d6d9e0"/>
<text x="84" y="427" font-size="24" font-weight="700">Already sent · Group 3 · Mains</text>
<rect x="68" y="445" width="684" height="60" rx="0" fill="#ffffff" stroke="#d6d9e0"/>
<text x="84" y="484" font-size="24" font-weight="400" style="fill:#5c626e">2 × Entrecot</text>
<text x="598" y="483" font-size="19" font-weight="400" style="fill:#5c626e">on its way</text>
<rect x="68" y="559" width="684" height="52" rx="8" fill="#f0f1f4" stroke="#d6d9e0"/>
<text x="84" y="593" font-size="24" font-weight="700">Fire now</text>
<rect x="68" y="611" width="684" height="60" rx="0" fill="#ffffff" stroke="#d6d9e0"/>
<rect x="84" y="628" width="26" height="26" rx="4" fill="#ffffff" stroke="#d6d9e0"/>
<text x="124" y="650" font-size="24" font-weight="400" style="fill:#16181d">1 × Solomillo</text>
<text x="598" y="649" font-size="19" font-weight="400" style="fill:#5c626e">unsent</text>
<rect x="68" y="725" width="684" height="52" rx="8" fill="#f0f1f4" stroke="#d6d9e0"/>
<text x="84" y="759" font-size="24" font-weight="700">Nothing from this attempt was sent</text>
<text x="84" y="813" font-size="22" font-weight="400" style="fill:#5c626e">Group 3 was fired. Its new dishes moved to Fire</text>
<text x="84" y="844" font-size="22" font-weight="400" style="fill:#5c626e">now. Check them, then send again.</text>
<rect x="554" y="958" width="170" height="52" rx="9" fill="#1f6feb" stroke="#d6d9e0"/>
<text x="572" y="992" font-size="23" font-weight="700" style="fill:#ffffff">Send all</text>
<text x="68" y="1074" font-size="22" font-weight="400" style="fill:#5c626e">The next Send all fires the Solomillo.</text>
<rect x="820" y="206" width="740" height="960" rx="12" fill="#ffffff" stroke="#d6d9e0"/>
<text x="844" y="250" font-size="27" font-weight="700">B · Keep it held in a fresh group</text>
<text x="844" y="288" font-size="22" font-weight="400" style="fill:#5c626e">Alternative: make a new held group; ask you to send</text>
<text x="844" y="319" font-size="22" font-weight="400" style="fill:#5c626e">again.</text>
<text x="848" y="365" font-size="27" font-weight="700">Table 4 · Bill 1</text>
<rect x="848" y="393" width="684" height="52" rx="8" fill="#f0f1f4" stroke="#d6d9e0"/>
<text x="864" y="427" font-size="24" font-weight="700">Already sent · Group 3 · Mains</text>
<rect x="848" y="445" width="684" height="60" rx="0" fill="#ffffff" stroke="#d6d9e0"/>
<text x="864" y="484" font-size="24" font-weight="400" style="fill:#5c626e">2 × Entrecot</text>
<text x="1378" y="483" font-size="19" font-weight="400" style="fill:#5c626e">on its way</text>
<rect x="848" y="559" width="684" height="52" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/>
<text x="864" y="593" font-size="24" font-weight="700">Group 4 · Mains (new)</text>
<rect x="848" y="611" width="684" height="60" rx="0" fill="#ffffff" stroke="#d6d9e0"/>
<rect x="864" y="628" width="26" height="26" rx="4" fill="#ffffff" stroke="#d6d9e0"/>
<text x="904" y="650" font-size="24" font-weight="400" style="fill:#16181d">1 × Solomillo</text>
<text x="1378" y="649" font-size="19" font-weight="400" style="fill:#5c626e">unsent</text>
<rect x="848" y="725" width="684" height="52" rx="8" fill="#f0f1f4" stroke="#d6d9e0"/>
<text x="864" y="759" font-size="24" font-weight="700">Nothing from this attempt was sent</text>
<text x="864" y="813" font-size="22" font-weight="400" style="fill:#5c626e">Group 3 was fired. Its new dishes moved to a new</text>
<text x="864" y="844" font-size="22" font-weight="400" style="fill:#5c626e">held group. Check them, then send again.</text>
<rect x="1334" y="958" width="170" height="52" rx="9" fill="#1f6feb" stroke="#d6d9e0"/>
<text x="1352" y="992" font-size="23" font-weight="700" style="fill:#ffffff">Send all</text>
<text x="848" y="1074" font-size="22" font-weight="400" style="fill:#5c626e">The next Send all holds the Solomillo in a new</text>
<text x="848" y="1105" font-size="22" font-weight="400" style="fill:#5c626e">group.</text>
<text x="40" y="1202" font-size="22" font-weight="400">Choose A (offer Fire now; you send again) or B (offer a fresh held group; you send again).</text>
</svg>