<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1240" viewBox="0 0 1600 1240" role="img" aria-labelledby="title desc"><title id="title">3 of 6. What if someone has already paid this bill?</title><desc id="desc">Table 4 · Bill 1 has 1 new Croquetas and 1 new Solomillo still unsent. Another waiter takes payment for Bill 1 before you press Send all. Bill 2 is open and is the main bill. All options are proposals awaiting the owner.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#16181d}</style>
<rect x="0" y="0" width="1600" height="1240" rx="0" fill="#f7f7f8" stroke="#d6d9e0"/>
<text x="40" y="52" font-size="36" font-weight="700">3 of 6 · What if someone has already paid this bill?</text>
<text x="40" y="96" font-size="23" font-weight="400" style="fill:#5c626e">Table 4 · Bill 1 has 1 new Croquetas and 1 new Solomillo still unsent. Another waiter takes payment for Bill 1</text>
<text x="40" y="128" font-size="23" font-weight="400" style="fill:#5c626e">before you press Send all. Bill 2 is open and is the main bill.</text>
<text x="40" y="168" font-size="19" font-weight="400" style="fill:#8a5300">PROPOSALS · awaiting your answer · illustrative wording</text>
<rect x="40" y="206" width="740" height="960" rx="12" fill="#ffffff" stroke="#d6d9e0"/>
<text x="64" y="250" font-size="27" font-weight="700">A · Send on the open main bill</text>
<text x="64" y="288" font-size="22" font-weight="400" style="fill:#5c626e">Plan proposal: send on Bill 2 and tell you where</text>
<text x="64" y="319" font-size="22" font-weight="400" style="fill:#5c626e">the dishes went.</text>
<text x="68" y="365" font-size="27" font-weight="700">Table 4 · Bill 2</text>
<rect x="68" y="393" width="684" height="52" rx="8" fill="#f0f1f4" stroke="#d6d9e0"/>
<text x="84" y="427" font-size="24" font-weight="700">Already sent · Starters</text>
<rect x="68" y="445" width="684" height="60" rx="0" fill="#ffffff" stroke="#d6d9e0"/>
<text x="84" y="484" font-size="24" font-weight="400" style="fill:#16181d">1 × Croquetas</text>
<text x="598" y="483" font-size="19" font-weight="400" style="fill:#5c626e">sent</text>
<rect x="68" y="523" width="684" height="52" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/>
<text x="84" y="557" font-size="24" font-weight="700">Group 3 · Mains</text>
<rect x="68" y="575" width="684" height="60" rx="0" fill="#ffffff" stroke="#d6d9e0"/>
<text x="84" y="614" font-size="24" font-weight="400" style="fill:#16181d">1 × Solomillo</text>
<text x="598" y="613" font-size="19" font-weight="400" style="fill:#5c626e">held</text>
<rect x="68" y="692" width="684" height="52" rx="8" fill="#f0f1f4" stroke="#d6d9e0"/>
<text x="84" y="726" font-size="24" font-weight="700">After Send all</text>
<text x="84" y="787" font-size="22" font-weight="400" style="fill:#5c626e">Bill 1 was paid. These dishes went on Bill 2.</text>
<text x="68" y="949" font-size="22" font-weight="400" style="fill:#5c626e">The screen follows Bill 2, as does any remaining</text>
<text x="68" y="980" font-size="22" font-weight="400" style="fill:#5c626e">unsent list. If no main bill is open, make one</text>
<text x="68" y="1011" font-size="22" font-weight="400" style="fill:#5c626e">and name it in the notice.</text>
<rect x="820" y="206" width="740" height="960" rx="12" fill="#ffffff" stroke="#d6d9e0"/>
<text x="844" y="250" font-size="27" font-weight="700">B · Stop and ask for a bill</text>
<text x="844" y="288" font-size="22" font-weight="400" style="fill:#5c626e">Alternative: keep the list unsent until you choose</text>
<text x="844" y="319" font-size="22" font-weight="400" style="fill:#5c626e">an open bill.</text>
<text x="848" y="365" font-size="27" font-weight="700">Table 4 · Bill 1 · paid</text>
<rect x="848" y="393" width="684" height="52" rx="8" fill="#f0f1f4" stroke="#d6d9e0"/>
<text x="864" y="427" font-size="24" font-weight="700">Fire now</text>
<rect x="848" y="445" width="684" height="60" rx="0" fill="#ffffff" stroke="#d6d9e0"/>
<rect x="864" y="462" width="26" height="26" rx="4" fill="#ffffff" stroke="#d6d9e0"/>
<text x="904" y="484" font-size="24" font-weight="400" style="fill:#16181d">1 × Croquetas</text>
<text x="1378" y="483" font-size="19" font-weight="400" style="fill:#5c626e">new</text>
<rect x="848" y="523" width="684" height="52" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/>
<text x="864" y="557" font-size="24" font-weight="700">Group 3 · Mains</text>
<rect x="848" y="575" width="684" height="60" rx="0" fill="#ffffff" stroke="#d6d9e0"/>
<rect x="864" y="592" width="26" height="26" rx="4" fill="#ffffff" stroke="#d6d9e0"/>
<text x="904" y="614" font-size="24" font-weight="400" style="fill:#16181d">1 × Solomillo</text>
<text x="1378" y="613" font-size="19" font-weight="400" style="fill:#5c626e">new</text>
<rect x="848" y="692" width="684" height="52" rx="8" fill="#f0f1f4" stroke="#d6d9e0"/>
<text x="864" y="726" font-size="24" font-weight="700">Bill 1 was paid. Choose a bill.</text>
<rect x="864" y="782" width="200" height="52" rx="9" fill="#1f6feb" stroke="#d6d9e0"/>
<text x="882" y="816" font-size="23" font-weight="700" style="fill:#ffffff">Use Bill 2</text>
<rect x="1080" y="782" width="170" height="52" rx="9" fill="#f0f1f4" stroke="#d6d9e0"/>
<text x="1098" y="816" font-size="23" font-weight="700" style="fill:#5c626e">Cancel</text>
<text x="848" y="949" font-size="22" font-weight="400" style="fill:#5c626e">Neither dish is sent yet. Choose Bill 2, then</text>
<text x="848" y="980" font-size="22" font-weight="400" style="fill:#5c626e">press Send all again. If no bill is open, offer</text>
<text x="848" y="1011" font-size="22" font-weight="400" style="fill:#5c626e">to open one first.</text>
<text x="40" y="1202" font-size="22" font-weight="400">Choose A (send on the main bill and notify you) or B (stop; you choose the bill before sending).</text>
</svg>