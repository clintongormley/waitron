<text x="864" y="830" font-size="24" font-weight="700">Tab drawer · Current orders</text>
<rect x="848" y="848" width="684" height="60" rx="0" fill="#ffffff" stroke="#d6d9e0"/>
<text x="864" y="887" font-size="24" font-weight="400" style="fill:#16181d">On its way · 2 items</text>
<rect x="848" y="908" width="684" height="60" rx="0" fill="#ffffff" stroke="#d6d9e0"/>
<text x="864" y="947" font-size="24" font-weight="400" style="fill:#16181d">Served · 7 items</text>
<text x="848" y="1034" font-size="22" font-weight="400" style="fill:#5c626e">No held-group copy in the drawer. Keep serving</text>
<text x="848" y="1065" font-size="22" font-weight="400" style="fill:#5c626e">and reminders there; arrange held groups in the</text>
<text x="848" y="1096" font-size="22" font-weight="400" style="fill:#5c626e">main list.</text>
<text x="40" y="1202" font-size="22" font-weight="400">Choose A (keep both until the drawer clean-up) or B (remove the drawer’s duplicate held groups now).</text>
