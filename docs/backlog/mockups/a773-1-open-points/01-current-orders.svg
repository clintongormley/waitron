<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1240" viewBox="0 0 1600 1240" role="img" aria-labelledby="title desc"><title id="title">1 of 6. Where do you see held groups?</title><desc id="desc">Table 4 has sent its starters. Group 3 · Mains is held: 2 Entrecot and 1 Merluza. You open the Tab drawer while looking at the order. All options are proposals awaiting the owner.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#16181d}</style>
<rect x="0" y="0" width="1600" height="1240" rx="0" fill="#f7f7f8" stroke="#d6d9e0"/>
<text x="40" y="52" font-size="36" font-weight="700">1 of 6 · Where do you see held groups?</text>
<text x="40" y="96" font-size="23" font-weight="400" style="fill:#5c626e">Table 4 has sent its starters. Group 3 · Mains is held: 2 Entrecot and 1 Merluza. You open the Tab drawer</text>
<text x="40" y="128" font-size="23" font-weight="400" style="fill:#5c626e">while looking at the order.</text>
<text x="40" y="168" font-size="19" font-weight="400" style="fill:#8a5300">PROPOSALS · awaiting your answer · illustrative wording</text>
<rect x="40" y="206" width="740" height="960" rx="12" fill="#ffffff" stroke="#d6d9e0"/>
<text x="64" y="250" font-size="27" font-weight="700">A · Keep both places for now</text>
<text x="64" y="288" font-size="22" font-weight="400" style="fill:#5c626e">Plan proposal: the list and Current orders both</text>
<text x="64" y="319" font-size="22" font-weight="400" style="fill:#5c626e">show held groups.</text>
<text x="68" y="365" font-size="27" font-weight="700">Table 4 · Bill 1</text>
<rect x="68" y="393" width="684" height="52" rx="8" fill="#f0f1f4" stroke="#d6d9e0"/>
<text x="84" y="427" font-size="24" font-weight="700">Fire now</text>
<rect x="68" y="445" width="684" height="60" rx="0" fill="#ffffff" stroke="#d6d9e0"/>
<rect x="84" y="462" width="26" height="26" rx="4" fill="#ffffff" stroke="#d6d9e0"/>
<text x="124" y="484" font-size="24" font-weight="400" style="fill:#16181d">1 × Croquetas</text>
<text x="598" y="483" font-size="19" font-weight="400" style="fill:#5c626e">new</text>
<rect x="68" y="523" width="684" height="52" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/>
<text x="84" y="557" font-size="24" font-weight="700">Group 3 · Mains</text>
<rect x="68" y="575" width="684" height="60" rx="0" fill="#ffffff" stroke="#d6d9e0"/>
<rect x="84" y="592" width="26" height="26" rx="4" fill="#ffffff" stroke="#d6d9e0"/>
<text x="124" y="614" font-size="24" font-weight="400" style="fill:#5c626e">2 × Entrecot</text>
<text x="598" y="613" font-size="19" font-weight="400" style="fill:#5c626e">held</text>
<rect x="68" y="635" width="684" height="60" rx="0" fill="#ffffff" stroke="#d6d9e0"/>
<rect x="84" y="652" width="26" height="26" rx="4" fill="#ffffff" stroke="#d6d9e0"/>
<text x="124" y="674" font-size="24" font-weight="400" style="fill:#5c626e">1 × Merluza</text>
<text x="598" y="673" font-size="19" font-weight="400" style="fill:#5c626e">held</text>
<rect x="582" y="709" width="170" height="52" rx="9" fill="#1f6feb" stroke="#d6d9e0"/>
<text x="600" y="743" font-size="23" font-weight="700" style="fill:#ffffff">Fire group</text>
<rect x="68" y="796" width="684" height="52" rx="8" fill="#f0f1f4" stroke="#d6d9e0"/>
<text x="84" y="830" font-size="24" font-weight="700">Tab drawer · Current orders</text>
<rect x="68" y="848" width="684" height="60" rx="0" fill="#ffffff" stroke="#d6d9e0"/>
<text x="84" y="887" font-size="24" font-weight="400" style="fill:#16181d">Group 3 · Mains</text>
<text x="598" y="886" font-size="19" font-weight="400" style="fill:#5c626e">held</text>
<rect x="68" y="908" width="684" height="60" rx="0" fill="#ffffff" stroke="#d6d9e0"/>
<text x="84" y="947" font-size="24" font-weight="400" style="fill:#5c626e">2 × Entrecot · 1 × Merluza</text>
<text x="68" y="1034" font-size="22" font-weight="400" style="fill:#5c626e">The same held dishes appear in two places. Keep</text>
<text x="68" y="1065" font-size="22" font-weight="400" style="fill:#5c626e">serving, reminders and reordering here until A738</text>
<text x="68" y="1096" font-size="22" font-weight="400" style="fill:#5c626e">reviews the drawer.</text>
<rect x="820" y="206" width="740" height="960" rx="12" fill="#ffffff" stroke="#d6d9e0"/>
<text x="844" y="250" font-size="27" font-weight="700">B · Show held groups once</text>
<text x="844" y="288" font-size="22" font-weight="400" style="fill:#5c626e">Alternative: held groups live in the list; the</text>
<text x="844" y="319" font-size="22" font-weight="400" style="fill:#5c626e">drawer keeps other jobs.</text>
<text x="848" y="365" font-size="27" font-weight="700">Table 4 · Bill 1</text>
<rect x="848" y="393" width="684" height="52" rx="8" fill="#f0f1f4" stroke="#d6d9e0"/>
