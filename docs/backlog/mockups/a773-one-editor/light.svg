<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1080" viewBox="0 0 1280 1080"><title>One editor: Luis takes over Table 4</title><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1280" height="1080" rx="0" fill="#f7f7f8" stroke="#f7f7f8"/><text x="44" y="50" fill="#16181d" font-size="32" font-weight="700">One table. Separate bills. One editor.</text><text x="44" y="83" fill="#5c626e" font-size="19" font-weight="400">Design proposal · saved dishes transfer; local unsaved changes stay on their own device</text><text x="44" y="127" fill="#16181d" font-size="22" font-weight="700">1  Luis opens Table 4</text><rect x="44" y="150" width="390" height="745" rx="12" fill="#ffffff" stroke="#d6d9e0"/><text x="64" y="190" fill="#16181d" font-size="25" font-weight="700">Table 4 · Bill 1</text><text x="64" y="222" fill="#5c626e" font-size="18" font-weight="400">Sent · 2 ready · €14.00</text><rect x="59" y="247" width="360" height="74" rx="12" fill="#e3ebfb" stroke="#d6d9e0"/><text x="73" y="276" fill="#16181d" font-size="19" font-weight="600">Ana is changing this order</text><text x="73" y="304" fill="#5c626e" font-size="16" font-weight="400">Take over before changing it.</text><text x="64" y="359" fill="#16181d" font-size="22" font-weight="700">New order · Ana</text><text x="64" y="394" fill="#16181d" font-size="18" font-weight="600">Fire now</text><rect x="59" y="412" width="360" height="72" rx="12" fill="#f0f1f4" stroke="#d6d9e0"/><text x="72" y="443" fill="#16181d" font-size="20" font-weight="400">Bravas ×2</text><text x="330" y="469" fill="#5c626e" font-size="17" font-weight="400">€8.00</text><text x="64" y="525" fill="#16181d" font-size="18" font-weight="600">New held group · Mains</text><rect x="59" y="544" width="360" height="72" rx="12" fill="#f0f1f4" stroke="#d6d9e0"/><text x="72" y="576" fill="#16181d" font-size="20" font-weight="400">Steak ×1</text><text x="322" y="601" fill="#5c626e" font-size="17" font-weight="400">€18.00</text><rect x="64" y="652" width="348" height="46" rx="12" fill="#1f6feb" stroke="#d6d9e0"/><text x="78" y="681" fill="#ffffff" font-size="17" font-weight="600">Take over</text><text x="64" y="735" fill="#5c626e" font-size="16" font-weight="400">Saved dishes on every bill transfer.</text><text x="64" y="803" fill="#16181d" font-size="20" font-weight="600">Total · €40.00</text><rect x="64" y="831" width="348" height="46" rx="12" fill="#f0f1f4" stroke="#d6d9e0"/><text x="78" y="860" fill="#5c626e" font-size="17" font-weight="600">Pay</text><text x="64" y="923" fill="#5c626e" font-size="18" font-weight="400">Floor: editing Ana</text><text x="470" y="127" fill="#16181d" font-size="22" font-weight="700">2  Luis takes over</text><rect x="470" y="150" width="390" height="745" rx="12" fill="#ffffff" stroke="#d6d9e0"/><text x="490" y="190" fill="#16181d" font-size="25" font-weight="700">Table 4 · Bill 1</text><text x="490" y="222" fill="#5c626e" font-size="18" font-weight="400">Sent · 2 ready · €14.00</text><rect x="485" y="247" width="360" height="74" rx="12" fill="#e3ebfb" stroke="#d6d9e0"/><text x="499" y="276" fill="#16181d" font-size="19" font-weight="600">Editing: Luis</text><text x="499" y="304" fill="#5c626e" font-size="16" font-weight="400">These saved dishes are now yours.</text><text x="490" y="359" fill="#16181d" font-size="22" font-weight="700">New order · Luis</text><text x="490" y="394" fill="#16181d" font-size="18" font-weight="600">Fire now</text><rect x="485" y="412" width="360" height="72" rx="12" fill="#f0f1f4" stroke="#d6d9e0"/><text x="498" y="443" fill="#16181d" font-size="20" font-weight="400">□  Bravas ×2</text><text x="756" y="469" fill="#5c626e" font-size="17" font-weight="400">€8.00</text><text x="490" y="525" fill="#16181d" font-size="18" font-weight="600">New held group · Mains</text><rect x="485" y="544" width="360" height="72" rx="12" fill="#f0f1f4" stroke="#d6d9e0"/><text x="498" y="576" fill="#16181d" font-size="20" font-weight="400">□  Steak ×1</text><text x="748" y="601" fill="#5c626e" font-size="17" font-weight="400">€18.00</text><rect x="490" y="652" width="168" height="46" rx="12" fill="#f0f1f4" stroke="#d6d9e0"/><text x="504" y="681" fill="#5c626e" font-size="17" font-weight="600">Move to…</text><rect x="670" y="652" width="168" height="46" rx="12" fill="#f0f1f4" stroke="#d6d9e0"/><text x="684" y="681" fill="#5c626e" font-size="17" font-weight="600">Fire</text><rect x="490" y="713" width="348" height="46" rx="12" fill="#1f6feb" stroke="#d6d9e0"/><text x="504" y="742" fill="#ffffff" font-size="17" font-weight="600">Send all</text><text x="490" y="803" fill="#16181d" font-size="20" font-weight="600">Total · €40.00</text><rect x="490" y="831" width="348" height="46" rx="12" fill="#f0f1f4" stroke="#d6d9e0"/><text x="504" y="860" fill="#5c626e" font-size="17" font-weight="600">Pay</text><text x="490" y="923" fill="#5c626e" font-size="18" font-weight="400">Floor: editing Luis</text><text x="906" y="127" fill="#16181d" font-size="22" font-weight="700">3  Ana’s device</text><rect x="906" y="150" width="330" height="480" rx="12" fill="#ffffff" stroke="#d6d9e0"/><text x="926" y="192" fill="#16181d" font-size="23" font-weight="700">Table 4 · Bill 1</text><rect x="921" y="220" width="300" height="86" rx="12" fill="#e3ebfb" stroke="#d6d9e0"/><text x="936" y="252" fill="#16181d" font-size="20" font-weight="700">Luis took over</text><text x="936" y="283" fill="#5c626e" font-size="17" font-weight="400">Saved order is read-only.</text><text x="926" y="344" fill="#16181d" font-size="20" font-weight="400">Bravas ×2</text><text x="926" y="386" fill="#16181d" font-size="20" font-weight="400">Steak ×1</text><rect x="921" y="421" width="300" height="116" rx="12" fill="#f0f1f4" stroke="#d6d9e0"/><text x="936" y="454" fill="#16181d" font-size="16" font-weight="600">Your unsaved change stays here.</text><text x="936" y="484" fill="#5c626e" font-size="17" font-weight="400">Review it explicitly after</text><text x="936" y="511" fill="#5c626e" font-size="17" font-weight="400">taking ownership back.</text><rect x="926" y="559" width="290" height="46" rx="12" fill="#f0f1f4" stroke="#d6d9e0"/><text x="940" y="588" fill="#16181d" font-size="17" font-weight="600">Take over</text><text x="906" y="680" fill="#16181d" font-size="21" font-weight="700">Still shared</text><text x="906" y="716" fill="#5c626e" font-size="18" font-weight="400">Serve ready dishes.</text><text x="906" y="750" fill="#5c626e" font-size="18" font-weight="400">Fire already-sent held food.</text><text x="906" y="784" fill="#5c626e" font-size="18" font-weight="400">Existing permissions apply.</text><text x="44" y="990" fill="#16181d" font-size="20" font-weight="600">When every bill’s New order is empty, the next saved addition can establish a new editor.</text><text x="44" y="1025" fill="#5c626e" font-size="18" font-weight="400">First accepted save wins when two people start from empty. A losing local candidate is kept for review.</text></g></svg>