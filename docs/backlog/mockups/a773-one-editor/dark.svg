<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1260" viewBox="0 0 1360 1260" role="img" aria-labelledby="title desc">
<title id="title">One editor per bill: two editors at Table 4, then takeover of Bill 1 only</title>
<desc id="desc">Before: Bill 1 belongs to Ana and Bill 2 to Luis, both with unsent dishes. Luis takes over only Bill 1. Bill 2 is unchanged. Ana sees the saved Bill 1 read-only; her unsaved salad remains separately on her device. The floor lists both nonempty bill and editor pairs. Design mockup, not implemented product.</desc>
<g font-family="Arial, sans-serif" style="--wt-color-bg:#101216;--wt-color-surface:#191c22;--wt-color-surface-raised:#22262e;--wt-color-surface-lifted:#2f3a4d;--wt-color-text:#eceef2;--wt-color-text-muted:#a1a7b3;--wt-color-border:#333945;--wt-color-primary:#4c8dff;--wt-color-on-primary:#06101f">
<rect x="0" y="0" width="1360" height="1260" rx="0" fill="var(--wt-color-bg)" stroke="var(--wt-color-border)"/>
<text x="44" y="51" fill="var(--wt-color-text)" font-size="32" font-weight="700">One table. Two bills. One editor per bill.</text>
<text x="44" y="84" fill="var(--wt-color-text-muted)" font-size="19" font-weight="400">Approved design · saved dishes transfer per bill; local unsaved changes stay on their original device</text>
<text x="44" y="130" fill="var(--wt-color-text)" font-size="22" font-weight="700">1  Ana and Luis edit different bills</text>
<rect x="44" y="153" width="390" height="790" rx="12" fill="var(--wt-color-surface)" stroke="var(--wt-color-border)"/>
<text x="484" y="130" fill="var(--wt-color-text)" font-size="22" font-weight="700">2  Luis takes over Bill 1 only</text>
<rect x="484" y="153" width="390" height="790" rx="12" fill="var(--wt-color-surface)" stroke="var(--wt-color-border)"/>
<text x="924" y="130" fill="var(--wt-color-text)" font-size="22" font-weight="700">3  Ana’s Bill 1 becomes read-only</text>
<rect x="924" y="153" width="390" height="790" rx="12" fill="var(--wt-color-surface)" stroke="var(--wt-color-border)"/>
<text x="64" y="194" fill="var(--wt-color-text)" font-size="24" font-weight="700">Table 4 · two devices</text>
<rect x="59" y="218" width="360" height="320" rx="12" fill="var(--wt-color-surface-lifted)" stroke="var(--wt-color-border)"/>
<text x="76" y="252" fill="var(--wt-color-text)" font-size="22" font-weight="700">Ana’s device · Bill 1</text>
<text x="76" y="283" fill="var(--wt-color-text-muted)" font-size="17" font-weight="400">Sent · 2 ready · €14.00</text>
<text x="76" y="322" fill="var(--wt-color-text)" font-size="20" font-weight="700">New order · Ana</text>
<text x="76" y="355" fill="var(--wt-color-text)" font-size="17" font-weight="600">Fire now</text>
<text x="76" y="387" fill="var(--wt-color-text)" font-size="19" font-weight="400">Bravas ×2                     €8.00</text>
<text x="76" y="425" fill="var(--wt-color-text)" font-size="17" font-weight="600">New held group · Mains</text>
<text x="76" y="457" fill="var(--wt-color-text)" font-size="19" font-weight="400">Steak ×1                       €18.00</text>
<text x="76" y="503" fill="var(--wt-color-text-muted)" font-size="17" font-weight="400">Ana can edit and send Bill 1.</text>
<rect x="59" y="558" width="360" height="230" rx="12" fill="var(--wt-color-surface-lifted)" stroke="var(--wt-color-border)"/>
<text x="76" y="593" fill="var(--wt-color-text)" font-size="22" font-weight="700">Luis’s device · Bill 2</text>
<text x="76" y="631" fill="var(--wt-color-text)" font-size="20" font-weight="700">New order · Luis</text>
<text x="76" y="656" fill="var(--wt-color-text-muted)" font-size="16" font-weight="600">New held group · Desserts</text>
<text x="76" y="684" fill="var(--wt-color-text)" font-size="19" font-weight="400">Lemon pie ×2                €12.00</text>
<rect x="76" y="704" width="324" height="46" rx="12" fill="var(--wt-color-primary)" stroke="var(--wt-color-border)"/>
<text x="90" y="733" fill="var(--wt-color-on-primary)" font-size="17" font-weight="600">Send all · Bill 2</text>
<text x="76" y="773" fill="var(--wt-color-text-muted)" font-size="16" font-weight="400">Luis can edit Bill 2 independently.</text>
<text x="64" y="832" fill="var(--wt-color-text)" font-size="18" font-weight="600">Luis switches to Bill 1.</text>
<text x="64" y="863" fill="var(--wt-color-text-muted)" font-size="17" font-weight="400">Ana’s saved outbox is read-only.</text>
<rect x="64" y="884" width="348" height="46" rx="12" fill="var(--wt-color-primary)" stroke="var(--wt-color-border)"/>
<text x="78" y="913" fill="var(--wt-color-on-primary)" font-size="17" font-weight="600">Take over · Bill 1</text>
<text x="504" y="194" fill="var(--wt-color-text)" font-size="25" font-weight="700">Table 4 · Bill 1</text>
<text x="504" y="226" fill="var(--wt-color-text-muted)" font-size="18" font-weight="400">Sent · 2 ready · €14.00</text>
<rect x="499" y="248" width="360" height="77" rx="12" fill="var(--wt-color-surface-lifted)" stroke="var(--wt-color-border)"/>
<text x="516" y="279" fill="var(--wt-color-text)" font-size="22" font-weight="700">New order · Luis</text>
<text x="516" y="309" fill="var(--wt-color-text-muted)" font-size="17" font-weight="400">Only Bill 1 has changed editor.</text>
<text x="504" y="366" fill="var(--wt-color-text)" font-size="18" font-weight="600">Fire now</text>
<rect x="499" y="384" width="360" height="71" rx="12" fill="var(--wt-color-surface-raised)" stroke="var(--wt-color-border)"/>
<text x="515" y="415" fill="var(--wt-color-text)" font-size="20" font-weight="400">□  Bravas ×2</text>
<text x="757" y="441" fill="var(--wt-color-text-muted)" font-size="17" font-weight="400">€8.00</text>
<text x="504" y="498" fill="var(--wt-color-text)" font-size="18" font-weight="600">New held group · Mains</text>
<rect x="499" y="516" width="360" height="71" rx="12" fill="var(--wt-color-surface-raised)" stroke="var(--wt-color-border)"/>
<text x="515" y="547" fill="var(--wt-color-text)" font-size="20" font-weight="400">□  Steak ×1</text>
<text x="749" y="573" fill="var(--wt-color-text-muted)" font-size="17" font-weight="400">€18.00</text>
<rect x="504" y="621" width="167" height="46" rx="12" fill="var(--wt-color-surface-raised)" stroke="var(--wt-color-border)"/>
<text x="518" y="650" fill="var(--wt-color-text-muted)" font-size="17" font-weight="600">Move to…</text>
<rect x="685" y="621" width="167" height="46" rx="12" fill="var(--wt-color-surface-raised)" stroke="var(--wt-color-border)"/>
<text x="699" y="650" fill="var(--wt-color-text-muted)" font-size="17" font-weight="600">Fire</text>
<rect x="504" y="685" width="348" height="46" rx="12" fill="var(--wt-color-primary)" stroke="var(--wt-color-border)"/>
<text x="518" y="714" fill="var(--wt-color-on-primary)" font-size="17" font-weight="600">Send all</text>
<text x="504" y="770" fill="var(--wt-color-text)" font-size="21" font-weight="600">Bill 1 total · €40.00</text>
<rect x="504" y="792" width="348" height="46" rx="12" fill="var(--wt-color-surface-raised)" stroke="var(--wt-color-border)"/>
<text x="518" y="821" fill="var(--wt-color-text-muted)" font-size="17" font-weight="600">Pay</text>
<text x="504" y="873" fill="var(--wt-color-text)" font-size="18" font-weight="600">Bill 2 · Luis · lemon pie ×2</text>
<text x="504" y="906" fill="var(--wt-color-text-muted)" font-size="16" font-weight="400">Its saved dishes and version stay put.</text>
<text x="944" y="194" fill="var(--wt-color-text)" font-size="25" font-weight="700">Table 4 · Bill 1</text>
<rect x="939" y="219" width="360" height="86" rx="12" fill="var(--wt-color-surface-lifted)" stroke="var(--wt-color-border)"/>
<text x="956" y="252" fill="var(--wt-color-text)" font-size="21" font-weight="700">Taken over by Luis</text>
<text x="956" y="283" fill="var(--wt-color-text-muted)" font-size="18" font-weight="400">Saved New order · read-only</text>
<text x="944" y="348" fill="var(--wt-color-text)" font-size="20" font-weight="400">Fire now · Bravas ×2</text>
<text x="944" y="388" fill="var(--wt-color-text)" font-size="20" font-weight="400">New group · Mains · Steak ×1</text>
<text x="944" y="428" fill="var(--wt-color-text-muted)" font-size="17" font-weight="400">No editing or Send on this bill.</text>
<rect x="939" y="463" width="360" height="230" rx="12" fill="var(--wt-color-surface-raised)" stroke="var(--wt-color-border)"/>
<text x="956" y="499" fill="var(--wt-color-text)" font-size="20" font-weight="700">Local unsaved change</text>
<text x="956" y="537" fill="var(--wt-color-text)" font-size="18" font-weight="400">Salad ×1 · on Ana’s device only</text>
<text x="956" y="575" fill="var(--wt-color-text-muted)" font-size="17" font-weight="400">Luis has taken over this order.</text>
<text x="956" y="603" fill="var(--wt-color-text-muted)" font-size="17" font-weight="400">Your last change was not saved.</text>
<text x="956" y="641" fill="var(--wt-color-text)" font-size="17" font-weight="400">Review against the saved order</text>
<text x="956" y="670" fill="var(--wt-color-text)" font-size="17" font-weight="400">after taking this bill back.</text>
<rect x="944" y="718" width="348" height="46" rx="12" fill="var(--wt-color-primary)" stroke="var(--wt-color-border)"/>
<text x="958" y="747" fill="var(--wt-color-on-primary)" font-size="17" font-weight="600">Take over · Bill 1</text>
<text x="944" y="819" fill="var(--wt-color-text)" font-size="21" font-weight="700">Still shared</text>
<text x="944" y="854" fill="var(--wt-color-text-muted)" font-size="16" font-weight="400">Serve ready dishes; fire sent held food.</text>
<text x="944" y="887" fill="var(--wt-color-text-muted)" font-size="17" font-weight="400">Existing permissions still apply.</text>
<rect x="44" y="966" width="390" height="142" rx="12" fill="var(--wt-color-surface-lifted)" stroke="var(--wt-color-border)"/>
<text x="64" y="997" fill="var(--wt-color-text)" font-size="19" font-weight="700">Floor · before takeover</text>
<text x="64" y="1035" fill="var(--wt-color-text)" font-size="20" font-weight="600">Bill 1 · Ana</text>
<text x="64" y="1074" fill="var(--wt-color-text)" font-size="20" font-weight="600">Bill 2 · Luis</text>
<rect x="484" y="966" width="390" height="142" rx="12" fill="var(--wt-color-surface-lifted)" stroke="var(--wt-color-border)"/>
<text x="504" y="997" fill="var(--wt-color-text)" font-size="19" font-weight="700">Floor · after Bill 1 takeover</text>
<text x="504" y="1035" fill="var(--wt-color-text)" font-size="20" font-weight="600">Bill 1 · Luis</text>
<text x="504" y="1074" fill="var(--wt-color-text)" font-size="20" font-weight="600">Bill 2 · Luis</text>
<rect x="924" y="966" width="390" height="142" rx="12" fill="var(--wt-color-surface-lifted)" stroke="var(--wt-color-border)"/>
<text x="944" y="997" fill="var(--wt-color-text)" font-size="19" font-weight="700">After Bill 1 is fully sent</text>
<text x="944" y="1035" fill="var(--wt-color-text)" font-size="17" font-weight="400">Bill 1 releases; Pay can proceed.</text>
<text x="944" y="1074" fill="var(--wt-color-text)" font-size="20" font-weight="600">Floor: Bill 2 · Luis</text>
<text x="44" y="1164" fill="var(--wt-color-text)" font-size="21" font-weight="600">Opening an empty bill reserves nothing. First accepted nonempty save wins on that bill.</text>
<text x="44" y="1202" fill="var(--wt-color-text-muted)" font-size="18" font-weight="400">The losing local candidate stays for review. Another bill’s editor or unsent dishes never block this bill’s Pay.</text>
</g>
</svg>
