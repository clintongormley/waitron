<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1170" viewBox="0 0 1280 1170"><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1280" height="1170" rx="0" fill="#101216"/><rect x="0" y="0" width="1280" height="70" rx="0" fill="#191c22" stroke="#333945"/><text x="20" y="32" font-size="23" fill="#78a9ff" font-weight="600">waitron</text><text x="190" y="32" font-size="14" fill="#eceef2" font-weight="600">Restaurante Olivo S.L.</text><text x="1198" y="32" font-size="12" fill="#a1a7b3">EN</text><circle cx="1250" cy="23" r="5" fill="none" stroke="#a1a7b3"/><path d="M1240,39 Q1240,29 1250,29 Q1260,29 1260,39 Z" fill="none" stroke="#a1a7b3"/><text x="28" y="126" font-size="12" fill="#78a9ff" font-weight="600">SETTINGS</text><text x="30" y="166" font-size="15" fill="#a1a7b3">Printers</text><text x="30" y="212" font-size="15" fill="#a1a7b3">Card payments</text><text x="30" y="258" font-size="15" fill="#78a9ff" font-weight="600">Modules</text><rect x="14" y="239" width="3" height="28" rx="0" fill="#4c8dff"/><text x="282" y="112" font-size="10" fill="#a1a7b3" font-weight="600">PROPOSED · STATIC MOCK-UP</text><text x="282" y="154" font-size="28" fill="#eceef2" font-weight="600">Modules</text><text x="282" y="190" font-size="14" fill="#a1a7b3">Turn optional features on and configure them here.</text><rect x="282" y="234" width="520" height="44" rx="8" fill="#191c22" stroke="#333945"/><text x="296" y="262" font-size="14" fill="#78a9ff" font-weight="600">All modules</text><text x="482" y="262" font-size="13" fill="#a1a7b3">Card providers</text><rect x="282" y="300" width="392" height="102" rx="8" fill="#191c22" stroke="#333945"/><text x="298" y="327" font-size="17" fill="#eceef2" font-weight="600">Google login</text><text x="298" y="352" font-size="13" fill="#a1a7b3">Off · not configured</text><text x="298" y="380" font-size="13" fill="#78a9ff" font-weight="600">Configure</text><rect x="616" y="320" width="40" height="24" rx="12" fill="#7a8291"/><circle cx="628" cy="332" r="8" fill="#06101f"/><rect x="282" y="418" width="392" height="102" rx="8" fill="#191c22" stroke="#333945"/><text x="298" y="445" font-size="17" fill="#eceef2" font-weight="600">Stripe</text><text x="298" y="470" font-size="13" fill="#a1a7b3">On · configured</text><text x="298" y="498" font-size="13" fill="#78a9ff" font-weight="600">Configure</text><rect x="616" y="438" width="40" height="24" rx="12" fill="#4c8dff"/><circle cx="644" cy="450" r="8" fill="#06101f"/><rect x="282" y="536" width="392" height="102" rx="8" fill="#191c22" stroke="#333945"/><text x="298" y="563" font-size="17" fill="#eceef2" font-weight="600">SumUp</text><text x="298" y="588" font-size="13" fill="#a1a7b3">Off · setup needed</text><text x="298" y="616" font-size="13" fill="#78a9ff" font-weight="600">Configure</text><rect x="616" y="556" width="40" height="24" rx="12" fill="#7a8291"/><circle cx="628" cy="568" r="8" fill="#06101f"/><text x="282" y="686" font-size="13" fill="#a1a7b3" font-weight="600">Required features stay on</text><text x="282" y="724" font-size="13" fill="#a1a7b3">Turning off keeps recorded data.</text><rect x="706" y="300" width="530" height="620" rx="8" fill="#191c22" stroke="#333945"/><text x="724" y="332" font-size="18" fill="#eceef2" font-weight="600">Configure Google login</text><rect x="724" y="363" width="40" height="24" rx="12" fill="#4c8dff"/><circle cx="752" cy="375" r="8" fill="#06101f"/><text x="778" y="381" font-size="14" fill="#eceef2">Enable Google login</text><text x="724" y="420" font-size="13" fill="#a1a7b3">Password and passkey sign-in stay available.</text><text x="724" y="473" font-size="13" fill="#eceef2" font-weight="600">Client ID *</text><rect x="724" y="488" width="494" height="48" rx="8" fill="#262a33" stroke="#333945"/><text x="736" y="518" font-size="12" fill="#a1a7b3">Paste the Google client ID</text><text x="724" y="577" font-size="13" fill="#eceef2" font-weight="600">Client secret *</text><rect x="724" y="592" width="494" height="48" rx="8" fill="#262a33" stroke="#333945"/><text x="736" y="622" font-size="12" fill="#a1a7b3">Paste a new client secret</text><text x="724" y="665" font-size="13" fill="#a1a7b3">The saved secret is never shown back to you.</text><text x="724" y="714" font-size="13" fill="#eceef2" font-weight="600">Callback address</text><text x="724" y="740" font-size="12" fill="#78a9ff">https://venue.example/management-api/google/callback</text><text x="724" y="791" font-size="13" fill="#a1a7b3">Copy this address into your Google setup.</text><rect x="1012" y="852" width="102" height="44" rx="8" fill="#191c22" stroke="#333945"/><text x="1026" y="880" font-size="14" fill="#78a9ff" font-weight="600">Cancel</text><rect x="1126" y="852" width="92" height="44" rx="8" fill="#4c8dff" stroke="#333945"/><text x="1140" y="880" font-size="14" fill="#06101f" font-weight="600">Save</text><rect x="282" y="950" width="954" height="128" rx="8" fill="#191c22" stroke="#333945"/><text x="298" y="978" font-size="16" fill="#eceef2" font-weight="600">Stripe stays on</text><text x="298" y="1004" font-size="13" fill="#ff7f73">One card payment still has an unknown outcome.</text><text x="298" y="1026" font-size="13" fill="#a1a7b3">Resolve it in Card payments, then try again.</text><text x="298" y="1060" font-size="13" fill="#78a9ff" font-weight="600">Open Card payments</text><text x="282" y="1116" font-size="12" fill="#a1a7b3">No restart. Changes are checked before they apply.</text></g></svg>