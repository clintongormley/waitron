<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1690" viewBox="0 0 390 1690"><g font-family="Arial, sans-serif"><rect x="0" y="0" width="390" height="1690" rx="0" fill="#101216"/><rect x="0" y="0" width="390" height="90" rx="0" fill="#191c22" stroke="#333945"/><text x="54" y="32" font-size="23" fill="#78a9ff" font-weight="600">waitron</text><text x="20" y="32" font-size="23" fill="#a1a7b3">≡</text><text x="20" y="66" font-size="14" fill="#eceef2" font-weight="600">Restaurante Olivo S.L.</text><text x="308" y="32" font-size="12" fill="#a1a7b3">ES</text><circle cx="360" cy="23" r="5" fill="none" stroke="#a1a7b3"/><path d="M350,39 Q350,29 360,29 Q370,29 370,39 Z" fill="none" stroke="#a1a7b3"/><text x="18" y="122" font-size="10" fill="#a1a7b3" font-weight="600">PROPUESTA · MAQUETA ESTÁTICA</text><text x="18" y="160" font-size="28" fill="#eceef2" font-weight="600">Módulos</text><text x="18" y="190" font-size="14" fill="#a1a7b3">Activa funciones opcionales y configúralas</text><text x="18" y="212" font-size="14" fill="#a1a7b3">aquí.</text><rect x="18" y="234" width="354" height="44" rx="8" fill="#191c22" stroke="#333945"/><text x="32" y="262" font-size="14" fill="#78a9ff" font-weight="600">Todos los módulos</text><text x="176" y="262" font-size="13" fill="#a1a7b3">Proveedores de tarjeta</text><rect x="18" y="300" width="354" height="102" rx="8" fill="#191c22" stroke="#333945"/><text x="34" y="327" font-size="17" fill="#eceef2" font-weight="600">Acceso con Google</text><text x="34" y="352" font-size="13" fill="#a1a7b3">Desactivado · sin configurar</text><text x="34" y="380" font-size="13" fill="#78a9ff" font-weight="600">Configurar</text><rect x="314" y="320" width="40" height="24" rx="12" fill="#7a8291"/><circle cx="326" cy="332" r="8" fill="#06101f"/><rect x="18" y="418" width="354" height="102" rx="8" fill="#191c22" stroke="#333945"/><text x="34" y="445" font-size="17" fill="#eceef2" font-weight="600">Stripe</text><text x="34" y="470" font-size="13" fill="#a1a7b3">Activado · configurado</text><text x="34" y="498" font-size="13" fill="#78a9ff" font-weight="600">Configurar</text><rect x="314" y="438" width="40" height="24" rx="12" fill="#4c8dff"/><circle cx="342" cy="450" r="8" fill="#06101f"/><rect x="18" y="536" width="354" height="102" rx="8" fill="#191c22" stroke="#333945"/><text x="34" y="563" font-size="17" fill="#eceef2" font-weight="600">SumUp</text><text x="34" y="588" font-size="13" fill="#a1a7b3">Desactivado · falta configurar</text><text x="34" y="616" font-size="13" fill="#78a9ff" font-weight="600">Configurar</text><rect x="314" y="556" width="40" height="24" rx="12" fill="#7a8291"/><circle cx="326" cy="568" r="8" fill="#06101f"/><text x="18" y="686" font-size="13" fill="#a1a7b3" font-weight="600">Las funciones necesarias siguen activas</text><text x="18" y="724" font-size="13" fill="#a1a7b3">Desactivar conserva los datos registrados.</text><rect x="18" y="800" width="354" height="620" rx="8" fill="#191c22" stroke="#333945"/><text x="36" y="832" font-size="18" fill="#eceef2" font-weight="600">Configurar acceso con Google</text><rect x="36" y="863" width="40" height="24" rx="12" fill="#4c8dff"/><circle cx="64" cy="875" r="8" fill="#06101f"/><text x="90" y="881" font-size="14" fill="#eceef2">Activar acceso con Google</text><text x="36" y="920" font-size="13" fill="#a1a7b3">El acceso con contraseña y clave de acceso</text><text x="36" y="942" font-size="13" fill="#a1a7b3">sigue disponible.</text><text x="36" y="973" font-size="13" fill="#eceef2" font-weight="600">ID de cliente *</text><rect x="36" y="988" width="318" height="48" rx="8" fill="#262a33" stroke="#333945"/><text x="48" y="1018" font-size="12" fill="#a1a7b3">Pega el ID de cliente de Google</text><text x="36" y="1077" font-size="13" fill="#eceef2" font-weight="600">Secreto de cliente *</text><rect x="36" y="1092" width="318" height="48" rx="8" fill="#262a33" stroke="#333945"/><text x="48" y="1122" font-size="12" fill="#a1a7b3">Pega un secreto de cliente nuevo</text><text x="36" y="1165" font-size="13" fill="#a1a7b3">El secreto guardado no se vuelve a mostrar.</text><text x="36" y="1214" font-size="13" fill="#eceef2" font-weight="600">Dirección de retorno</text><text x="36" y="1240" font-size="12" fill="#78a9ff">https://venue.example/management-</text><text x="36" y="1262" font-size="12" fill="#78a9ff">api/google/callback</text><text x="36" y="1291" font-size="13" fill="#a1a7b3">Copia esta dirección en la configuración de</text><text x="36" y="1313" font-size="13" fill="#a1a7b3">Google.</text><rect x="148" y="1352" width="102" height="44" rx="8" fill="#191c22" stroke="#333945"/><text x="162" y="1380" font-size="14" fill="#78a9ff" font-weight="600">Cancelar</text><rect x="262" y="1352" width="92" height="44" rx="8" fill="#4c8dff" stroke="#333945"/><text x="276" y="1380" font-size="14" fill="#06101f" font-weight="600">Guardar</text><rect x="18" y="1450" width="354" height="178" rx="8" fill="#191c22" stroke="#333945"/><text x="34" y="1478" font-size="16" fill="#eceef2" font-weight="600">Stripe sigue activado</text><text x="34" y="1504" font-size="13" fill="#ff7f73">Un pago con tarjeta aún tiene resultado</text><text x="34" y="1526" font-size="13" fill="#ff7f73">desconocido.</text><text x="34" y="1548" font-size="13" fill="#a1a7b3">Resuélvelo en Pagos con tarjeta y vuelve a</text><text x="34" y="1570" font-size="13" fill="#a1a7b3">intentarlo.</text><text x="34" y="1604" font-size="13" fill="#78a9ff" font-weight="600">Abrir Pagos con tarjeta</text><text x="18" y="1636" font-size="12" fill="#a1a7b3">Sin reinicio. Los cambios se comprueban antes de</text><text x="18" y="1658" font-size="12" fill="#a1a7b3">aplicarse.</text></g></svg>