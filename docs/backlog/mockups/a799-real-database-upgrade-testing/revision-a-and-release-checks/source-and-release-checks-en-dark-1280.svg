<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="2002" viewBox="0 0 1280 2002"><title>A799 · Which older releases must pass?</title><rect width="1280" height="2002" fill="#101216"/><g font-family="Arial, sans-serif"><text x="40" y="32" font-size="21" fill="#eceef2" font-weight="700">A799 · Which older releases must pass?</text><text x="40" y="60" font-size="14" fill="#78a9ff">Source agreed · release checks proposed</text><text x="40" y="104" font-size="19" fill="#eceef2" font-weight="700">A · Agreed: an invented venue</text><rect x="40" y="136" width="1200" height="528" rx="8" fill="#22262e" stroke="#333945"/><text x="56" y="166" font-size="16" fill="#78a9ff" font-weight="700">A799 · Design review</text><text x="56" y="198" font-size="17" fill="#eceef2" font-weight="700">Created through a frozen older product</text><rect x="56" y="234" width="1168" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="260" font-size="16" fill="#eceef2" font-weight="700">Ana’s invented restaurant</text><text x="68" y="286" font-size="15" fill="#a1a7b3">No private venue snapshot</text><rect x="56" y="334" width="1168" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="360" font-size="16" fill="#eceef2" font-weight="700">Normal setup, menus, staff and sales</text><text x="68" y="386" font-size="15" fill="#a1a7b3">Old image writes the recorded history</text><rect x="56" y="434" width="1168" height="88" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="68" y="460" font-size="16" fill="#eceef2" font-weight="700">Freeze what the old product wrote</text><text x="68" y="486" font-size="15" fill="#a1a7b3">Compare exact facts after upgrade</text><text x="56" y="542" font-size="16" fill="#a1a7b3">Source choice only is approved. No capture, migration, reset or fiscal change is authorised. Historical source observations remain unverified at runtime.</text><rect x="56" y="580" width="1168" height="64" rx="8" fill="#4c8dff" stroke="#333945"/><text x="68" y="608" font-size="16" fill="#06101f" font-weight="700">Owner chose invented venue</text><text x="40" y="698" font-size="19" fill="#eceef2" font-weight="700">B · Recommended: oldest + previous</text><rect x="40" y="730" width="1200" height="552" rx="8" fill="#22262e" stroke="#333945"/><text x="56" y="760" font-size="16" fill="#78a9ff" font-weight="700">A799 · Design review</text><text x="56" y="792" font-size="17" fill="#eceef2" font-weight="700">Before publishing candidate R5</text><rect x="56" y="828" width="1168" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="854" font-size="16" fill="#eceef2" font-weight="700">Keep frozen inputs from all four releases</text><text x="68" y="880" font-size="15" fill="#a1a7b3">R1 · R2 · R3 · R4</text><rect x="56" y="928" width="1168" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="954" font-size="16" fill="#eceef2" font-weight="700">Required upgrade checks</text><text x="68" y="980" font-size="15" fill="#a1a7b3">R1 to R5 and R4 to R5</text><rect x="56" y="1028" width="1168" height="88" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="68" y="1054" font-size="16" fill="#eceef2" font-weight="700">R2 and R3 not checked in this gate</text><text x="68" y="1080" font-size="15" fill="#a1a7b3">No passing evidence for either</text><text x="56" y="1136" font-size="16" fill="#a1a7b3">Fewer required checks. A defect affecting only R2 or R3 could be missed. Do not silently retire their support or claim they passed. Existing optional-module-off</text><text x="56" y="1160" font-size="16" fill="#a1a7b3">variants remain proposed; deduplicate identical endpoints.</text><rect x="56" y="1198" width="1168" height="64" rx="8" fill="#4c8dff" stroke="#333945"/><text x="68" y="1226" font-size="16" fill="#06101f" font-weight="700">Proposed · not agreed</text><text x="40" y="1316" font-size="19" fill="#eceef2" font-weight="700">B · Alternative: every retained release</text><rect x="40" y="1348" width="1200" height="552" rx="8" fill="#22262e" stroke="#333945"/><text x="56" y="1378" font-size="16" fill="#78a9ff" font-weight="700">A799 · Design review</text><text x="56" y="1410" font-size="17" fill="#eceef2" font-weight="700">Same four frozen sources; candidate R5</text><rect x="56" y="1446" width="1168" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="1472" font-size="16" fill="#eceef2" font-weight="700">Keep exactly the same original inputs</text><text x="68" y="1498" font-size="15" fill="#a1a7b3">R1 · R2 · R3 · R4</text><rect x="56" y="1546" width="1168" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="1572" font-size="16" fill="#eceef2" font-weight="700">Required upgrade checks</text><text x="68" y="1598" font-size="15" fill="#a1a7b3">R1, R2, R3 and R4 to R5</text><rect x="56" y="1646" width="1168" height="88" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="68" y="1672" font-size="16" fill="#eceef2" font-weight="700">Check intermediate releases as well</text><text x="68" y="1698" font-size="15" fill="#a1a7b3">More required jobs as releases accumulate</text><text x="56" y="1754" font-size="16" fill="#a1a7b3">Both options keep all original archives and expectations. This question chooses mandatory checks, not storage or deletion. Same-image restart alone never meets</text><text x="56" y="1778" font-size="16" fill="#a1a7b3">the pending-migration acceptance requirement.</text><rect x="56" y="1816" width="1168" height="64" rx="8" fill="#4c8dff" stroke="#333945"/><text x="68" y="1844" font-size="16" fill="#06101f" font-weight="700">Proposed · not agreed</text><text x="40" y="1934" font-size="14" fill="#a1a7b3">Illustrative design boards. R1–R5 are imagined releases after the separately approved A760 reset. No fixture or upgrade result exists by this drawing. Store, support/retirement policy, issued</text><text x="40" y="1958" font-size="14" fill="#a1a7b3">F1, capture time/IDs and complete design/build remain open.</text></g></svg>