<svg xmlns="http://www.w3.org/2000/svg" width="390" height="2362" viewBox="0 0 390 2362"><title>A799 · ¿Qué versiones deben pasar?</title><rect width="390" height="2362" fill="#f7f7f8"/><g font-family="Arial, sans-serif"><text x="18" y="32" font-size="21" fill="#16181d" font-weight="700">A799 · ¿Qué versiones deben</text><text x="18" y="56" font-size="21" fill="#16181d" font-weight="700">pasar?</text><text x="18" y="84" font-size="14" fill="#1a5fd0">Origen acordado · pruebas propuestas</text><text x="18" y="128" font-size="19" fill="#16181d" font-weight="700">A · Acordado: un local inventado</text><rect x="18" y="160" width="354" height="600" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="34" y="190" font-size="16" fill="#1a5fd0" font-weight="700">A799 · Revisión del diseño</text><text x="34" y="222" font-size="17" fill="#16181d" font-weight="700">Creado con el producto antiguo fijado</text><rect x="34" y="258" width="322" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="284" font-size="16" fill="#16181d" font-weight="700">El restaurante inventado de Ana</text><text x="46" y="310" font-size="15" fill="#5c626e">Sin copia de un local privado</text><rect x="34" y="358" width="322" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="384" font-size="16" fill="#16181d" font-weight="700">Alta, carta, personal y ventas normales</text><text x="46" y="410" font-size="15" fill="#5c626e">La imagen antigua escribe el historial</text><rect x="34" y="458" width="322" height="88" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="46" y="484" font-size="16" fill="#16181d" font-weight="700">Conservar los hechos originales</text><text x="46" y="510" font-size="15" fill="#5c626e">Compararlos después de actualizar</text><text x="34" y="566" font-size="16" fill="#5c626e">Solo está aprobado el origen. No se autoriza</text><text x="34" y="590" font-size="16" fill="#5c626e">capturar, migrar, reiniciar ni cambiar datos</text><text x="34" y="614" font-size="16" fill="#5c626e">fiscales. Las observaciones del código no se</text><text x="34" y="638" font-size="16" fill="#5c626e">han verificado en ejecución.</text><rect x="34" y="676" width="322" height="64" rx="8" fill="#1f6feb" stroke="#d6d9e0"/><text x="46" y="704" font-size="16" fill="#ffffff" font-weight="700">El dueño eligió un local inventado</text><text x="18" y="794" font-size="19" fill="#16181d" font-weight="700">B · Recomendado: primera + anterior</text><rect x="18" y="826" width="354" height="672" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="34" y="856" font-size="16" fill="#1a5fd0" font-weight="700">A799 · Revisión del diseño</text><text x="34" y="888" font-size="17" fill="#16181d" font-weight="700">Antes de publicar la versión candidata</text><text x="34" y="912" font-size="17" fill="#16181d" font-weight="700">R5</text><rect x="34" y="948" width="322" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="974" font-size="16" fill="#16181d" font-weight="700">Guardar las cuatro capturas originales</text><text x="46" y="1000" font-size="15" fill="#5c626e">R1 · R2 · R3 · R4</text><rect x="34" y="1048" width="322" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="1074" font-size="16" fill="#16181d" font-weight="700">Actualizaciones obligatorias</text><text x="46" y="1100" font-size="15" fill="#5c626e">R1 a R5 y R4 a R5</text><rect x="34" y="1148" width="322" height="88" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="46" y="1174" font-size="16" fill="#16181d" font-weight="700">Este control no prueba R2 ni R3</text><text x="46" y="1200" font-size="15" fill="#5c626e">Ningún resultado favorable para ellas</text><text x="34" y="1256" font-size="16" fill="#5c626e">Menos controles. Puede pasar por alto un</text><text x="34" y="1280" font-size="16" fill="#5c626e">defecto exclusivo de R2 o R3. No se retira su</text><text x="34" y="1304" font-size="16" fill="#5c626e">soporte ni se afirma que pasan. Se</text><text x="34" y="1328" font-size="16" fill="#5c626e">mantienen las variantes propuestas con</text><text x="34" y="1352" font-size="16" fill="#5c626e">módulos apagados; sin repetir extremos</text><text x="34" y="1376" font-size="16" fill="#5c626e">iguales.</text><rect x="34" y="1414" width="322" height="64" rx="8" fill="#1f6feb" stroke="#d6d9e0"/><text x="46" y="1442" font-size="16" fill="#ffffff" font-weight="700">Propuesto · sin aprobar</text><text x="18" y="1532" font-size="19" fill="#16181d" font-weight="700">B · Alternativa: todas las conservadas</text><rect x="18" y="1564" width="354" height="624" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="34" y="1594" font-size="16" fill="#1a5fd0" font-weight="700">A799 · Revisión del diseño</text><text x="34" y="1626" font-size="17" fill="#16181d" font-weight="700">Mismas cuatro capturas; candidata R5</text><rect x="34" y="1662" width="322" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="1688" font-size="16" fill="#16181d" font-weight="700">Conservar los mismos originales</text><text x="46" y="1714" font-size="15" fill="#5c626e">R1 · R2 · R3 · R4</text><rect x="34" y="1762" width="322" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="1788" font-size="16" fill="#16181d" font-weight="700">Actualizaciones obligatorias</text><text x="46" y="1814" font-size="15" fill="#5c626e">R1, R2, R3 y R4 a R5</text><rect x="34" y="1862" width="322" height="88" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="46" y="1888" font-size="16" fill="#16181d" font-weight="700">Probar también las intermedias</text><text x="46" y="1914" font-size="15" fill="#5c626e">Más controles al acumular versiones</text><text x="34" y="1970" font-size="16" fill="#5c626e">Ambas opciones conservan archivos y</text><text x="34" y="1994" font-size="16" fill="#5c626e">hechos originales. Se eligen controles, no</text><text x="34" y="2018" font-size="16" fill="#5c626e">almacenamiento ni borrado. Reiniciar la</text><text x="34" y="2042" font-size="16" fill="#5c626e">misma imagen no cumple la exigencia de</text><text x="34" y="2066" font-size="16" fill="#5c626e">aplicar una migración pendiente.</text><rect x="34" y="2104" width="322" height="64" rx="8" fill="#1f6feb" stroke="#d6d9e0"/><text x="46" y="2132" font-size="16" fill="#ffffff" font-weight="700">Propuesto · sin aprobar</text><text x="18" y="2222" font-size="14" fill="#5c626e">Dibujos de diseño. R1–R5 son versiones imaginadas</text><text x="18" y="2246" font-size="14" fill="#5c626e">posteriores al reinicio A760 aprobado por separado.</text><text x="18" y="2270" font-size="14" fill="#5c626e">Aquí no existe una captura ni un resultado.</text><text x="18" y="2294" font-size="14" fill="#5c626e">Almacenamiento, soporte, F1, captura y aprobación</text><text x="18" y="2318" font-size="14" fill="#5c626e">completa siguen abiertos.</text></g></svg>