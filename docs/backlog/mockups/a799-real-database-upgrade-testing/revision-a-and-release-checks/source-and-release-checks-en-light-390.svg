<svg xmlns="http://www.w3.org/2000/svg" width="390" height="2362" viewBox="0 0 390 2362"><title>A799 · Which older releases must pass?</title><rect width="390" height="2362" fill="#f7f7f8"/><g font-family="Arial, sans-serif"><text x="18" y="32" font-size="21" fill="#16181d" font-weight="700">A799 · Which older releases must</text><text x="18" y="56" font-size="21" fill="#16181d" font-weight="700">pass?</text><text x="18" y="84" font-size="14" fill="#1a5fd0">Source agreed · release checks proposed</text><text x="18" y="128" font-size="19" fill="#16181d" font-weight="700">A · Agreed: an invented venue</text><rect x="18" y="160" width="354" height="600" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="34" y="190" font-size="16" fill="#1a5fd0" font-weight="700">A799 · Design review</text><text x="34" y="222" font-size="17" fill="#16181d" font-weight="700">Created through a frozen older product</text><rect x="34" y="258" width="322" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="284" font-size="16" fill="#16181d" font-weight="700">Ana’s invented restaurant</text><text x="46" y="310" font-size="15" fill="#5c626e">No private venue snapshot</text><rect x="34" y="358" width="322" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="384" font-size="16" fill="#16181d" font-weight="700">Normal setup, menus, staff and sales</text><text x="46" y="410" font-size="15" fill="#5c626e">Old image writes the recorded history</text><rect x="34" y="458" width="322" height="88" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="46" y="484" font-size="16" fill="#16181d" font-weight="700">Freeze what the old product wrote</text><text x="46" y="510" font-size="15" fill="#5c626e">Compare exact facts after upgrade</text><text x="34" y="566" font-size="16" fill="#5c626e">Source choice only is approved. No capture,</text><text x="34" y="590" font-size="16" fill="#5c626e">migration, reset or fiscal change is</text><text x="34" y="614" font-size="16" fill="#5c626e">authorised. Historical source observations</text><text x="34" y="638" font-size="16" fill="#5c626e">remain unverified at runtime.</text><rect x="34" y="676" width="322" height="64" rx="8" fill="#1f6feb" stroke="#d6d9e0"/><text x="46" y="704" font-size="16" fill="#ffffff" font-weight="700">Owner chose invented venue</text><text x="18" y="794" font-size="19" fill="#16181d" font-weight="700">B · Recommended: oldest + previous</text><rect x="18" y="826" width="354" height="672" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="34" y="856" font-size="16" fill="#1a5fd0" font-weight="700">A799 · Design review</text><text x="34" y="888" font-size="17" fill="#16181d" font-weight="700">Before publishing candidate R5</text><rect x="34" y="924" width="322" height="112" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="950" font-size="16" fill="#16181d" font-weight="700">Keep frozen inputs from all four</text><text x="46" y="974" font-size="16" fill="#16181d" font-weight="700">releases</text><text x="46" y="1000" font-size="15" fill="#5c626e">R1 · R2 · R3 · R4</text><rect x="34" y="1048" width="322" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="1074" font-size="16" fill="#16181d" font-weight="700">Required upgrade checks</text><text x="46" y="1100" font-size="15" fill="#5c626e">R1 to R5 and R4 to R5</text><rect x="34" y="1148" width="322" height="88" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="46" y="1174" font-size="16" fill="#16181d" font-weight="700">R2 and R3 not checked in this gate</text><text x="46" y="1200" font-size="15" fill="#5c626e">No passing evidence for either</text><text x="34" y="1256" font-size="16" fill="#5c626e">Fewer required checks. A defect affecting</text><text x="34" y="1280" font-size="16" fill="#5c626e">only R2 or R3 could be missed. Do not</text><text x="34" y="1304" font-size="16" fill="#5c626e">silently retire their support or claim they</text><text x="34" y="1328" font-size="16" fill="#5c626e">passed. Existing optional-module-off variants</text><text x="34" y="1352" font-size="16" fill="#5c626e">remain proposed; deduplicate identical</text><text x="34" y="1376" font-size="16" fill="#5c626e">endpoints.</text><rect x="34" y="1414" width="322" height="64" rx="8" fill="#1f6feb" stroke="#d6d9e0"/><text x="46" y="1442" font-size="16" fill="#ffffff" font-weight="700">Proposed · not agreed</text><text x="18" y="1532" font-size="19" fill="#16181d" font-weight="700">B · Alternative: every retained release</text><rect x="18" y="1564" width="354" height="624" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="34" y="1594" font-size="16" fill="#1a5fd0" font-weight="700">A799 · Design review</text><text x="34" y="1626" font-size="17" fill="#16181d" font-weight="700">Same four frozen sources; candidate R5</text><rect x="34" y="1662" width="322" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="1688" font-size="16" fill="#16181d" font-weight="700">Keep exactly the same original inputs</text><text x="46" y="1714" font-size="15" fill="#5c626e">R1 · R2 · R3 · R4</text><rect x="34" y="1762" width="322" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="1788" font-size="16" fill="#16181d" font-weight="700">Required upgrade checks</text><text x="46" y="1814" font-size="15" fill="#5c626e">R1, R2, R3 and R4 to R5</text><rect x="34" y="1862" width="322" height="88" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="46" y="1888" font-size="16" fill="#16181d" font-weight="700">Check intermediate releases as well</text><text x="46" y="1914" font-size="15" fill="#5c626e">More required jobs as releases accumulate</text><text x="34" y="1970" font-size="16" fill="#5c626e">Both options keep all original archives and</text><text x="34" y="1994" font-size="16" fill="#5c626e">expectations. This question chooses</text><text x="34" y="2018" font-size="16" fill="#5c626e">mandatory checks, not storage or deletion.</text><text x="34" y="2042" font-size="16" fill="#5c626e">Same-image restart alone never meets the</text><text x="34" y="2066" font-size="16" fill="#5c626e">pending-migration acceptance requirement.</text><rect x="34" y="2104" width="322" height="64" rx="8" fill="#1f6feb" stroke="#d6d9e0"/><text x="46" y="2132" font-size="16" fill="#ffffff" font-weight="700">Proposed · not agreed</text><text x="18" y="2222" font-size="14" fill="#5c626e">Illustrative design boards. R1–R5 are imagined</text><text x="18" y="2246" font-size="14" fill="#5c626e">releases after the separately approved A760 reset. No</text><text x="18" y="2270" font-size="14" fill="#5c626e">fixture or upgrade result exists by this drawing. Store,</text><text x="18" y="2294" font-size="14" fill="#5c626e">support/retirement policy, issued F1, capture time/IDs</text><text x="18" y="2318" font-size="14" fill="#5c626e">and complete design/build remain open.</text></g></svg>