<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="2002" viewBox="0 0 1280 2002"><title>A799 · ¿Qué versiones deben pasar?</title><rect width="1280" height="2002" fill="#101216"/><g font-family="Arial, sans-serif"><text x="40" y="32" font-size="21" fill="#eceef2" font-weight="700">A799 · ¿Qué versiones deben pasar?</text><text x="40" y="60" font-size="14" fill="#78a9ff">Origen acordado · pruebas propuestas</text><text x="40" y="104" font-size="19" fill="#eceef2" font-weight="700">A · Acordado: un local inventado</text><rect x="40" y="136" width="1200" height="528" rx="8" fill="#22262e" stroke="#333945"/><text x="56" y="166" font-size="16" fill="#78a9ff" font-weight="700">A799 · Revisión del diseño</text><text x="56" y="198" font-size="17" fill="#eceef2" font-weight="700">Creado con el producto antiguo fijado</text><rect x="56" y="234" width="1168" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="260" font-size="16" fill="#eceef2" font-weight="700">El restaurante inventado de Ana</text><text x="68" y="286" font-size="15" fill="#a1a7b3">Sin copia de un local privado</text><rect x="56" y="334" width="1168" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="360" font-size="16" fill="#eceef2" font-weight="700">Alta, carta, personal y ventas normales</text><text x="68" y="386" font-size="15" fill="#a1a7b3">La imagen antigua escribe el historial</text><rect x="56" y="434" width="1168" height="88" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="68" y="460" font-size="16" fill="#eceef2" font-weight="700">Conservar los hechos originales</text><text x="68" y="486" font-size="15" fill="#a1a7b3">Compararlos después de actualizar</text><text x="56" y="542" font-size="16" fill="#a1a7b3">Solo está aprobado el origen. No se autoriza capturar, migrar, reiniciar ni cambiar datos fiscales. Las observaciones del código no se han verificado en ejecución.</text><rect x="56" y="580" width="1168" height="64" rx="8" fill="#4c8dff" stroke="#333945"/><text x="68" y="608" font-size="16" fill="#06101f" font-weight="700">El dueño eligió un local inventado</text><text x="40" y="698" font-size="19" fill="#eceef2" font-weight="700">B · Recomendado: primera + anterior</text><rect x="40" y="730" width="1200" height="552" rx="8" fill="#22262e" stroke="#333945"/><text x="56" y="760" font-size="16" fill="#78a9ff" font-weight="700">A799 · Revisión del diseño</text><text x="56" y="792" font-size="17" fill="#eceef2" font-weight="700">Antes de publicar la versión candidata R5</text><rect x="56" y="828" width="1168" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="854" font-size="16" fill="#eceef2" font-weight="700">Guardar las cuatro capturas originales</text><text x="68" y="880" font-size="15" fill="#a1a7b3">R1 · R2 · R3 · R4</text><rect x="56" y="928" width="1168" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="954" font-size="16" fill="#eceef2" font-weight="700">Actualizaciones obligatorias</text><text x="68" y="980" font-size="15" fill="#a1a7b3">R1 a R5 y R4 a R5</text><rect x="56" y="1028" width="1168" height="88" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="68" y="1054" font-size="16" fill="#eceef2" font-weight="700">Este control no prueba R2 ni R3</text><text x="68" y="1080" font-size="15" fill="#a1a7b3">Ningún resultado favorable para ellas</text><text x="56" y="1136" font-size="16" fill="#a1a7b3">Menos controles. Puede pasar por alto un defecto exclusivo de R2 o R3. No se retira su soporte ni se afirma que pasan. Se mantienen las variantes propuestas con</text><text x="56" y="1160" font-size="16" fill="#a1a7b3">módulos apagados; sin repetir extremos iguales.</text><rect x="56" y="1198" width="1168" height="64" rx="8" fill="#4c8dff" stroke="#333945"/><text x="68" y="1226" font-size="16" fill="#06101f" font-weight="700">Propuesto · sin aprobar</text><text x="40" y="1316" font-size="19" fill="#eceef2" font-weight="700">B · Alternativa: todas las conservadas</text><rect x="40" y="1348" width="1200" height="552" rx="8" fill="#22262e" stroke="#333945"/><text x="56" y="1378" font-size="16" fill="#78a9ff" font-weight="700">A799 · Revisión del diseño</text><text x="56" y="1410" font-size="17" fill="#eceef2" font-weight="700">Mismas cuatro capturas; candidata R5</text><rect x="56" y="1446" width="1168" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="1472" font-size="16" fill="#eceef2" font-weight="700">Conservar los mismos originales</text><text x="68" y="1498" font-size="15" fill="#a1a7b3">R1 · R2 · R3 · R4</text><rect x="56" y="1546" width="1168" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="1572" font-size="16" fill="#eceef2" font-weight="700">Actualizaciones obligatorias</text><text x="68" y="1598" font-size="15" fill="#a1a7b3">R1, R2, R3 y R4 a R5</text><rect x="56" y="1646" width="1168" height="88" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="68" y="1672" font-size="16" fill="#eceef2" font-weight="700">Probar también las intermedias</text><text x="68" y="1698" font-size="15" fill="#a1a7b3">Más controles al acumular versiones</text><text x="56" y="1754" font-size="16" fill="#a1a7b3">Ambas opciones conservan archivos y hechos originales. Se eligen controles, no almacenamiento ni borrado. Reiniciar la misma imagen no cumple la exigencia de</text><text x="56" y="1778" font-size="16" fill="#a1a7b3">aplicar una migración pendiente.</text><rect x="56" y="1816" width="1168" height="64" rx="8" fill="#4c8dff" stroke="#333945"/><text x="68" y="1844" font-size="16" fill="#06101f" font-weight="700">Propuesto · sin aprobar</text><text x="40" y="1934" font-size="14" fill="#a1a7b3">Dibujos de diseño. R1–R5 son versiones imaginadas posteriores al reinicio A760 aprobado por separado. Aquí no existe una captura ni un resultado. Almacenamiento, soporte, F1, captura</text><text x="40" y="1958" font-size="14" fill="#a1a7b3">y aprobación completa siguen abiertos.</text></g></svg>