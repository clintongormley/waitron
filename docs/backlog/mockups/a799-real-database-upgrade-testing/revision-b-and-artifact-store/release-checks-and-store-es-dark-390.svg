<svg xmlns="http://www.w3.org/2000/svg" width="390" height="2506" viewBox="0 0 390 2506"><title>A799 · ¿Dónde guardar las capturas?</title><rect width="390" height="2506" fill="#101216"/><g font-family="Arial, sans-serif"><text x="18" y="32" font-size="21" fill="#eceef2" font-weight="700">A799 · ¿Dónde guardar las</text><text x="18" y="56" font-size="21" fill="#eceef2" font-weight="700">capturas?</text><text x="18" y="84" font-size="14" fill="#78a9ff">Antigua + anterior acordado · almacén propuesto</text><text x="18" y="128" font-size="19" fill="#eceef2" font-weight="700">B · Acordado: antigua + anterior</text><rect x="18" y="160" width="354" height="672" rx="8" fill="#22262e" stroke="#333945"/><text x="34" y="190" font-size="16" fill="#78a9ff" font-weight="700">A799 · Revisión del diseño</text><text x="34" y="222" font-size="17" fill="#eceef2" font-weight="700">Antes de publicar la candidata</text><text x="34" y="246" font-size="17" fill="#eceef2" font-weight="700">imaginada R5</text><rect x="34" y="282" width="322" height="112" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="308" font-size="16" fill="#eceef2" font-weight="700">Pruebas obligatorias con datos</text><text x="46" y="332" font-size="16" fill="#eceef2" font-weight="700">congelados</text><text x="46" y="358" font-size="15" fill="#a1a7b3">R1 a R5 y R4 a R5</text><rect x="34" y="406" width="322" height="112" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="432" font-size="16" fill="#eceef2" font-weight="700">Guardar todas las capturas y</text><text x="46" y="456" font-size="16" fill="#eceef2" font-weight="700">expectativas</text><text x="46" y="482" font-size="15" fill="#a1a7b3">R1 · R2 · R3 · R4</text><rect x="34" y="530" width="322" height="88" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="46" y="556" font-size="16" fill="#eceef2" font-weight="700">Este control no prueba R2 ni R3</text><text x="46" y="582" font-size="15" fill="#a1a7b3">No implica que hayan pasado</text><text x="34" y="638" font-size="16" fill="#a1a7b3">Solo se eligen las pruebas obligatorias. No</text><text x="34" y="662" font-size="16" fill="#a1a7b3">se retira el soporte de las intermedias. El</text><text x="34" y="686" font-size="16" fill="#a1a7b3">origen sigue siendo un local inventado</text><text x="34" y="710" font-size="16" fill="#a1a7b3">escrito por el producto antiguo.</text><rect x="34" y="748" width="322" height="64" rx="8" fill="#4c8dff" stroke="#333945"/><text x="46" y="776" font-size="16" fill="#06101f" font-weight="700">El dueño eligió antigua + anterior</text><text x="18" y="866" font-size="19" fill="#eceef2" font-weight="700">C · Recomendado: almacén aparte</text><rect x="18" y="898" width="354" height="696" rx="8" fill="#22262e" stroke="#333945"/><text x="34" y="928" font-size="16" fill="#78a9ff" font-weight="700">A799 · Revisión del diseño</text><text x="34" y="960" font-size="17" fill="#eceef2" font-weight="700">Git guarda un índice de huellas de los</text><text x="34" y="984" font-size="17" fill="#eceef2" font-weight="700">archivos</text><rect x="34" y="1020" width="322" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="1046" font-size="16" fill="#eceef2" font-weight="700">Capturas y expectativas congeladas</text><text x="46" y="1072" font-size="15" fill="#a1a7b3">En un almacén de archivos de versiones</text><rect x="34" y="1120" width="322" height="112" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="1146" font-size="16" fill="#eceef2" font-weight="700">R5 obtiene R1 y R4 por sus huellas</text><text x="46" y="1170" font-size="16" fill="#eceef2" font-weight="700">fijadas</text><text x="46" y="1196" font-size="15" fill="#a1a7b3">R2 y R3 también se conservan</text><rect x="34" y="1244" width="322" height="112" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="46" y="1270" font-size="16" fill="#eceef2" font-weight="700">Originales sellados, copias para las</text><text x="46" y="1294" font-size="16" fill="#eceef2" font-weight="700">pruebas</text><text x="46" y="1320" font-size="15" fill="#a1a7b3">R5 nunca vuelve a crear el historial</text><text x="34" y="1376" font-size="16" fill="#a1a7b3">Contrato propuesto: no sustituir originales ni</text><text x="34" y="1400" font-size="16" fill="#a1a7b3">dar credenciales de subida/borrado al código</text><text x="34" y="1424" font-size="16" fill="#a1a7b3">candidato no fiable. Si falta un archivo o está</text><text x="34" y="1448" font-size="16" fill="#a1a7b3">dañado, se bloquea la prueba. Proveedor y</text><text x="34" y="1472" font-size="16" fill="#a1a7b3">acceso sin decidir.</text><rect x="34" y="1510" width="322" height="64" rx="8" fill="#4c8dff" stroke="#333945"/><text x="46" y="1538" font-size="16" fill="#06101f" font-weight="700">Propuesto · sin aprobar</text><text x="18" y="1628" font-size="19" fill="#eceef2" font-weight="700">C · Alternativa: capturas dentro de Git</text><rect x="18" y="1660" width="354" height="672" rx="8" fill="#22262e" stroke="#333945"/><text x="34" y="1690" font-size="16" fill="#78a9ff" font-weight="700">A799 · Revisión del diseño</text><text x="34" y="1722" font-size="17" fill="#eceef2" font-weight="700">Una copia incluye el código y los datos</text><text x="34" y="1746" font-size="17" fill="#eceef2" font-weight="700">de prueba</text><rect x="34" y="1782" width="322" height="112" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="1808" font-size="16" fill="#eceef2" font-weight="700">Guardar cada captura y sus</text><text x="46" y="1832" font-size="16" fill="#eceef2" font-weight="700">expectativas</text><text x="46" y="1858" font-size="15" fill="#a1a7b3">Junto al índice de huellas</text><rect x="34" y="1906" width="322" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="1932" font-size="16" fill="#eceef2" font-weight="700">Siguen siendo obligatorias R1 y R4</text><text x="46" y="1958" font-size="15" fill="#a1a7b3">Los cuatro originales quedan conservados</text><rect x="34" y="2006" width="322" height="88" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="46" y="2032" font-size="16" fill="#eceef2" font-weight="700">Los archivos amplían el historial de Git</text><text x="46" y="2058" font-size="15" fill="#a1a7b3">La comparación de hechos es la misma</text><text x="34" y="2114" font-size="16" fill="#a1a7b3">Solo se elige dónde guardar. No autoriza</text><text x="34" y="2138" font-size="16" fill="#a1a7b3">capturas, migraciones, reinicios,</text><text x="34" y="2162" font-size="16" fill="#a1a7b3">credenciales ni servicios de pago. F1,</text><text x="34" y="2186" font-size="16" fill="#a1a7b3">captura, soporte y diseño completo siguen</text><text x="34" y="2210" font-size="16" fill="#a1a7b3">abiertos.</text><rect x="34" y="2248" width="322" height="64" rx="8" fill="#4c8dff" stroke="#333945"/><text x="46" y="2276" font-size="16" fill="#06101f" font-weight="700">Propuesto · sin aprobar</text><text x="18" y="2366" font-size="14" fill="#a1a7b3">Dibujos estáticos. R1–R5 son versiones imaginadas</text><text x="18" y="2390" font-size="14" fill="#a1a7b3">tras el reinicio A760 autorizado por separado. No</text><text x="18" y="2414" font-size="14" fill="#a1a7b3">prueban una captura ni una actualización. Almacén,</text><text x="18" y="2438" font-size="14" fill="#a1a7b3">acceso, soporte, F1, captura y diseño completo siguen</text><text x="18" y="2462" font-size="14" fill="#a1a7b3">abiertos.</text></g></svg>