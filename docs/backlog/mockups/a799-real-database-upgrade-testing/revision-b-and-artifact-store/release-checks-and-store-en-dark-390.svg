<svg xmlns="http://www.w3.org/2000/svg" width="390" height="2530" viewBox="0 0 390 2530"><title>A799 · Where should frozen inputs live?</title><rect width="390" height="2530" fill="#101216"/><g font-family="Arial, sans-serif"><text x="18" y="32" font-size="21" fill="#eceef2" font-weight="700">A799 · Where should frozen inputs</text><text x="18" y="56" font-size="21" fill="#eceef2" font-weight="700">live?</text><text x="18" y="84" font-size="14" fill="#78a9ff">Oldest + previous agreed · store proposed</text><text x="18" y="128" font-size="19" fill="#eceef2" font-weight="700">B · Agreed: oldest + previous</text><rect x="18" y="160" width="354" height="648" rx="8" fill="#22262e" stroke="#333945"/><text x="34" y="190" font-size="16" fill="#78a9ff" font-weight="700">A799 · Design review</text><text x="34" y="222" font-size="17" fill="#eceef2" font-weight="700">Before publishing imagined candidate</text><text x="34" y="246" font-size="17" fill="#eceef2" font-weight="700">R5</text><rect x="34" y="282" width="322" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="308" font-size="16" fill="#eceef2" font-weight="700">Required checks from frozen inputs</text><text x="46" y="334" font-size="15" fill="#a1a7b3">R1 to R5 and R4 to R5</text><rect x="34" y="382" width="322" height="112" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="408" font-size="16" fill="#eceef2" font-weight="700">Keep every original bundle and</text><text x="46" y="432" font-size="16" fill="#eceef2" font-weight="700">expectation</text><text x="46" y="458" font-size="15" fill="#a1a7b3">R1 · R2 · R3 · R4</text><rect x="34" y="506" width="322" height="88" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="46" y="532" font-size="16" fill="#eceef2" font-weight="700">R2 and R3 are not checked in this gate</text><text x="46" y="558" font-size="15" fill="#a1a7b3">No passing result is implied for them</text><text x="34" y="614" font-size="16" fill="#a1a7b3">The answer selects required checks only. It</text><text x="34" y="638" font-size="16" fill="#a1a7b3">does not retire intermediate releases. Source</text><text x="34" y="662" font-size="16" fill="#a1a7b3">A remains an invented venue written by the</text><text x="34" y="686" font-size="16" fill="#a1a7b3">old product.</text><rect x="34" y="724" width="322" height="64" rx="8" fill="#4c8dff" stroke="#333945"/><text x="46" y="752" font-size="16" fill="#06101f" font-weight="700">Owner chose oldest + previous</text><text x="18" y="842" font-size="19" fill="#eceef2" font-weight="700">C · Recommended: separate artifact</text><text x="18" y="866" font-size="19" fill="#eceef2" font-weight="700">store</text><rect x="18" y="898" width="354" height="696" rx="8" fill="#22262e" stroke="#333945"/><text x="34" y="928" font-size="16" fill="#78a9ff" font-weight="700">A799 · Design review</text><text x="34" y="960" font-size="17" fill="#eceef2" font-weight="700">Git keeps a checksum index</text><rect x="34" y="996" width="322" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="1022" font-size="16" fill="#eceef2" font-weight="700">Keep frozen bundles and expectations</text><text x="46" y="1048" font-size="15" fill="#a1a7b3">In a dedicated release-artifact store</text><rect x="34" y="1096" width="322" height="112" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="1122" font-size="16" fill="#eceef2" font-weight="700">R5 fetches R1 and R4 by pinned</text><text x="46" y="1146" font-size="16" fill="#eceef2" font-weight="700">hashes</text><text x="46" y="1172" font-size="15" fill="#a1a7b3">R2 and R3 remain kept</text><rect x="34" y="1220" width="322" height="112" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="46" y="1246" font-size="16" fill="#eceef2" font-weight="700">Original sealed inputs, disposable test</text><text x="46" y="1270" font-size="16" fill="#eceef2" font-weight="700">copies</text><text x="46" y="1296" font-size="15" fill="#a1a7b3">Never rebuild history with candidate R5</text><text x="34" y="1352" font-size="16" fill="#a1a7b3">Proposed contract: no in-place replacement</text><text x="34" y="1376" font-size="16" fill="#a1a7b3">and no upload/delete credentials for</text><text x="34" y="1400" font-size="16" fill="#a1a7b3">untrusted candidate code. Missing or corrupt</text><text x="34" y="1424" font-size="16" fill="#a1a7b3">required input blocks the run; no skip or</text><text x="34" y="1448" font-size="16" fill="#a1a7b3">current-seed fallback. Provider and access</text><text x="34" y="1472" font-size="16" fill="#a1a7b3">are not chosen.</text><rect x="34" y="1510" width="322" height="64" rx="8" fill="#4c8dff" stroke="#333945"/><text x="46" y="1538" font-size="16" fill="#06101f" font-weight="700">Proposed · not agreed</text><text x="18" y="1628" font-size="19" fill="#eceef2" font-weight="700">C · Alternative: keep the bundles in Git</text><rect x="18" y="1660" width="354" height="696" rx="8" fill="#22262e" stroke="#333945"/><text x="34" y="1690" font-size="16" fill="#78a9ff" font-weight="700">A799 · Design review</text><text x="34" y="1722" font-size="17" fill="#eceef2" font-weight="700">One checkout contains source and test</text><text x="34" y="1746" font-size="17" fill="#eceef2" font-weight="700">inputs</text><rect x="34" y="1782" width="322" height="112" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="1808" font-size="16" fill="#eceef2" font-weight="700">Commit every original bundle and</text><text x="46" y="1832" font-size="16" fill="#eceef2" font-weight="700">expectation</text><text x="46" y="1858" font-size="15" fill="#a1a7b3">Alongside the checksum index</text><rect x="34" y="1906" width="322" height="112" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="1932" font-size="16" fill="#eceef2" font-weight="700">Required upgrade checks stay R1 and</text><text x="46" y="1956" font-size="16" fill="#eceef2" font-weight="700">R4</text><text x="46" y="1982" font-size="15" fill="#a1a7b3">All four originals remain in history</text><rect x="34" y="2030" width="322" height="88" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="46" y="2056" font-size="16" fill="#eceef2" font-weight="700">Binary bundles add to Git history</text><text x="46" y="2082" font-size="15" fill="#a1a7b3">The same frozen-fact comparisons apply</text><text x="34" y="2138" font-size="16" fill="#a1a7b3">Choose storage only. Neither option</text><text x="34" y="2162" font-size="16" fill="#a1a7b3">approves capture, migration, resets,</text><text x="34" y="2186" font-size="16" fill="#a1a7b3">credentials or paid services. Issued F1,</text><text x="34" y="2210" font-size="16" fill="#a1a7b3">capture IDs/time, support and full</text><text x="34" y="2234" font-size="16" fill="#a1a7b3">design/build remain open.</text><rect x="34" y="2272" width="322" height="64" rx="8" fill="#4c8dff" stroke="#333945"/><text x="46" y="2300" font-size="16" fill="#06101f" font-weight="700">Proposed · not agreed</text><text x="18" y="2390" font-size="14" fill="#a1a7b3">Static review drawings. R1–R5 are imagined releases</text><text x="18" y="2414" font-size="14" fill="#a1a7b3">after the separately authorised A760 reset. No fixture or</text><text x="18" y="2438" font-size="14" fill="#a1a7b3">upgrade result is established. Store, access,</text><text x="18" y="2462" font-size="14" fill="#a1a7b3">support/retirement, issued F1, capture time/IDs and full</text><text x="18" y="2486" font-size="14" fill="#a1a7b3">design/build remain open.</text></g></svg>