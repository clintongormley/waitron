<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1155" viewBox="0 0 390 1155"><title>D · What each run must show</title><rect width="390" height="1155" fill="#f7f7f8"/><g font-family="Arial, sans-serif"><text x="20" y="36" font-size="14" fill="#1a5fd0" font-weight="700">A799 · DESIGN PROPOSAL</text><text x="20" y="67" font-size="26" fill="#16181d" font-weight="700">D · What each run must</text><text x="20" y="102" font-size="26" fill="#16181d" font-weight="700">show</text><text x="20" y="145" font-size="18" fill="#5c626e">Illustrative results, not a built test</text><text x="20" y="172" font-size="18" fill="#5c626e">dashboard</text><rect x="20" y="217" width="350" height="186" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="38" y="248" font-size="19" fill="#1a5fd0" font-weight="700">1 · Validate the captured artifact</text><text x="38" y="281" font-size="17" fill="#16181d">Match image digest, file hashes,</text><text x="38" y="307" font-size="17" fill="#16181d">migration history, scenario and saved</text><text x="38" y="333" font-size="17" fill="#16181d">facts. Missing or changed input fails,</text><text x="38" y="359" font-size="17" fill="#16181d">without silently rebuilding it.</text><rect x="20" y="419" width="350" height="186" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="38" y="450" font-size="19" fill="#16181d" font-weight="700">2 · Upgrade one private copy</text><text x="38" y="483" font-size="17" fill="#16181d">No access to real AEAT, Cloud,</text><text x="38" y="509" font-size="17" fill="#16181d">payments, printers or the LAN. Keep node</text><text x="38" y="535" font-size="17" fill="#16181d">identity and old boot protections; stop</text><text x="38" y="561" font-size="17" fill="#16181d">only the test’s own processes.</text><rect x="20" y="621" width="350" height="186" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="38" y="652" font-size="19" fill="#16181d" font-weight="700">3 · Compare and report</text><text x="38" y="685" font-size="17" fill="#16181d">Separate input, start, migration and</text><text x="38" y="711" font-size="17" fill="#16181d">data-comparison failures. Keep bounded</text><text x="38" y="737" font-size="17" fill="#16181d">logs and a field-level difference. A skip is</text><text x="38" y="763" font-size="17" fill="#16181d">not a pass.</text><rect x="20" y="823" width="350" height="238" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="38" y="854" font-size="19" fill="#16181d" font-weight="700">Coverage must be honest</text><text x="38" y="887" font-size="17" fill="#16181d">Keep issued F2 records, pending outbox,</text><text x="38" y="913" font-size="17" fill="#16181d">staff history and disabled-module data. A</text><text x="38" y="939" font-size="17" fill="#16181d">recipient on an unpaid order is not an</text><text x="38" y="965" font-size="17" fill="#16181d">issued F1 invoice; required issued-F1</text><text x="38" y="991" font-size="17" fill="#16181d">coverage stays open if the old image</text><text x="38" y="1017" font-size="17" fill="#16181d">cannot create it.</text><text x="20" y="1089" font-size="14" fill="#5c626e">Illustrative review board. No implementation is</text><text x="20" y="1112" font-size="14" fill="#5c626e">approved.</text></g></svg>