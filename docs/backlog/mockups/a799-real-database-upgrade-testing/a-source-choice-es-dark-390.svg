<svg xmlns="http://www.w3.org/2000/svg" width="390" height="918" viewBox="0 0 390 918"><title>A · ¿Qué local antiguo?</title><rect width="390" height="918" fill="#101216"/><g font-family="Arial, sans-serif"><text x="20" y="36" font-size="14" fill="#78a9ff" font-weight="700">A799 · PROPUESTA DE DISEÑO</text><text x="20" y="67" font-size="26" fill="#eceef2" font-weight="700">A · ¿Qué local antiguo?</text><text x="20" y="110" font-size="18" fill="#a1a7b3">Propuesta: datos inventados, escritos por el</text><text x="20" y="137" font-size="18" fill="#a1a7b3">producto</text><rect x="20" y="182" width="350" height="186" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="38" y="213" font-size="19" fill="#78a9ff" font-weight="700">A · Un restaurante reproducible</text><text x="38" y="246" font-size="17" fill="#eceef2">Una imagen antigua fija crea Olivo Test:</text><text x="38" y="272" font-size="17" fill="#eceef2">personal, menús, ventas y facturas por</text><text x="38" y="298" font-size="17" fill="#eceef2">sus vías normales. Personas y claves</text><text x="38" y="324" font-size="17" fill="#eceef2">son solo de prueba.</text><rect x="20" y="384" width="350" height="186" rx="8" fill="#191c22" stroke="#333945"/><text x="38" y="415" font-size="19" fill="#eceef2" font-weight="700">B · Copia de un local privado</text><text x="38" y="448" font-size="17" fill="#eceef2">Se parece más a una caja concreta, pero</text><text x="38" y="474" font-size="17" fill="#eceef2">incluye datos privados y credenciales.</text><text x="38" y="500" font-size="17" fill="#eceef2">Limpiarlos puede cambiar el caso que se</text><text x="38" y="526" font-size="17" fill="#eceef2">quería conservar.</text><rect x="20" y="586" width="350" height="238" rx="8" fill="#191c22" stroke="#333945"/><text x="38" y="617" font-size="19" fill="#eceef2" font-weight="700">Primera pregunta</text><text x="38" y="650" font-size="17" fill="#eceef2">¿Debe usarse un local inventado creado</text><text x="38" y="676" font-size="17" fill="#eceef2">por una imagen antigua (recomendado:</text><text x="38" y="702" font-size="17" fill="#eceef2">los 0,350 kg de queso vendidos por Ana</text><text x="38" y="728" font-size="17" fill="#eceef2">deben seguir siendo 0,350 kg después), o</text><text x="38" y="754" font-size="17" fill="#eceef2">una captura privada real con un proceso</text><text x="38" y="780" font-size="17" fill="#eceef2">de custodia aprobado por separado?</text><text x="20" y="852" font-size="14" fill="#a1a7b3">Ejemplo para revisión. La implementación no está</text><text x="20" y="875" font-size="14" fill="#a1a7b3">aprobada.</text></g></svg>