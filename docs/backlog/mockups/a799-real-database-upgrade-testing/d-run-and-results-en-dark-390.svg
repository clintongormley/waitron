<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1155" viewBox="0 0 390 1155"><title>D · What each run must show</title><rect width="390" height="1155" fill="#101216"/><g font-family="Arial, sans-serif"><text x="20" y="36" font-size="14" fill="#78a9ff" font-weight="700">A799 · DESIGN PROPOSAL</text><text x="20" y="67" font-size="26" fill="#eceef2" font-weight="700">D · What each run must</text><text x="20" y="102" font-size="26" fill="#eceef2" font-weight="700">show</text><text x="20" y="145" font-size="18" fill="#a1a7b3">Illustrative results, not a built test</text><text x="20" y="172" font-size="18" fill="#a1a7b3">dashboard</text><rect x="20" y="217" width="350" height="186" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="38" y="248" font-size="19" fill="#78a9ff" font-weight="700">1 · Validate the captured artifact</text><text x="38" y="281" font-size="17" fill="#eceef2">Match image digest, file hashes,</text><text x="38" y="307" font-size="17" fill="#eceef2">migration history, scenario and saved</text><text x="38" y="333" font-size="17" fill="#eceef2">facts. Missing or changed input fails,</text><text x="38" y="359" font-size="17" fill="#eceef2">without silently rebuilding it.</text><rect x="20" y="419" width="350" height="186" rx="8" fill="#191c22" stroke="#333945"/><text x="38" y="450" font-size="19" fill="#eceef2" font-weight="700">2 · Upgrade one private copy</text><text x="38" y="483" font-size="17" fill="#eceef2">No access to real AEAT, Cloud,</text><text x="38" y="509" font-size="17" fill="#eceef2">payments, printers or the LAN. Keep node</text><text x="38" y="535" font-size="17" fill="#eceef2">identity and old boot protections; stop</text><text x="38" y="561" font-size="17" fill="#eceef2">only the test’s own processes.</text><rect x="20" y="621" width="350" height="186" rx="8" fill="#191c22" stroke="#333945"/><text x="38" y="652" font-size="19" fill="#eceef2" font-weight="700">3 · Compare and report</text><text x="38" y="685" font-size="17" fill="#eceef2">Separate input, start, migration and</text><text x="38" y="711" font-size="17" fill="#eceef2">data-comparison failures. Keep bounded</text><text x="38" y="737" font-size="17" fill="#eceef2">logs and a field-level difference. A skip is</text><text x="38" y="763" font-size="17" fill="#eceef2">not a pass.</text><rect x="20" y="823" width="350" height="238" rx="8" fill="#191c22" stroke="#333945"/><text x="38" y="854" font-size="19" fill="#eceef2" font-weight="700">Coverage must be honest</text><text x="38" y="887" font-size="17" fill="#eceef2">Keep issued F2 records, pending outbox,</text><text x="38" y="913" font-size="17" fill="#eceef2">staff history and disabled-module data. A</text><text x="38" y="939" font-size="17" fill="#eceef2">recipient on an unpaid order is not an</text><text x="38" y="965" font-size="17" fill="#eceef2">issued F1 invoice; required issued-F1</text><text x="38" y="991" font-size="17" fill="#eceef2">coverage stays open if the old image</text><text x="38" y="1017" font-size="17" fill="#eceef2">cannot create it.</text><text x="20" y="1089" font-size="14" fill="#a1a7b3">Illustrative review board. No implementation is</text><text x="20" y="1112" font-size="14" fill="#a1a7b3">approved.</text></g></svg>