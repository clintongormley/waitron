<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1207" viewBox="0 0 390 1207"><title>D · Qué debe mostrar cada ejecución</title><rect width="390" height="1207" fill="#f7f7f8"/><g font-family="Arial, sans-serif"><text x="20" y="36" font-size="14" fill="#1a5fd0" font-weight="700">A799 · PROPUESTA DE DISEÑO</text><text x="20" y="67" font-size="26" fill="#16181d" font-weight="700">D · Qué debe mostrar cada</text><text x="20" y="102" font-size="26" fill="#16181d" font-weight="700">ejecución</text><text x="20" y="145" font-size="18" fill="#5c626e">Resultados ilustrados; no hay un panel ya</text><text x="20" y="172" font-size="18" fill="#5c626e">construido</text><rect x="20" y="217" width="350" height="186" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="38" y="248" font-size="19" fill="#1a5fd0" font-weight="700">1 · Validar la captura</text><text x="38" y="281" font-size="17" fill="#16181d">Comprobar imagen, hashes de archivos,</text><text x="38" y="307" font-size="17" fill="#16181d">historial, escenario y datos esperados.</text><text x="38" y="333" font-size="17" fill="#16181d">Una entrada ausente o cambiada falla; no</text><text x="38" y="359" font-size="17" fill="#16181d">se regenera a escondidas.</text><rect x="20" y="419" width="350" height="212" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="38" y="450" font-size="19" fill="#16181d" font-weight="700">2 · Actualizar una copia privada</text><text x="38" y="483" font-size="17" fill="#16181d">Sin acceso a AEAT real, Cloud, pagos,</text><text x="38" y="509" font-size="17" fill="#16181d">impresoras ni la red local. Conservar</text><text x="38" y="535" font-size="17" fill="#16181d">identidad y protecciones antiguas.</text><text x="38" y="561" font-size="17" fill="#16181d">Detener solo los procesos propios de la</text><text x="38" y="587" font-size="17" fill="#16181d">prueba.</text><rect x="20" y="647" width="350" height="212" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="38" y="678" font-size="19" fill="#16181d" font-weight="700">3 · Comparar y explicar</text><text x="38" y="711" font-size="17" fill="#16181d">Distinguir fallos de entrada, inicio,</text><text x="38" y="737" font-size="17" fill="#16181d">migración y comparación. Guardar</text><text x="38" y="763" font-size="17" fill="#16181d">registros limitados y la diferencia del</text><text x="38" y="789" font-size="17" fill="#16181d">campo. Omitir la prueba no equivale a</text><text x="38" y="815" font-size="17" fill="#16181d">aprobarla.</text><rect x="20" y="875" width="350" height="238" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="38" y="906" font-size="19" fill="#16181d" font-weight="700">Precisar la cobertura</text><text x="38" y="939" font-size="17" fill="#16181d">Conservar registros F2, envíos</text><text x="38" y="965" font-size="17" fill="#16181d">pendientes, historial del personal y datos</text><text x="38" y="991" font-size="17" fill="#16181d">de módulos desactivados. Un destinatario</text><text x="38" y="1017" font-size="17" fill="#16181d">en un pedido sin pagar no es una factura</text><text x="38" y="1043" font-size="17" fill="#16181d">F1 emitida. Si la imagen no puede</text><text x="38" y="1069" font-size="17" fill="#16181d">emitirla, esa cobertura sigue pendiente.</text><text x="20" y="1141" font-size="14" fill="#5c626e">Ejemplo para revisión. La implementación no está</text><text x="20" y="1164" font-size="14" fill="#5c626e">aprobada.</text></g></svg>