<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1200" viewBox="0 0 390 1200"><title>B · Same facts after upgrade</title><rect width="390" height="1200" fill="#101216"/><g font-family="Arial, sans-serif"><text x="20" y="36" font-size="14" fill="#78a9ff" font-weight="700">A799 · DESIGN PROPOSAL</text><text x="20" y="67" font-size="26" fill="#eceef2" font-weight="700">B · Same facts after upgrade</text><text x="20" y="110" font-size="18" fill="#a1a7b3">A count can stay right while a value</text><text x="20" y="137" font-size="18" fill="#a1a7b3">changes</text><rect x="20" y="182" width="350" height="240" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="38" y="213" font-size="19" fill="#78a9ff" font-weight="700">Before · recorded by the older</text><text x="38" y="241" font-size="19" fill="#78a9ff" font-weight="700">image</text><text x="38" y="274" font-size="17" fill="#eceef2">Ana sells 0.350 kg cheese at €22.00/kg:</text><text x="38" y="300" font-size="17" fill="#eceef2">€7.70. Coffee €2.20 and wine €3.63 make</text><text x="38" y="326" font-size="17" fill="#eceef2">€13.53. Keep the staff, customer and</text><text x="38" y="352" font-size="17" fill="#eceef2">kitchen names distinct. Freeze the</text><text x="38" y="378" font-size="17" fill="#eceef2">returned ids and recorded times.</text><rect x="20" y="438" width="350" height="212" rx="8" fill="#191c22" stroke="#333945"/><text x="38" y="469" font-size="19" fill="#eceef2" font-weight="700">After · start the candidate image</text><text x="38" y="502" font-size="17" fill="#eceef2">Open a disposable copy through the</text><text x="38" y="528" font-size="17" fill="#eceef2">candidate start path. Compare the saved</text><text x="38" y="554" font-size="17" fill="#eceef2">facts, record ids and stored fiscal bytes.</text><text x="38" y="580" font-size="17" fill="#eceef2">The candidate cannot write its own</text><text x="38" y="606" font-size="17" fill="#eceef2">expected answers.</text><rect x="20" y="666" width="350" height="212" rx="8" fill="#191c22" stroke="#333945"/><text x="38" y="697" font-size="19" fill="#eceef2" font-weight="700">Example failure</text><text x="38" y="730" font-size="17" fill="#eceef2">Cheese quantity: expected 350</text><text x="38" y="756" font-size="17" fill="#eceef2">thousandths; got 35. The row count is</text><text x="38" y="782" font-size="17" fill="#eceef2">unchanged, but the comparison fails by</text><text x="38" y="808" font-size="17" fill="#eceef2">the original line id. Stop the release; do</text><text x="38" y="834" font-size="17" fill="#eceef2">not replace the frozen answer.</text><rect x="20" y="894" width="350" height="212" rx="8" fill="#191c22" stroke="#333945"/><text x="38" y="925" font-size="19" fill="#eceef2" font-weight="700">Separate continuation check</text><text x="38" y="958" font-size="17" fill="#eceef2">The live cheese price is now €24.00/kg.</text><text x="38" y="984" font-size="17" fill="#eceef2">On a second copy, a new 0.350 kg sale</text><text x="38" y="1010" font-size="17" fill="#eceef2">should be €8.40. Yesterday’s line must</text><text x="38" y="1036" font-size="17" fill="#eceef2">remain €7.70 with its old name and fiscal</text><text x="38" y="1062" font-size="17" fill="#eceef2">bytes.</text><text x="20" y="1134" font-size="14" fill="#a1a7b3">Illustrative review board. No implementation is</text><text x="20" y="1157" font-size="14" fill="#a1a7b3">approved.</text></g></svg>