<svg xmlns="http://www.w3.org/2000/svg" width="390" height="918" viewBox="0 0 390 918"><title>A · Which older venue?</title><rect width="390" height="918" fill="#f7f7f8"/><g font-family="Arial, sans-serif"><text x="20" y="36" font-size="14" fill="#1a5fd0" font-weight="700">A799 · DESIGN PROPOSAL</text><text x="20" y="67" font-size="26" fill="#16181d" font-weight="700">A · Which older venue?</text><text x="20" y="110" font-size="18" fill="#5c626e">Recommended: invented venue, real</text><text x="20" y="137" font-size="18" fill="#5c626e">product writes</text><rect x="20" y="182" width="350" height="186" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="38" y="213" font-size="19" fill="#1a5fd0" font-weight="700">A · A repeatable restaurant</text><text x="38" y="246" font-size="17" fill="#16181d">A frozen older image creates Olivo Test:</text><text x="38" y="272" font-size="17" fill="#16181d">staff, menus, sales and invoices through</text><text x="38" y="298" font-size="17" fill="#16181d">its normal product paths. All people and</text><text x="38" y="324" font-size="17" fill="#16181d">keys are test-only.</text><rect x="20" y="384" width="350" height="186" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="38" y="415" font-size="19" fill="#16181d" font-weight="700">B · A private venue copy</text><text x="38" y="448" font-size="17" fill="#16181d">Closer to a particular box, but brings</text><text x="38" y="474" font-size="17" fill="#16181d">private records and credentials. Cleaning</text><text x="38" y="500" font-size="17" fill="#16181d">them can also change the case you</text><text x="38" y="526" font-size="17" fill="#16181d">wanted to preserve.</text><rect x="20" y="586" width="350" height="238" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="38" y="617" font-size="19" fill="#16181d" font-weight="700">First owner question</text><text x="38" y="650" font-size="17" fill="#16181d">Should the required fixture be an invented</text><text x="38" y="676" font-size="17" fill="#16181d">venue created by an older image</text><text x="38" y="702" font-size="17" fill="#16181d">(recommended: Ana’s 0.350 kg cheese</text><text x="38" y="728" font-size="17" fill="#16181d">sale must still be 0.350 kg after upgrade),</text><text x="38" y="754" font-size="17" fill="#16181d">or an actual private venue snapshot with</text><text x="38" y="780" font-size="17" fill="#16181d">a separately approved custody process?</text><text x="20" y="852" font-size="14" fill="#5c626e">Illustrative review board. No implementation is</text><text x="20" y="875" font-size="14" fill="#5c626e">approved.</text></g></svg>