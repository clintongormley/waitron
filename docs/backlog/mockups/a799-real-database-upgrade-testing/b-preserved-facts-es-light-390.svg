<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1289" viewBox="0 0 390 1289"><title>B · Los mismos datos al actualizar</title><rect width="390" height="1289" fill="#f7f7f8"/><g font-family="Arial, sans-serif"><text x="20" y="36" font-size="14" fill="#1a5fd0" font-weight="700">A799 · PROPUESTA DE DISEÑO</text><text x="20" y="67" font-size="26" fill="#16181d" font-weight="700">B · Los mismos datos al</text><text x="20" y="102" font-size="26" fill="#16181d" font-weight="700">actualizar</text><text x="20" y="145" font-size="18" fill="#5c626e">El recuento puede coincidir aunque cambie</text><text x="20" y="172" font-size="18" fill="#5c626e">un valor</text><rect x="20" y="217" width="350" height="266" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="38" y="248" font-size="19" fill="#1a5fd0" font-weight="700">Antes · escritos por la imagen</text><text x="38" y="276" font-size="19" fill="#1a5fd0" font-weight="700">antigua</text><text x="38" y="309" font-size="17" fill="#16181d">Ana vende 0,350 kg de queso a 22,00</text><text x="38" y="335" font-size="17" fill="#16181d">€/kg: 7,70 €. Café 2,20 € y vino 3,63 €</text><text x="38" y="361" font-size="17" fill="#16181d">suman 13,53 €. Los nombres para</text><text x="38" y="387" font-size="17" fill="#16181d">personal, cliente y cocina son distintos.</text><text x="38" y="413" font-size="17" fill="#16181d">Guardar identificadores y horas</text><text x="38" y="439" font-size="17" fill="#16181d">originales.</text><rect x="20" y="499" width="350" height="240" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="38" y="530" font-size="19" fill="#16181d" font-weight="700">Después · iniciar la imagen</text><text x="38" y="558" font-size="19" fill="#16181d" font-weight="700">candidata</text><text x="38" y="591" font-size="17" fill="#16181d">Abrir una copia desechable por la vía de</text><text x="38" y="617" font-size="17" fill="#16181d">inicio candidata. Comparar datos,</text><text x="38" y="643" font-size="17" fill="#16181d">identificadores y bytes fiscales</text><text x="38" y="669" font-size="17" fill="#16181d">guardados. La candidata no decide el</text><text x="38" y="695" font-size="17" fill="#16181d">resultado esperado.</text><rect x="20" y="755" width="350" height="212" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="38" y="786" font-size="19" fill="#16181d" font-weight="700">Ejemplo de fallo</text><text x="38" y="819" font-size="17" fill="#16181d">Cantidad de queso: se esperaban 350</text><text x="38" y="845" font-size="17" fill="#16181d">milésimas; hay 35. El recuento no</text><text x="38" y="871" font-size="17" fill="#16181d">cambia, pero falla la comparación del</text><text x="38" y="897" font-size="17" fill="#16181d">identificador original. Detener la versión;</text><text x="38" y="923" font-size="17" fill="#16181d">no sustituir el valor esperado.</text><rect x="20" y="983" width="350" height="212" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="38" y="1014" font-size="19" fill="#16181d" font-weight="700">Otra prueba de continuidad</text><text x="38" y="1047" font-size="17" fill="#16181d">El queso ahora cuesta 24,00 €/kg. En otra</text><text x="38" y="1073" font-size="17" fill="#16181d">copia, una venta nueva de 0,350 kg debe</text><text x="38" y="1099" font-size="17" fill="#16181d">ser 8,40 €. La línea de ayer debe</text><text x="38" y="1125" font-size="17" fill="#16181d">conservar 7,70 €, su nombre antiguo y</text><text x="38" y="1151" font-size="17" fill="#16181d">sus bytes fiscales.</text><text x="20" y="1223" font-size="14" fill="#5c626e">Ejemplo para revisión. La implementación no está</text><text x="20" y="1246" font-size="14" fill="#5c626e">aprobada.</text></g></svg>