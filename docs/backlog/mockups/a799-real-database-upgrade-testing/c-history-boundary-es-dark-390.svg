<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1068" viewBox="0 0 390 1068"><title>C · El reinicio marca el límite</title><rect width="390" height="1068" fill="#101216"/><g font-family="Arial, sans-serif"><text x="20" y="36" font-size="14" fill="#78a9ff" font-weight="700">A799 · PROPUESTA DE DISEÑO</text><text x="20" y="67" font-size="26" fill="#eceef2" font-weight="700">C · El reinicio marca el límite</text><text x="20" y="110" font-size="18" fill="#a1a7b3">Primero A760; las capturas admitidas</text><text x="20" y="137" font-size="18" fill="#a1a7b3">empiezan después</text><rect x="20" y="182" width="350" height="160" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="38" y="213" font-size="19" fill="#78a9ff" font-weight="700">Antes de agrupar las migraciones</text><text x="38" y="246" font-size="17" fill="#eceef2">Las carpetas previas usan el historial</text><text x="38" y="272" font-size="17" fill="#eceef2">antiguo. A799 no autoriza convertirlas</text><text x="38" y="298" font-size="17" fill="#eceef2">para A760 ni reiniciar ninguna caja.</text><rect x="20" y="358" width="350" height="186" rx="8" fill="#191c22" stroke="#333945"/><text x="38" y="389" font-size="19" fill="#eceef2" font-weight="700">Reinicio autorizado de A760</text><text x="38" y="422" font-size="17" fill="#eceef2">El trabajo del operador registra reinicios o</text><text x="38" y="448" font-size="17" fill="#eceef2">cuarentena. La caja física de casa sigue</text><text x="38" y="474" font-size="17" fill="#eceef2">a cargo del propietario. Este diseño no</text><text x="38" y="500" font-size="17" fill="#eceef2">inicia ese trabajo.</text><rect x="20" y="560" width="350" height="212" rx="8" fill="#191c22" stroke="#333945"/><text x="38" y="591" font-size="19" fill="#eceef2" font-weight="700">Primera captura admitida</text><text x="38" y="624" font-size="17" fill="#eceef2">Tras A760, fijar la primera imagen válida</text><text x="38" y="650" font-size="17" fill="#eceef2">y su local. Otra imagen posterior debe</text><text x="38" y="676" font-size="17" fill="#eceef2">aplicar migraciones pendientes y</text><text x="38" y="702" font-size="17" fill="#eceef2">conservar los datos. Reiniciar la misma</text><text x="38" y="728" font-size="17" fill="#eceef2">imagen es solo un control.</text><rect x="20" y="788" width="350" height="186" rx="8" fill="#191c22" stroke="#333945"/><text x="38" y="819" font-size="19" fill="#eceef2" font-weight="700">Mientras no exista esa captura</text><text x="38" y="852" font-size="17" fill="#eceef2">Este bloqueo sigue abierto. Un ensayo</text><text x="38" y="878" font-size="17" fill="#eceef2">opcional de rechazo anterior a A760 tiene</text><text x="38" y="904" font-size="17" fill="#eceef2">otro resultado; no demuestra</text><text x="38" y="930" font-size="17" fill="#eceef2">conservación correcta.</text><text x="20" y="1002" font-size="14" fill="#a1a7b3">Ejemplo para revisión. La implementación no está</text><text x="20" y="1025" font-size="14" fill="#a1a7b3">aprobada.</text></g></svg>