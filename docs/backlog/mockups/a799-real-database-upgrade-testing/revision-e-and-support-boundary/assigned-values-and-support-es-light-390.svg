<svg xmlns="http://www.w3.org/2000/svg" width="390" height="3547" viewBox="0 0 390 3547" xml:lang="es">
<title>A799 · Conserva los hechos asignados</title>
<desc>E acordado · F propuesto, sin aprobar. Static design artwork, not runtime evidence.</desc>
<rect width="390" height="3547" fill="#f7f7f8"/>
<g font-family="Arial, sans-serif">
<text x="18" y="34" font-size="21" fill="#16181d" font-weight="700">A799 · Conserva los hechos</text>
<text x="18" y="58" font-size="21" fill="#16181d" font-weight="700">asignados</text>
<text x="18" y="86" font-size="15" fill="#1a5fd0" font-weight="700">E acordado · F propuesto, sin aprobar</text>
<text x="18" y="116" font-size="16" fill="#5c626e">F pregunta cuándo retirar el punto</text>
<text x="18" y="140" font-size="16" fill="#5c626e">de partida más antiguo admitido. B</text>
<text x="18" y="164" font-size="16" fill="#5c626e">sigue exigiendo la versión más</text>
<text x="18" y="188" font-size="16" fill="#5c626e">antigua admitida y la anterior</text>
<text x="18" y="212" font-size="16" fill="#5c626e">conservada, sin duplicar extremos</text>
<text x="18" y="236" font-size="16" fill="#5c626e">iguales.</text>
<text x="18" y="272" font-size="18" fill="#1a5fd0" font-weight="700">E · ACORDADO</text>
<rect x="18" y="300" width="354" height="601" rx="8" fill="#ffffff" stroke="#d6d9e0"/>
<text x="32" y="329" font-size="18" fill="#16181d" font-weight="700">Cada captura sigue exacta</text>
<rect x="32" y="361" width="326" height="122" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/>
<text x="42" y="385" font-size="15" fill="#16181d" font-weight="700">Captura A inventada</text>
<text x="42" y="409" font-size="15" fill="#5c626e">Harbour · F1 F/1042</text>
<text x="42" y="431" font-size="15" fill="#5c626e">ID: sale-harbour-01</text>
<text x="42" y="453" font-size="15" fill="#5c626e">2026-11-04T12:15:00.000Z</text>
<text x="32" y="501" font-size="16" fill="#5c626e">Cada actualización usa una copia</text>
<text x="32" y="525" font-size="16" fill="#5c626e">de A y compara sus hechos</text>
<text x="32" y="549" font-size="16" fill="#5c626e">originales exactos.</text>
<rect x="32" y="583" width="326" height="122" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/>
<text x="42" y="607" font-size="15" fill="#16181d" font-weight="700">Nueva captura B, otra versión</text>
<text x="42" y="631" font-size="15" fill="#5c626e">Harbour · F1 F/1051</text>
<text x="42" y="653" font-size="15" fill="#5c626e">ID: sale-harbour-02</text>
<text x="42" y="675" font-size="15" fill="#5c626e">2026-11-05T09:20:00.000Z</text>
<text x="32" y="723" font-size="16" fill="#5c626e">B tiene expectativas revisadas de</text>
<text x="32" y="747" font-size="16" fill="#5c626e">forma independiente. Conserva A y</text>
<text x="32" y="771" font-size="16" fill="#5c626e">B; no reescribas ID, números ni</text>
<text x="32" y="795" font-size="16" fill="#5c626e">fechas para igualarlos.</text>
<rect x="32" y="829" width="326" height="52" rx="8" fill="#1f6feb" stroke="#d6d9e0"/>
<text x="42" y="853" font-size="15" fill="#ffffff" font-weight="700">Solo el alcance de E acordado</text>
<text x="18" y="933" font-size="18" fill="#1a5fd0" font-weight="700">F · RECOMENDADO</text>
<rect x="18" y="961" width="354" height="655" rx="8" fill="#ffffff" stroke="#d6d9e0"/>
<text x="32" y="990" font-size="18" fill="#16181d" font-weight="700">Retirar solo por decisión</text>
<text x="32" y="1014" font-size="18" fill="#16181d" font-weight="700">tuya</text>
<text x="32" y="1048" font-size="16" fill="#5c626e">PROPUESTO · SIN APROBAR</text>
<rect x="32" y="1082" width="326" height="100" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/>
<text x="42" y="1106" font-size="15" fill="#16181d" font-weight="700">Un historial tras el reinicio</text>
<text x="42" y="1130" font-size="15" fill="#5c626e">R1 · R2 · R3 · R4</text>
<text x="42" y="1152" font-size="15" fill="#5c626e">Candidata: R5</text>
<rect x="32" y="1198" width="326" height="78" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/>
<text x="42" y="1222" font-size="15" fill="#16181d" font-weight="700">Orígenes exigidos para R5</text>
<text x="42" y="1246" font-size="15" fill="#5c626e">R1 y R4</text>
<text x="32" y="1294" font-size="16" fill="#5c626e">Conserva R1 como base más antigua</text>
<text x="32" y="1318" font-size="16" fill="#5c626e">admitida hasta que apruebes su</text>
<text x="32" y="1342" font-size="16" fill="#5c626e">retirada y nombres la sustituta.</text>
<text x="32" y="1378" font-size="16" fill="#5c626e">Si apruebas R2 como sustituta</text>
<text x="32" y="1402" font-size="16" fill="#5c626e">desde R5, B exige R2 y R4. Aquí</text>
<text x="32" y="1426" font-size="16" fill="#5c626e">no se aprueba ninguna retirada.</text>
<text x="32" y="1462" font-size="16" fill="#5c626e">Motivo: otra versión no elimina</text>
<text x="32" y="1486" font-size="16" fill="#5c626e">por sí sola el historial más</text>
<text x="32" y="1510" font-size="16" fill="#5c626e">antiguo de las pruebas exigidas.</text>
<rect x="32" y="1544" width="326" height="52" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/>
<text x="42" y="1568" font-size="15" fill="#16181d" font-weight="700">Conserva cada paquete original</text>
<text x="18" y="1648" font-size="18" fill="#1a5fd0" font-weight="700">F · ALTERNATIVA</text>
<rect x="18" y="1676" width="354" height="633" rx="8" fill="#ffffff" stroke="#d6d9e0"/>
<text x="32" y="1705" font-size="18" fill="#16181d" font-weight="700">Ventana móvil de tres</text>
<text x="32" y="1729" font-size="18" fill="#16181d" font-weight="700">orígenes</text>
<text x="32" y="1763" font-size="16" fill="#5c626e">PROPUESTO · SIN APROBAR</text>
<rect x="32" y="1797" width="326" height="100" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/>
<text x="42" y="1821" font-size="15" fill="#16181d" font-weight="700">Para la candidata R5</text>
<text x="42" y="1845" font-size="15" fill="#5c626e">Ventana: R2 · R3 · R4</text>
<text x="42" y="1867" font-size="15" fill="#5c626e">Orígenes exigidos: R2 y R4</text>
<text x="32" y="1915" font-size="16" fill="#5c626e">Admite las tres versiones de</text>
<text x="32" y="1939" font-size="16" fill="#5c626e">origen conservadas más recientes</text>
<text x="32" y="1963" font-size="16" fill="#5c626e">antes de cada candidata, en el</text>
<text x="32" y="1987" font-size="16" fill="#5c626e">mismo historial tras el reinicio.</text>
<text x="32" y="2023" font-size="16" fill="#5c626e">R1 sale de los puntos de partida</text>
<text x="32" y="2047" font-size="16" fill="#5c626e">admitidos para R5. R3 sigue en la</text>
<text x="32" y="2071" font-size="16" fill="#5c626e">ventana, pero no es un extremo de</text>
<text x="32" y="2095" font-size="16" fill="#5c626e">prueba exigido.</text>
<text x="32" y="2131" font-size="16" fill="#5c626e">Motivo: la ventana avanza con las</text>
<text x="32" y="2155" font-size="16" fill="#5c626e">versiones. Retira el origen más</text>
<text x="32" y="2179" font-size="16" fill="#5c626e">antiguo sin una decisión de</text>
<text x="32" y="2203" font-size="16" fill="#5c626e">retirada aparte.</text>
<rect x="32" y="2237" width="326" height="52" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/>
<text x="42" y="2261" font-size="15" fill="#16181d" font-weight="700">Conserva R1 y sus expectativas</text>
<text x="18" y="2341" font-size="18" fill="#16181d" font-weight="700">Ambas opciones F conservan las</text>
<text x="18" y="2365" font-size="18" fill="#16181d" font-weight="700">pruebas</text>
<text x="18" y="2393" font-size="16" fill="#5c626e">Retirar nunca borra un paquete</text>
<text x="18" y="2417" font-size="16" fill="#5c626e">original ni sus expectativas. Cada</text>
<text x="18" y="2441" font-size="16" fill="#5c626e">comparación elegida sigue siendo</text>
<text x="18" y="2465" font-size="16" fill="#5c626e">exacta. Un éxito de R1/R4 no prueba</text>
<text x="18" y="2489" font-size="16" fill="#5c626e">R2/R3; uno de R2/R4 no prueba R1/R3.</text>
<text x="18" y="2513" font-size="16" fill="#5c626e">Un fallo exigido sigue siendo un</text>
<text x="18" y="2537" font-size="16" fill="#5c626e">fallo. Ninguna opción cambia ni crea</text>
<text x="18" y="2561" font-size="16" fill="#5c626e">una garantía de soporte publicada.</text>
<text x="18" y="2599" font-size="18" fill="#16181d" font-weight="700">A–D mantienen solo su alcance</text>
<text x="18" y="2623" font-size="18" fill="#16181d" font-weight="700">acordado</text>
<text x="18" y="2651" font-size="16" fill="#5c626e">A: datos inventados escritos por el</text>
<text x="18" y="2675" font-size="16" fill="#5c626e">producto antiguo. B: versión más</text>
<text x="18" y="2699" font-size="16" fill="#5c626e">antigua admitida y anterior</text>
<text x="18" y="2723" font-size="16" fill="#5c626e">conservada. C: GitHub Releases de</text>
<text x="18" y="2747" font-size="16" fill="#5c626e">Waitron, sumas de comprobación en</text>
<text x="18" y="2771" font-size="16" fill="#5c626e">Git; verificar después las descargas</text>
<text x="18" y="2795" font-size="16" fill="#5c626e">privadas en CI con el acceso</text>
<text x="18" y="2819" font-size="16" fill="#5c626e">existente. D: F1 emitida debe</text>
<text x="18" y="2843" font-size="16" fill="#5c626e">conservar el nombre y dirección</text>
<text x="18" y="2867" font-size="16" fill="#5c626e">originales del cliente para cerrar</text>
<text x="18" y="2891" font-size="16" fill="#5c626e">A799.</text>
<text x="18" y="2929" font-size="18" fill="#16181d" font-weight="700">El trabajo exigido sigue</text>
<text x="18" y="2953" font-size="18" fill="#16181d" font-weight="700">pendiente</text>
<text x="18" y="2981" font-size="16" fill="#5c626e">Si no hay F1 por la vía normal,</text>
<text x="18" y="3005" font-size="16" fill="#5c626e">identifica el requisito previo con</text>
<text x="18" y="3029" font-size="16" fill="#5c626e">pruebas y deja A799 abierto. No lo</text>
<text x="18" y="3053" font-size="16" fill="#5c626e">cubren un pedido sin pagar, F2,</text>
<text x="18" y="3077" font-size="16" fill="#5c626e">reinicio, venta nueva ni otro</text>
<text x="18" y="3101" font-size="16" fill="#5c626e">escritor fiscal. El reinicio A760</text>
<text x="18" y="3125" font-size="16" fill="#5c626e">necesita autorización aparte. Mantén</text>
<text x="18" y="3149" font-size="16" fill="#5c626e">captura tras el reinicio,</text>
<text x="18" y="3173" font-size="16" fill="#5c626e">actualización posterior con</text>
<text x="18" y="3197" font-size="16" fill="#5c626e">migraciones pendientes, casos de</text>
<text x="18" y="3221" font-size="16" fill="#5c626e">módulo opcional apagado,</text>
<text x="18" y="3245" font-size="16" fill="#5c626e">expectativas independientes, bytes</text>
<text x="18" y="3269" font-size="16" fill="#5c626e">fiscales exactos e identidad de</text>
<text x="18" y="3293" font-size="16" fill="#5c626e">nodo/SIF/serie. Separa conservación</text>
<text x="18" y="3317" font-size="16" fill="#5c626e">y venta nueva.</text>
<text x="18" y="3355" font-size="14" fill="#5c626e">Dibujos estáticos con ejemplos</text>
<text x="18" y="3377" font-size="14" fill="#5c626e">inventados. Solo se aprueba el alcance</text>
<text x="18" y="3399" font-size="14" fill="#5c626e">preciso de A–E; F, el diseño completo, el</text>
<text x="18" y="3421" font-size="14" fill="#5c626e">plan y la implementación siguen sin</text>
<text x="18" y="3443" font-size="14" fill="#5c626e">aprobar. Lecturas históricas del código</text>
<text x="18" y="3465" font-size="14" fill="#5c626e">SIN VERIFICAR en ejecución. No se muestra</text>
<text x="18" y="3487" font-size="14" fill="#5c626e">captura, migración, actualización ni</text>
<text x="18" y="3509" font-size="14" fill="#5c626e">prueba de acceso real.</text>
</g>
</svg>
