<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1315" viewBox="0 0 1280 1315" xml:lang="en">
<title>A799 · Keep the assigned facts</title>
<desc>E agreed · F proposed, not approved. Static design artwork, not runtime evidence.</desc>
<rect width="1280" height="1315" fill="#f7f7f8"/>
<g font-family="Arial, sans-serif">
<text x="32" y="34" font-size="21" fill="#16181d" font-weight="700">A799 · Keep the assigned facts</text>
<text x="32" y="62" font-size="15" fill="#1a5fd0" font-weight="700">E agreed · F proposed, not approved</text>
<text x="32" y="92" font-size="16" fill="#5c626e">F asks when the oldest supported starting point may retire. B still requires the oldest supported plus</text>
<text x="32" y="116" font-size="16" fill="#5c626e">previous retained release, with equal endpoints counted once.</text>
<text x="32" y="152" font-size="18" fill="#1a5fd0" font-weight="700">E · AGREED</text>
<rect x="32" y="180" width="394.667" height="577" rx="8" fill="#ffffff" stroke="#d6d9e0"/>
<text x="46" y="209" font-size="18" fill="#16181d" font-weight="700">Keep each capture exact</text>
<rect x="46" y="241" width="366.667" height="122" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/>
<text x="56" y="265" font-size="15" fill="#16181d" font-weight="700">Invented capture A</text>
<text x="56" y="289" font-size="15" fill="#5c626e">Harbour · F1 F/1042</text>
<text x="56" y="311" font-size="15" fill="#5c626e">ID: sale-harbour-01</text>
<text x="56" y="333" font-size="15" fill="#5c626e">2026-11-04T12:15:00.000Z</text>
<text x="46" y="381" font-size="16" fill="#5c626e">Every upgrade reuses a copy of A and</text>
<text x="46" y="405" font-size="16" fill="#5c626e">compares A’s exact original facts.</text>
<rect x="46" y="439" width="366.667" height="122" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/>
<text x="56" y="463" font-size="15" fill="#16181d" font-weight="700">Fresh capture B, new version</text>
<text x="56" y="487" font-size="15" fill="#5c626e">Harbour · F1 F/1051</text>
<text x="56" y="509" font-size="15" fill="#5c626e">ID: sale-harbour-02</text>
<text x="56" y="531" font-size="15" fill="#5c626e">2026-11-05T09:20:00.000Z</text>
<text x="46" y="579" font-size="16" fill="#5c626e">B has its own independently reviewed</text>
<text x="46" y="603" font-size="16" fill="#5c626e">expectations. Keep A and B; never</text>
<text x="46" y="627" font-size="16" fill="#5c626e">rewrite IDs, numbers or dates to make</text>
<text x="46" y="651" font-size="16" fill="#5c626e">them match.</text>
<rect x="46" y="685" width="366.667" height="52" rx="8" fill="#1f6feb" stroke="#d6d9e0"/>
<text x="56" y="709" font-size="15" fill="#ffffff" font-weight="700">Only E’s precise scope agreed</text>
<text x="442.667" y="152" font-size="18" fill="#1a5fd0" font-weight="700">F · RECOMMENDED</text>
<rect x="442.667" y="180" width="394.667" height="655" rx="8" fill="#ffffff" stroke="#d6d9e0"/>
<text x="456.667" y="209" font-size="18" fill="#16181d" font-weight="700">Retire only by owner decision</text>
<text x="456.667" y="243" font-size="16" fill="#5c626e">PROPOSED · NOT APPROVED</text>
<rect x="456.667" y="277" width="366.667" height="100" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/>
<text x="466.667" y="301" font-size="15" fill="#16181d" font-weight="700">One post-reset history</text>
<text x="466.667" y="325" font-size="15" fill="#5c626e">R1 · R2 · R3 · R4</text>
<text x="466.667" y="347" font-size="15" fill="#5c626e">Candidate: R5</text>
<rect x="456.667" y="393" width="366.667" height="78" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/>
<text x="466.667" y="417" font-size="15" fill="#16181d" font-weight="700">Required sources for R5</text>
<text x="466.667" y="441" font-size="15" fill="#5c626e">R1 and R4</text>
<text x="456.667" y="489" font-size="16" fill="#5c626e">Keep R1 as the oldest supported</text>
<text x="456.667" y="513" font-size="16" fill="#5c626e">baseline until you explicitly approve</text>
<text x="456.667" y="537" font-size="16" fill="#5c626e">retirement and name its replacement.</text>
<text x="456.667" y="573" font-size="16" fill="#5c626e">If you approve R2 as the replacement</text>
<text x="456.667" y="597" font-size="16" fill="#5c626e">from R5, B requires R2 and R4</text>
<text x="456.667" y="621" font-size="16" fill="#5c626e">instead. No retirement is approved</text>
<text x="456.667" y="645" font-size="16" fill="#5c626e">here.</text>
<text x="456.667" y="681" font-size="16" fill="#5c626e">Why: another release cannot silently</text>
<text x="456.667" y="705" font-size="16" fill="#5c626e">remove the oldest history from</text>
<text x="456.667" y="729" font-size="16" fill="#5c626e">required checks.</text>
<rect x="456.667" y="763" width="366.667" height="52" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/>
<text x="466.667" y="787" font-size="15" fill="#16181d" font-weight="700">Keep every original bundle</text>
<text x="853.333" y="152" font-size="18" fill="#1a5fd0" font-weight="700">F · ALTERNATIVE</text>
<rect x="853.333" y="180" width="394.667" height="609" rx="8" fill="#ffffff" stroke="#d6d9e0"/>
<text x="867.333" y="209" font-size="18" fill="#16181d" font-weight="700">Rolling three-source window</text>
<text x="867.333" y="243" font-size="16" fill="#5c626e">PROPOSED · NOT APPROVED</text>
<rect x="867.333" y="277" width="366.667" height="100" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/>
<text x="877.333" y="301" font-size="15" fill="#16181d" font-weight="700">For candidate R5</text>
<text x="877.333" y="325" font-size="15" fill="#5c626e">Window: R2 · R3 · R4</text>
<text x="877.333" y="347" font-size="15" fill="#5c626e">Required sources: R2 and R4</text>
<text x="867.333" y="395" font-size="16" fill="#5c626e">Keep the three most recent retained</text>
<text x="867.333" y="419" font-size="16" fill="#5c626e">source releases before each</text>
<text x="867.333" y="443" font-size="16" fill="#5c626e">candidate, in the same post-reset</text>
<text x="867.333" y="467" font-size="16" fill="#5c626e">history.</text>
<text x="867.333" y="503" font-size="16" fill="#5c626e">R1 leaves the supported</text>
<text x="867.333" y="527" font-size="16" fill="#5c626e">starting-point window for R5. R3</text>
<text x="867.333" y="551" font-size="16" fill="#5c626e">stays in the window but is not a</text>
<text x="867.333" y="575" font-size="16" fill="#5c626e">required endpoint run.</text>
<text x="867.333" y="611" font-size="16" fill="#5c626e">Why: the window moves with releases.</text>
<text x="867.333" y="635" font-size="16" fill="#5c626e">It removes the oldest starting point</text>
<text x="867.333" y="659" font-size="16" fill="#5c626e">without a separate retirement</text>
<text x="867.333" y="683" font-size="16" fill="#5c626e">decision.</text>
<rect x="867.333" y="717" width="366.667" height="52" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/>
<text x="877.333" y="741" font-size="15" fill="#16181d" font-weight="700">Keep R1 and its expectations</text>
<text x="32" y="867" font-size="18" fill="#16181d" font-weight="700">Both F choices keep the evidence</text>
<text x="32" y="895" font-size="16" fill="#5c626e">Retirement never deletes an original bundle or expectation set. Every selected comparison stays exact. Passing</text>
<text x="32" y="919" font-size="16" fill="#5c626e">R1/R4 says nothing about R2/R3; passing R2/R4 says nothing about R1/R3. A failing required run remains a</text>
<text x="32" y="943" font-size="16" fill="#5c626e">failure. Neither choice changes or creates a published support guarantee.</text>
<text x="32" y="981" font-size="18" fill="#16181d" font-weight="700">A–D stay agreed within their precise scopes</text>
<text x="32" y="1009" font-size="16" fill="#5c626e">A: invented data written through the old product. B: oldest supported plus previous retained. C: Waitron</text>
<text x="32" y="1033" font-size="16" fill="#5c626e">GitHub Releases, checksums in Git; verify private CI downloads later through existing access. D: issued F1</text>
<text x="32" y="1057" font-size="16" fill="#5c626e">must keep its original customer name and address before A799 closes.</text>
<text x="32" y="1095" font-size="18" fill="#16181d" font-weight="700">Required work remains open</text>
<text x="32" y="1123" font-size="16" fill="#5c626e">Missing normal-path F1 needs an evidence-based prerequisite; A799 stays open. No unpaid order, F2, restart,</text>
<text x="32" y="1147" font-size="16" fill="#5c626e">new sale or new fiscal writer replaces it. A760 reset needs separate authority. Keep post-reset capture, a</text>
<text x="32" y="1171" font-size="16" fill="#5c626e">distinct later pending-migration upgrade, optional-module-off cases, independent expectations, exact raw</text>
<text x="32" y="1195" font-size="16" fill="#5c626e">fiscal bytes and node/SIF/series identity. Report preservation and a separate new sale distinctly.</text>
<text x="32" y="1233" font-size="14" fill="#5c626e">Static design drawings. All examples are invented. Only A–E’s precise scopes are approved; F, the full design, plan and build</text>
<text x="32" y="1255" font-size="14" fill="#5c626e">remain unapproved. Historical source observations are UNVERIFIED at runtime. No capture, migration, upgrade or access result</text>
<text x="32" y="1277" font-size="14" fill="#5c626e">is shown.</text>
</g>
</svg>
