<svg xmlns="http://www.w3.org/2000/svg" width="390" height="2506" viewBox="0 0 390 2506"><title>A799 · Keep the customer invoice?</title><rect width="390" height="2506" fill="#101216"/><g font-family="Arial, sans-serif"><text x="18" y="32" font-size="21" fill="#eceef2" font-weight="700">A799 · Keep the customer</text><text x="18" y="56" font-size="21" fill="#eceef2" font-weight="700">invoice?</text><text x="18" y="84" font-size="14" fill="#78a9ff">GitHub Releases agreed · invoice coverage proposed</text><text x="18" y="128" font-size="19" fill="#eceef2" font-weight="700">C · Agreed: GitHub Releases</text><rect x="18" y="160" width="354" height="648" rx="8" fill="#22262e" stroke="#333945"/><text x="34" y="190" font-size="16" fill="#78a9ff" font-weight="700">A799 · Design review</text><text x="34" y="222" font-size="17" fill="#eceef2" font-weight="700">Store each original with its own Waitron</text><text x="34" y="246" font-size="17" fill="#eceef2" font-weight="700">release</text><rect x="34" y="282" width="322" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="308" font-size="16" fill="#eceef2" font-weight="700">Frozen venue bundle + expected facts</text><text x="46" y="334" font-size="15" fill="#a1a7b3">Git keeps their checksum index</text><rect x="34" y="382" width="322" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="408" font-size="16" fill="#eceef2" font-weight="700">R5 requires R1 and R4</text><text x="46" y="434" font-size="15" fill="#a1a7b3">Keep R2/R3 too; no pass implied</text><rect x="34" y="482" width="322" height="88" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="46" y="508" font-size="16" fill="#eceef2" font-weight="700">Design for a private repository</text><text x="46" y="534" font-size="15" fill="#a1a7b3">Use existing CI access; verify it before build</text><text x="34" y="590" font-size="16" fill="#a1a7b3">Proposed builder contract: fetch and check</text><text x="34" y="614" font-size="16" fill="#a1a7b3">original fingerprints before running candidate</text><text x="34" y="638" font-size="16" fill="#a1a7b3">code; keep download credentials out of that</text><text x="34" y="662" font-size="16" fill="#a1a7b3">code. Missing or corrupt required inputs fail</text><text x="34" y="686" font-size="16" fill="#a1a7b3">the run. No other provider or paid service.</text><rect x="34" y="724" width="322" height="64" rx="8" fill="#4c8dff" stroke="#333945"/><text x="46" y="752" font-size="16" fill="#06101f" font-weight="700">Owner chose GitHub Releases</text><text x="18" y="842" font-size="19" fill="#eceef2" font-weight="700">D · Recommended: require an issued</text><text x="18" y="866" font-size="19" fill="#eceef2" font-weight="700">F1</text><rect x="18" y="898" width="354" height="696" rx="8" fill="#22262e" stroke="#333945"/><text x="34" y="928" font-size="16" fill="#78a9ff" font-weight="700">A799 · Design review</text><text x="34" y="960" font-size="17" fill="#eceef2" font-weight="700">Harbour issued a full customer invoice</text><rect x="34" y="996" width="322" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="1022" font-size="16" fill="#eceef2" font-weight="700">Customer: Mara Soler</text><text x="46" y="1048" font-size="15" fill="#a1a7b3">Recorded address: 18 Market Street</text><rect x="34" y="1096" width="322" height="112" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="1122" font-size="16" fill="#eceef2" font-weight="700">Before and after the upgrade</text><text x="46" y="1148" font-size="15" fill="#a1a7b3">Compare the original issued customer</text><text x="46" y="1172" font-size="15" fill="#a1a7b3">snapshot</text><rect x="34" y="1220" width="322" height="112" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="46" y="1246" font-size="16" fill="#eceef2" font-weight="700">Keep A799 open until this is covered</text><text x="46" y="1272" font-size="15" fill="#a1a7b3">If issuance is unavailable, retain the</text><text x="46" y="1296" font-size="15" fill="#a1a7b3">dependency</text><text x="34" y="1352" font-size="16" fill="#a1a7b3">F1 means a full invoice naming the customer.</text><text x="34" y="1376" font-size="16" fill="#a1a7b3">Require one written by the frozen older</text><text x="34" y="1400" font-size="16" fill="#a1a7b3">product. An unpaid order with customer</text><text x="34" y="1424" font-size="16" fill="#a1a7b3">details is different. This choice enables no F1</text><text x="34" y="1448" font-size="16" fill="#a1a7b3">route and changes no fiscal code.</text><rect x="34" y="1486" width="322" height="88" rx="8" fill="#4c8dff" stroke="#333945"/><text x="46" y="1514" font-size="16" fill="#06101f" font-weight="700">Proposed: mandatory before</text><text x="46" y="1538" font-size="16" fill="#06101f" font-weight="700">completion</text><text x="18" y="1628" font-size="19" fill="#eceef2" font-weight="700">D · Alternative: narrower first scope</text><rect x="18" y="1660" width="354" height="672" rx="8" fill="#22262e" stroke="#333945"/><text x="34" y="1690" font-size="16" fill="#78a9ff" font-weight="700">A799 · Design review</text><text x="34" y="1722" font-size="17" fill="#eceef2" font-weight="700">An unpaid order plus an issued F2</text><rect x="34" y="1758" width="322" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="1784" font-size="16" fill="#eceef2" font-weight="700">Order: Mara Soler, 18 Market Street</text><text x="46" y="1810" font-size="15" fill="#a1a7b3">Still unpaid; no issued customer invoice</text><rect x="34" y="1858" width="322" height="112" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="1884" font-size="16" fill="#eceef2" font-weight="700">F2: a simplified receipt</text><text x="46" y="1910" font-size="15" fill="#a1a7b3">Does not cover an issued F1 customer</text><text x="46" y="1934" font-size="15" fill="#a1a7b3">snapshot</text><rect x="34" y="1982" width="322" height="112" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="46" y="2008" font-size="16" fill="#eceef2" font-weight="700">A799 may close with that gap explicit</text><text x="46" y="2034" font-size="15" fill="#a1a7b3">Track issued-F1 preservation as a separate</text><text x="46" y="2058" font-size="15" fill="#a1a7b3">follow-up</text><text x="34" y="2114" font-size="16" fill="#a1a7b3">This alternative accepts missing</text><text x="34" y="2138" font-size="16" fill="#a1a7b3">customer-invoice coverage in the first A799</text><text x="34" y="2162" font-size="16" fill="#a1a7b3">delivery. A successful restart, upgrade or new</text><text x="34" y="2186" font-size="16" fill="#a1a7b3">sale cannot stand in for it. Neither option</text><text x="34" y="2210" font-size="16" fill="#a1a7b3">approves capture or the full build.</text><rect x="34" y="2248" width="322" height="64" rx="8" fill="#4c8dff" stroke="#333945"/><text x="46" y="2276" font-size="16" fill="#06101f" font-weight="700">Proposed: narrower completion</text><text x="18" y="2366" font-size="14" fill="#a1a7b3">Static design drawings. R1–R5 and Harbour are</text><text x="18" y="2390" font-size="14" fill="#a1a7b3">imagined. No fixture or upgrade has run. A–C precise</text><text x="18" y="2414" font-size="14" fill="#a1a7b3">scope only; D, full design, plan and build await</text><text x="18" y="2438" font-size="14" fill="#a1a7b3">approval. A760 reset is separate. Private access must</text><text x="18" y="2462" font-size="14" fill="#a1a7b3">be verified.</text></g></svg>