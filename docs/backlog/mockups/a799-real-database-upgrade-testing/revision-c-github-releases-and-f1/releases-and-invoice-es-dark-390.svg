<svg xmlns="http://www.w3.org/2000/svg" width="390" height="2434" viewBox="0 0 390 2434"><title>A799 · ¿Conservar la factura del cliente?</title><rect width="390" height="2434" fill="#101216"/><g font-family="Arial, sans-serif"><text x="18" y="32" font-size="21" fill="#eceef2" font-weight="700">A799 · ¿Conservar la factura del</text><text x="18" y="56" font-size="21" fill="#eceef2" font-weight="700">cliente?</text><text x="18" y="84" font-size="14" fill="#78a9ff">GitHub Releases acordado · cobertura F1 propuesta</text><text x="18" y="128" font-size="19" fill="#eceef2" font-weight="700">C · Acordado: GitHub Releases</text><rect x="18" y="160" width="354" height="648" rx="8" fill="#22262e" stroke="#333945"/><text x="34" y="190" font-size="16" fill="#78a9ff" font-weight="700">A799 · Revisión del diseño</text><text x="34" y="222" font-size="17" fill="#eceef2" font-weight="700">Cada original en su versión de Waitron</text><rect x="34" y="258" width="322" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="284" font-size="16" fill="#eceef2" font-weight="700">Captura del local + hechos esperados</text><text x="46" y="310" font-size="15" fill="#a1a7b3">Git conserva el índice de huellas</text><rect x="34" y="358" width="322" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="384" font-size="16" fill="#eceef2" font-weight="700">R5 debe probar R1 y R4</text><text x="46" y="410" font-size="15" fill="#a1a7b3">R2/R3 se conservan; no implica que pasen</text><rect x="34" y="458" width="322" height="88" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="46" y="484" font-size="16" fill="#eceef2" font-weight="700">Preparado para un repositorio privado</text><text x="46" y="510" font-size="15" fill="#a1a7b3">Usar el acceso de CI existente; verificarlo</text><text x="34" y="566" font-size="16" fill="#a1a7b3">Contrato propuesto: obtener originales y</text><text x="34" y="590" font-size="16" fill="#a1a7b3">comprobar huellas antes de ejecutar la</text><text x="34" y="614" font-size="16" fill="#a1a7b3">candidata, sin darle credenciales. Si falta un</text><text x="34" y="638" font-size="16" fill="#a1a7b3">archivo obligatorio o está dañado, falla la</text><text x="34" y="662" font-size="16" fill="#a1a7b3">prueba. Sin otro proveedor ni servicio de</text><text x="34" y="686" font-size="16" fill="#a1a7b3">pago.</text><rect x="34" y="724" width="322" height="64" rx="8" fill="#4c8dff" stroke="#333945"/><text x="46" y="752" font-size="16" fill="#06101f" font-weight="700">El dueño eligió GitHub Releases</text><text x="18" y="842" font-size="19" fill="#eceef2" font-weight="700">D · Recomendado: exigir una F1</text><text x="18" y="866" font-size="19" fill="#eceef2" font-weight="700">emitida</text><rect x="18" y="898" width="354" height="624" rx="8" fill="#22262e" stroke="#333945"/><text x="34" y="928" font-size="16" fill="#78a9ff" font-weight="700">A799 · Revisión del diseño</text><text x="34" y="960" font-size="17" fill="#eceef2" font-weight="700">Harbour emitió una factura completa</text><rect x="34" y="996" width="322" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="1022" font-size="16" fill="#eceef2" font-weight="700">Cliente: Mara Soler</text><text x="46" y="1048" font-size="15" fill="#a1a7b3">Dirección registrada: 18 Market Street</text><rect x="34" y="1096" width="322" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="1122" font-size="16" fill="#eceef2" font-weight="700">Antes y después de actualizar</text><text x="46" y="1148" font-size="15" fill="#a1a7b3">Comparar los datos originales del cliente</text><rect x="34" y="1196" width="322" height="88" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="46" y="1222" font-size="16" fill="#eceef2" font-weight="700">A799 sigue abierto hasta cubrirlo</text><text x="46" y="1248" font-size="15" fill="#a1a7b3">Si no se puede emitir, queda la dependencia</text><text x="34" y="1304" font-size="16" fill="#a1a7b3">F1 es una factura completa que identifica al</text><text x="34" y="1328" font-size="16" fill="#a1a7b3">cliente. Exigir una emitida por el producto</text><text x="34" y="1352" font-size="16" fill="#a1a7b3">antiguo. Un pedido sin pagar con sus datos</text><text x="34" y="1376" font-size="16" fill="#a1a7b3">es distinto. Esta elección no habilita F1 ni</text><text x="34" y="1400" font-size="16" fill="#a1a7b3">cambia código fiscal.</text><rect x="34" y="1438" width="322" height="64" rx="8" fill="#4c8dff" stroke="#333945"/><text x="46" y="1466" font-size="16" fill="#06101f" font-weight="700">Propuesto: obligatorio para completar</text><text x="18" y="1556" font-size="19" fill="#eceef2" font-weight="700">D · Alternativa: primer alcance</text><text x="18" y="1580" font-size="19" fill="#eceef2" font-weight="700">reducido</text><rect x="18" y="1612" width="354" height="672" rx="8" fill="#22262e" stroke="#333945"/><text x="34" y="1642" font-size="16" fill="#78a9ff" font-weight="700">A799 · Revisión del diseño</text><text x="34" y="1674" font-size="17" fill="#eceef2" font-weight="700">Un pedido sin pagar y una F2 emitida</text><rect x="34" y="1710" width="322" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="1736" font-size="16" fill="#eceef2" font-weight="700">Pedido: Mara Soler, 18 Market Street</text><text x="46" y="1762" font-size="15" fill="#a1a7b3">Sin pagar; sin factura completa emitida</text><rect x="34" y="1810" width="322" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="1836" font-size="16" fill="#eceef2" font-weight="700">F2: factura simplificada</text><text x="46" y="1862" font-size="15" fill="#a1a7b3">No cubre los datos de una F1 emitida</text><rect x="34" y="1910" width="322" height="88" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="46" y="1936" font-size="16" fill="#eceef2" font-weight="700">Cerrar A799 con esa carencia explícita</text><text x="46" y="1962" font-size="15" fill="#a1a7b3">Registrar la prueba de F1 como tarea aparte</text><text x="34" y="2018" font-size="16" fill="#a1a7b3">Esta alternativa acepta que la primera</text><text x="34" y="2042" font-size="16" fill="#a1a7b3">entrega no cubra la factura del cliente. Un</text><text x="34" y="2066" font-size="16" fill="#a1a7b3">reinicio, actualización o venta nuevos</text><text x="34" y="2090" font-size="16" fill="#a1a7b3">correctos no cubren esa carencia. Ninguna</text><text x="34" y="2114" font-size="16" fill="#a1a7b3">opción aprueba capturas ni el desarrollo</text><text x="34" y="2138" font-size="16" fill="#a1a7b3">completo.</text><rect x="34" y="2176" width="322" height="88" rx="8" fill="#4c8dff" stroke="#333945"/><text x="46" y="2204" font-size="16" fill="#06101f" font-weight="700">Propuesto: completar con alcance</text><text x="46" y="2228" font-size="16" fill="#06101f" font-weight="700">menor</text><text x="18" y="2318" font-size="14" fill="#a1a7b3">Dibujos estáticos. R1–R5 y Harbour son ejemplos</text><text x="18" y="2342" font-size="14" fill="#a1a7b3">imaginados. No hay captura ni actualización probada.</text><text x="18" y="2366" font-size="14" fill="#a1a7b3">Solo A–C acordado; D, diseño, plan y desarrollo sin</text><text x="18" y="2390" font-size="14" fill="#a1a7b3">aprobar. A760 aparte. Acceso privado por verificar.</text></g></svg>