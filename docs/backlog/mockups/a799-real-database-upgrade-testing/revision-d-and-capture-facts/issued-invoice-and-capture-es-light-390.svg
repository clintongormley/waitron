<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1815" viewBox="0 0 390 1815"><title>A799 · Conservar los hechos originales</title><rect width="390" height="1815" fill="#f7f7f8"/><g font-family="Arial, sans-serif"><text x="18" y="34" font-size="21" fill="#16181d" font-weight="700">A799 · Conservar los hechos</text><text x="18" y="57" font-size="21" fill="#16181d" font-weight="700">originales</text><text x="18" y="85" font-size="14" fill="#1a5fd0">D acordado: factura completa obligatoria · E propuesto</text><text x="18" y="126" font-size="18" fill="#1a5fd0" font-weight="700">D · Acordado</text><rect x="18" y="155" width="354" height="425" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="32" y="184" font-size="18" fill="#16181d" font-weight="700">Conservar la factura del cliente</text><rect x="32" y="217" width="326" height="79" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="42" y="241" font-size="15" fill="#16181d" font-weight="700">Harbour · Factura completa F/1042</text><text x="42" y="266" font-size="15" fill="#5c626e">Mara Soler · 18 Market Street</text><rect x="32" y="308" width="326" height="79" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="42" y="332" font-size="15" fill="#16181d" font-weight="700">Tras la actualización</text><text x="42" y="357" font-size="15" fill="#5c626e">Conservar ese nombre y dirección exactos</text><text x="32" y="405" font-size="15" fill="#5c626e">A799 sigue abierto si la versión antigua no emite</text><text x="32" y="428" font-size="15" fill="#5c626e">F1 por su vía normal. Hay que identificar el</text><text x="32" y="451" font-size="15" fill="#5c626e">requisito pendiente; un pedido sin pagar, F2 o</text><text x="32" y="474" font-size="15" fill="#5c626e">venta nueva no lo cubren.</text><rect x="32" y="507" width="326" height="57" rx="8" fill="#1f6feb" stroke="#d6d9e0"/><text x="42" y="532" font-size="15" fill="#ffffff" font-weight="700">Obligatorio para cerrar A799</text><text x="18" y="610" font-size="18" fill="#1a5fd0" font-weight="700">E · Recomendado</text><rect x="18" y="639" width="354" height="425" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="32" y="668" font-size="18" fill="#16181d" font-weight="700">Congelar lo que asigna el producto</text><rect x="32" y="701" width="326" height="79" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="42" y="725" font-size="15" fill="#16181d" font-weight="700">Datos capturados ilustrativos</text><text x="42" y="750" font-size="15" fill="#5c626e">F/1042 · 4 nov., 12:15 UTC · fila 7b8…</text><rect x="32" y="792" width="326" height="79" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="42" y="816" font-size="15" fill="#16181d" font-weight="700">Cada prueba de actualización posterior</text><text x="42" y="841" font-size="15" fill="#5c626e">Reutiliza esa captura y sus hechos originales</text><text x="32" y="889" font-size="15" fill="#5c626e">Otra captura puede tener fechas o ID distintos.</text><text x="32" y="912" font-size="15" fill="#5c626e">Sellarla aparte con expectativas revisadas;</text><text x="32" y="935" font-size="15" fill="#5c626e">conservar cada original. Cada comparación sigue</text><text x="32" y="958" font-size="15" fill="#5c626e">siendo exacta.</text><rect x="32" y="991" width="326" height="57" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="42" y="1016" font-size="15" fill="#16181d" font-weight="700">Propuesto · sin aprobar</text><text x="18" y="1094" font-size="18" fill="#1a5fd0" font-weight="700">E · Alternativa</text><rect x="18" y="1123" width="354" height="425" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="32" y="1152" font-size="18" fill="#16181d" font-weight="700">Recrear también los mismos datos</text><rect x="32" y="1185" width="326" height="79" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="42" y="1209" font-size="15" fill="#16181d" font-weight="700">Nueva captura desde cero</text><text x="42" y="1234" font-size="15" fill="#5c626e">Repite F/1042, su fecha y el ID de fila</text><rect x="32" y="1276" width="326" height="79" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="42" y="1300" font-size="15" fill="#16181d" font-weight="700">Cada prueba de actualización posterior</text><text x="42" y="1325" font-size="15" fill="#5c626e">También usa una captura congelada</text><text x="32" y="1373" font-size="15" fill="#5c626e">Hay que estudiar un mecanismo de reloj e</text><text x="32" y="1396" font-size="15" fill="#5c626e">identidad compatible. Sin cambiar el código</text><text x="32" y="1419" font-size="15" fill="#5c626e">antiguo, sembrar por SQL ni eludir controles</text><text x="32" y="1442" font-size="15" fill="#5c626e">fiscales. Aún sin verificar.</text><rect x="32" y="1475" width="326" height="57" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="42" y="1500" font-size="15" fill="#16181d" font-weight="700">Propuesto · sin aprobar</text><text x="18" y="1582" font-size="16" fill="#16181d" font-weight="700">Ambas opciones comparan los registros de</text><text x="18" y="1605" font-size="16" fill="#16181d" font-weight="700">ayer exactamente. Nunca reescribir hechos ni</text><text x="18" y="1628" font-size="16" fill="#16181d" font-weight="700">flexibilizar fechas; la candidata no genera las</text><text x="18" y="1651" font-size="16" fill="#16181d" font-weight="700">expectativas.</text><text x="18" y="1684" font-size="14" fill="#5c626e">Dibujos estáticos. Todos los ejemplos son inventados.</text><text x="18" y="1707" font-size="14" fill="#5c626e">A–D aprueban solo su alcance; E, el diseño completo,</text><text x="18" y="1730" font-size="14" fill="#5c626e">el plan y la implementación siguen abiertos. El reinicio</text><text x="18" y="1753" font-size="14" fill="#5c626e">A760 es aparte. No muestran una captura ni una</text><text x="18" y="1776" font-size="14" fill="#5c626e">actualización real.</text></g></svg>