<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="663" viewBox="0 0 1280 663"><title>A799 · Preserve the original facts</title><rect width="1280" height="663" fill="#101216"/><g font-family="Arial, sans-serif"><text x="32" y="34" font-size="21" fill="#eceef2" font-weight="700">A799 · Preserve the original facts</text><text x="32" y="62" font-size="14" fill="#78a9ff">D agreed: issued full invoice required · E proposed</text><text x="32" y="103" font-size="18" fill="#78a9ff" font-weight="700">D · Agreed</text><rect x="32" y="132" width="394" height="402" rx="8" fill="#22262e" stroke="#333945"/><text x="46" y="161" font-size="18" fill="#eceef2" font-weight="700">Keep the issued customer invoice</text><rect x="46" y="194" width="366" height="79" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="56" y="218" font-size="15" fill="#eceef2" font-weight="700">Harbour · Full invoice F/1042</text><text x="56" y="243" font-size="15" fill="#a1a7b3">Mara Soler · 18 Market Street</text><rect x="46" y="285" width="366" height="79" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="56" y="309" font-size="15" fill="#eceef2" font-weight="700">After the upgrade</text><text x="56" y="334" font-size="15" fill="#a1a7b3">Keep that issued name and address exactly</text><text x="46" y="382" font-size="15" fill="#a1a7b3">A799 stays open if the qualifying old product cannot</text><text x="46" y="405" font-size="15" fill="#a1a7b3">issue F1 normally. Identify its prerequisite; an unpaid</text><text x="46" y="428" font-size="15" fill="#a1a7b3">order, F2 receipt or new sale cannot fill the gap.</text><rect x="46" y="461" width="366" height="57" rx="8" fill="#4c8dff" stroke="#333945"/><text x="56" y="486" font-size="15" fill="#06101f" font-weight="700">Required before A799 closes</text><text x="442" y="103" font-size="18" fill="#78a9ff" font-weight="700">E · Recommended</text><rect x="442" y="132" width="394" height="402" rx="8" fill="#22262e" stroke="#333945"/><text x="456" y="161" font-size="18" fill="#eceef2" font-weight="700">Freeze what the old product assigns</text><rect x="456" y="194" width="366" height="79" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="466" y="218" font-size="15" fill="#eceef2" font-weight="700">Illustrative captured facts</text><text x="466" y="243" font-size="15" fill="#a1a7b3">F/1042 · 4 Nov, 12:15 UTC · row 7b8…</text><rect x="456" y="285" width="366" height="79" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="466" y="309" font-size="15" fill="#eceef2" font-weight="700">Every later upgrade test</text><text x="466" y="334" font-size="15" fill="#a1a7b3">Reuse this same bundle and original facts</text><text x="456" y="382" font-size="15" fill="#a1a7b3">A new capture may have different dates or IDs. Seal it</text><text x="456" y="405" font-size="15" fill="#a1a7b3">separately with reviewed expectations; keep every old</text><text x="456" y="428" font-size="15" fill="#a1a7b3">original. Each comparison stays exact.</text><rect x="456" y="461" width="366" height="57" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="466" y="486" font-size="15" fill="#eceef2" font-weight="700">Proposed · not agreed</text><text x="852" y="103" font-size="18" fill="#78a9ff" font-weight="700">E · Alternative</text><rect x="852" y="132" width="394" height="402" rx="8" fill="#22262e" stroke="#333945"/><text x="866" y="161" font-size="18" fill="#eceef2" font-weight="700">Recreate identical initial facts too</text><rect x="866" y="194" width="366" height="79" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="876" y="218" font-size="15" fill="#eceef2" font-weight="700">A new capture from scratch</text><text x="876" y="243" font-size="15" fill="#a1a7b3">Must reproduce F/1042, its time and row ID</text><rect x="866" y="285" width="366" height="79" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="876" y="309" font-size="15" fill="#eceef2" font-weight="700">Every later upgrade test</text><text x="876" y="334" font-size="15" fill="#a1a7b3">Still reuse one frozen bundle per capture</text><text x="866" y="382" font-size="15" fill="#a1a7b3">An old-image-compatible clock and identity mechanism</text><text x="866" y="405" font-size="15" fill="#a1a7b3">needs investigation. No source patches, SQL seed or</text><text x="866" y="428" font-size="15" fill="#a1a7b3">fiscal bypass. This requirement is not yet verified.</text><rect x="866" y="461" width="366" height="57" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="876" y="486" font-size="15" fill="#eceef2" font-weight="700">Proposed · not agreed</text><text x="32" y="568" font-size="16" fill="#eceef2" font-weight="700">Both choices compare yesterday’s records exactly. Never rewrite old facts, relax time comparisons or derive expectations from the candidate.</text><text x="32" y="601" font-size="14" fill="#a1a7b3">Static design drawings. All examples are invented. A–D approve only their precise scope; E and the full design, plan and build remain open. A760 reset is separate. No captured fixture, runtime</text><text x="32" y="624" font-size="14" fill="#a1a7b3">or upgrade result is shown.</text></g></svg>