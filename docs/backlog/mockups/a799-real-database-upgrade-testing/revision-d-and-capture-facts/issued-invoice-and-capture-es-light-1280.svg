<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="663" viewBox="0 0 1280 663"><title>A799 · Conservar los hechos originales</title><rect width="1280" height="663" fill="#f7f7f8"/><g font-family="Arial, sans-serif"><text x="32" y="34" font-size="21" fill="#16181d" font-weight="700">A799 · Conservar los hechos originales</text><text x="32" y="62" font-size="14" fill="#1a5fd0">D acordado: factura completa obligatoria · E propuesto</text><text x="32" y="103" font-size="18" fill="#1a5fd0" font-weight="700">D · Acordado</text><rect x="32" y="132" width="394" height="402" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="161" font-size="18" fill="#16181d" font-weight="700">Conservar la factura del cliente</text><rect x="46" y="194" width="366" height="79" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="56" y="218" font-size="15" fill="#16181d" font-weight="700">Harbour · Factura completa F/1042</text><text x="56" y="243" font-size="15" fill="#5c626e">Mara Soler · 18 Market Street</text><rect x="46" y="285" width="366" height="79" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="56" y="309" font-size="15" fill="#16181d" font-weight="700">Tras la actualización</text><text x="56" y="334" font-size="15" fill="#5c626e">Conservar ese nombre y dirección exactos</text><text x="46" y="382" font-size="15" fill="#5c626e">A799 sigue abierto si la versión antigua no emite F1 por</text><text x="46" y="405" font-size="15" fill="#5c626e">su vía normal. Hay que identificar el requisito pendiente;</text><text x="46" y="428" font-size="15" fill="#5c626e">un pedido sin pagar, F2 o venta nueva no lo cubren.</text><rect x="46" y="461" width="366" height="57" rx="8" fill="#1f6feb" stroke="#d6d9e0"/><text x="56" y="486" font-size="15" fill="#ffffff" font-weight="700">Obligatorio para cerrar A799</text><text x="442" y="103" font-size="18" fill="#1a5fd0" font-weight="700">E · Recomendado</text><rect x="442" y="132" width="394" height="402" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="456" y="161" font-size="18" fill="#16181d" font-weight="700">Congelar lo que asigna el producto</text><rect x="456" y="194" width="366" height="79" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="466" y="218" font-size="15" fill="#16181d" font-weight="700">Datos capturados ilustrativos</text><text x="466" y="243" font-size="15" fill="#5c626e">F/1042 · 4 nov., 12:15 UTC · fila 7b8…</text><rect x="456" y="285" width="366" height="79" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="466" y="309" font-size="15" fill="#16181d" font-weight="700">Cada prueba de actualización posterior</text><text x="466" y="334" font-size="15" fill="#5c626e">Reutiliza esa captura y sus hechos originales</text><text x="456" y="382" font-size="15" fill="#5c626e">Otra captura puede tener fechas o ID distintos. Sellarla</text><text x="456" y="405" font-size="15" fill="#5c626e">aparte con expectativas revisadas; conservar cada</text><text x="456" y="428" font-size="15" fill="#5c626e">original. Cada comparación sigue siendo exacta.</text><rect x="456" y="461" width="366" height="57" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="466" y="486" font-size="15" fill="#16181d" font-weight="700">Propuesto · sin aprobar</text><text x="852" y="103" font-size="18" fill="#1a5fd0" font-weight="700">E · Alternativa</text><rect x="852" y="132" width="394" height="402" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="866" y="161" font-size="18" fill="#16181d" font-weight="700">Recrear también los mismos datos</text><rect x="866" y="194" width="366" height="79" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="876" y="218" font-size="15" fill="#16181d" font-weight="700">Nueva captura desde cero</text><text x="876" y="243" font-size="15" fill="#5c626e">Repite F/1042, su fecha y el ID de fila</text><rect x="866" y="285" width="366" height="79" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="876" y="309" font-size="15" fill="#16181d" font-weight="700">Cada prueba de actualización posterior</text><text x="876" y="334" font-size="15" fill="#5c626e">También usa una captura congelada</text><text x="866" y="382" font-size="15" fill="#5c626e">Hay que estudiar un mecanismo de reloj e identidad</text><text x="866" y="405" font-size="15" fill="#5c626e">compatible. Sin cambiar el código antiguo, sembrar por</text><text x="866" y="428" font-size="15" fill="#5c626e">SQL ni eludir controles fiscales. Aún sin verificar.</text><rect x="866" y="461" width="366" height="57" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="876" y="486" font-size="15" fill="#16181d" font-weight="700">Propuesto · sin aprobar</text><text x="32" y="568" font-size="16" fill="#16181d" font-weight="700">Ambas opciones comparan los registros de ayer exactamente. Nunca reescribir hechos ni flexibilizar fechas; la candidata no genera las expectativas.</text><text x="32" y="601" font-size="14" fill="#5c626e">Dibujos estáticos. Todos los ejemplos son inventados. A–D aprueban solo su alcance; E, el diseño completo, el plan y la implementación siguen abiertos. El reinicio A760 es aparte. No</text><text x="32" y="624" font-size="14" fill="#5c626e">muestran una captura ni una actualización real.</text></g></svg>