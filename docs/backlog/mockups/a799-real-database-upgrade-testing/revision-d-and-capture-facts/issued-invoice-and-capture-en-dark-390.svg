<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1769" viewBox="0 0 390 1769"><title>A799 · Preserve the original facts</title><rect width="390" height="1769" fill="#101216"/><g font-family="Arial, sans-serif"><text x="18" y="34" font-size="21" fill="#eceef2" font-weight="700">A799 · Preserve the original facts</text><text x="18" y="62" font-size="14" fill="#78a9ff">D agreed: issued full invoice required · E proposed</text><text x="18" y="103" font-size="18" fill="#78a9ff" font-weight="700">D · Agreed</text><rect x="18" y="132" width="354" height="425" rx="8" fill="#22262e" stroke="#333945"/><text x="32" y="161" font-size="18" fill="#eceef2" font-weight="700">Keep the issued customer invoice</text><rect x="32" y="194" width="326" height="79" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="42" y="218" font-size="15" fill="#eceef2" font-weight="700">Harbour · Full invoice F/1042</text><text x="42" y="243" font-size="15" fill="#a1a7b3">Mara Soler · 18 Market Street</text><rect x="32" y="285" width="326" height="79" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="42" y="309" font-size="15" fill="#eceef2" font-weight="700">After the upgrade</text><text x="42" y="334" font-size="15" fill="#a1a7b3">Keep that issued name and address exactly</text><text x="32" y="382" font-size="15" fill="#a1a7b3">A799 stays open if the qualifying old product</text><text x="32" y="405" font-size="15" fill="#a1a7b3">cannot issue F1 normally. Identify its prerequisite;</text><text x="32" y="428" font-size="15" fill="#a1a7b3">an unpaid order, F2 receipt or new sale cannot fill</text><text x="32" y="451" font-size="15" fill="#a1a7b3">the gap.</text><rect x="32" y="484" width="326" height="57" rx="8" fill="#4c8dff" stroke="#333945"/><text x="42" y="509" font-size="15" fill="#06101f" font-weight="700">Required before A799 closes</text><text x="18" y="587" font-size="18" fill="#78a9ff" font-weight="700">E · Recommended</text><rect x="18" y="616" width="354" height="425" rx="8" fill="#22262e" stroke="#333945"/><text x="32" y="645" font-size="18" fill="#eceef2" font-weight="700">Freeze what the old product assigns</text><rect x="32" y="678" width="326" height="79" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="42" y="702" font-size="15" fill="#eceef2" font-weight="700">Illustrative captured facts</text><text x="42" y="727" font-size="15" fill="#a1a7b3">F/1042 · 4 Nov, 12:15 UTC · row 7b8…</text><rect x="32" y="769" width="326" height="79" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="42" y="793" font-size="15" fill="#eceef2" font-weight="700">Every later upgrade test</text><text x="42" y="818" font-size="15" fill="#a1a7b3">Reuse this same bundle and original facts</text><text x="32" y="866" font-size="15" fill="#a1a7b3">A new capture may have different dates or IDs.</text><text x="32" y="889" font-size="15" fill="#a1a7b3">Seal it separately with reviewed expectations;</text><text x="32" y="912" font-size="15" fill="#a1a7b3">keep every old original. Each comparison stays</text><text x="32" y="935" font-size="15" fill="#a1a7b3">exact.</text><rect x="32" y="968" width="326" height="57" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="42" y="993" font-size="15" fill="#eceef2" font-weight="700">Proposed · not agreed</text><text x="18" y="1071" font-size="18" fill="#78a9ff" font-weight="700">E · Alternative</text><rect x="18" y="1100" width="354" height="425" rx="8" fill="#22262e" stroke="#333945"/><text x="32" y="1129" font-size="18" fill="#eceef2" font-weight="700">Recreate identical initial facts too</text><rect x="32" y="1162" width="326" height="79" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="42" y="1186" font-size="15" fill="#eceef2" font-weight="700">A new capture from scratch</text><text x="42" y="1211" font-size="15" fill="#a1a7b3">Must reproduce F/1042, its time and row ID</text><rect x="32" y="1253" width="326" height="79" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="42" y="1277" font-size="15" fill="#eceef2" font-weight="700">Every later upgrade test</text><text x="42" y="1302" font-size="15" fill="#a1a7b3">Still reuse one frozen bundle per capture</text><text x="32" y="1350" font-size="15" fill="#a1a7b3">An old-image-compatible clock and identity</text><text x="32" y="1373" font-size="15" fill="#a1a7b3">mechanism needs investigation. No source</text><text x="32" y="1396" font-size="15" fill="#a1a7b3">patches, SQL seed or fiscal bypass. This</text><text x="32" y="1419" font-size="15" fill="#a1a7b3">requirement is not yet verified.</text><rect x="32" y="1452" width="326" height="57" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="42" y="1477" font-size="15" fill="#eceef2" font-weight="700">Proposed · not agreed</text><text x="18" y="1559" font-size="16" fill="#eceef2" font-weight="700">Both choices compare yesterday’s records</text><text x="18" y="1582" font-size="16" fill="#eceef2" font-weight="700">exactly. Never rewrite old facts, relax time</text><text x="18" y="1605" font-size="16" fill="#eceef2" font-weight="700">comparisons or derive expectations from the</text><text x="18" y="1628" font-size="16" fill="#eceef2" font-weight="700">candidate.</text><text x="18" y="1661" font-size="14" fill="#a1a7b3">Static design drawings. All examples are invented. A–D</text><text x="18" y="1684" font-size="14" fill="#a1a7b3">approve only their precise scope; E and the full design,</text><text x="18" y="1707" font-size="14" fill="#a1a7b3">plan and build remain open. A760 reset is separate. No</text><text x="18" y="1730" font-size="14" fill="#a1a7b3">captured fixture, runtime or upgrade result is shown.</text></g></svg>