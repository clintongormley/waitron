<svg xmlns="http://www.w3.org/2000/svg" width="390" height="918" viewBox="0 0 390 918"><title>A · Which older venue?</title><rect width="390" height="918" fill="#101216"/><g font-family="Arial, sans-serif"><text x="20" y="36" font-size="14" fill="#78a9ff" font-weight="700">A799 · DESIGN PROPOSAL</text><text x="20" y="67" font-size="26" fill="#eceef2" font-weight="700">A · Which older venue?</text><text x="20" y="110" font-size="18" fill="#a1a7b3">Recommended: invented venue, real</text><text x="20" y="137" font-size="18" fill="#a1a7b3">product writes</text><rect x="20" y="182" width="350" height="186" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="38" y="213" font-size="19" fill="#78a9ff" font-weight="700">A · A repeatable restaurant</text><text x="38" y="246" font-size="17" fill="#eceef2">A frozen older image creates Olivo Test:</text><text x="38" y="272" font-size="17" fill="#eceef2">staff, menus, sales and invoices through</text><text x="38" y="298" font-size="17" fill="#eceef2">its normal product paths. All people and</text><text x="38" y="324" font-size="17" fill="#eceef2">keys are test-only.</text><rect x="20" y="384" width="350" height="186" rx="8" fill="#191c22" stroke="#333945"/><text x="38" y="415" font-size="19" fill="#eceef2" font-weight="700">B · A private venue copy</text><text x="38" y="448" font-size="17" fill="#eceef2">Closer to a particular box, but brings</text><text x="38" y="474" font-size="17" fill="#eceef2">private records and credentials. Cleaning</text><text x="38" y="500" font-size="17" fill="#eceef2">them can also change the case you</text><text x="38" y="526" font-size="17" fill="#eceef2">wanted to preserve.</text><rect x="20" y="586" width="350" height="238" rx="8" fill="#191c22" stroke="#333945"/><text x="38" y="617" font-size="19" fill="#eceef2" font-weight="700">First owner question</text><text x="38" y="650" font-size="17" fill="#eceef2">Should the required fixture be an invented</text><text x="38" y="676" font-size="17" fill="#eceef2">venue created by an older image</text><text x="38" y="702" font-size="17" fill="#eceef2">(recommended: Ana’s 0.350 kg cheese</text><text x="38" y="728" font-size="17" fill="#eceef2">sale must still be 0.350 kg after upgrade),</text><text x="38" y="754" font-size="17" fill="#eceef2">or an actual private venue snapshot with</text><text x="38" y="780" font-size="17" fill="#eceef2">a separately approved custody process?</text><text x="20" y="852" font-size="14" fill="#a1a7b3">Illustrative review board. No implementation is</text><text x="20" y="875" font-size="14" fill="#a1a7b3">approved.</text></g></svg>