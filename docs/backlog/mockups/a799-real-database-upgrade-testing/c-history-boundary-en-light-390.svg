<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1094" viewBox="0 0 390 1094"><title>C · The reset is a boundary</title><rect width="390" height="1094" fill="#f7f7f8"/><g font-family="Arial, sans-serif"><text x="20" y="36" font-size="14" fill="#1a5fd0" font-weight="700">A799 · DESIGN PROPOSAL</text><text x="20" y="67" font-size="26" fill="#16181d" font-weight="700">C · The reset is a boundary</text><text x="20" y="110" font-size="18" fill="#5c626e">A760 first; supported old fixtures begin after</text><text x="20" y="137" font-size="18" fill="#5c626e">it</text><rect x="20" y="182" width="350" height="186" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="38" y="213" font-size="19" fill="#1a5fd0" font-weight="700">Before the approved squash</text><text x="38" y="246" font-size="17" fill="#16181d">Existing pre-live folders use the old</text><text x="38" y="272" font-size="17" fill="#16181d">migration history. A799 does not approve</text><text x="38" y="298" font-size="17" fill="#16181d">moving them through A760 or resetting</text><text x="38" y="324" font-size="17" fill="#16181d">any box.</text><rect x="20" y="384" width="350" height="186" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="38" y="415" font-size="19" fill="#16181d" font-weight="700">Approved A760 reset</text><text x="38" y="448" font-size="17" fill="#16181d">The separate operator job records resets</text><text x="38" y="474" font-size="17" fill="#16181d">or quarantine. The physical home box</text><text x="38" y="500" font-size="17" fill="#16181d">remains the owner’s job. Nothing in this</text><text x="38" y="526" font-size="17" fill="#16181d">design starts that work.</text><rect x="20" y="586" width="350" height="212" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="38" y="617" font-size="19" fill="#16181d" font-weight="700">First supported capture</text><text x="38" y="650" font-size="17" fill="#16181d">After A760, pin the first qualifying image</text><text x="38" y="676" font-size="17" fill="#16181d">and its product-created venue. A later</text><text x="38" y="702" font-size="17" fill="#16181d">image must apply pending migrations and</text><text x="38" y="728" font-size="17" fill="#16181d">preserve those facts; restarting the same</text><text x="38" y="754" font-size="17" fill="#16181d">image is only a control.</text><rect x="20" y="814" width="350" height="186" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="38" y="845" font-size="19" fill="#16181d" font-weight="700">Before that fixture exists</text><text x="38" y="878" font-size="17" fill="#16181d">Do not call this blocker closed. An</text><text x="38" y="904" font-size="17" fill="#16181d">optional pre-squash refusal rehearsal is a</text><text x="38" y="930" font-size="17" fill="#16181d">separate result, never a successful</text><text x="38" y="956" font-size="17" fill="#16181d">preservation test.</text><text x="20" y="1028" font-size="14" fill="#5c626e">Illustrative review board. No implementation is</text><text x="20" y="1051" font-size="14" fill="#5c626e">approved.</text></g></svg>