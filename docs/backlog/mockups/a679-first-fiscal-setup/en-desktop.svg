<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1032" viewBox="0 0 1280 1032" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Keep your custodian kit · PROPOSAL A · OWNER DECISION PENDING</title>
<desc id="desc">Static wireframe of proposed guided first fiscal setup. The outside custodian retains an encrypted private key and one current master register before signing. Public import, trust confirmation and activation on the box follow later. Continue is unavailable until retention is confirmed.</desc>
<!-- Static export of UI colour, spacing, radius and target-size tokens. -->
<style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#16181d;font-size:14px} .muted{fill:#5c626e}.small{font-size:12px}.heading{font-size:22px;font-weight:600}.group{font-size:18px;font-weight:600}.strong{font-weight:600}.link{fill:#1a5fd0}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}</style>
<rect x="0" y="0" width="1280" height="1032" rx="0" fill="#f7f7f8"/>
<rect x="0" y="0" width="1280" height="36" rx="0" fill="#e3ebfb"/>
<text x="32" y="23" class="small strong link">PROPOSAL A · OWNER DECISION PENDING</text>
<rect x="0" y="36" width="1280" height="68" rx="0" fill="#ffffff"/>
<text x="32" y="76" class="group">Waitron</text>
<text x="180" y="76" class="muted">First fiscal setup</text>
<text x="1184" y="76" class="small muted">EN / ES</text>
<rect x="24" y="128" width="244" height="260" rx="8" fill="#ffffff" stroke="#d6d9e0"/>
<text x="44" y="158" class="small strong muted">YOUR SETUP</text>
<text x="48" y="191" class="link strong">✓</text>
<text x="80" y="191" class="muted">Prepare request</text>
<rect x="36" y="217" width="220" height="44" rx="4" fill="#e3ebfb"/>
<text x="48" y="241" class="link strong">2</text>
<text x="80" y="241" class="strong link">Keep kit</text>
<text x="48" y="291" class="muted">3</text>
<text x="80" y="291" class="muted">Record use and sign</text>
<text x="48" y="341" class="muted">4</text>
<text x="80" y="341" class="muted">Import on the box</text>
<text x="44" y="432" class="small strong">Existing custodian?</text>
<text x="44" y="457" class="small link">Import public files</text>
<text x="44" y="477" class="small link">on the box.</text>
<text x="300" y="148" class="small strong muted">Custodian tool · separate computer</text>
<text x="300" y="190" class="heading">Keep your custodian kit</text>
<text x="300" y="219" class="muted">Keep the signing key and current register outside the Waitron box.</text>
<text x="300" y="241" class="muted">Only signed public files go back to the box.</text>
<rect x="300" y="274" width="928" height="116" rx="8" fill="#ffffff" stroke="#d6d9e0"/>
<text x="324" y="303" class="strong">Restaurante Olivo S.L. · B12345674</text>
<text x="324" y="328" class="small muted">Production · Custodian: Elena</text>
<text x="324" y="356" class="strong">Proposed first entry: S000001</text>
<text x="774" y="356" class="mono">A-S000001 · FF-S000001 · R-S000001</text>
<rect x="300" y="410" width="928" height="184" rx="8" fill="#ffffff" stroke="#d6d9e0"/>
<text x="324" y="443" class="group">1. Keep the private signing key</text>
<text x="324" y="473" class="muted">Save an encrypted key file on the custodian’s computer.</text>
<text x="324" y="495" class="muted">Keep it separate from the printed register and venue backups.</text>
<rect x="324" y="522" width="224" height="44" rx="8" fill="#ffffff" stroke="#d6d9e0"/>
<text x="436.0" y="549" text-anchor="middle" class="link strong">Download key file</text>
<text x="572" y="549" class="small muted">Not yet retained</text>
<rect x="300" y="614" width="928" height="222" rx="8" fill="#ffffff" stroke="#d6d9e0"/>
<text x="324" y="647" class="group">2. Keep one current master register</text>
<text x="324" y="676" class="muted">Keep this master outside the box. Update it before each use.</text>
<text x="324" y="698" class="muted">Other printouts are snapshots; they cannot replace the master.</text>
<rect x="324" y="728" width="172" height="44" rx="8" fill="#ffffff" stroke="#d6d9e0"/>
<text x="410.0" y="755" text-anchor="middle" class="link strong">Print register</text>
<rect x="508" y="728" width="180" height="44" rx="8" fill="#ffffff" stroke="#d6d9e0"/>
<text x="598.0" y="755" text-anchor="middle" class="link strong">Download register</text>
<text x="732" y="745" class="small strong">Public-key fingerprint</text>
<text x="732" y="770" class="small muted">Compare the full fingerprint from the current master</text>
<text x="732" y="790" class="small muted">in a separate confirmation step on the box.</text>
<rect x="324" y="858" width="18" height="18" rx="4" fill="#ffffff" stroke="#7d8390"/>
<text x="354" y="872">I reopened the saved key file.</text>
<rect x="324" y="892" width="18" height="18" rx="4" fill="#ffffff" stroke="#7d8390"/>
<text x="354" y="906">I kept one writable current master.</text>
<text x="324" y="936" class="small muted">Next: mark this entry used in the current master, then sign.</text>
<text x="324" y="956" class="small muted">It stays used even if setup is abandoned.</text>
<text x="324" y="996" class="small muted">Confirm both items to continue.</text>
<rect x="918" y="970" width="104" height="44" rx="8" fill="#ffffff" stroke="#d6d9e0"/>
<text x="970.0" y="997" text-anchor="middle" class="link strong">Back</text>
<rect x="1034" y="970" width="170" height="44" rx="8" fill="#f0f1f4" stroke="#d6d9e0"/>
<text x="1119.0" y="997" text-anchor="middle" class="muted">Continue</text>
<text x="32" y="997" class="small muted">Static design drawing · no working controls</text>
</svg>
