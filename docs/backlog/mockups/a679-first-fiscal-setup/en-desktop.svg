<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1280" viewBox="0 0 1280 1280" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Keep your custodian kit · LIVE / PRODUCTION · BOTH ROUTES APPROVED</title>
<desc id="desc">Static Live/Production wireframe. Both routes are approved: a guided first outside kit and import from an existing custodian. Encrypted file plus secret paper approved 2026-10-15; recovery checks and layout proposed. The private key and one current master stay outside the box; only signed public files return to it. No working controls.</desc>
<!-- Static export of UI colour, spacing, radius and target-size tokens. -->
