<text x="32" y="23" class="small strong link">LIVE / PRODUCTION · BOTH ROUTES APPROVED</text>
<rect x="0" y="36" width="1280" height="68" rx="0" fill="#ffffff"/>
<text x="32" y="76" class="group">Waitron</text>
<text x="180" y="76" class="muted">Live setup / Production</text>
<text x="1184" y="76" class="small muted">EN / ES</text>
<rect x="24" y="128" width="244" height="260" rx="8" fill="#ffffff" stroke="#d6d9e0"/>
<text x="44" y="158" class="small strong muted">YOUR SETUP</text>
<text x="48" y="191" class="link strong">✓</text>
<text x="80" y="191" class="muted">Prepare request</text>
<rect x="36" y="217" width="220" height="44" rx="4" fill="#e3ebfb"/>
<text x="48" y="241" class="link strong">2</text>
<text x="80" y="241" class="strong link">Keep kit</text>
<text x="48" y="291" class="muted">3</text>
<text x="80" y="291" class="muted">Record use and sign</text>
<text x="48" y="341" class="muted">4</text>
<text x="80" y="341" class="muted">Import on the box</text>
<text x="44" y="432" class="small strong">Existing custodian?</text>
<text x="44" y="457" class="small link">Import public files</text>
<text x="44" y="477" class="small link">on the box.</text>
<text x="300" y="148" class="small strong muted">Custodian tool · separate computer</text>
<text x="840" y="148" class="small muted">B approved · recovery checks proposed</text>
<text x="300" y="190" class="heading">Keep your custodian kit</text>
<text x="300" y="219" class="muted">Keep the signing key and current register outside the Waitron box.</text>
<text x="300" y="241" class="muted">Only signed public files go back to the box.</text>
<rect x="300" y="274" width="928" height="116" rx="8" fill="#ffffff" stroke="#d6d9e0"/>
<text x="324" y="303" class="strong">Restaurante Olivo S.L. · B12345674</text>
<text x="324" y="328" class="small muted">Production · Custodian: Elena</text>
<text x="324" y="356" class="strong">Proposed first entry: S000001</text>
<text x="774" y="356" class="mono">A-S000001 · FF-S000001 · R-S000001</text>
<rect x="300" y="410" width="928" height="350" rx="8" fill="#ffffff" stroke="#d6d9e0"/>
<text x="324" y="443" class="group">1. Keep encrypted file AND secret paper</text>
<text x="324" y="473" class="muted">Save the passphrase-protected file and reopen that saved file before continuing.</text>
<text x="324" y="495" class="muted">Versioned secret paper carries the SAME key and full public fingerprint.</text>
<rect x="324" y="522" width="224" height="44" rx="8" fill="#ffffff" stroke="#d6d9e0"/>
<text x="436.0" y="549" text-anchor="middle" class="link strong">Download encrypted file</text>
<rect x="560" y="522" width="224" height="44" rx="8" fill="#ffffff" stroke="#d6d9e0"/>
<text x="672.0" y="549" text-anchor="middle" class="link strong">Print secret paper</text>
<rect x="796" y="522" width="384" height="44" rx="8" fill="#ffffff" stroke="#d6d9e0"/>
<text x="988.0" y="549" text-anchor="middle" class="link strong">Check printed recovery</text>
<text x="324" y="594" class="strong">Whoever holds this paper can sign. Store it apart from the public master.</text>
<text x="324" y="622" class="muted">In a separate offline session, restore from the actual printed paper, not the preview.</text>
<text x="324" y="648" class="muted">Match the full fingerprint, then sign and verify a harmless local challenge.</text>
<text x="324" y="674" class="muted">Wrong or malformed paper: refuse before signing.</text>
<text x="324" y="706" class="small muted">Offline tool, no remote resources. Keep secrets outside the box and venue backups.</text>
<text x="324" y="730" class="small muted">Only the explicitly saved encrypted file and secret print leave tool memory.</text>
<rect x="300" y="780" width="928" height="222" rx="8" fill="#ffffff" stroke="#d6d9e0"/>
<text x="324" y="813" class="group">2. Keep one current master register</text>
<text x="324" y="842" class="muted">One writable public paper original, outside the box. Record each use there.</text>
<text x="324" y="864" class="muted">Every other copy says SNAPSHOT; it cannot replace the current original.</text>
<rect x="324" y="894" width="172" height="44" rx="8" fill="#ffffff" stroke="#d6d9e0"/>
<text x="410.0" y="921" text-anchor="middle" class="link strong">Print master original</text>
<rect x="508" y="894" width="180" height="44" rx="8" fill="#ffffff" stroke="#d6d9e0"/>
<text x="598.0" y="921" text-anchor="middle" class="link strong">Download snapshot</text>
<text x="732" y="911" class="small strong">Public-key fingerprint</text>
<text x="732" y="936" class="small muted">Compare the full fingerprint from the current master</text>
<text x="732" y="956" class="small muted">in a separate confirmation step on the box.</text>
<rect x="324" y="1024" width="18" height="18" rx="4" fill="#ffffff" stroke="#7d8390"/>
<text x="354" y="1038">I reopened the saved key file.</text>
<rect x="324" y="1058" width="18" height="18" rx="4" fill="#ffffff" stroke="#7d8390"/>
<text x="354" y="1072">I restored the actual print and checked the fingerprint and local challenge.</text>
<rect x="324" y="1092" width="18" height="18" rx="4" fill="#ffffff" stroke="#7d8390"/>
<text x="354" y="1106">I kept one writable current master.</text>
<text x="324" y="1136" class="small muted">Next: mark this entry used in the current master, then sign.</text>
<text x="324" y="1156" class="small muted">It stays used even if setup is abandoned.</text>
<text x="324" y="1196" class="small muted">Complete all three checks to continue.</text>
<rect x="918" y="1170" width="104" height="44" rx="8" fill="#ffffff" stroke="#d6d9e0"/>
<text x="970.0" y="1197" text-anchor="middle" class="link strong">Back</text>
<rect x="1034" y="1170" width="170" height="44" rx="8" fill="#f0f1f4" stroke="#d6d9e0"/>
<text x="1119.0" y="1197" text-anchor="middle" class="muted">Continue</text>
<text x="32" y="1255" class="small muted">Proposed static layout · no working controls</text>
</svg>
