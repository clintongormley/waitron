<rect x="0" y="36" width="390" height="68" rx="0" fill="#ffffff"/>
<text x="16" y="76" class="group">Waitron</text>
<text x="374" y="75" text-anchor="end" class="small muted">EN / ES</text>
<text x="16" y="128" class="small strong">Configuración en vivo / Producción</text>
<text x="16" y="151" class="small muted">Herramienta de custodia · equipo separado</text>
<text x="16" y="184" class="small link strong">Paso 2 de 4 · Conservar kit</text>
<text x="16" y="202" class="small muted">Conservación del kit propuesta</text>
<text x="16" y="222" class="heading">Conserva tu kit de custodia</text>
<text x="16" y="252" class="muted">Guarda el kit en el equipo del responsable.</text>
<text x="16" y="274" class="muted">A la caja solo van archivos públicos.</text>
<rect x="16" y="296" width="358" height="132" rx="8" fill="#ffffff" stroke="#d6d9e0"/>
<text x="32" y="320" class="strong">Olivo S.L. · B12345674</text>
<text x="32" y="343" class="small muted">Producción · Responsable: Elena</text>
<text x="32" y="373" class="strong">Entrada propuesta: S000001</text>
<text x="32" y="400" class="mono">A-S000001 · FF-S000001 · R-S000001</text>
<rect x="16" y="444" width="358" height="218" rx="8" fill="#ffffff" stroke="#d6d9e0"/>
<text x="32" y="474" class="group">1. Conserva la clave privada</text>
<text x="32" y="505" class="muted">Guarda un archivo de clave cifrado.</text>
<text x="32" y="527" class="muted">Sepáralo de la caja, las copias del</text>
<text x="32" y="549" class="muted">restaurante y el registro impreso.</text>
<rect x="32" y="580" width="214" height="44" rx="8" fill="#ffffff" stroke="#d6d9e0"/>
<text x="139.0" y="607" text-anchor="middle" class="link strong">Descargar clave</text>
<text x="32" y="644" class="small muted">Aún no conservado</text>
<rect x="16" y="678" width="358" height="292" rx="8" fill="#ffffff" stroke="#d6d9e0"/>
<text x="32" y="708" class="group">2. Conserva el maestro actual</text>
<text x="32" y="739" class="muted">Guarda un único maestro fuera de la caja.</text>
<text x="32" y="761" class="muted">Actualízalo antes de cada uso.</text>
<text x="32" y="783" class="muted">Las demás impresiones son copias.</text>
<rect x="32" y="814" width="156" height="44" rx="8" fill="#ffffff" stroke="#d6d9e0"/>
<text x="110.0" y="841" text-anchor="middle" class="link strong">Imprimir registro</text>
<rect x="200" y="814" width="158" height="44" rx="8" fill="#ffffff" stroke="#d6d9e0"/>
<text x="279.0" y="841" text-anchor="middle" class="link strong">Descargar registro</text>
<text x="32" y="889" class="small strong">Huella de la clave pública</text>
<text x="32" y="917" class="small muted">Compara la huella completa del maestro</text>
<text x="32" y="937" class="small muted">por separado en la caja.</text>
<rect x="24" y="993" width="18" height="18" rx="4" fill="#ffffff" stroke="#7d8390"/>
<text x="54" y="1007">He abierto el archivo de clave guardado.</text>
<rect x="24" y="1031" width="18" height="18" rx="4" fill="#ffffff" stroke="#7d8390"/>
<text x="54" y="1045">Conservo un único maestro actual.</text>
<text x="24" y="1087" class="small muted">Después: anota el uso de la entrada y firma.</text>
<text x="24" y="1109" class="small muted">Abandonar no deja la entrada libre.</text>
<text x="24" y="1146" class="small muted">Confirma ambos puntos para continuar.</text>
<rect x="16" y="1166" width="112" height="44" rx="8" fill="#ffffff" stroke="#d6d9e0"/>
<text x="72.0" y="1193" text-anchor="middle" class="link strong">Atrás</text>
<rect x="140" y="1166" width="234" height="44" rx="8" fill="#f0f1f4" stroke="#d6d9e0"/>
<text x="257.0" y="1193" text-anchor="middle" class="muted">Continuar</text>
<text x="16" y="1240" class="small link">¿Ya tienes responsable?</text>
<text x="16" y="1260" class="small link">Importa archivos públicos en la caja.</text>
<text x="16" y="1327" class="small muted">Dibujo estático · controles sin funcionamiento</text>
