<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1360" viewBox="0 0 390 1360" role="img" aria-labelledby="title desc" lang="es">
<title id="title">Conserva tu kit de custodia · EN VIVO / PRODUCCIÓN · AMBAS VÍAS APROBADAS</title>
<desc id="desc">Dibujo estático de configuración en vivo/producción. Ambas vías están aprobadas: primer kit externo guiado e importación de archivos de un responsable existente. Los detalles de conservación siguen propuestos. La clave privada y el único maestro actual quedan fuera de la caja; solo se importan archivos públicos firmados. No hay controles funcionales.</desc>
