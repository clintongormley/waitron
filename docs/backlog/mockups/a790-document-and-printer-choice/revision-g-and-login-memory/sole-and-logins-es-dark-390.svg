<svg xmlns="http://www.w3.org/2000/svg" width="390" height="2668" viewBox="0 0 390 2668"><title>A790 · Una impresora; compartir elecciones</title><rect width="390" height="2668" fill="#101216"/><g font-family="Arial, sans-serif"><text x="18" y="32" font-size="21" fill="#eceef2" font-weight="700">A790 · Una impresora; compartir</text><text x="18" y="56" font-size="21" fill="#eceef2" font-weight="700">elecciones</text><text x="18" y="84" font-size="14" fill="#78a9ff">G acordada · H es una pregunta · solo diseño</text><text x="18" y="128" font-size="19" fill="#eceef2" font-weight="700">G · Acordado: proponer la única</text><text x="18" y="152" font-size="19" fill="#eceef2" font-weight="700">impresora</text><rect x="18" y="184" width="354" height="702" rx="8" fill="#22262e" stroke="#333945"/><text x="34" y="214" font-size="16" fill="#78a9ff" font-weight="700">Restaurante Olivo S.L.</text><text x="34" y="246" font-size="17" fill="#eceef2" font-weight="700">Formulario recién abierto · Harbour</text><text x="34" y="270" font-size="17" fill="#eceef2" font-weight="700">F/1042</text><rect x="34" y="306" width="322" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="332" font-size="16" fill="#eceef2" font-weight="700">Impresora anterior no disponible</text><text x="46" y="358" font-size="15" fill="#a1a7b3">Bar receipt está desactivada</text><rect x="34" y="406" width="322" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="432" font-size="16" fill="#eceef2" font-weight="700">Única válida · preseleccionada</text><text x="46" y="458" font-size="15" fill="#a1a7b3">Patio receipt</text><rect x="34" y="506" width="322" height="88" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="46" y="532" font-size="16" fill="#eceef2" font-weight="700">Confirmación final con su nombre</text><text x="46" y="558" font-size="15" fill="#a1a7b3">Imprimir copia en Patio receipt</text><text x="34" y="614" font-size="16" fill="#a1a7b3">Primer uso: preseleccionar la única sin</text><text x="34" y="638" font-size="16" fill="#a1a7b3">inventar un aviso de impresora anterior. Abrir</text><text x="34" y="662" font-size="16" fill="#a1a7b3">no imprime ni cambia la memoria. G no</text><text x="34" y="686" font-size="16" fill="#a1a7b3">sustituye una selección abierta ni redirige</text><text x="34" y="710" font-size="16" fill="#a1a7b3">una solicitud enviada.</text><rect x="34" y="748" width="90" height="42" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="775" font-size="15" fill="#78a9ff">Cancelar</text><rect x="34" y="802" width="322" height="64" rx="8" fill="#4c8dff" stroke="#333945"/><text x="46" y="830" font-size="16" fill="#06101f" font-weight="700">Solo ejemplo · no imprime</text><text x="18" y="920" font-size="19" fill="#eceef2" font-weight="700">H · Recomendado: compartir en este</text><text x="18" y="944" font-size="19" fill="#eceef2" font-weight="700">navegador</text><rect x="18" y="976" width="354" height="726" rx="8" fill="#22262e" stroke="#333945"/><text x="34" y="1006" font-size="16" fill="#78a9ff" font-weight="700">Restaurante Olivo S.L.</text><text x="34" y="1038" font-size="17" fill="#eceef2" font-weight="700">Luis entra después de Ana · mismo</text><text x="34" y="1062" font-size="17" fill="#eceef2" font-weight="700">navegador</text><rect x="34" y="1098" width="322" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="1124" font-size="16" fill="#eceef2" font-weight="700">Antes: Luis imprimió en Bar receipt</text><text x="46" y="1150" font-size="15" fill="#a1a7b3">Después: Ana imprimió en Patio receipt</text><rect x="34" y="1198" width="322" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="1224" font-size="16" fill="#eceef2" font-weight="700">El servidor aceptó la solicitud de Ana</text><text x="46" y="1250" font-size="15" fill="#a1a7b3">Ana sale; Luis inicia sesión</text><rect x="34" y="1298" width="322" height="88" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="46" y="1324" font-size="16" fill="#eceef2" font-weight="700">Luis abre Recibo · Patio seleccionada</text><text x="46" y="1350" font-size="15" fill="#a1a7b3">Imprimir copia en Patio receipt</text><text x="34" y="1406" font-size="16" fill="#a1a7b3">Bar y Patio siguen siendo válidas para Luis.</text><text x="34" y="1430" font-size="16" fill="#a1a7b3">Compartir conserva el último destino</text><text x="34" y="1454" font-size="16" fill="#a1a7b3">aceptado en este puesto. La memoria no da</text><text x="34" y="1478" font-size="16" fill="#a1a7b3">permisos ni muestra impresoras no</text><text x="34" y="1502" font-size="16" fill="#a1a7b3">autorizadas. Factura y Hillside siguen</text><text x="34" y="1526" font-size="16" fill="#a1a7b3">separados.</text><rect x="34" y="1564" width="90" height="42" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="1591" font-size="15" fill="#78a9ff">Cancelar</text><rect x="34" y="1618" width="322" height="64" rx="8" fill="#4c8dff" stroke="#333945"/><text x="46" y="1646" font-size="16" fill="#06101f" font-weight="700">Solo ejemplo · no imprime</text><text x="18" y="1736" font-size="19" fill="#eceef2" font-weight="700">H · Alternativa: una elección por</text><text x="18" y="1760" font-size="19" fill="#eceef2" font-weight="700">persona</text><rect x="18" y="1792" width="354" height="702" rx="8" fill="#22262e" stroke="#333945"/><text x="34" y="1822" font-size="16" fill="#78a9ff" font-weight="700">Restaurante Olivo S.L.</text><text x="34" y="1854" font-size="17" fill="#eceef2" font-weight="700">Mismas impresiones · mismo navegador</text><text x="34" y="1878" font-size="17" fill="#eceef2" font-weight="700">y local</text><rect x="34" y="1914" width="322" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="1940" font-size="16" fill="#eceef2" font-weight="700">Elección anterior aceptada de Luis</text><text x="46" y="1966" font-size="15" fill="#a1a7b3">Bar receipt</text><rect x="34" y="2014" width="322" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="2040" font-size="16" fill="#eceef2" font-weight="700">Elección posterior aceptada de Ana</text><text x="46" y="2066" font-size="15" fill="#a1a7b3">Patio receipt</text><rect x="34" y="2114" width="322" height="88" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="46" y="2140" font-size="16" fill="#eceef2" font-weight="700">Luis abre Recibo · Bar seleccionada</text><text x="46" y="2166" font-size="15" fill="#a1a7b3">Imprimir copia en Bar receipt</text><text x="34" y="2222" font-size="16" fill="#a1a7b3">Se recupera la elección de Luis en vez de la</text><text x="34" y="2246" font-size="16" fill="#a1a7b3">de Ana. Ambas opciones exigen confirmar</text><text x="34" y="2270" font-size="16" fill="#a1a7b3">con el botón de impresión. Entrar no imprime.</text><text x="34" y="2294" font-size="16" fill="#a1a7b3">H decide si compartir, no almacenamiento,</text><text x="34" y="2318" font-size="16" fill="#a1a7b3">caducidad ni respuestas tardías.</text><rect x="34" y="2356" width="90" height="42" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="2383" font-size="15" fill="#78a9ff">Cancelar</text><rect x="34" y="2410" width="322" height="64" rx="8" fill="#4c8dff" stroke="#333945"/><text x="46" y="2438" font-size="16" fill="#06101f" font-weight="700">Solo ejemplo · no imprime</text><text x="18" y="2528" font-size="14" fill="#a1a7b3">Panel sin perfil de dispositivo. H es una propuesta.</text><text x="18" y="2552" font-size="14" fill="#a1a7b3">Almacenamiento, caducidad, solicitudes tardías,</text><text x="18" y="2576" font-size="14" fill="#a1a7b3">memoria de Factura y portátiles siguen abiertos.</text><text x="18" y="2600" font-size="14" fill="#a1a7b3">Equipo sigue A796. Dibujos sin pruebas del producto ni</text><text x="18" y="2624" font-size="14" fill="#a1a7b3">del papel.</text></g></svg>