<svg xmlns="http://www.w3.org/2000/svg" width="390" height="2668" viewBox="0 0 390 2668"><title>A790 · One printer; sharing remembered choices</title><rect width="390" height="2668" fill="#f7f7f8"/><g font-family="Arial, sans-serif"><text x="18" y="32" font-size="21" fill="#16181d" font-weight="700">A790 · One printer; sharing</text><text x="18" y="56" font-size="21" fill="#16181d" font-weight="700">remembered choices</text><text x="18" y="84" font-size="14" fill="#1a5fd0">G agreed · H is one question · design only</text><text x="18" y="128" font-size="19" fill="#16181d" font-weight="700">G · Agreed: suggest the sole available</text><text x="18" y="152" font-size="19" fill="#16181d" font-weight="700">printer</text><rect x="18" y="184" width="354" height="702" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="34" y="214" font-size="16" fill="#1a5fd0" font-weight="700">Restaurante Olivo S.L.</text><text x="34" y="246" font-size="17" fill="#16181d" font-weight="700">Newly opened form · Harbour F/1042</text><text x="34" y="270" font-size="17" fill="#16181d" font-weight="700">Receipt</text><rect x="34" y="306" width="322" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="332" font-size="16" fill="#16181d" font-weight="700">Previous printer unavailable</text><text x="46" y="358" font-size="15" fill="#5c626e">Bar receipt is disabled</text><rect x="34" y="406" width="322" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="432" font-size="16" fill="#16181d" font-weight="700">Only eligible printer · preselected</text><text x="46" y="458" font-size="15" fill="#5c626e">Patio receipt</text><rect x="34" y="506" width="322" height="88" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="46" y="532" font-size="16" fill="#16181d" font-weight="700">Final named confirmation still required</text><text x="46" y="558" font-size="15" fill="#5c626e">Print a copy on Patio receipt</text><text x="34" y="614" font-size="16" fill="#5c626e">First use: select the sole eligible printer</text><text x="34" y="638" font-size="16" fill="#5c626e">without inventing a previous-printer warning.</text><text x="34" y="662" font-size="16" fill="#5c626e">Nothing prints or changes memory merely on</text><text x="34" y="686" font-size="16" fill="#5c626e">opening. G does not replace an open</text><text x="34" y="710" font-size="16" fill="#5c626e">selection or reroute a submitted request.</text><rect x="34" y="748" width="90" height="42" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="775" font-size="15" fill="#1a5fd0">Cancel</text><rect x="34" y="802" width="322" height="64" rx="8" fill="#1f6feb" stroke="#d6d9e0"/><text x="46" y="830" font-size="16" fill="#ffffff" font-weight="700">Example only · no printing</text><text x="18" y="920" font-size="19" fill="#16181d" font-weight="700">H · Recommended: share in this</text><text x="18" y="944" font-size="19" fill="#16181d" font-weight="700">browser</text><rect x="18" y="976" width="354" height="726" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="34" y="1006" font-size="16" fill="#1a5fd0" font-weight="700">Restaurante Olivo S.L.</text><text x="34" y="1038" font-size="17" fill="#16181d" font-weight="700">Luis signs in after Ana · same browser /</text><text x="34" y="1062" font-size="17" fill="#16181d" font-weight="700">venue</text><rect x="34" y="1098" width="322" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="1124" font-size="16" fill="#16181d" font-weight="700">Earlier: Luis printed on Bar receipt</text><text x="46" y="1150" font-size="15" fill="#5c626e">Later: Ana printed on Patio receipt</text><rect x="34" y="1198" width="322" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="1224" font-size="16" fill="#16181d" font-weight="700">Server accepted Ana’s Patio request</text><text x="46" y="1250" font-size="15" fill="#5c626e">Ana logs out; Luis signs in</text><rect x="34" y="1298" width="322" height="88" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="46" y="1324" font-size="16" fill="#16181d" font-weight="700">Luis opens Receipt · Patio selected</text><text x="46" y="1350" font-size="15" fill="#5c626e">Print a copy on Patio receipt</text><text x="34" y="1406" font-size="16" fill="#5c626e">Both Bar and Patio are still eligible to Luis.</text><text x="34" y="1430" font-size="16" fill="#5c626e">Shared memory keeps the last accepted</text><text x="34" y="1454" font-size="16" fill="#5c626e">destination at this workstation. Only eligible</text><text x="34" y="1478" font-size="16" fill="#5c626e">choices may be shown; memory grants no</text><text x="34" y="1502" font-size="16" fill="#5c626e">permission. Invoice and Hillside remain</text><text x="34" y="1526" font-size="16" fill="#5c626e">separate.</text><rect x="34" y="1564" width="90" height="42" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="1591" font-size="15" fill="#1a5fd0">Cancel</text><rect x="34" y="1618" width="322" height="64" rx="8" fill="#1f6feb" stroke="#d6d9e0"/><text x="46" y="1646" font-size="16" fill="#ffffff" font-weight="700">Example only · no printing</text><text x="18" y="1736" font-size="19" fill="#16181d" font-weight="700">H · Alternative: each person’s own</text><text x="18" y="1760" font-size="19" fill="#16181d" font-weight="700">choice</text><rect x="18" y="1792" width="354" height="702" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="34" y="1822" font-size="16" fill="#1a5fd0" font-weight="700">Restaurante Olivo S.L.</text><text x="34" y="1854" font-size="17" fill="#16181d" font-weight="700">Same accepted prints · same browser /</text><text x="34" y="1878" font-size="17" fill="#16181d" font-weight="700">venue</text><rect x="34" y="1914" width="322" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="1940" font-size="16" fill="#16181d" font-weight="700">Luis’s earlier accepted printer</text><text x="46" y="1966" font-size="15" fill="#5c626e">Bar receipt</text><rect x="34" y="2014" width="322" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="2040" font-size="16" fill="#16181d" font-weight="700">Ana’s later accepted printer</text><text x="46" y="2066" font-size="15" fill="#5c626e">Patio receipt</text><rect x="34" y="2114" width="322" height="88" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="46" y="2140" font-size="16" fill="#16181d" font-weight="700">Luis opens Receipt · Bar selected</text><text x="46" y="2166" font-size="15" fill="#5c626e">Print a copy on Bar receipt</text><text x="34" y="2222" font-size="16" fill="#5c626e">Personal memory restores Luis’s choice</text><text x="34" y="2246" font-size="16" fill="#5c626e">instead of Ana’s. Both alternatives require the</text><text x="34" y="2270" font-size="16" fill="#5c626e">final named print button; sign-in never prints.</text><text x="34" y="2294" font-size="16" fill="#5c626e">H settles login sharing only, not storage,</text><text x="34" y="2318" font-size="16" fill="#5c626e">expiry or delayed updates across accounts.</text><rect x="34" y="2356" width="90" height="42" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="2383" font-size="15" fill="#1a5fd0">Cancel</text><rect x="34" y="2410" width="322" height="64" rx="8" fill="#1f6feb" stroke="#d6d9e0"/><text x="46" y="2438" font-size="16" fill="#ffffff" font-weight="700">Example only · no printing</text><text x="18" y="2528" font-size="14" fill="#5c626e">Dashboard without a device profile. H is a proposal</text><text x="18" y="2552" font-size="14" fill="#5c626e">only. Storage, expiry/reset, late requests, device Invoice</text><text x="18" y="2576" font-size="14" fill="#5c626e">memory and portable receipt holding stay open. Phone</text><text x="18" y="2600" font-size="14" fill="#5c626e">Equipment follows A796. Static drawings, no runtime or</text><text x="18" y="2624" font-size="14" fill="#5c626e">paper evidence.</text></g></svg>