<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="2188" viewBox="0 0 1280 2188"><title>A790 · Una impresora; compartir elecciones</title><rect width="1280" height="2188" fill="#101216"/><g font-family="Arial, sans-serif"><text x="40" y="32" font-size="21" fill="#eceef2" font-weight="700">A790 · Una impresora; compartir elecciones</text><text x="40" y="60" font-size="14" fill="#78a9ff">G acordada · H es una pregunta · solo diseño</text><text x="40" y="104" font-size="19" fill="#eceef2" font-weight="700">G · Acordado: proponer la única impresora</text><rect x="40" y="136" width="1200" height="606" rx="8" fill="#22262e" stroke="#333945"/><text x="56" y="166" font-size="16" fill="#78a9ff" font-weight="700">Restaurante Olivo S.L.</text><text x="56" y="198" font-size="17" fill="#eceef2" font-weight="700">Formulario recién abierto · Harbour F/1042</text><rect x="56" y="234" width="1168" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="260" font-size="16" fill="#eceef2" font-weight="700">Impresora anterior no disponible</text><text x="68" y="286" font-size="15" fill="#a1a7b3">Bar receipt está desactivada</text><rect x="56" y="334" width="1168" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="360" font-size="16" fill="#eceef2" font-weight="700">Única válida · preseleccionada</text><text x="68" y="386" font-size="15" fill="#a1a7b3">Patio receipt</text><rect x="56" y="434" width="1168" height="88" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="68" y="460" font-size="16" fill="#eceef2" font-weight="700">Confirmación final con su nombre</text><text x="68" y="486" font-size="15" fill="#a1a7b3">Imprimir copia en Patio receipt</text><text x="56" y="542" font-size="16" fill="#a1a7b3">Primer uso: preseleccionar la única sin inventar un aviso de impresora anterior. Abrir no imprime ni cambia la memoria. G no sustituye una selección abierta ni</text><text x="56" y="566" font-size="16" fill="#a1a7b3">redirige una solicitud enviada.</text><rect x="56" y="604" width="90" height="42" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="631" font-size="15" fill="#78a9ff">Cancelar</text><rect x="56" y="658" width="1168" height="64" rx="8" fill="#4c8dff" stroke="#333945"/><text x="68" y="686" font-size="16" fill="#06101f" font-weight="700">Solo ejemplo · no imprime</text><text x="40" y="776" font-size="19" fill="#eceef2" font-weight="700">H · Recomendado: compartir en este navegador</text><rect x="40" y="808" width="1200" height="606" rx="8" fill="#22262e" stroke="#333945"/><text x="56" y="838" font-size="16" fill="#78a9ff" font-weight="700">Restaurante Olivo S.L.</text><text x="56" y="870" font-size="17" fill="#eceef2" font-weight="700">Luis entra después de Ana · mismo navegador</text><rect x="56" y="906" width="1168" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="932" font-size="16" fill="#eceef2" font-weight="700">Antes: Luis imprimió en Bar receipt</text><text x="68" y="958" font-size="15" fill="#a1a7b3">Después: Ana imprimió en Patio receipt</text><rect x="56" y="1006" width="1168" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="1032" font-size="16" fill="#eceef2" font-weight="700">El servidor aceptó la solicitud de Ana</text><text x="68" y="1058" font-size="15" fill="#a1a7b3">Ana sale; Luis inicia sesión</text><rect x="56" y="1106" width="1168" height="88" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="68" y="1132" font-size="16" fill="#eceef2" font-weight="700">Luis abre Recibo · Patio seleccionada</text><text x="68" y="1158" font-size="15" fill="#a1a7b3">Imprimir copia en Patio receipt</text><text x="56" y="1214" font-size="16" fill="#a1a7b3">Bar y Patio siguen siendo válidas para Luis. Compartir conserva el último destino aceptado en este puesto. La memoria no da permisos ni muestra impresoras no</text><text x="56" y="1238" font-size="16" fill="#a1a7b3">autorizadas. Factura y Hillside siguen separados.</text><rect x="56" y="1276" width="90" height="42" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="1303" font-size="15" fill="#78a9ff">Cancelar</text><rect x="56" y="1330" width="1168" height="64" rx="8" fill="#4c8dff" stroke="#333945"/><text x="68" y="1358" font-size="16" fill="#06101f" font-weight="700">Solo ejemplo · no imprime</text><text x="40" y="1448" font-size="19" fill="#eceef2" font-weight="700">H · Alternativa: una elección por persona</text><rect x="40" y="1480" width="1200" height="606" rx="8" fill="#22262e" stroke="#333945"/><text x="56" y="1510" font-size="16" fill="#78a9ff" font-weight="700">Restaurante Olivo S.L.</text><text x="56" y="1542" font-size="17" fill="#eceef2" font-weight="700">Mismas impresiones · mismo navegador y local</text><rect x="56" y="1578" width="1168" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="1604" font-size="16" fill="#eceef2" font-weight="700">Elección anterior aceptada de Luis</text><text x="68" y="1630" font-size="15" fill="#a1a7b3">Bar receipt</text><rect x="56" y="1678" width="1168" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="1704" font-size="16" fill="#eceef2" font-weight="700">Elección posterior aceptada de Ana</text><text x="68" y="1730" font-size="15" fill="#a1a7b3">Patio receipt</text><rect x="56" y="1778" width="1168" height="88" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="68" y="1804" font-size="16" fill="#eceef2" font-weight="700">Luis abre Recibo · Bar seleccionada</text><text x="68" y="1830" font-size="15" fill="#a1a7b3">Imprimir copia en Bar receipt</text><text x="56" y="1886" font-size="16" fill="#a1a7b3">Se recupera la elección de Luis en vez de la de Ana. Ambas opciones exigen confirmar con el botón de impresión. Entrar no imprime. H decide si compartir, no</text><text x="56" y="1910" font-size="16" fill="#a1a7b3">almacenamiento, caducidad ni respuestas tardías.</text><rect x="56" y="1948" width="90" height="42" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="1975" font-size="15" fill="#78a9ff">Cancelar</text><rect x="56" y="2002" width="1168" height="64" rx="8" fill="#4c8dff" stroke="#333945"/><text x="68" y="2030" font-size="16" fill="#06101f" font-weight="700">Solo ejemplo · no imprime</text><text x="40" y="2120" font-size="14" fill="#a1a7b3">Panel sin perfil de dispositivo. H es una propuesta. Almacenamiento, caducidad, solicitudes tardías, memoria de Factura y portátiles siguen abiertos. Equipo sigue A796. Dibujos sin pruebas</text><text x="40" y="2144" font-size="14" fill="#a1a7b3">del producto ni del papel.</text></g></svg>