<svg xmlns="http://www.w3.org/2000/svg" width="390" height="2596" viewBox="0 0 390 2596"><title>A790 · Receipt directly; dashboard memory next</title><rect width="390" height="2596" fill="#f7f7f8"/><g font-family="Arial, sans-serif"><text x="18" y="32" font-size="21" fill="#16181d" font-weight="700">A790 · Receipt directly; dashboard</text><text x="18" y="56" font-size="21" fill="#16181d" font-weight="700">memory next</text><text x="18" y="84" font-size="14" fill="#1a5fd0">D approved · E is one question · design only</text><text x="18" y="128" font-size="19" fill="#16181d" font-weight="700">D · Agreed: open Receipt directly</text><rect x="18" y="160" width="354" height="678" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="34" y="190" font-size="16" fill="#1a5fd0" font-weight="700">Restaurante Olivo S.L.</text><text x="34" y="222" font-size="17" fill="#16181d" font-weight="700">Simplified sale S/318 · €14.50 · Spanish</text><text x="34" y="246" font-size="17" fill="#16181d" font-weight="700">· 1 guest</text><rect x="34" y="282" width="322" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="308" font-size="16" fill="#16181d" font-weight="700">Receipt · Simplified invoice</text><text x="46" y="334" font-size="15" fill="#5c626e">No document-choice step</text><rect x="34" y="382" width="322" height="88" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="46" y="408" font-size="16" fill="#16181d" font-weight="700">Receipt printer ▸ · Change</text><text x="46" y="434" font-size="15" fill="#5c626e">Patio receipt · current Equipment choice</text><rect x="34" y="482" width="322" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="508" font-size="16" fill="#16181d" font-weight="700">Expand in this same form</text><text x="46" y="534" font-size="15" fill="#5c626e">Bar receipt / Patio receipt</text><text x="34" y="590" font-size="16" fill="#5c626e">Keep the recorded sale, language choice and</text><text x="34" y="614" font-size="16" fill="#5c626e">final named press. Selecting a printer or</text><text x="34" y="638" font-size="16" fill="#5c626e">folding the row never prints. This is a device</text><text x="34" y="662" font-size="16" fill="#5c626e">example; the dashboard follows B.</text><rect x="34" y="700" width="90" height="42" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="727" font-size="15" fill="#1a5fd0">Cancel</text><rect x="34" y="754" width="322" height="64" rx="8" fill="#1f6feb" stroke="#d6d9e0"/><text x="46" y="782" font-size="16" fill="#ffffff" font-weight="700">Print a copy on Patio receipt</text><text x="18" y="872" font-size="19" fill="#16181d" font-weight="700">E · Recommended: remember</text><text x="18" y="896" font-size="19" fill="#16181d" font-weight="700">separately</text><rect x="18" y="928" width="354" height="702" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="34" y="958" font-size="16" fill="#1a5fd0" font-weight="700">Restaurante Olivo S.L.</text><text x="34" y="990" font-size="17" fill="#16181d" font-weight="700">Harbour F/1042 · dashboard without</text><text x="34" y="1014" font-size="17" fill="#16181d" font-weight="700">device profile</text><rect x="34" y="1050" width="322" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="1076" font-size="16" fill="#16181d" font-weight="700">Earlier: Receipt on Bar receipt</text><text x="46" y="1102" font-size="15" fill="#5c626e">Then: Invoice on Office · A4</text><rect x="34" y="1150" width="322" height="88" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="46" y="1176" font-size="16" fill="#16181d" font-weight="700">Open Receipt again</text><text x="46" y="1202" font-size="15" fill="#5c626e">Bar receipt preselected</text><rect x="34" y="1250" width="322" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="1276" font-size="16" fill="#16181d" font-weight="700">Open Invoice again</text><text x="46" y="1302" font-size="15" fill="#5c626e">Office · A4 preselected</text><text x="34" y="1358" font-size="16" fill="#5c626e">Proposed: one remembered printer per sale</text><text x="34" y="1382" font-size="16" fill="#5c626e">venue and document on this browser.</text><text x="34" y="1406" font-size="16" fill="#5c626e">Switching invoice printer leaves the receipt</text><text x="34" y="1430" font-size="16" fill="#5c626e">choice alone. Only while each remains active</text><text x="34" y="1454" font-size="16" fill="#5c626e">at Harbour.</text><rect x="34" y="1492" width="90" height="42" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="1519" font-size="15" fill="#1a5fd0">Cancel</text><rect x="34" y="1546" width="322" height="64" rx="8" fill="#1f6feb" stroke="#d6d9e0"/><text x="46" y="1574" font-size="16" fill="#ffffff" font-weight="700">Example only · no printing</text><text x="18" y="1664" font-size="19" fill="#16181d" font-weight="700">E · Alternative: share one printer</text><rect x="18" y="1696" width="354" height="702" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="34" y="1726" font-size="16" fill="#1a5fd0" font-weight="700">Restaurante Olivo S.L.</text><text x="34" y="1758" font-size="17" fill="#16181d" font-weight="700">The same Harbour F/1042 · the same</text><text x="34" y="1782" font-size="17" fill="#16181d" font-weight="700">two prints</text><rect x="34" y="1818" width="322" height="112" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="1844" font-size="16" fill="#16181d" font-weight="700">Receipt on Bar, then Invoice on Office</text><text x="46" y="1870" font-size="15" fill="#5c626e">Office becomes the shared remembered</text><text x="46" y="1894" font-size="15" fill="#5c626e">printer</text><rect x="34" y="1942" width="322" height="88" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="46" y="1968" font-size="16" fill="#16181d" font-weight="700">Open Receipt again</text><text x="46" y="1994" font-size="15" fill="#5c626e">Office · A4 preselected</text><rect x="34" y="2042" width="322" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="2068" font-size="16" fill="#16181d" font-weight="700">Open Invoice again</text><text x="46" y="2094" font-size="15" fill="#5c626e">Office · A4 preselected</text><text x="34" y="2150" font-size="16" fill="#5c626e">Proposed: one remembered printer per sale</text><text x="34" y="2174" font-size="16" fill="#5c626e">venue, shared by Receipt and Invoice. Office</text><text x="34" y="2198" font-size="16" fill="#5c626e">A4 is allowed by dashboard B; paper does</text><text x="34" y="2222" font-size="16" fill="#5c626e">not convert the recorded invoice.</text><rect x="34" y="2260" width="90" height="42" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="2287" font-size="15" fill="#1a5fd0">Cancel</text><rect x="34" y="2314" width="322" height="64" rx="8" fill="#1f6feb" stroke="#d6d9e0"/><text x="46" y="2342" font-size="16" fill="#ffffff" font-weight="700">Example only · no printing</text><text x="18" y="2432" font-size="14" fill="#5c626e">E is unapproved. B already lists every active printer at</text><text x="18" y="2456" font-size="14" fill="#5c626e">the sale venue. Both E proposals keep venues apart;</text><text x="18" y="2480" font-size="14" fill="#5c626e">that memory scope is proposed. Storage, update</text><text x="18" y="2504" font-size="14" fill="#5c626e">timing, fallback and portable receipt holding remain</text><text x="18" y="2528" font-size="14" fill="#5c626e">open. No phone Equipment change. Static drawings, no</text><text x="18" y="2552" font-size="14" fill="#5c626e">runtime or paper evidence.</text></g></svg>