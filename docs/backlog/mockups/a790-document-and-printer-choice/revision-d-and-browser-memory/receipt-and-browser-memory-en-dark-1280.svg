<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="2164" viewBox="0 0 1280 2164"><title>A790 · Receipt directly; dashboard memory next</title><rect width="1280" height="2164" fill="#101216"/><g font-family="Arial, sans-serif"><text x="40" y="32" font-size="21" fill="#eceef2" font-weight="700">A790 · Receipt directly; dashboard memory next</text><text x="40" y="60" font-size="14" fill="#78a9ff">D approved · E is one question · design only</text><text x="40" y="104" font-size="19" fill="#eceef2" font-weight="700">D · Agreed: open Receipt directly</text><rect x="40" y="136" width="1200" height="606" rx="8" fill="#22262e" stroke="#333945"/><text x="56" y="166" font-size="16" fill="#78a9ff" font-weight="700">Restaurante Olivo S.L.</text><text x="56" y="198" font-size="17" fill="#eceef2" font-weight="700">Simplified sale S/318 · €14.50 · Spanish · 1 guest</text><rect x="56" y="234" width="1168" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="260" font-size="16" fill="#eceef2" font-weight="700">Receipt · Simplified invoice</text><text x="68" y="286" font-size="15" fill="#a1a7b3">No document-choice step</text><rect x="56" y="334" width="1168" height="88" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="68" y="360" font-size="16" fill="#eceef2" font-weight="700">Receipt printer ▸ · Change</text><text x="68" y="386" font-size="15" fill="#a1a7b3">Patio receipt · current Equipment choice</text><rect x="56" y="434" width="1168" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="460" font-size="16" fill="#eceef2" font-weight="700">Expand in this same form</text><text x="68" y="486" font-size="15" fill="#a1a7b3">Bar receipt / Patio receipt</text><text x="56" y="542" font-size="16" fill="#a1a7b3">Keep the recorded sale, language choice and final named press. Selecting a printer or folding the row never prints. This is a device example; the dashboard follows</text><text x="56" y="566" font-size="16" fill="#a1a7b3">B.</text><rect x="56" y="604" width="90" height="42" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="631" font-size="15" fill="#78a9ff">Cancel</text><rect x="56" y="658" width="1168" height="64" rx="8" fill="#4c8dff" stroke="#333945"/><text x="68" y="686" font-size="16" fill="#06101f" font-weight="700">Print a copy on Patio receipt</text><text x="40" y="776" font-size="19" fill="#eceef2" font-weight="700">E · Recommended: remember separately</text><rect x="40" y="808" width="1200" height="606" rx="8" fill="#22262e" stroke="#333945"/><text x="56" y="838" font-size="16" fill="#78a9ff" font-weight="700">Restaurante Olivo S.L.</text><text x="56" y="870" font-size="17" fill="#eceef2" font-weight="700">Harbour F/1042 · dashboard without device profile</text><rect x="56" y="906" width="1168" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="932" font-size="16" fill="#eceef2" font-weight="700">Earlier: Receipt on Bar receipt</text><text x="68" y="958" font-size="15" fill="#a1a7b3">Then: Invoice on Office · A4</text><rect x="56" y="1006" width="1168" height="88" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="68" y="1032" font-size="16" fill="#eceef2" font-weight="700">Open Receipt again</text><text x="68" y="1058" font-size="15" fill="#a1a7b3">Bar receipt preselected</text><rect x="56" y="1106" width="1168" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="1132" font-size="16" fill="#eceef2" font-weight="700">Open Invoice again</text><text x="68" y="1158" font-size="15" fill="#a1a7b3">Office · A4 preselected</text><text x="56" y="1214" font-size="16" fill="#a1a7b3">Proposed: one remembered printer per sale venue and document on this browser. Switching invoice printer leaves the receipt choice alone. Only while each remains</text><text x="56" y="1238" font-size="16" fill="#a1a7b3">active at Harbour.</text><rect x="56" y="1276" width="90" height="42" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="1303" font-size="15" fill="#78a9ff">Cancel</text><rect x="56" y="1330" width="1168" height="64" rx="8" fill="#4c8dff" stroke="#333945"/><text x="68" y="1358" font-size="16" fill="#06101f" font-weight="700">Example only · no printing</text><text x="40" y="1448" font-size="19" fill="#eceef2" font-weight="700">E · Alternative: share one printer</text><rect x="40" y="1480" width="1200" height="582" rx="8" fill="#22262e" stroke="#333945"/><text x="56" y="1510" font-size="16" fill="#78a9ff" font-weight="700">Restaurante Olivo S.L.</text><text x="56" y="1542" font-size="17" fill="#eceef2" font-weight="700">The same Harbour F/1042 · the same two prints</text><rect x="56" y="1578" width="1168" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="1604" font-size="16" fill="#eceef2" font-weight="700">Receipt on Bar, then Invoice on Office</text><text x="68" y="1630" font-size="15" fill="#a1a7b3">Office becomes the shared remembered printer</text><rect x="56" y="1678" width="1168" height="88" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="68" y="1704" font-size="16" fill="#eceef2" font-weight="700">Open Receipt again</text><text x="68" y="1730" font-size="15" fill="#a1a7b3">Office · A4 preselected</text><rect x="56" y="1778" width="1168" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="1804" font-size="16" fill="#eceef2" font-weight="700">Open Invoice again</text><text x="68" y="1830" font-size="15" fill="#a1a7b3">Office · A4 preselected</text><text x="56" y="1886" font-size="16" fill="#a1a7b3">Proposed: one remembered printer per sale venue, shared by Receipt and Invoice. Office A4 is allowed by dashboard B; paper does not convert the recorded invoice.</text><rect x="56" y="1924" width="90" height="42" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="1951" font-size="15" fill="#78a9ff">Cancel</text><rect x="56" y="1978" width="1168" height="64" rx="8" fill="#4c8dff" stroke="#333945"/><text x="68" y="2006" font-size="16" fill="#06101f" font-weight="700">Example only · no printing</text><text x="40" y="2096" font-size="14" fill="#a1a7b3">E is unapproved. B already lists every active printer at the sale venue. Both E proposals keep venues apart; that memory scope is proposed. Storage, update timing, fallback and portable</text><text x="40" y="2120" font-size="14" fill="#a1a7b3">receipt holding remain open. No phone Equipment change. Static drawings, no runtime or paper evidence.</text></g></svg>