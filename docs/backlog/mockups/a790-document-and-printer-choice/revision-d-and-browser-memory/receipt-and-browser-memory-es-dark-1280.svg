<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="2116" viewBox="0 0 1280 2116"><title>A790 · Recibo directo; memoria del panel</title><rect width="1280" height="2116" fill="#101216"/><g font-family="Arial, sans-serif"><text x="40" y="32" font-size="21" fill="#eceef2" font-weight="700">A790 · Recibo directo; memoria del panel</text><text x="40" y="60" font-size="14" fill="#78a9ff">D aprobada · E es una pregunta · solo diseño</text><text x="40" y="104" font-size="19" fill="#eceef2" font-weight="700">D · Acordado: abrir Recibo directamente</text><rect x="40" y="136" width="1200" height="582" rx="8" fill="#22262e" stroke="#333945"/><text x="56" y="166" font-size="16" fill="#78a9ff" font-weight="700">Restaurante Olivo S.L.</text><text x="56" y="198" font-size="17" fill="#eceef2" font-weight="700">Venta simplificada S/318 · 14,50 € · Español · 1 comensal</text><rect x="56" y="234" width="1168" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="260" font-size="16" fill="#eceef2" font-weight="700">Recibo · Factura simplificada</text><text x="68" y="286" font-size="15" fill="#a1a7b3">Sin paso para elegir documento</text><rect x="56" y="334" width="1168" height="88" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="68" y="360" font-size="16" fill="#eceef2" font-weight="700">Impresora de recibos ▸ · Cambiar</text><text x="68" y="386" font-size="15" fill="#a1a7b3">Patio receipt · elección actual de Equipo</text><rect x="56" y="434" width="1168" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="460" font-size="16" fill="#eceef2" font-weight="700">Desplegar en este mismo formulario</text><text x="68" y="486" font-size="15" fill="#a1a7b3">Bar receipt / Patio receipt</text><text x="56" y="542" font-size="16" fill="#a1a7b3">Conserva la venta guardada, el idioma y el botón final con nombre. Elegir o plegar no imprime. Es un ejemplo en dispositivo; el panel sigue B.</text><rect x="56" y="580" width="90" height="42" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="607" font-size="15" fill="#78a9ff">Cancelar</text><rect x="56" y="634" width="1168" height="64" rx="8" fill="#4c8dff" stroke="#333945"/><text x="68" y="662" font-size="16" fill="#06101f" font-weight="700">Imprimir una copia en Patio receipt</text><text x="40" y="752" font-size="19" fill="#eceef2" font-weight="700">E · Recomendado: recordar por separado</text><rect x="40" y="784" width="1200" height="582" rx="8" fill="#22262e" stroke="#333945"/><text x="56" y="814" font-size="16" fill="#78a9ff" font-weight="700">Restaurante Olivo S.L.</text><text x="56" y="846" font-size="17" fill="#eceef2" font-weight="700">Harbour F/1042 · panel sin perfil de dispositivo</text><rect x="56" y="882" width="1168" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="908" font-size="16" fill="#eceef2" font-weight="700">Antes: Recibo en Bar receipt</text><text x="68" y="934" font-size="15" fill="#a1a7b3">Después: Factura en Office · A4</text><rect x="56" y="982" width="1168" height="88" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="68" y="1008" font-size="16" fill="#eceef2" font-weight="700">Abrir Recibo otra vez</text><text x="68" y="1034" font-size="15" fill="#a1a7b3">Bar receipt preseleccionada</text><rect x="56" y="1082" width="1168" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="1108" font-size="16" fill="#eceef2" font-weight="700">Abrir Factura otra vez</text><text x="68" y="1134" font-size="15" fill="#a1a7b3">Office · A4 preseleccionada</text><text x="56" y="1190" font-size="16" fill="#a1a7b3">Propuesta: una impresora por local de la venta y documento en este navegador. Cambiar la de facturas no cambia la de recibos. Solo si siguen activas en Harbour.</text><rect x="56" y="1228" width="90" height="42" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="1255" font-size="15" fill="#78a9ff">Cancelar</text><rect x="56" y="1282" width="1168" height="64" rx="8" fill="#4c8dff" stroke="#333945"/><text x="68" y="1310" font-size="16" fill="#06101f" font-weight="700">Solo ejemplo · no imprime</text><text x="40" y="1400" font-size="19" fill="#eceef2" font-weight="700">E · Alternativa: compartir impresora</text><rect x="40" y="1432" width="1200" height="582" rx="8" fill="#22262e" stroke="#333945"/><text x="56" y="1462" font-size="16" fill="#78a9ff" font-weight="700">Restaurante Olivo S.L.</text><text x="56" y="1494" font-size="17" fill="#eceef2" font-weight="700">La misma F/1042 de Harbour · las mismas impresiones</text><rect x="56" y="1530" width="1168" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="1556" font-size="16" fill="#eceef2" font-weight="700">Recibo en Bar; después Factura en Office</text><text x="68" y="1582" font-size="15" fill="#a1a7b3">Office queda como impresora compartida</text><rect x="56" y="1630" width="1168" height="88" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="68" y="1656" font-size="16" fill="#eceef2" font-weight="700">Abrir Recibo otra vez</text><text x="68" y="1682" font-size="15" fill="#a1a7b3">Office · A4 preseleccionada</text><rect x="56" y="1730" width="1168" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="1756" font-size="16" fill="#eceef2" font-weight="700">Abrir Factura otra vez</text><text x="68" y="1782" font-size="15" fill="#a1a7b3">Office · A4 preseleccionada</text><text x="56" y="1838" font-size="16" fill="#a1a7b3">Propuesta: una impresora por local de venta, compartida por Recibo y Factura. B permite Office A4 en el panel; el papel no convierte la factura guardada.</text><rect x="56" y="1876" width="90" height="42" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="1903" font-size="15" fill="#78a9ff">Cancelar</text><rect x="56" y="1930" width="1168" height="64" rx="8" fill="#4c8dff" stroke="#333945"/><text x="68" y="1958" font-size="16" fill="#06101f" font-weight="700">Solo ejemplo · no imprime</text><text x="40" y="2048" font-size="14" fill="#a1a7b3">E no está aprobada. B ya lista todas las impresoras activas del local de la venta. Ambas propuestas separan locales; ese alcance de memoria es propuesto. Almacenamiento, cuándo</text><text x="40" y="2072" font-size="14" fill="#a1a7b3">recordar, alternativas y portátiles siguen abiertos. No cambia Equipo del teléfono. Dibujos, sin pruebas del producto ni del papel.</text></g></svg>