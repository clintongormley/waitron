<svg xmlns="http://www.w3.org/2000/svg" width="390" height="2620" viewBox="0 0 390 2620"><title>A790 · Recibo directo; memoria del panel</title><rect width="390" height="2620" fill="#f7f7f8"/><g font-family="Arial, sans-serif"><text x="18" y="32" font-size="21" fill="#16181d" font-weight="700">A790 · Recibo directo; memoria</text><text x="18" y="56" font-size="21" fill="#16181d" font-weight="700">del panel</text><text x="18" y="84" font-size="14" fill="#1a5fd0">D aprobada · E es una pregunta · solo diseño</text><text x="18" y="128" font-size="19" fill="#16181d" font-weight="700">D · Acordado: abrir Recibo</text><text x="18" y="152" font-size="19" fill="#16181d" font-weight="700">directamente</text><rect x="18" y="184" width="354" height="678" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="34" y="214" font-size="16" fill="#1a5fd0" font-weight="700">Restaurante Olivo S.L.</text><text x="34" y="246" font-size="17" fill="#16181d" font-weight="700">Venta simplificada S/318 · 14,50 € ·</text><text x="34" y="270" font-size="17" fill="#16181d" font-weight="700">Español · 1 comensal</text><rect x="34" y="306" width="322" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="332" font-size="16" fill="#16181d" font-weight="700">Recibo · Factura simplificada</text><text x="46" y="358" font-size="15" fill="#5c626e">Sin paso para elegir documento</text><rect x="34" y="406" width="322" height="88" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="46" y="432" font-size="16" fill="#16181d" font-weight="700">Impresora de recibos ▸ · Cambiar</text><text x="46" y="458" font-size="15" fill="#5c626e">Patio receipt · elección actual de Equipo</text><rect x="34" y="506" width="322" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="532" font-size="16" fill="#16181d" font-weight="700">Desplegar en este mismo formulario</text><text x="46" y="558" font-size="15" fill="#5c626e">Bar receipt / Patio receipt</text><text x="34" y="614" font-size="16" fill="#5c626e">Conserva la venta guardada, el idioma y el</text><text x="34" y="638" font-size="16" fill="#5c626e">botón final con nombre. Elegir o plegar no</text><text x="34" y="662" font-size="16" fill="#5c626e">imprime. Es un ejemplo en dispositivo; el</text><text x="34" y="686" font-size="16" fill="#5c626e">panel sigue B.</text><rect x="34" y="724" width="90" height="42" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="751" font-size="15" fill="#1a5fd0">Cancelar</text><rect x="34" y="778" width="322" height="64" rx="8" fill="#1f6feb" stroke="#d6d9e0"/><text x="46" y="806" font-size="16" fill="#ffffff" font-weight="700">Imprimir una copia en Patio receipt</text><text x="18" y="896" font-size="19" fill="#16181d" font-weight="700">E · Recomendado: recordar por</text><text x="18" y="920" font-size="19" fill="#16181d" font-weight="700">separado</text><rect x="18" y="952" width="354" height="678" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="34" y="982" font-size="16" fill="#1a5fd0" font-weight="700">Restaurante Olivo S.L.</text><text x="34" y="1014" font-size="17" fill="#16181d" font-weight="700">Harbour F/1042 · panel sin perfil de</text><text x="34" y="1038" font-size="17" fill="#16181d" font-weight="700">dispositivo</text><rect x="34" y="1074" width="322" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="1100" font-size="16" fill="#16181d" font-weight="700">Antes: Recibo en Bar receipt</text><text x="46" y="1126" font-size="15" fill="#5c626e">Después: Factura en Office · A4</text><rect x="34" y="1174" width="322" height="88" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="46" y="1200" font-size="16" fill="#16181d" font-weight="700">Abrir Recibo otra vez</text><text x="46" y="1226" font-size="15" fill="#5c626e">Bar receipt preseleccionada</text><rect x="34" y="1274" width="322" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="1300" font-size="16" fill="#16181d" font-weight="700">Abrir Factura otra vez</text><text x="46" y="1326" font-size="15" fill="#5c626e">Office · A4 preseleccionada</text><text x="34" y="1382" font-size="16" fill="#5c626e">Propuesta: una impresora por local de la</text><text x="34" y="1406" font-size="16" fill="#5c626e">venta y documento en este navegador.</text><text x="34" y="1430" font-size="16" fill="#5c626e">Cambiar la de facturas no cambia la de</text><text x="34" y="1454" font-size="16" fill="#5c626e">recibos. Solo si siguen activas en Harbour.</text><rect x="34" y="1492" width="90" height="42" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="1519" font-size="15" fill="#1a5fd0">Cancelar</text><rect x="34" y="1546" width="322" height="64" rx="8" fill="#1f6feb" stroke="#d6d9e0"/><text x="46" y="1574" font-size="16" fill="#ffffff" font-weight="700">Solo ejemplo · no imprime</text><text x="18" y="1664" font-size="19" fill="#16181d" font-weight="700">E · Alternativa: compartir impresora</text><rect x="18" y="1696" width="354" height="702" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="34" y="1726" font-size="16" fill="#1a5fd0" font-weight="700">Restaurante Olivo S.L.</text><text x="34" y="1758" font-size="17" fill="#16181d" font-weight="700">La misma F/1042 de Harbour · las</text><text x="34" y="1782" font-size="17" fill="#16181d" font-weight="700">mismas impresiones</text><rect x="34" y="1818" width="322" height="112" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="1844" font-size="16" fill="#16181d" font-weight="700">Recibo en Bar; después Factura en</text><text x="46" y="1868" font-size="16" fill="#16181d" font-weight="700">Office</text><text x="46" y="1894" font-size="15" fill="#5c626e">Office queda como impresora compartida</text><rect x="34" y="1942" width="322" height="88" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="46" y="1968" font-size="16" fill="#16181d" font-weight="700">Abrir Recibo otra vez</text><text x="46" y="1994" font-size="15" fill="#5c626e">Office · A4 preseleccionada</text><rect x="34" y="2042" width="322" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="2068" font-size="16" fill="#16181d" font-weight="700">Abrir Factura otra vez</text><text x="46" y="2094" font-size="15" fill="#5c626e">Office · A4 preseleccionada</text><text x="34" y="2150" font-size="16" fill="#5c626e">Propuesta: una impresora por local de venta,</text><text x="34" y="2174" font-size="16" fill="#5c626e">compartida por Recibo y Factura. B permite</text><text x="34" y="2198" font-size="16" fill="#5c626e">Office A4 en el panel; el papel no convierte la</text><text x="34" y="2222" font-size="16" fill="#5c626e">factura guardada.</text><rect x="34" y="2260" width="90" height="42" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="2287" font-size="15" fill="#1a5fd0">Cancelar</text><rect x="34" y="2314" width="322" height="64" rx="8" fill="#1f6feb" stroke="#d6d9e0"/><text x="46" y="2342" font-size="16" fill="#ffffff" font-weight="700">Solo ejemplo · no imprime</text><text x="18" y="2432" font-size="14" fill="#5c626e">E no está aprobada. B ya lista todas las impresoras</text><text x="18" y="2456" font-size="14" fill="#5c626e">activas del local de la venta. Ambas propuestas</text><text x="18" y="2480" font-size="14" fill="#5c626e">separan locales; ese alcance de memoria es</text><text x="18" y="2504" font-size="14" fill="#5c626e">propuesto. Almacenamiento, cuándo recordar,</text><text x="18" y="2528" font-size="14" fill="#5c626e">alternativas y portátiles siguen abiertos. No cambia</text><text x="18" y="2552" font-size="14" fill="#5c626e">Equipo del teléfono. Dibujos, sin pruebas del producto</text><text x="18" y="2576" font-size="14" fill="#5c626e">ni del papel.</text></g></svg>