<svg xmlns="http://www.w3.org/2000/svg" width="390" height="2620" viewBox="0 0 390 2620"><title>A790 · Accepted print; one remaining printer</title><rect width="390" height="2620" fill="#101216"/><g font-family="Arial, sans-serif"><text x="18" y="32" font-size="21" fill="#eceef2" font-weight="700">A790 · Accepted print; one</text><text x="18" y="56" font-size="21" fill="#eceef2" font-weight="700">remaining printer</text><text x="18" y="84" font-size="14" fill="#78a9ff">F agreed · G is one question · design only</text><text x="18" y="128" font-size="19" fill="#eceef2" font-weight="700">F · Agreed: remember an accepted</text><text x="18" y="152" font-size="19" fill="#eceef2" font-weight="700">print</text><rect x="18" y="184" width="354" height="678" rx="8" fill="#22262e" stroke="#333945"/><text x="34" y="214" font-size="16" fill="#78a9ff" font-weight="700">Restaurante Olivo S.L.</text><text x="34" y="246" font-size="17" fill="#eceef2" font-weight="700">Harbour F/1042 · Receipt · this browser</text><rect x="34" y="282" width="322" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="308" font-size="16" fill="#eceef2" font-weight="700">Choose Patio, then Cancel</text><text x="46" y="334" font-size="15" fill="#a1a7b3">Bar receipt remains remembered</text><rect x="34" y="382" width="322" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="408" font-size="16" fill="#eceef2" font-weight="700">Server accepts Patio print request</text><text x="46" y="434" font-size="15" fill="#a1a7b3">Patio receipt is now remembered</text><rect x="34" y="482" width="322" height="88" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="46" y="508" font-size="16" fill="#eceef2" font-weight="700">Physical paper later fails</text><text x="46" y="534" font-size="15" fill="#a1a7b3">Patio remains remembered</text><text x="34" y="590" font-size="16" fill="#a1a7b3">A refusal leaves memory alone. Unknown</text><text x="34" y="614" font-size="16" fill="#a1a7b3">response: check the same request before</text><text x="34" y="638" font-size="16" fill="#a1a7b3">claiming acceptance or sending a fresh print.</text><text x="34" y="662" font-size="16" fill="#a1a7b3">Invoice and Hillside memories stay separate.</text><text x="34" y="686" font-size="16" fill="#a1a7b3">Selection alone never prints.</text><rect x="34" y="724" width="90" height="42" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="751" font-size="15" fill="#78a9ff">Cancel</text><rect x="34" y="778" width="322" height="64" rx="8" fill="#4c8dff" stroke="#333945"/><text x="46" y="806" font-size="16" fill="#06101f" font-weight="700">Example only · no printing</text><text x="18" y="896" font-size="19" fill="#eceef2" font-weight="700">G · Recommended: suggest the sole</text><text x="18" y="920" font-size="19" fill="#eceef2" font-weight="700">printer</text><rect x="18" y="952" width="354" height="702" rx="8" fill="#22262e" stroke="#333945"/><text x="34" y="982" font-size="16" fill="#78a9ff" font-weight="700">Restaurante Olivo S.L.</text><text x="34" y="1014" font-size="17" fill="#eceef2" font-weight="700">Newly opened form · Bar receipt</text><text x="34" y="1038" font-size="17" fill="#eceef2" font-weight="700">disabled</text><rect x="34" y="1074" width="322" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="1100" font-size="16" fill="#eceef2" font-weight="700">Remembered printer unavailable</text><text x="46" y="1126" font-size="15" fill="#a1a7b3">Bar receipt is disabled</text><rect x="34" y="1174" width="322" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="1200" font-size="16" fill="#eceef2" font-weight="700">Only eligible printer · preselected</text><text x="46" y="1226" font-size="15" fill="#a1a7b3">Patio receipt</text><rect x="34" y="1274" width="322" height="88" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="46" y="1300" font-size="16" fill="#eceef2" font-weight="700">Named final confirmation still required</text><text x="46" y="1326" font-size="15" fill="#a1a7b3">Print a copy on Patio receipt</text><text x="34" y="1382" font-size="16" fill="#a1a7b3">Proposal: on first use or unusable memory,</text><text x="34" y="1406" font-size="16" fill="#a1a7b3">preselect the sole eligible printer only when</text><text x="34" y="1430" font-size="16" fill="#a1a7b3">opening the form. Several options: ask you to</text><text x="34" y="1454" font-size="16" fill="#a1a7b3">choose. Zero: explain and offer Retry. A</text><text x="34" y="1478" font-size="16" fill="#a1a7b3">suggestion does not change memory.</text><rect x="34" y="1516" width="90" height="42" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="1543" font-size="15" fill="#78a9ff">Cancel</text><rect x="34" y="1570" width="322" height="64" rx="8" fill="#4c8dff" stroke="#333945"/><text x="46" y="1598" font-size="16" fill="#06101f" font-weight="700">Example only · no printing</text><text x="18" y="1688" font-size="19" fill="#eceef2" font-weight="700">G · Alternative: always choose</text><text x="18" y="1712" font-size="19" fill="#eceef2" font-weight="700">explicitly</text><rect x="18" y="1744" width="354" height="702" rx="8" fill="#22262e" stroke="#333945"/><text x="34" y="1774" font-size="16" fill="#78a9ff" font-weight="700">Restaurante Olivo S.L.</text><text x="34" y="1806" font-size="17" fill="#eceef2" font-weight="700">Same newly opened form · only Patio</text><text x="34" y="1830" font-size="17" fill="#eceef2" font-weight="700">eligible</text><rect x="34" y="1866" width="322" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="1892" font-size="16" fill="#eceef2" font-weight="700">Remembered printer unavailable</text><text x="46" y="1918" font-size="15" fill="#a1a7b3">Bar receipt is disabled</text><rect x="34" y="1966" width="322" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="1992" font-size="16" fill="#eceef2" font-weight="700">Printer choice starts empty</text><text x="46" y="2018" font-size="15" fill="#a1a7b3">Choose Patio receipt</text><rect x="34" y="2066" width="322" height="88" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="46" y="2092" font-size="16" fill="#eceef2" font-weight="700">Then confirm the named print</text><text x="46" y="2118" font-size="15" fill="#a1a7b3">Print a copy on Patio receipt</text><text x="34" y="2174" font-size="16" fill="#a1a7b3">This adds a selection even when there is one</text><text x="34" y="2198" font-size="16" fill="#a1a7b3">printer. G never replaces a selection mid-form</text><text x="34" y="2222" font-size="16" fill="#a1a7b3">or reroutes a submitted request. Printer</text><text x="34" y="2246" font-size="16" fill="#a1a7b3">eligibility must be rechecked. Full design and</text><text x="34" y="2270" font-size="16" fill="#a1a7b3">build remain unapproved.</text><rect x="34" y="2308" width="90" height="42" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="2335" font-size="15" fill="#78a9ff">Cancel</text><rect x="34" y="2362" width="322" height="64" rx="8" fill="#4c8dff" stroke="#333945"/><text x="46" y="2390" font-size="16" fill="#06101f" font-weight="700">Example only · no printing</text><text x="18" y="2480" font-size="14" fill="#a1a7b3">Dashboard only. Memory storage, expiry, login sharing,</text><text x="18" y="2504" font-size="14" fill="#a1a7b3">concurrent requests, device Invoice memory and</text><text x="18" y="2528" font-size="14" fill="#a1a7b3">portable receipt holding remain open. Phone Equipment</text><text x="18" y="2552" font-size="14" fill="#a1a7b3">follows A796. Static drawings, no runtime or paper</text><text x="18" y="2576" font-size="14" fill="#a1a7b3">evidence.</text></g></svg>