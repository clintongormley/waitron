<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="2188" viewBox="0 0 1280 2188"><title>A790 · Accepted print; one remaining printer</title><rect width="1280" height="2188" fill="#f7f7f8"/><g font-family="Arial, sans-serif"><text x="40" y="32" font-size="21" fill="#16181d" font-weight="700">A790 · Accepted print; one remaining printer</text><text x="40" y="60" font-size="14" fill="#1a5fd0">F agreed · G is one question · design only</text><text x="40" y="104" font-size="19" fill="#16181d" font-weight="700">F · Agreed: remember an accepted print</text><rect x="40" y="136" width="1200" height="606" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="56" y="166" font-size="16" fill="#1a5fd0" font-weight="700">Restaurante Olivo S.L.</text><text x="56" y="198" font-size="17" fill="#16181d" font-weight="700">Harbour F/1042 · Receipt · this browser</text><rect x="56" y="234" width="1168" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="68" y="260" font-size="16" fill="#16181d" font-weight="700">Choose Patio, then Cancel</text><text x="68" y="286" font-size="15" fill="#5c626e">Bar receipt remains remembered</text><rect x="56" y="334" width="1168" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="68" y="360" font-size="16" fill="#16181d" font-weight="700">Server accepts Patio print request</text><text x="68" y="386" font-size="15" fill="#5c626e">Patio receipt is now remembered</text><rect x="56" y="434" width="1168" height="88" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="68" y="460" font-size="16" fill="#16181d" font-weight="700">Physical paper later fails</text><text x="68" y="486" font-size="15" fill="#5c626e">Patio remains remembered</text><text x="56" y="542" font-size="16" fill="#5c626e">A refusal leaves memory alone. Unknown response: check the same request before claiming acceptance or sending a fresh print. Invoice and Hillside memories stay</text><text x="56" y="566" font-size="16" fill="#5c626e">separate. Selection alone never prints.</text><rect x="56" y="604" width="90" height="42" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="68" y="631" font-size="15" fill="#1a5fd0">Cancel</text><rect x="56" y="658" width="1168" height="64" rx="8" fill="#1f6feb" stroke="#d6d9e0"/><text x="68" y="686" font-size="16" fill="#ffffff" font-weight="700">Example only · no printing</text><text x="40" y="776" font-size="19" fill="#16181d" font-weight="700">G · Recommended: suggest the sole printer</text><rect x="40" y="808" width="1200" height="606" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="56" y="838" font-size="16" fill="#1a5fd0" font-weight="700">Restaurante Olivo S.L.</text><text x="56" y="870" font-size="17" fill="#16181d" font-weight="700">Newly opened form · Bar receipt disabled</text><rect x="56" y="906" width="1168" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="68" y="932" font-size="16" fill="#16181d" font-weight="700">Remembered printer unavailable</text><text x="68" y="958" font-size="15" fill="#5c626e">Bar receipt is disabled</text><rect x="56" y="1006" width="1168" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="68" y="1032" font-size="16" fill="#16181d" font-weight="700">Only eligible printer · preselected</text><text x="68" y="1058" font-size="15" fill="#5c626e">Patio receipt</text><rect x="56" y="1106" width="1168" height="88" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="68" y="1132" font-size="16" fill="#16181d" font-weight="700">Named final confirmation still required</text><text x="68" y="1158" font-size="15" fill="#5c626e">Print a copy on Patio receipt</text><text x="56" y="1214" font-size="16" fill="#5c626e">Proposal: on first use or unusable memory, preselect the sole eligible printer only when opening the form. Several options: ask you to choose. Zero: explain and offer</text><text x="56" y="1238" font-size="16" fill="#5c626e">Retry. A suggestion does not change memory.</text><rect x="56" y="1276" width="90" height="42" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="68" y="1303" font-size="15" fill="#1a5fd0">Cancel</text><rect x="56" y="1330" width="1168" height="64" rx="8" fill="#1f6feb" stroke="#d6d9e0"/><text x="68" y="1358" font-size="16" fill="#ffffff" font-weight="700">Example only · no printing</text><text x="40" y="1448" font-size="19" fill="#16181d" font-weight="700">G · Alternative: always choose explicitly</text><rect x="40" y="1480" width="1200" height="606" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="56" y="1510" font-size="16" fill="#1a5fd0" font-weight="700">Restaurante Olivo S.L.</text><text x="56" y="1542" font-size="17" fill="#16181d" font-weight="700">Same newly opened form · only Patio eligible</text><rect x="56" y="1578" width="1168" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="68" y="1604" font-size="16" fill="#16181d" font-weight="700">Remembered printer unavailable</text><text x="68" y="1630" font-size="15" fill="#5c626e">Bar receipt is disabled</text><rect x="56" y="1678" width="1168" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="68" y="1704" font-size="16" fill="#16181d" font-weight="700">Printer choice starts empty</text><text x="68" y="1730" font-size="15" fill="#5c626e">Choose Patio receipt</text><rect x="56" y="1778" width="1168" height="88" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="68" y="1804" font-size="16" fill="#16181d" font-weight="700">Then confirm the named print</text><text x="68" y="1830" font-size="15" fill="#5c626e">Print a copy on Patio receipt</text><text x="56" y="1886" font-size="16" fill="#5c626e">This adds a selection even when there is one printer. G never replaces a selection mid-form or reroutes a submitted request. Printer eligibility must be rechecked. Full</text><text x="56" y="1910" font-size="16" fill="#5c626e">design and build remain unapproved.</text><rect x="56" y="1948" width="90" height="42" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="68" y="1975" font-size="15" fill="#1a5fd0">Cancel</text><rect x="56" y="2002" width="1168" height="64" rx="8" fill="#1f6feb" stroke="#d6d9e0"/><text x="68" y="2030" font-size="16" fill="#ffffff" font-weight="700">Example only · no printing</text><text x="40" y="2120" font-size="14" fill="#5c626e">Dashboard only. Memory storage, expiry, login sharing, concurrent requests, device Invoice memory and portable receipt holding remain open. Phone Equipment follows A796. Static</text><text x="40" y="2144" font-size="14" fill="#5c626e">drawings, no runtime or paper evidence.</text></g></svg>