<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="840" viewBox="0 0 1280 840">
  <title>A790: agreed explicit choice and proposed no-printer options, English light desktop</title>
  <desc>J agreed: choose a printer before named confirmation. K unapproved: keep the empty form with explicit refresh or explain on return to sale. Static design only.</desc>
  <style>
    svg{background:#f7f7f8} text{font-family:Arial,Helvetica,sans-serif;fill:#16181d;font-size:16px}
    .bg{fill:#f7f7f8}.card{fill:#ffffff;stroke:#d6d9e0}.field{fill:#f0f1f4;stroke:#7d8390}.line{stroke:#d6d9e0}
    .quiet{fill:#f7f7f8;stroke:#d6d9e0}.primary{fill:#1f6feb}.on{fill:#ffffff}.muted{fill:#5c626e}
    .note{font-size:14px;fill:#5c626e}.tag{font-size:12px;font-weight:700;letter-spacing:1px}.agreed{fill:#1a7f5a}.proposal{fill:#8a5300}
    .heading{font-size:36px;font-weight:700}.bold{font-weight:700}.small{font-size:14px}.center{text-anchor:middle}
  </style>
  <rect class="bg" width="1280" height="840"/>
  <text x="24" y="31" class="tag muted">A790 · 19 OCTOBER 2026 · DEVICE-FREE DASHBOARD · STATIC DESIGN</text>
  <text x="24" y="80" class="heading">Choose deliberately. Confirm the destination.</text>
  <text x="24" y="112" class="note">Cards show UI snapshots. Notes outside explain the design. J is agreed; both K alternatives await the owner.</text>
  <line x1="24" y1="138" x2="1256" y2="138" class="line"/>
  <text x="24" y="173" class="tag agreed">J AGREED · SEVERAL ELIGIBLE PRINTERS</text>
  <rect x="24" y="194" width="392" height="278" rx="16" class="card"/>
  <text x="44" y="226" class="bold">Receipt · Harbour · F/1042</text>
  <text x="44" y="251" class="small muted">Mar Azul SL · €86.40</text>
  <text x="44" y="282" class="small muted">Previous printer Bar receipt is unavailable.</text>
  <text x="44" y="312" class="small bold">Printer *</text>
  <rect x="44" y="323" width="352" height="42" rx="7" class="field"/>
  <text x="58" y="350" class="muted">Choose a printer</text><text x="373" y="350">⌄</text>
  <circle cx="53" cy="386" r="6" fill="none" class="line"/><text x="70" y="391">Office · A4</text>
  <circle cx="53" cy="411" r="6" fill="none" class="line"/><text x="70" y="416">Patio receipt</text>
  <rect x="44" y="429" width="112" height="30" rx="6" class="quiet"/><text x="100" y="450" class="center small">Cancel</text>
  <rect x="284" y="429" width="112" height="30" rx="6" class="quiet"/><text x="340" y="450" class="center small muted">Print</text>
  <text x="24" y="495" class="note">Quiet, disabled Print. Office is first by name, unselected.</text>
  <rect x="24" y="514" width="392" height="173" rx="16" class="card"/>
  <text x="44" y="545" class="bold">Receipt · F/1042</text>
  <text x="44" y="578">Printer · Patio receipt</text><text x="373" y="578" class="muted">⌄</text>
  <rect x="44" y="617" width="100" height="44" rx="8" class="quiet"/><text x="94" y="645" class="center small">Cancel</text>
  <rect x="156" y="597" width="240" height="70" rx="8" class="primary"/>
  <text x="276" y="625" class="center on bold"><tspan x="276">Print a copy on</tspan><tspan x="276" dy="21">Patio receipt</tspan></text>
  <text x="24" y="712" class="note">Luis selects Patio. “Copy” is server-designated.</text>
  <text x="444" y="173" class="tag proposal">K UNAPPROVED · KEEP OPEN / RECOMMENDED</text>
  <rect x="444" y="194" width="392" height="350" rx="16" class="card"/>
  <text x="464" y="226" class="bold">Receipt · Harbour · F/1042</text>
  <text x="464" y="251" class="small muted">Mar Azul SL · €86.40</text>
  <text x="464" y="311" class="bold"><tspan x="464">No printers available</tspan><tspan x="464" dy="25">for this document</tspan></text>
  <rect x="464" y="370" width="352" height="46" rx="8" class="card"/>
  <text x="640" y="399" class="center bold">Refresh printers</text>
  <line x1="464" y1="449" x2="816" y2="449" class="line"/>
  <rect x="464" y="476" width="160" height="44" rx="8" class="quiet"/><text x="544" y="504" class="center">Cancel</text>
  <rect x="640" y="476" width="176" height="44" rx="8" class="quiet"/><text x="728" y="504" class="center muted">Print</text>
  <text x="444" y="576" class="note"><tspan x="444">Successful empty offers read. No prior submission.</tspan><tspan x="444" dy="23">Keep the document context while an administrator</tspan><tspan x="444" dy="23">restores a printer. Refresh explicitly reads offers;</tspan><tspan x="444" dy="23">it never prints or polls automatically.</tspan></text>
  <text x="444" y="688" class="note"><tspan x="444">If Bar alone returns: explicitly choose, then confirm.</tspan><tspan x="444" dy="23">G's sole-printer rule does not select mid-form.</tspan></text>
  <text x="864" y="173" class="tag proposal">K UNAPPROVED · RETURN / ALTERNATIVE</text>
  <rect x="864" y="194" width="392" height="278" rx="16" class="card"/>
  <text x="884" y="226" class="bold">Sale · Harbour · F/1042</text>
  <text x="884" y="251" class="small muted">Mar Azul SL · €86.40</text>
  <text x="884" y="311"><tspan x="884">No printers available</tspan><tspan x="884" dy="25">for this document</tspan></text>
  <text x="884" y="436" class="small muted">Return</text>
  <rect x="1002" y="408" width="234" height="44" rx="8" class="card"/><text x="1119" y="436" class="center bold">Print/reprint</text>
  <text x="864" y="507" class="note"><tspan x="864">Explain on the sale after closing the print form.</tspan><tspan x="864" dy="23">Reopen Print/reprint once a printer is restored.</tspan><tspan x="864" dy="23">Both options offer Cancel/return, print nothing</tspan><tspan x="864" dy="23">and preserve the remembered choice.</tspan></text>
  <text x="864" y="630" class="note"><tspan x="864">UI names no inaccessible printers. No fallback to</tspan><tspan x="864" dy="23">another venue, profile, email or invoice conversion.</tspan><tspan x="864" dy="23">No Settings permission is required as a fallback.</tspan></text>
  <rect x="24" y="745" width="1232" height="71" rx="12" class="card"/>
  <text x="44" y="772" class="tag muted">BOUNDARIES · FULL DESIGN / PLAN / BUILD UNAPPROVED</text>
  <text x="44" y="797" class="note">Loading/read failure ≠ empty offers. Unanswered prints reconcile the same identity first. Selection saves nothing; acceptance remembers, without proving paper.</text>
</svg>
