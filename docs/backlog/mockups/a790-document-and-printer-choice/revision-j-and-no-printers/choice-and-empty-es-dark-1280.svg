<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="840" viewBox="0 0 1280 840">
  <title>A790: elección explícita acordada y opciones sin impresoras propuestas, escritorio oscuro</title>
  <desc>J acordado: elegir antes de confirmar la impresora por nombre. K sin aprobar: mantener el formulario vacío con actualización explícita o explicar al volver a la venta. Solo diseño estático.</desc>
  <style>
    svg{background:#101216} text{font-family:Arial,Helvetica,sans-serif;fill:#eceef2;font-size:16px}
    .bg{fill:#101216}.card{fill:#191c22;stroke:#333945}.field{fill:#262a33;stroke:#7a8291}.line{stroke:#333945}
    .quiet{fill:#101216;stroke:#333945}.primary{fill:#4c8dff}.on{fill:#06101f}.muted{fill:#a1a7b3}
    .note{font-size:14px;fill:#a1a7b3}.tag{font-size:12px;font-weight:700;letter-spacing:1px}.agreed{fill:#4ac08d}.proposal{fill:#f2b24c}
    .heading{font-size:36px;font-weight:700}.bold{font-weight:700}.small{font-size:14px}.center{text-anchor:middle}
  </style>
  <rect class="bg" width="1280" height="840"/>
  <text x="24" y="31" class="tag muted">A790 · 19 OCTUBRE 2026 · PANEL SIN PERFIL DE DISPOSITIVO · DISEÑO ESTÁTICO</text>
  <text x="24" y="80" class="heading">Elige la impresora. Confirma el destino.</text>
  <text x="24" y="112" class="note">Tarjetas: interfaz. Fuera: notas del autor. J está acordado; las dos alternativas de K esperan la decisión del propietario.</text>
  <line x1="24" y1="138" x2="1256" y2="138" class="line"/>
  <text x="24" y="173" class="tag agreed">J ACORDADO · VARIAS IMPRESORAS VÁLIDAS</text>
  <rect x="24" y="194" width="392" height="278" rx="16" class="card"/>
  <text x="44" y="226" class="bold">Recibo · Harbour · F/1042</text>
  <text x="44" y="251" class="small muted">Mar Azul SL · 86,40 €</text>
  <text x="44" y="282" class="small muted">La anterior, Bar receipt, no está disponible.</text>
  <text x="44" y="312" class="small bold">Impresora *</text>
  <rect x="44" y="323" width="352" height="42" rx="7" class="field"/>
  <text x="58" y="350" class="muted">Elige una impresora</text><text x="373" y="350">⌄</text>
  <circle cx="53" cy="386" r="6" fill="none" class="line"/><text x="70" y="391">Office · A4</text>
  <circle cx="53" cy="411" r="6" fill="none" class="line"/><text x="70" y="416">Patio receipt</text>
  <rect x="44" y="429" width="112" height="30" rx="6" class="quiet"/><text x="100" y="450" class="center small">Cancelar</text>
  <rect x="284" y="429" width="112" height="30" rx="6" class="quiet"/><text x="340" y="450" class="center small muted">Imprimir</text>
  <text x="24" y="495" class="note">Imprimir desactivado. Office va primero, sin elegir.</text>
  <rect x="24" y="514" width="392" height="173" rx="16" class="card"/>
  <text x="44" y="545" class="bold">Recibo · F/1042</text>
  <text x="44" y="578">Impresora · Patio receipt</text><text x="373" y="578" class="muted">⌄</text>
  <rect x="44" y="617" width="100" height="44" rx="8" class="quiet"/><text x="94" y="645" class="center small">Cancelar</text>
  <rect x="156" y="597" width="240" height="70" rx="8" class="primary"/>
  <text x="276" y="625" class="center on bold"><tspan x="276">Imprimir una copia en</tspan><tspan x="276" dy="21">Patio receipt</tspan></text>
  <text x="24" y="712" class="note">Luis elige Patio. El servidor designa la copia.</text>
  <text x="444" y="173" class="tag proposal">K SIN APROBAR · ABIERTO / RECOMENDADO</text>
  <rect x="444" y="194" width="392" height="350" rx="16" class="card"/>
  <text x="464" y="226" class="bold">Recibo · Harbour · F/1042</text>
  <text x="464" y="251" class="small muted">Mar Azul SL · 86,40 €</text>
  <text x="464" y="311" class="bold"><tspan x="464">No hay impresoras disponibles</tspan><tspan x="464" dy="25">para este documento</tspan></text>
  <rect x="464" y="370" width="352" height="46" rx="8" class="card"/>
  <text x="640" y="399" class="center bold">Actualizar impresoras</text>
  <line x1="464" y1="449" x2="816" y2="449" class="line"/>
  <rect x="464" y="476" width="160" height="44" rx="8" class="quiet"/><text x="544" y="504" class="center">Cancelar</text>
  <rect x="640" y="476" width="176" height="44" rx="8" class="quiet"/><text x="728" y="504" class="center muted">Imprimir</text>
  <text x="444" y="576" class="note"><tspan x="444">Lectura correcta y vacía. Ningún envío previo.</tspan><tspan x="444" dy="23">Conserva el contexto mientras un administrador</tspan><tspan x="444" dy="23">restaura una impresora. Actualizar solo lee;</tspan><tspan x="444" dy="23">no imprime ni consulta automáticamente.</tspan></text>
  <text x="444" y="688" class="note"><tspan x="444">Si vuelve solo Bar: elígela y después confirma.</tspan><tspan x="444" dy="23">G no selecciona impresoras con el formulario abierto.</tspan></text>
  <text x="864" y="173" class="tag proposal">K SIN APROBAR · VOLVER / ALTERNATIVA</text>
  <rect x="864" y="194" width="392" height="278" rx="16" class="card"/>
  <text x="884" y="226" class="bold">Venta · Harbour · F/1042</text>
  <text x="884" y="251" class="small muted">Mar Azul SL · 86,40 €</text>
  <text x="884" y="311"><tspan x="884">No hay impresoras disponibles</tspan><tspan x="884" dy="25">para este documento</tspan></text>
  <text x="884" y="436" class="small muted">Volver</text>
  <rect x="1002" y="408" width="234" height="44" rx="8" class="card"/><text x="1119" y="436" class="center bold">Imprimir/reimprimir</text>
  <text x="864" y="507" class="note"><tspan x="864">Cierra el formulario y explica el motivo en la venta.</tspan><tspan x="864" dy="23">Reabre Imprimir/reimprimir tras la restauración.</tspan><tspan x="864" dy="23">Ambas opciones permiten cancelar o volver,</tspan><tspan x="864" dy="23">no imprimen y conservan la elección recordada.</tspan></text>
  <text x="864" y="630" class="note"><tspan x="864">No revela impresoras inaccesibles ni cambia de local</tspan><tspan x="864" dy="23">o perfil. No añade correo ni conversión a factura,</tspan><tspan x="864" dy="23">ni exige permiso de Ajustes como alternativa.</tspan></text>
  <rect x="24" y="745" width="1232" height="71" rx="12" class="card"/>
  <text x="44" y="772" class="tag muted">LÍMITES · DISEÑO COMPLETO / PLAN / DESARROLLO SIN APROBAR</text>
  <text x="44" y="797" class="note">Cargando o lectura fallida ≠ lista vacía. Un envío sin respuesta se concilia con su misma identidad. Elegir no guarda; aceptar recuerda, sin demostrar papel.</text>
</svg>
