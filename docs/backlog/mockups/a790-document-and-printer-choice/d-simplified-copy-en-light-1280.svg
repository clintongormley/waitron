<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="582" viewBox="0 0 1280 582"><title>A790 d-simplified-copy en light</title><rect width="1280" height="582" fill="#f7f7f8"/><g font-family="Arial, sans-serif"><text x="40" y="25" fill="#1a5fd0" font-size="13">PROPOSAL · awaiting owner agreement</text><g transform="translate(0 -1967)"><text x="40" y="2040" fill="#16181d" font-size="22" font-weight="700">04 · A simplified sale</text><rect x="40" y="2070" width="1200" height="434" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="58" y="2102" fill="#1a5fd0" font-size="17" font-weight="700">Restaurante Olivo S.L.</text><text x="58" y="2138" fill="#16181d" font-size="17" font-weight="700">Receipt S/318 · €14.50 · Spanish · 1 guest</text><text x="58" y="2170" fill="#16181d" font-size="19" font-weight="700">Recommended: Receipt only</text><text x="58" y="2204" fill="#16181d" font-size="16" font-weight="700">Receipt: Same stored sale, number and amounts</text><rect x="58" y="2242" width="1164" height="94" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="70" y="2270" fill="#1a5fd0" font-size="16">●</text><text x="96" y="2270" fill="#16181d" font-size="17" font-weight="700">Patio receipt</text><text x="96" y="2298" fill="#5c626e" font-size="15">Selected · Bar receipt also offered</text><text x="58" y="2360" fill="#5c626e" font-size="16">Skip the one-document step. With one eligible printer, show its name and keep the final Print press. Zero printers: explain why, with no print action. Keeping every</text><text x="58" y="2384" fill="#5c626e" font-size="16">picker is the extra-tap alternative.</text><rect x="58" y="2428" width="80" height="44" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="70" y="2456" fill="#1a5fd0" font-size="16">Cancel</text><rect x="862" y="2428" width="360" height="52" rx="8" fill="#1f6feb" stroke="#d6d9e0"/><text x="874" y="2460" fill="#ffffff" font-size="16">Print a copy on Patio receipt</text></g></g></svg>