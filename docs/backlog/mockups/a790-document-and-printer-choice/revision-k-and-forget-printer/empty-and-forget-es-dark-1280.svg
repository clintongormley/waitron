<text x="640.0" y="309.0" fill="#eceef2" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Olvidar impresora guardada</text>
<text x="458" y="347" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start">Harbour · Recibo · Este navegador</text>
<text x="458" y="365" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start">Compartido entre quienes inician sesión.</text>
<text x="442" y="406" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start">2 · Tras Olvidar: vuelve a elegir</text>
<rect x="442" y="420" width="396" height="190" rx="12" fill="#191c22" stroke="#333945"/>
