<text x="458" y="271" fill="#eceef2" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" text-anchor="start">Impresora · Patio receipt</text>
<text x="816" y="271" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="end">⌄</text>
