<rect x="458" y="560" width="86" height="38" rx="8" fill="#191c22" stroke="#333945"/>
<text x="501.0" y="584.0" fill="#eceef2" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Cancelar</text>
<rect x="722" y="560" width="100" height="38" rx="8" fill="#1f2229" stroke="#333945"/>
<text x="772.0" y="584.0" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Imprimir</text>
<text x="442" y="634" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400"><tspan x="442" dy="0">Solo borra Harbour/Recibo entre sesiones</tspan><tspan x="442" dy="20">y la selección de este formulario abierto.</tspan><tspan x="442" dy="20">G no elige a mitad del formulario. Al abrir</tspan><tspan x="442" dy="20">uno nuevo con dos opciones, se aplica J.</tspan></text>
<text x="442" y="732" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start">3 · Luis elige Bar y luego confirma</text>
<rect x="442" y="746" width="396" height="68" rx="12" fill="#191c22" stroke="#333945"/>
<path d="M458 753h364" stroke="#333945"/>
<rect x="458" y="763" width="86" height="38" rx="8" fill="#191c22" stroke="#333945"/>
<text x="501.0" y="787.0" fill="#eceef2" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Cancelar</text>
<rect x="598" y="763" width="224" height="38" rx="8" fill="#4c8dff"/>
<text x="710.0" y="779.0" fill="#06101f" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Imprimir una copia en</text>
<text x="710.0" y="794.0" fill="#06101f" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Bar receipt</text>
<text x="442" y="840" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start">Solo la aceptación del servidor recuerda Bar.</text>
<text x="860" y="205" fill="#f2b24c" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="start">L · PROPUESTO · Sin botón para olvidar</text>
<rect x="860" y="220" width="396" height="158" rx="12" fill="#191c22" stroke="#333945"/>
<text x="876" y="247" fill="#eceef2" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start">Recibo · F/1042</text>
<text x="1240" y="247" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" text-anchor="end">UI</text>
<text x="876" y="269" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start">Harbour · Español</text>
<text x="876" y="294" fill="#eceef2" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" text-anchor="start">Impresora · Patio receipt</text>
<text x="1234" y="294" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="end">⌄</text>
<path d="M876 314h364" stroke="#333945"/>
<rect x="876" y="324" width="86" height="38" rx="8" fill="#191c22" stroke="#333945"/>
<text x="919.0" y="348.0" fill="#eceef2" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Cancelar</text>
<rect x="1016" y="324" width="224" height="38" rx="8" fill="#4c8dff"/>
<text x="1128.0" y="340.0" fill="#06101f" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Imprimir una copia en</text>
<text x="1128.0" y="355.0" fill="#06101f" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Patio receipt</text>
<text x="860" y="408" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400"><tspan x="860" dy="0">Patio sigue hasta otro envío aceptado</tspan><tspan x="860" dy="23">o hasta borrar los datos del sitio (I).</tspan><tspan x="860" dy="23">Aquí no hay un botón para olvidar.</tspan><tspan x="860" dy="23">El borrado de datos queda fuera del formulario;</tspan><tspan x="860" dy="23">no se afirma qué otros datos contiene.</tspan></text>
<text x="860" y="562" fill="#f2b24c" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="start">AMBAS ALTERNATIVAS L</text>
<text x="860" y="591" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400"><tspan x="860" dy="0">Mantienen opciones y permisos actuales.</tspan><tspan x="860" dy="22">No imprimen ni cancelan envíos por sí solas.</tspan><tspan x="860" dy="22">Preferencia compartida de este navegador.</tspan><tspan x="860" dy="22">No borran ni desactivan ni reconfiguran una</tspan><tspan x="860" dy="22">impresora; no cambian Equipo ni piden ser admin.</tspan></text>
<text x="24" y="652" fill="#f2b24c" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="start">SIGUE ABIERTO</text>
<text x="24" y="682" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400"><tspan x="24" dy="0">Almacenamiento, caducidad, errores, modo privado;</tspan><tspan x="24" dy="23">envíos simultáneos/tardíos e integración.</tspan><tspan x="24" dy="23">L exige que no haya envíos sin respuesta.</tspan><tspan x="24" dy="23">Conserva su identidad y comprueba el resultado.</tspan></text>
<path d="M24 879h1232" stroke="#333945"/>
<text x="24" y="905" fill="#f2b24c" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" text-anchor="start">L excluye solicitudes enviadas sin respuesta.</text>
<text x="1256" y="905" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="end">Diseño estático · Diseño/plan/desarrollo sin aprobar.</text>
</svg>
