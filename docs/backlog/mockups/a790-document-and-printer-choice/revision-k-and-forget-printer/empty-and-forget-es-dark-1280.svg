<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="940" viewBox="0 0 1280 940" role="img" aria-labelledby="title desc">
<title id="title">Lista vacía. Preferencia guardada. — ES, dark, 1280</title>
<desc id="desc">Static design: agreed K empty form, proposed L targeted Forget with explicit choice and named confirmation, and proposed L alternative retaining Patio. No runtime implementation or rendering evidence.</desc>
<rect x="0" y="0" width="1280" height="940" rx="0" fill="#101216"/>
<text x="24" y="42" fill="#eceef2" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" text-anchor="start">A790 / Lista vacía y una preferencia guardada</text>
<text x="24" y="70" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">K acordado · Solo L propuesto · Panel sin dispositivo · 19 de octubre de 2026</text>
<path d="M24 88h1232" stroke="#333945"/>
<text x="24" y="115" fill="#eceef2" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" text-anchor="start">Ejemplo L: el mismo navegador normal compartido; todos los envíos tienen un resultado conocido.</text>
<text x="24" y="140" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start">El Recibo F/1042 de Ana en Harbour, en Patio receipt, fue aceptado y completado. Bar receipt y Patio receipt están disponibles para Luis.</text>
<text x="24" y="165" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start">Sin cambios al olvidar: Factura de Harbour en Office · A4; Recibo de Hillside en Hillside bar.</text>
<text x="24" y="205" fill="#4ac08d" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="start">K · ACORDADO · Mantener el formulario</text>
<rect x="24" y="220" width="396" height="230" rx="12" fill="#191c22" stroke="#333945"/>
<text x="40" y="247" fill="#eceef2" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start">Recibo · F/1042</text>
<text x="404" y="247" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" text-anchor="end">UI</text>
<text x="40" y="269" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start">Harbour · Español</text>
<text x="40" y="303" fill="#eceef2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600"><tspan x="40" dy="0">No hay impresoras disponibles</tspan><tspan x="40" dy="21">para este documento</tspan></text>
<rect x="40" y="344" width="364" height="38" rx="8" fill="#191c22" stroke="#333945"/>
<text x="222.0" y="368.0" fill="#eceef2" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Actualizar impresoras</text>
<path d="M40 388h364" stroke="#333945"/>
<rect x="40" y="398" width="86" height="38" rx="8" fill="#191c22" stroke="#333945"/>
<text x="83.0" y="422.0" fill="#eceef2" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Cancelar</text>
<rect x="304" y="398" width="100" height="38" rx="8" fill="#1f2229" stroke="#333945"/>
<text x="354.0" y="422.0" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Imprimir</text>
<text x="24" y="478" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400"><tspan x="24" dy="0">Lectura correcta sin impresoras; sin envío.</tspan><tspan x="24" dy="23">Actualizar solo lee opciones. No imprime</tspan><tspan x="24" dy="23">ni consulta automáticamente. Carga, fallo</tspan><tspan x="24" dy="23">y envío sin respuesta son estados distintos.</tspan></text>
<text x="442" y="205" fill="#f2b24c" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="start">L · PROPUESTO · Olvidar solo esta elección</text>
<rect x="442" y="220" width="396" height="158" rx="12" fill="#191c22" stroke="#333945"/>
<text x="458" y="246" fill="#eceef2" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start">Recibo · F/1042</text>
