<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="940" viewBox="0 0 1280 940" role="img" aria-labelledby="title desc">
<title id="title">Empty list. Saved preference. — EN, dark, 1280</title>
<desc id="desc">Static design: agreed K empty form, proposed L targeted Forget with explicit choice and named confirmation, and proposed L alternative retaining Patio. No runtime implementation or rendering evidence.</desc>
<rect x="0" y="0" width="1280" height="940" rx="0" fill="#101216"/>
<text x="24" y="42" fill="#eceef2" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" text-anchor="start">A790 / Empty list and one saved preference</text>
<text x="24" y="70" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">K agreed · L proposed only · Device-free dashboard · 19 October 2026</text>
<path d="M24 88h1232" stroke="#333945"/>
<text x="24" y="115" fill="#eceef2" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" text-anchor="start">L worked example: same normal shared browser; every submission has a known outcome.</text>
<text x="24" y="140" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start">Ana’s Harbour F/1042 Receipt on Patio receipt was accepted and completed. Bar receipt and Patio receipt are eligible to Luis.</text>
<text x="24" y="165" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start">Unchanged by targeted Forget: Harbour Invoice remembers Office · A4; Hillside Receipt remembers Hillside bar.</text>
<text x="24" y="205" fill="#4ac08d" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="start">K · AGREED · Keep the empty form open</text>
<rect x="24" y="220" width="396" height="230" rx="12" fill="#191c22" stroke="#333945"/>
<text x="40" y="247" fill="#eceef2" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start">Receipt · F/1042</text>
<text x="404" y="247" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" text-anchor="end">UI</text>
<text x="40" y="269" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start">Harbour · English</text>
<text x="40" y="303" fill="#eceef2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600"><tspan x="40" dy="0">No printers available</tspan><tspan x="40" dy="21">for this document</tspan></text>
<rect x="40" y="344" width="364" height="38" rx="8" fill="#191c22" stroke="#333945"/>
<text x="222.0" y="368.0" fill="#eceef2" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Refresh printers</text>
<path d="M40 388h364" stroke="#333945"/>
<rect x="40" y="398" width="86" height="38" rx="8" fill="#191c22" stroke="#333945"/>
<text x="83.0" y="422.0" fill="#eceef2" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Cancel</text>
<rect x="304" y="398" width="100" height="38" rx="8" fill="#1f2229" stroke="#333945"/>
<text x="354.0" y="422.0" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Print</text>
<text x="24" y="478" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400"><tspan x="24" dy="0">Successful empty offers read, no submission.</tspan><tspan x="24" dy="23">Refresh reads offers only. No print or polling.</tspan><tspan x="24" dy="23">Loading, read failure and unanswered print</tspan><tspan x="24" dy="23">remain separate states. No hidden printer details.</tspan></text>
<text x="442" y="205" fill="#f2b24c" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="start">L · PROPOSED · Targeted Forget</text>
<rect x="442" y="220" width="396" height="158" rx="12" fill="#191c22" stroke="#333945"/>
<text x="458" y="246" fill="#eceef2" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start">Receipt · F/1042</text>
<text x="822" y="246" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" text-anchor="end">UI</text>
<text x="458" y="271" fill="#eceef2" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" text-anchor="start">Printer · Patio receipt</text>
<text x="816" y="271" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="end">⌄</text>
<rect x="458" y="286" width="364" height="36" rx="8" fill="#191c22" stroke="#333945"/>
<text x="640.0" y="309.0" fill="#eceef2" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Forget saved printer</text>
<text x="458" y="347" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start">Harbour · Receipt · This browser</text>
<text x="458" y="365" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start">Shared by everyone who signs in.</text>
<text x="442" y="406" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start">2 · After Forget: explicitly choose again</text>
<rect x="442" y="420" width="396" height="190" rx="12" fill="#191c22" stroke="#333945"/>
<text x="458" y="447" fill="#eceef2" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start">Receipt · F/1042</text>
<text x="822" y="447" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" text-anchor="end">UI</text>
<rect x="458" y="459" width="364" height="34" rx="6" fill="#262a33" stroke="#7a8291"/>
<text x="470" y="482" fill="#eceef2" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">Choose a printer *</text>
<text x="810" y="482" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="end">⌄</text>
<circle cx="469" cy="511" r="6" fill="#191c22" stroke="#7a8291"/>
<text x="486" y="516" fill="#eceef2" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start">Bar receipt</text>
<circle cx="469" cy="535" r="6" fill="#191c22" stroke="#7a8291"/>
<text x="486" y="540" fill="#eceef2" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start">Patio receipt</text>
<path d="M458 550h364" stroke="#333945"/>
<rect x="458" y="560" width="86" height="38" rx="8" fill="#191c22" stroke="#333945"/>
<text x="501.0" y="584.0" fill="#eceef2" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Cancel</text>
<rect x="722" y="560" width="100" height="38" rx="8" fill="#1f2229" stroke="#333945"/>
<text x="772.0" y="584.0" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Print</text>
<text x="442" y="634" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400"><tspan x="442" dy="0">Only Harbour/Receipt memory is cleared,</tspan><tspan x="442" dy="20">across logins, plus this open form’s selection.</tspan><tspan x="442" dy="20">G cannot choose for you midway through a form.</tspan><tspan x="442" dy="20">Next newly opened form, two offers: follow J.</tspan></text>
<text x="442" y="732" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start">3 · Luis chooses Bar, then confirms</text>
<rect x="442" y="746" width="396" height="68" rx="12" fill="#191c22" stroke="#333945"/>
<path d="M458 753h364" stroke="#333945"/>
<rect x="458" y="763" width="86" height="38" rx="8" fill="#191c22" stroke="#333945"/>
<text x="501.0" y="787.0" fill="#eceef2" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Cancel</text>
<rect x="598" y="763" width="224" height="38" rx="8" fill="#4c8dff"/>
<text x="710.0" y="779.0" fill="#06101f" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Print a copy on</text>
<text x="710.0" y="794.0" fill="#06101f" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Bar receipt</text>
<text x="442" y="840" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start">Only server acceptance remembers Bar.</text>
<text x="860" y="205" fill="#f2b24c" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="start">L · PROPOSED · No targeted control</text>
<rect x="860" y="220" width="396" height="158" rx="12" fill="#191c22" stroke="#333945"/>
<text x="876" y="247" fill="#eceef2" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start">Receipt · F/1042</text>
<text x="1240" y="247" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" text-anchor="end">UI</text>
<text x="876" y="269" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start">Harbour · English</text>
<text x="876" y="294" fill="#eceef2" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" text-anchor="start">Printer · Patio receipt</text>
<text x="1234" y="294" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="end">⌄</text>
<path d="M876 314h364" stroke="#333945"/>
<rect x="876" y="324" width="86" height="38" rx="8" fill="#191c22" stroke="#333945"/>
<text x="919.0" y="348.0" fill="#eceef2" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Cancel</text>
<rect x="1016" y="324" width="224" height="38" rx="8" fill="#4c8dff"/>
<text x="1128.0" y="340.0" fill="#06101f" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Print a copy on</text>
<text x="1128.0" y="355.0" fill="#06101f" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Patio receipt</text>
<text x="860" y="408" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400"><tspan x="860" dy="0">Patio remains remembered until a normal</tspan><tspan x="860" dy="23">accepted replacement or clearing site data (I).</tspan><tspan x="860" dy="23">There is no targeted Forget control here.</tspan><tspan x="860" dy="23">Site-data clearing is outside this form; no</tspan><tspan x="860" dy="23">claim is made about other data it contains.</tspan></text>
<text x="860" y="562" fill="#f2b24c" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="start">BOTH L ALTERNATIVES</text>
<text x="860" y="591" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400"><tspan x="860" dy="0">Keep current offers and permissions.</tspan><tspan x="860" dy="22">Neither prints or cancels a request by itself.</tspan><tspan x="860" dy="22">Browser preference only, shared across logins.</tspan><tspan x="860" dy="22">No printer deletion, deactivation, reconfiguration,</tspan><tspan x="860" dy="22">Equipment change or administrator permission.</tspan></text>
<text x="24" y="652" fill="#f2b24c" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="start">STILL OPEN</text>
<text x="24" y="682" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400"><tspan x="24" dy="0">Storage, expiry, errors and private lifecycles;</tspan><tspan x="24" dy="23">concurrent/late accepted intents; integration.</tspan><tspan x="24" dy="23">L applies only without an unanswered request.</tspan><tspan x="24" dy="23">Preserve request identity and reconcile first.</tspan></text>
<path d="M24 879h1232" stroke="#333945"/>
<text x="24" y="905" fill="#f2b24c" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" text-anchor="start">L excludes unanswered submitted requests.</text>
<text x="1256" y="905" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="end">Static design · Full design/plan/build unapproved.</text>
</svg>
