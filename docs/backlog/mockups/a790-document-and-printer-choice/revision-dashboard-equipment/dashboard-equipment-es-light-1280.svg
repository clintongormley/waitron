<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="2464" viewBox="0 0 1280 2464"><title>A790 · tus decisiones de impresora</title><rect width="1280" height="2464" fill="#f7f7f8"/><g font-family="Arial, sans-serif"><text x="40" y="32" font-size="21" fill="#16181d" font-weight="700">A790 · tus decisiones de impresora</text><text x="40" y="60" font-size="14" fill="#1a5fd0">A + B acordadas · C es una propuesta · sin desarrollo</text><text x="40" y="104" font-size="19" fill="#16181d" font-weight="700">1 · Panel · impresoras activas de Harbour</text><rect x="40" y="136" width="1200" height="582" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="56" y="166" font-size="16" fill="#1a5fd0" font-weight="700">Restaurante Olivo S.L.</text><text x="56" y="198" font-size="17" fill="#16181d" font-weight="700">Harbour · factura completa F/1042</text><rect x="56" y="234" width="1168" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="68" y="260" font-size="16" fill="#16181d" font-weight="700">● Factura</text><text x="68" y="286" font-size="15" fill="#5c626e">La misma F/1042 · Mar Azul SL</text><rect x="56" y="334" width="1168" height="88" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="68" y="360" font-size="16" fill="#16181d" font-weight="700">Impresora ▸ · Cambiar</text><text x="68" y="386" font-size="15" fill="#5c626e">Office · A4 · última en este navegador</text><rect x="56" y="434" width="1168" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="68" y="460" font-size="16" fill="#16181d" font-weight="700">Al desplegar</text><text x="68" y="486" font-size="15" fill="#5c626e">Bar · papel de recibo / Office · A4 / Terraza · papel de recibo</text><text x="56" y="542" font-size="16" fill="#5c626e">Todas las impresoras activas del local de la venta. Sin elegir perfil. Se excluyen las desactivadas y las de Hillside. El orden mostrado es propuesto.</text><rect x="56" y="580" width="90" height="42" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="68" y="607" font-size="15" fill="#1a5fd0">Cancelar</text><rect x="56" y="634" width="1168" height="64" rx="8" fill="#1f6feb" stroke="#d6d9e0"/><text x="68" y="662" font-size="16" fill="#ffffff" font-weight="700">Imprimir una copia en Office</text><text x="40" y="752" font-size="19" fill="#16181d" font-weight="700">2 · Móvil · una elección de Equipo</text><rect x="40" y="784" width="1200" height="482" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="56" y="814" font-size="16" fill="#1a5fd0" font-weight="700">Restaurante Olivo S.L.</text><text x="56" y="846" font-size="17" fill="#16181d" font-weight="700">Mesa 4 · primera parte · 24,00 €</text><rect x="56" y="882" width="1168" height="88" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="68" y="908" font-size="16" fill="#16181d" font-weight="700">Equipo ▸ · Cambiar</text><text x="68" y="934" font-size="15" fill="#5c626e">Lector: Terrace reader · Recibo: Terraza</text><rect x="56" y="982" width="1168" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="68" y="1008" font-size="16" fill="#16181d" font-weight="700">Escanear QR</text><text x="68" y="1034" font-size="15" fill="#5c626e">Visible también con Equipo plegado</text><text x="56" y="1090" font-size="16" fill="#5c626e">Elegir Terraza cambia la impresora de recibos de Equipo en el móvil. No espera a que se acepte una impresión. Elegir o escanear no cobra ni imprime.</text><rect x="56" y="1128" width="90" height="42" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="68" y="1155" font-size="15" fill="#1a5fd0">Cancelar</text><rect x="56" y="1182" width="1168" height="64" rx="8" fill="#1f6feb" stroke="#d6d9e0"/><text x="68" y="1210" font-size="16" fill="#ffffff" font-weight="700">Cobrar 24,00 € · Terrace reader</text><text x="40" y="1300" font-size="19" fill="#16181d" font-weight="700">3 · El mismo móvil · otra mesa</text><rect x="40" y="1332" width="1200" height="482" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="56" y="1362" font-size="16" fill="#1a5fd0" font-weight="700">Restaurante Olivo S.L.</text><text x="56" y="1394" font-size="17" fill="#16181d" font-weight="700">Mesa 9 · 32,00 €</text><rect x="56" y="1430" width="1168" height="88" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="68" y="1456" font-size="16" fill="#16181d" font-weight="700">Equipo ▸ · Cambiar</text><text x="68" y="1482" font-size="15" fill="#5c626e">Lector: Terrace reader · Recibo: Terraza</text><rect x="56" y="1530" width="1168" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="68" y="1556" font-size="16" fill="#16181d" font-weight="700">Escanear QR</text><text x="68" y="1582" font-size="15" fill="#5c626e">El mismo ajuste de Equipo, sin otra memoria</text><text x="56" y="1638" font-size="16" fill="#5c626e">Equipo y el cobro muestran Terraza. Un QR o toque NFC permitido cambia ese mismo ajuste. A796 define el lector y los permisos de escaneo.</text><rect x="56" y="1676" width="90" height="42" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="68" y="1703" font-size="15" fill="#1a5fd0">Cancelar</text><rect x="56" y="1730" width="1168" height="64" rx="8" fill="#1f6feb" stroke="#d6d9e0"/><text x="68" y="1758" font-size="16" fill="#ffffff" font-weight="700">Cobrar 32,00 € · Terrace reader</text><text x="40" y="1848" font-size="19" fill="#16181d" font-weight="700">C · Una pregunta · selector en el formulario</text><rect x="40" y="1880" width="1200" height="506" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="56" y="1910" font-size="16" fill="#1a5fd0" font-weight="700">Restaurante Olivo S.L.</text><text x="56" y="1942" font-size="17" fill="#16181d" font-weight="700">F/1042 · Factura elegida</text><rect x="56" y="1978" width="1168" height="88" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="68" y="2004" font-size="16" fill="#16181d" font-weight="700">Impresora de facturas ▸ · Cambiar</text><text x="68" y="2030" font-size="15" fill="#5c626e">Office · A4</text><rect x="56" y="2078" width="1168" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="68" y="2104" font-size="16" fill="#16181d" font-weight="700">Al desplegar</text><text x="68" y="2130" font-size="15" fill="#5c626e">Office · A4 / Terraza · papel de recibo</text><text x="56" y="2186" font-size="16" fill="#5c626e">Propuesta: selector plegable en este formulario, como Recibo. Una impresora conserva la confirmación con nombre; sin impresoras no se imprime. D y el destino</text><text x="56" y="2210" font-size="16" fill="#5c626e">alternativo siguen abiertos.</text><rect x="56" y="2248" width="90" height="42" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="68" y="2275" font-size="15" fill="#1a5fd0">Cancelar</text><rect x="56" y="2302" width="1168" height="64" rx="8" fill="#1f6feb" stroke="#d6d9e0"/><text x="68" y="2330" font-size="16" fill="#ffffff" font-weight="700">Imprimir una copia en Office</text><text x="40" y="2420" font-size="14" fill="#5c626e">Dibujo estático. El orden nuevo y C son propuestas. No verifica el producto, la accesibilidad ni el papel.</text></g></svg>