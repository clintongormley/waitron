<svg xmlns="http://www.w3.org/2000/svg" width="390" height="2872" viewBox="0 0 390 2872"><title>A790 · tus decisiones de impresora</title><rect width="390" height="2872" fill="#101216"/><g font-family="Arial, sans-serif"><text x="18" y="32" font-size="21" fill="#eceef2" font-weight="700">A790 · tus decisiones de</text><text x="18" y="56" font-size="21" fill="#eceef2" font-weight="700">impresora</text><text x="18" y="84" font-size="14" fill="#78a9ff">A + B acordadas · C es una propuesta · sin desarrollo</text><text x="18" y="128" font-size="19" fill="#eceef2" font-weight="700">1 · Panel · impresoras activas de</text><text x="18" y="152" font-size="19" fill="#eceef2" font-weight="700">Harbour</text><rect x="18" y="184" width="354" height="678" rx="8" fill="#22262e" stroke="#333945"/><text x="34" y="214" font-size="16" fill="#78a9ff" font-weight="700">Restaurante Olivo S.L.</text><text x="34" y="246" font-size="17" fill="#eceef2" font-weight="700">Harbour · factura completa F/1042</text><rect x="34" y="282" width="322" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="308" font-size="16" fill="#eceef2" font-weight="700">● Factura</text><text x="46" y="334" font-size="15" fill="#a1a7b3">La misma F/1042 · Mar Azul SL</text><rect x="34" y="382" width="322" height="88" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="46" y="408" font-size="16" fill="#eceef2" font-weight="700">Impresora ▸ · Cambiar</text><text x="46" y="434" font-size="15" fill="#a1a7b3">Office · A4 · última en este navegador</text><rect x="34" y="482" width="322" height="112" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="508" font-size="16" fill="#eceef2" font-weight="700">Al desplegar</text><text x="46" y="534" font-size="15" fill="#a1a7b3">Bar · papel de recibo / Office · A4 / Terraza ·</text><text x="46" y="558" font-size="15" fill="#a1a7b3">papel de recibo</text><text x="34" y="614" font-size="16" fill="#a1a7b3">Todas las impresoras activas del local de la</text><text x="34" y="638" font-size="16" fill="#a1a7b3">venta. Sin elegir perfil. Se excluyen las</text><text x="34" y="662" font-size="16" fill="#a1a7b3">desactivadas y las de Hillside. El orden</text><text x="34" y="686" font-size="16" fill="#a1a7b3">mostrado es propuesto.</text><rect x="34" y="724" width="90" height="42" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="751" font-size="15" fill="#78a9ff">Cancelar</text><rect x="34" y="778" width="322" height="64" rx="8" fill="#4c8dff" stroke="#333945"/><text x="46" y="806" font-size="16" fill="#06101f" font-weight="700">Imprimir una copia en Office</text><text x="18" y="896" font-size="19" fill="#eceef2" font-weight="700">2 · Móvil · una elección de Equipo</text><rect x="18" y="928" width="354" height="554" rx="8" fill="#22262e" stroke="#333945"/><text x="34" y="958" font-size="16" fill="#78a9ff" font-weight="700">Restaurante Olivo S.L.</text><text x="34" y="990" font-size="17" fill="#eceef2" font-weight="700">Mesa 4 · primera parte · 24,00 €</text><rect x="34" y="1026" width="322" height="88" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="46" y="1052" font-size="16" fill="#eceef2" font-weight="700">Equipo ▸ · Cambiar</text><text x="46" y="1078" font-size="15" fill="#a1a7b3">Lector: Terrace reader · Recibo: Terraza</text><rect x="34" y="1126" width="322" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="1152" font-size="16" fill="#eceef2" font-weight="700">Escanear QR</text><text x="46" y="1178" font-size="15" fill="#a1a7b3">Visible también con Equipo plegado</text><text x="34" y="1234" font-size="16" fill="#a1a7b3">Elegir Terraza cambia la impresora de</text><text x="34" y="1258" font-size="16" fill="#a1a7b3">recibos de Equipo en el móvil. No espera a</text><text x="34" y="1282" font-size="16" fill="#a1a7b3">que se acepte una impresión. Elegir o</text><text x="34" y="1306" font-size="16" fill="#a1a7b3">escanear no cobra ni imprime.</text><rect x="34" y="1344" width="90" height="42" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="1371" font-size="15" fill="#78a9ff">Cancelar</text><rect x="34" y="1398" width="322" height="64" rx="8" fill="#4c8dff" stroke="#333945"/><text x="46" y="1426" font-size="16" fill="#06101f" font-weight="700">Cobrar 24,00 € · Terrace reader</text><text x="18" y="1516" font-size="19" fill="#eceef2" font-weight="700">3 · El mismo móvil · otra mesa</text><rect x="18" y="1548" width="354" height="554" rx="8" fill="#22262e" stroke="#333945"/><text x="34" y="1578" font-size="16" fill="#78a9ff" font-weight="700">Restaurante Olivo S.L.</text><text x="34" y="1610" font-size="17" fill="#eceef2" font-weight="700">Mesa 9 · 32,00 €</text><rect x="34" y="1646" width="322" height="88" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="46" y="1672" font-size="16" fill="#eceef2" font-weight="700">Equipo ▸ · Cambiar</text><text x="46" y="1698" font-size="15" fill="#a1a7b3">Lector: Terrace reader · Recibo: Terraza</text><rect x="34" y="1746" width="322" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="1772" font-size="16" fill="#eceef2" font-weight="700">Escanear QR</text><text x="46" y="1798" font-size="15" fill="#a1a7b3">El mismo ajuste de Equipo, sin otra memoria</text><text x="34" y="1854" font-size="16" fill="#a1a7b3">Equipo y el cobro muestran Terraza. Un QR</text><text x="34" y="1878" font-size="16" fill="#a1a7b3">o toque NFC permitido cambia ese mismo</text><text x="34" y="1902" font-size="16" fill="#a1a7b3">ajuste. A796 define el lector y los permisos</text><text x="34" y="1926" font-size="16" fill="#a1a7b3">de escaneo.</text><rect x="34" y="1964" width="90" height="42" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="1991" font-size="15" fill="#78a9ff">Cancelar</text><rect x="34" y="2018" width="322" height="64" rx="8" fill="#4c8dff" stroke="#333945"/><text x="46" y="2046" font-size="16" fill="#06101f" font-weight="700">Cobrar 32,00 € · Terrace reader</text><text x="18" y="2136" font-size="19" fill="#eceef2" font-weight="700">C · Una pregunta · selector en el</text><text x="18" y="2160" font-size="19" fill="#eceef2" font-weight="700">formulario</text><rect x="18" y="2192" width="354" height="578" rx="8" fill="#22262e" stroke="#333945"/><text x="34" y="2222" font-size="16" fill="#78a9ff" font-weight="700">Restaurante Olivo S.L.</text><text x="34" y="2254" font-size="17" fill="#eceef2" font-weight="700">F/1042 · Factura elegida</text><rect x="34" y="2290" width="322" height="88" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="46" y="2316" font-size="16" fill="#eceef2" font-weight="700">Impresora de facturas ▸ · Cambiar</text><text x="46" y="2342" font-size="15" fill="#a1a7b3">Office · A4</text><rect x="34" y="2390" width="322" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="2416" font-size="16" fill="#eceef2" font-weight="700">Al desplegar</text><text x="46" y="2442" font-size="15" fill="#a1a7b3">Office · A4 / Terraza · papel de recibo</text><text x="34" y="2498" font-size="16" fill="#a1a7b3">Propuesta: selector plegable en este</text><text x="34" y="2522" font-size="16" fill="#a1a7b3">formulario, como Recibo. Una impresora</text><text x="34" y="2546" font-size="16" fill="#a1a7b3">conserva la confirmación con nombre; sin</text><text x="34" y="2570" font-size="16" fill="#a1a7b3">impresoras no se imprime. D y el destino</text><text x="34" y="2594" font-size="16" fill="#a1a7b3">alternativo siguen abiertos.</text><rect x="34" y="2632" width="90" height="42" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="2659" font-size="15" fill="#78a9ff">Cancelar</text><rect x="34" y="2686" width="322" height="64" rx="8" fill="#4c8dff" stroke="#333945"/><text x="46" y="2714" font-size="16" fill="#06101f" font-weight="700">Imprimir una copia en Office</text><text x="18" y="2804" font-size="14" fill="#a1a7b3">Dibujo estático. El orden nuevo y C son propuestas. No</text><text x="18" y="2828" font-size="14" fill="#a1a7b3">verifica el producto, la accesibilidad ni el papel.</text></g></svg>