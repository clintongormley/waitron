<svg xmlns="http://www.w3.org/2000/svg" width="390" height="2896" viewBox="0 0 390 2896"><title>A790 · your printer decisions</title><rect width="390" height="2896" fill="#101216"/><g font-family="Arial, sans-serif"><text x="18" y="32" font-size="21" fill="#eceef2" font-weight="700">A790 · your printer decisions</text><text x="18" y="60" font-size="14" fill="#78a9ff">A + B agreed · C below is a proposal · no product build</text><text x="18" y="104" font-size="19" fill="#eceef2" font-weight="700">1 · Dashboard · all active Harbour</text><text x="18" y="128" font-size="19" fill="#eceef2" font-weight="700">printers</text><rect x="18" y="160" width="354" height="678" rx="8" fill="#22262e" stroke="#333945"/><text x="34" y="190" font-size="16" fill="#78a9ff" font-weight="700">Restaurante Olivo S.L.</text><text x="34" y="222" font-size="17" fill="#eceef2" font-weight="700">Harbour · full invoice F/1042</text><rect x="34" y="258" width="322" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="284" font-size="16" fill="#eceef2" font-weight="700">● Invoice</text><text x="46" y="310" font-size="15" fill="#a1a7b3">Same recorded F/1042 · Mar Azul SL</text><rect x="34" y="358" width="322" height="88" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="46" y="384" font-size="16" fill="#eceef2" font-weight="700">Printer ▸ · Change</text><text x="46" y="410" font-size="15" fill="#a1a7b3">Office · A4 · last used on this browser</text><rect x="34" y="458" width="322" height="112" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="484" font-size="16" fill="#eceef2" font-weight="700">Available when expanded</text><text x="46" y="510" font-size="15" fill="#a1a7b3">Bar · receipt paper / Office · A4 / Terraza ·</text><text x="46" y="534" font-size="15" fill="#a1a7b3">receipt paper</text><text x="34" y="590" font-size="16" fill="#a1a7b3">Every active printer at the sale venue. No</text><text x="34" y="614" font-size="16" fill="#a1a7b3">profile choice. Disabled Harbour printers and</text><text x="34" y="638" font-size="16" fill="#a1a7b3">all Hillside printers are excluded. List order</text><text x="34" y="662" font-size="16" fill="#a1a7b3">shown is proposed.</text><rect x="34" y="700" width="90" height="42" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="727" font-size="15" fill="#78a9ff">Cancel</text><rect x="34" y="754" width="322" height="64" rx="8" fill="#4c8dff" stroke="#333945"/><text x="46" y="782" font-size="16" fill="#06101f" font-weight="700">Print a copy on Office</text><text x="18" y="872" font-size="19" fill="#eceef2" font-weight="700">2 · Phone · one Equipment choice</text><rect x="18" y="904" width="354" height="554" rx="8" fill="#22262e" stroke="#333945"/><text x="34" y="934" font-size="16" fill="#78a9ff" font-weight="700">Restaurante Olivo S.L.</text><text x="34" y="966" font-size="17" fill="#eceef2" font-weight="700">Mesa 4 · first share · €24.00</text><rect x="34" y="1002" width="322" height="88" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="46" y="1028" font-size="16" fill="#eceef2" font-weight="700">Equipment ▸ · Change</text><text x="46" y="1054" font-size="15" fill="#a1a7b3">Reader: Terrace reader · Receipt: Terraza</text><rect x="34" y="1102" width="322" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="1128" font-size="16" fill="#eceef2" font-weight="700">Scan QR</text><text x="46" y="1154" font-size="15" fill="#a1a7b3">Always visible, even with Equipment folded</text><text x="34" y="1210" font-size="16" fill="#a1a7b3">Choosing Terraza changes the phone’s</text><text x="34" y="1234" font-size="16" fill="#a1a7b3">Equipment receipt printer. It does not wait for</text><text x="34" y="1258" font-size="16" fill="#a1a7b3">a print to be accepted. Selecting or scanning</text><text x="34" y="1282" font-size="16" fill="#a1a7b3">never charges or prints.</text><rect x="34" y="1320" width="90" height="42" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="1347" font-size="15" fill="#78a9ff">Cancel</text><rect x="34" y="1374" width="322" height="64" rx="8" fill="#4c8dff" stroke="#333945"/><text x="46" y="1402" font-size="16" fill="#06101f" font-weight="700">Pay €24.00 · Terrace reader</text><text x="18" y="1492" font-size="19" fill="#eceef2" font-weight="700">3 · The same phone · next table</text><rect x="18" y="1524" width="354" height="578" rx="8" fill="#22262e" stroke="#333945"/><text x="34" y="1554" font-size="16" fill="#78a9ff" font-weight="700">Restaurante Olivo S.L.</text><text x="34" y="1586" font-size="17" fill="#eceef2" font-weight="700">Mesa 9 · €32.00</text><rect x="34" y="1622" width="322" height="88" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="46" y="1648" font-size="16" fill="#eceef2" font-weight="700">Equipment ▸ · Change</text><text x="46" y="1674" font-size="15" fill="#a1a7b3">Reader: Terrace reader · Receipt: Terraza</text><rect x="34" y="1722" width="322" height="112" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="1748" font-size="16" fill="#eceef2" font-weight="700">Scan QR</text><text x="46" y="1774" font-size="15" fill="#a1a7b3">Same Equipment setting, no new receipt</text><text x="46" y="1798" font-size="15" fill="#a1a7b3">memory</text><text x="34" y="1854" font-size="16" fill="#a1a7b3">Equipment and this payment form both show</text><text x="34" y="1878" font-size="16" fill="#a1a7b3">Terraza. A QR scan or permitted NFC tap</text><text x="34" y="1902" font-size="16" fill="#a1a7b3">updates this same setting. A796 owns reader</text><text x="34" y="1926" font-size="16" fill="#a1a7b3">and scan-permission behavior.</text><rect x="34" y="1964" width="90" height="42" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="1991" font-size="15" fill="#78a9ff">Cancel</text><rect x="34" y="2018" width="322" height="64" rx="8" fill="#4c8dff" stroke="#333945"/><text x="46" y="2046" font-size="16" fill="#06101f" font-weight="700">Pay €32.00 · Terrace reader</text><text x="18" y="2136" font-size="19" fill="#eceef2" font-weight="700">C · One question · invoice selector</text><text x="18" y="2160" font-size="19" fill="#eceef2" font-weight="700">inline?</text><rect x="18" y="2192" width="354" height="578" rx="8" fill="#22262e" stroke="#333945"/><text x="34" y="2222" font-size="16" fill="#78a9ff" font-weight="700">Restaurante Olivo S.L.</text><text x="34" y="2254" font-size="17" fill="#eceef2" font-weight="700">F/1042 · Invoice chosen</text><rect x="34" y="2290" width="322" height="88" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="46" y="2316" font-size="16" fill="#eceef2" font-weight="700">Invoice printer ▸ · Change</text><text x="46" y="2342" font-size="15" fill="#a1a7b3">Office · A4</text><rect x="34" y="2390" width="322" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="2416" font-size="16" fill="#eceef2" font-weight="700">When expanded</text><text x="46" y="2442" font-size="15" fill="#a1a7b3">Office · A4 / Terraza · receipt paper</text><text x="34" y="2498" font-size="16" fill="#a1a7b3">Proposed: keep the invoice selector in this</text><text x="34" y="2522" font-size="16" fill="#a1a7b3">form, collapsible like Receipt. One printer still</text><text x="34" y="2546" font-size="16" fill="#a1a7b3">keeps the named confirmation; no printers</text><text x="34" y="2570" font-size="16" fill="#a1a7b3">means no print action. D and exact fallback</text><text x="34" y="2594" font-size="16" fill="#a1a7b3">remain open.</text><rect x="34" y="2632" width="90" height="42" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="2659" font-size="15" fill="#78a9ff">Cancel</text><rect x="34" y="2686" width="322" height="64" rx="8" fill="#4c8dff" stroke="#333945"/><text x="46" y="2714" font-size="16" fill="#06101f" font-weight="700">Print a copy on Office</text><text x="18" y="2804" font-size="14" fill="#a1a7b3">Static discussion drawing. New ordering and C are</text><text x="18" y="2828" font-size="14" fill="#a1a7b3">proposals. No runtime, accessibility or physical-paper</text><text x="18" y="2852" font-size="14" fill="#a1a7b3">evidence.</text></g></svg>