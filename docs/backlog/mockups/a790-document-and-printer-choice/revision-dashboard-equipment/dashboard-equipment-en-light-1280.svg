<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="2464" viewBox="0 0 1280 2464"><title>A790 · your printer decisions</title><rect width="1280" height="2464" fill="#f7f7f8"/><g font-family="Arial, sans-serif"><text x="40" y="32" font-size="21" fill="#16181d" font-weight="700">A790 · your printer decisions</text><text x="40" y="60" font-size="14" fill="#1a5fd0">A + B agreed · C below is a proposal · no product build</text><text x="40" y="104" font-size="19" fill="#16181d" font-weight="700">1 · Dashboard · all active Harbour printers</text><rect x="40" y="136" width="1200" height="582" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="56" y="166" font-size="16" fill="#1a5fd0" font-weight="700">Restaurante Olivo S.L.</text><text x="56" y="198" font-size="17" fill="#16181d" font-weight="700">Harbour · full invoice F/1042</text><rect x="56" y="234" width="1168" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="68" y="260" font-size="16" fill="#16181d" font-weight="700">● Invoice</text><text x="68" y="286" font-size="15" fill="#5c626e">Same recorded F/1042 · Mar Azul SL</text><rect x="56" y="334" width="1168" height="88" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="68" y="360" font-size="16" fill="#16181d" font-weight="700">Printer ▸ · Change</text><text x="68" y="386" font-size="15" fill="#5c626e">Office · A4 · last used on this browser</text><rect x="56" y="434" width="1168" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="68" y="460" font-size="16" fill="#16181d" font-weight="700">Available when expanded</text><text x="68" y="486" font-size="15" fill="#5c626e">Bar · receipt paper / Office · A4 / Terraza · receipt paper</text><text x="56" y="542" font-size="16" fill="#5c626e">Every active printer at the sale venue. No profile choice. Disabled Harbour printers and all Hillside printers are excluded. List order shown is proposed.</text><rect x="56" y="580" width="90" height="42" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="68" y="607" font-size="15" fill="#1a5fd0">Cancel</text><rect x="56" y="634" width="1168" height="64" rx="8" fill="#1f6feb" stroke="#d6d9e0"/><text x="68" y="662" font-size="16" fill="#ffffff" font-weight="700">Print a copy on Office</text><text x="40" y="752" font-size="19" fill="#16181d" font-weight="700">2 · Phone · one Equipment choice</text><rect x="40" y="784" width="1200" height="482" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="56" y="814" font-size="16" fill="#1a5fd0" font-weight="700">Restaurante Olivo S.L.</text><text x="56" y="846" font-size="17" fill="#16181d" font-weight="700">Mesa 4 · first share · €24.00</text><rect x="56" y="882" width="1168" height="88" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="68" y="908" font-size="16" fill="#16181d" font-weight="700">Equipment ▸ · Change</text><text x="68" y="934" font-size="15" fill="#5c626e">Reader: Terrace reader · Receipt: Terraza</text><rect x="56" y="982" width="1168" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="68" y="1008" font-size="16" fill="#16181d" font-weight="700">Scan QR</text><text x="68" y="1034" font-size="15" fill="#5c626e">Always visible, even with Equipment folded</text><text x="56" y="1090" font-size="16" fill="#5c626e">Choosing Terraza changes the phone’s Equipment receipt printer. It does not wait for a print to be accepted. Selecting or scanning never charges or prints.</text><rect x="56" y="1128" width="90" height="42" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="68" y="1155" font-size="15" fill="#1a5fd0">Cancel</text><rect x="56" y="1182" width="1168" height="64" rx="8" fill="#1f6feb" stroke="#d6d9e0"/><text x="68" y="1210" font-size="16" fill="#ffffff" font-weight="700">Pay €24.00 · Terrace reader</text><text x="40" y="1300" font-size="19" fill="#16181d" font-weight="700">3 · The same phone · next table</text><rect x="40" y="1332" width="1200" height="482" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="56" y="1362" font-size="16" fill="#1a5fd0" font-weight="700">Restaurante Olivo S.L.</text><text x="56" y="1394" font-size="17" fill="#16181d" font-weight="700">Mesa 9 · €32.00</text><rect x="56" y="1430" width="1168" height="88" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="68" y="1456" font-size="16" fill="#16181d" font-weight="700">Equipment ▸ · Change</text><text x="68" y="1482" font-size="15" fill="#5c626e">Reader: Terrace reader · Receipt: Terraza</text><rect x="56" y="1530" width="1168" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="68" y="1556" font-size="16" fill="#16181d" font-weight="700">Scan QR</text><text x="68" y="1582" font-size="15" fill="#5c626e">Same Equipment setting, no new receipt memory</text><text x="56" y="1638" font-size="16" fill="#5c626e">Equipment and this payment form both show Terraza. A QR scan or permitted NFC tap updates this same setting. A796 owns reader and scan-permission behavior.</text><rect x="56" y="1676" width="90" height="42" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="68" y="1703" font-size="15" fill="#1a5fd0">Cancel</text><rect x="56" y="1730" width="1168" height="64" rx="8" fill="#1f6feb" stroke="#d6d9e0"/><text x="68" y="1758" font-size="16" fill="#ffffff" font-weight="700">Pay €32.00 · Terrace reader</text><text x="40" y="1848" font-size="19" fill="#16181d" font-weight="700">C · One question · invoice selector inline?</text><rect x="40" y="1880" width="1200" height="506" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="56" y="1910" font-size="16" fill="#1a5fd0" font-weight="700">Restaurante Olivo S.L.</text><text x="56" y="1942" font-size="17" fill="#16181d" font-weight="700">F/1042 · Invoice chosen</text><rect x="56" y="1978" width="1168" height="88" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="68" y="2004" font-size="16" fill="#16181d" font-weight="700">Invoice printer ▸ · Change</text><text x="68" y="2030" font-size="15" fill="#5c626e">Office · A4</text><rect x="56" y="2078" width="1168" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="68" y="2104" font-size="16" fill="#16181d" font-weight="700">When expanded</text><text x="68" y="2130" font-size="15" fill="#5c626e">Office · A4 / Terraza · receipt paper</text><text x="56" y="2186" font-size="16" fill="#5c626e">Proposed: keep the invoice selector in this form, collapsible like Receipt. One printer still keeps the named confirmation; no printers means no print action. D and</text><text x="56" y="2210" font-size="16" fill="#5c626e">exact fallback remain open.</text><rect x="56" y="2248" width="90" height="42" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="68" y="2275" font-size="15" fill="#1a5fd0">Cancel</text><rect x="56" y="2302" width="1168" height="64" rx="8" fill="#1f6feb" stroke="#d6d9e0"/><text x="68" y="2330" font-size="16" fill="#ffffff" font-weight="700">Print a copy on Office</text><text x="40" y="2420" font-size="14" fill="#5c626e">Static discussion drawing. New ordering and C are proposals. No runtime, accessibility or physical-paper evidence.</text></g></svg>