<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="968" viewBox="0 0 1280 968"><title>A790 e-changing-state-and-outcomes es light</title><rect width="1280" height="968" fill="#f7f7f8"/><g font-family="Arial, sans-serif"><text x="40" y="25" fill="#1a5fd0" font-size="13">PROPUESTA · pendiente de acuerdo</text><g transform="translate(0 -2477)"><text x="40" y="2550" fill="#16181d" font-size="22" font-weight="700">05 · Estados y resultados</text><rect x="40" y="2580" width="1200" height="820" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="58" y="2612" fill="#1a5fd0" font-size="17" font-weight="700">Restaurante Olivo S.L.</text><text x="58" y="2648" fill="#16181d" font-size="17" font-weight="700">F/1042 · destino: Office</text><text x="58" y="2680" fill="#16181d" font-size="19" font-weight="700">Cada estado es un ejemplo separado</text><rect x="58" y="2714" width="1164" height="94" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="96" y="2742" fill="#16181d" font-size="17" font-weight="700">Cargando</text><text x="96" y="2770" fill="#5c626e" font-size="15">Leyendo las impresoras permitidas…</text><rect x="58" y="2820" width="1164" height="94" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="96" y="2848" fill="#16181d" font-size="17" font-weight="700">Lectura fallida</text><text x="96" y="2876" fill="#5c626e" font-size="15">No se cargaron las impresoras. Reintentar.</text><rect x="58" y="2926" width="1164" height="94" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="96" y="2954" fill="#16181d" font-size="17" font-weight="700">Impresora eliminada</text><text x="96" y="2982" fill="#5c626e" font-size="15">Elige otra impresora permitida.</text><rect x="58" y="3032" width="1164" height="94" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="96" y="3060" fill="#16181d" font-size="17" font-weight="700">Solicitud aceptada</text><text x="96" y="3088" fill="#5c626e" font-size="15">Estado no disponible. Consulta la solicitud.</text><rect x="58" y="3138" width="1164" height="94" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="96" y="3166" fill="#16181d" font-size="17" font-weight="700">Resultado desconocido</text><text x="96" y="3194" fill="#5c626e" font-size="15">La primera solicitud aún podría imprimir.</text><text x="58" y="3256" fill="#5c626e" font-size="16">No tener destinos es distinto de una lectura fallida. Si el original pasa a copia, se confirma otra vez. No cambiar de impresora ni repetir una escritura incierta</text><text x="58" y="3280" fill="#5c626e" font-size="16">automáticamente.</text><rect x="58" y="3324" width="80" height="44" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="70" y="3352" fill="#1a5fd0" font-size="16">Cancelar</text><rect x="862" y="3324" width="360" height="52" rx="8" fill="#1f6feb" stroke="#d6d9e0"/><text x="874" y="3356" fill="#ffffff" font-size="16">Consultar solicitud</text></g></g></svg>