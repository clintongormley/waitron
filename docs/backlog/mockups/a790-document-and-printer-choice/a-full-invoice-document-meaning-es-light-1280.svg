ont-size="14">A4</text><text x="656.0" y="519" fill="#16181d" font-size="14" font-weight="700">F/1042</text><text x="656.0" y="551" fill="#16181d" font-size="14">Mar Azul SL</text><text x="656.0" y="583" fill="#16181d" font-size="14">86,40 €</text><text x="58" y="636" fill="#5c626e" font-size="16">Propuesta: ambos conservan F/1042 y los datos del cliente. La lista de facturas incluye A4 y papel de recibo. Una sola opción Factura completa o un recibo de pago</text><text x="58" y="660" fill="#5c626e" font-size="16">separado son las alternativas.</text><rect x="58" y="704" width="80" height="44" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="70" y="732" fill="#1a5fd0" font-size="16">Cancelar</text><rect x="862" y="704" width="360" height="52" rx="8" fill="#1f6feb" stroke="#d6d9e0"/><text x="874" y="736" fill="#ffffff" font-size="16">Elegir impresora</text></g></g></svg>