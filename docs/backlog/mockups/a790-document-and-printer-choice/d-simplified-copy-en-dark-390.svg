<svg xmlns="http://www.w3.org/2000/svg" width="390" height="758" viewBox="0 0 390 758"><title>A790 d-simplified-copy en dark</title><rect width="390" height="758" fill="#101216"/><g font-family="Arial, sans-serif"><text x="18" y="25" fill="#78a9ff" font-size="13">PROPOSAL · awaiting owner agreement</text><g transform="translate(0 -2399)"><text x="18" y="2472" fill="#eceef2" font-size="22" font-weight="700">04 · A simplified sale</text><rect x="18" y="2502" width="354" height="610" rx="8" fill="#22262e" stroke="#333945"/><text x="36" y="2534" fill="#78a9ff" font-size="17" font-weight="700">Restaurante Olivo S.L.</text><text x="36" y="2570" fill="#eceef2" font-size="17" font-weight="700">Receipt S/318 · €14.50 · Spanish · 1</text><text x="36" y="2594" fill="#eceef2" font-size="17" font-weight="700">guest</text><text x="36" y="2626" fill="#eceef2" font-size="19" font-weight="700">Recommended: Receipt only</text><text x="36" y="2660" fill="#eceef2" font-size="16" font-weight="700">Receipt: Same stored sale, number and</text><text x="36" y="2684" fill="#eceef2" font-size="16" font-weight="700">amounts</text><rect x="36" y="2722" width="318" height="94" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="48" y="2750" fill="#78a9ff" font-size="16">●</text><text x="74" y="2750" fill="#eceef2" font-size="17" font-weight="700">Patio receipt</text><text x="74" y="2778" fill="#a1a7b3" font-size="15">Selected · Bar receipt also offered</text><text x="36" y="2840" fill="#a1a7b3" font-size="16">Skip the one-document step. With one</text><text x="36" y="2864" fill="#a1a7b3" font-size="16">eligible printer, show its name and keep the</text><text x="36" y="2888" fill="#a1a7b3" font-size="16">final Print press. Zero printers: explain why,</text><text x="36" y="2912" fill="#a1a7b3" font-size="16">with no print action. Keeping every picker is</text><text x="36" y="2936" fill="#a1a7b3" font-size="16">the extra-tap alternative.</text><rect x="36" y="2980" width="80" height="44" rx="8" fill="#191c22" stroke="#333945"/><text x="48" y="3008" fill="#78a9ff" font-size="16">Cancel</text><rect x="36" y="3036" width="318" height="52" rx="8" fill="#4c8dff" stroke="#333945"/><text x="48" y="3068" fill="#06101f" font-size="16">Print a copy on Patio receipt</text></g></g></svg>