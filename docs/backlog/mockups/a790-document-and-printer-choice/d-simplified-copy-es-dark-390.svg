<svg xmlns="http://www.w3.org/2000/svg" width="390" height="734" viewBox="0 0 390 734"><title>A790 d-simplified-copy es dark</title><rect width="390" height="734" fill="#101216"/><g font-family="Arial, sans-serif"><text x="18" y="25" fill="#78a9ff" font-size="13">PROPUESTA · pendiente de acuerdo</text><g transform="translate(0 -2399)"><text x="18" y="2472" fill="#eceef2" font-size="22" font-weight="700">04 · Una venta simplificada</text><rect x="18" y="2502" width="354" height="586" rx="8" fill="#22262e" stroke="#333945"/><text x="36" y="2534" fill="#78a9ff" font-size="17" font-weight="700">Restaurante Olivo S.L.</text><text x="36" y="2570" fill="#eceef2" font-size="17" font-weight="700">Recibo S/318 · 14,50 € · español · 1</text><text x="36" y="2594" fill="#eceef2" font-size="17" font-weight="700">comensal</text><text x="36" y="2626" fill="#eceef2" font-size="19" font-weight="700">Propuesta: solo Recibo</text><text x="36" y="2660" fill="#eceef2" font-size="16" font-weight="700">Recibo: Misma venta, número e importes</text><rect x="36" y="2698" width="318" height="94" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="48" y="2726" fill="#78a9ff" font-size="16">●</text><text x="74" y="2726" fill="#eceef2" font-size="17" font-weight="700">Patio receipt</text><text x="74" y="2754" fill="#a1a7b3" font-size="15">Elegida · también se ofrece Bar receipt</text><text x="36" y="2816" fill="#a1a7b3" font-size="16">Omitir la elección de un único documento.</text><text x="36" y="2840" fill="#a1a7b3" font-size="16">Con una impresora, mostrar su nombre y</text><text x="36" y="2864" fill="#a1a7b3" font-size="16">confirmar. Sin impresoras, explicar por qué y</text><text x="36" y="2888" fill="#a1a7b3" font-size="16">no permitir imprimir. Mantener cada selector</text><text x="36" y="2912" fill="#a1a7b3" font-size="16">requiere más pulsaciones.</text><rect x="36" y="2956" width="80" height="44" rx="8" fill="#191c22" stroke="#333945"/><text x="48" y="2984" fill="#78a9ff" font-size="16">Cancelar</text><rect x="36" y="3012" width="318" height="52" rx="8" fill="#4c8dff" stroke="#333945"/><text x="48" y="3044" fill="#06101f" font-size="15">Imprimir una copia en Patio receipt</text></g></g></svg>