<title id="title">Una elección de factura. Se guarda al elegir.</title>
<desc id="desc">Static A790 M agreement storyboard. Proposed UI is labelled separately from design explanation. Complete routing approval and A739 timing integration remain pending. No rendering or runtime verification by the author.</desc>
