<text x="30" y="706" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600">Interfaz · NUEVA factura · F/1043</text>
<text x="30" y="736" fill="#eceef2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600">Cinturón terraza</text>
