<text x="16" y="516" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400">Ambas permitidas; el servidor indica una copia.</text>
<text x="16" y="552" fill="#4ac08d" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">TRAS GUARDAR LA ELECCIÓN</text>
