<text x="30" y="769" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400">Seleccionada si sigue disponible</text>
<text x="16" y="810" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400">Diseño · Elegir y guardar no imprime.</text>
<text x="16" y="830" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400">Cerrar conserva la elección guardada.</text>
<text x="16" y="850" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400">Lo enviado mantiene su destino fijo.</text>
<path d="M16 864h358" fill="none" stroke="#333945"/>
<text x="16" y="886" fill="#78a9ff" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">PROPUESTAS TÉCNICAS · SIN VERIFICAR</text>
<text x="16" y="911" fill="#eceef2" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600">Guardando / sin respuesta</text>
<text x="16" y="930" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400">Comprobar ese guardado antes de imprimir.</text>
<text x="16" y="954" fill="#eceef2" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600">Guardado rechazado</text>
<text x="16" y="973" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400">Restaurar la elección anterior confirmada.</text>
<text x="16" y="997" fill="#eceef2" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600">Guardado; falla la actualización</text>
<text x="16" y="1016" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400">Conservarlo. Mostrar el fallo de carga.</text>
<path d="M16 1030h358" fill="none" stroke="#333945"/>
<text x="16" y="1053" fill="#f2b24c" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">REVISIÓN DEL DISEÑO · PENDIENTE</text>
<text x="16" y="1080" fill="#eceef2" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600">Aprobar el diseño A790 para planificar,</text>
<text x="16" y="1100" fill="#eceef2" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600">con las propuestas técnicas indicadas,</text>
<text x="16" y="1120" fill="#eceef2" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600">o pedir cambios concretos.</text>
<text x="16" y="1152" fill="#f2b24c" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400">A739 sigue sin decidir cuándo:</text>
<text x="16" y="1172" fill="#f2b24c" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400">A · Tras el pago   B · Al finalizar</text>
<text x="16" y="1192" fill="#f2b24c" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400">Justificante y espera también pendientes.</text>
<text x="16" y="1247" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400">Dibujo estático · Interfaz propuesta</text>
</svg>
