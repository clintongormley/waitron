<text x="864" y="173" fill="#f2b24c" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">REVISIÓN DEL DISEÑO · PENDIENTE</text>
<text x="864" y="213" fill="#eceef2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600">Aprobar el diseño A790 para planificar,</text>
<text x="864" y="238" fill="#eceef2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600">con las propuestas técnicas indicadas,</text>
<text x="864" y="263" fill="#eceef2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600">o pedir cambios concretos.</text>
<text x="864" y="309" fill="#f2b24c" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">A739 sigue sin decidir cuándo:</text>
<text x="864" y="333" fill="#f2b24c" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">A · Tras el pago   B · Al finalizar</text>
<text x="864" y="357" fill="#f2b24c" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">Justificante y espera también pendientes.</text>
<text x="864" y="417" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">Diseño · Elegir y guardar no imprime.</text>
<text x="864" y="441" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">Cerrar conserva la elección guardada.</text>
<text x="864" y="465" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">Lo enviado mantiene su destino fijo.</text>
