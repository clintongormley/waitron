<text x="880" y="605" fill="#eceef2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600">Guardado; falla la actualización</text>
<text x="880" y="641" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">Conservarlo. Mostrar el fallo de carga.</text>
<text x="16" y="727" fill="#f2b24c" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600">Revisión del diseño: se pide aprobar la planificación; el desarrollo sigue pendiente.</text>
<text x="16" y="825" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400">Dibujo estático · Interfaz propuesta</text>
