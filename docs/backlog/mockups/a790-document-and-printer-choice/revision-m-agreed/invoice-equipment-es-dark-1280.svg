<text x="32" y="605" fill="#eceef2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600">Guardando / sin respuesta</text>
<text x="32" y="641" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">Comprobar ese guardado antes de imprimir.</text>
<rect x="440" y="573" width="400" height="104" rx="12" fill="#191c22" stroke="#333945"/>
