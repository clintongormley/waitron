<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1916" viewBox="0 0 1280 1916"><title>A790 · Factura acordada; venta simplificada</title><rect width="1280" height="1916" fill="#f7f7f8"/><g font-family="Arial, sans-serif"><text x="40" y="32" font-size="21" fill="#16181d" font-weight="700">A790 · Factura acordada; venta simplificada</text><text x="40" y="60" font-size="14" fill="#1a5fd0">C aprobada · D es una pregunta · sin desarrollo</text><text x="40" y="104" font-size="19" fill="#16181d" font-weight="700">C · Acordado: Factura en el formulario</text><rect x="40" y="136" width="1200" height="482" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="56" y="166" font-size="16" fill="#1a5fd0" font-weight="700">Restaurante Olivo S.L.</text><text x="56" y="198" font-size="17" fill="#16181d" font-weight="700">Factura completa F/1042 · Factura elegida</text><rect x="56" y="234" width="1168" height="88" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="68" y="260" font-size="16" fill="#16181d" font-weight="700">Impresora de facturas ▸ · Cambiar</text><text x="68" y="286" font-size="15" fill="#5c626e">Office · A4</text><rect x="56" y="334" width="1168" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="68" y="360" font-size="16" fill="#16181d" font-weight="700">Al desplegar, en el mismo formulario</text><text x="68" y="386" font-size="15" fill="#5c626e">Office · A4 / Terrace belt · papel de recibo</text><text x="56" y="442" font-size="16" fill="#5c626e">La fila plegada sigue junto al botón final con el nombre. Sin otro paso para elegir impresora. Office se supone válida; no se aprueba otra memoria de facturas.</text><rect x="56" y="480" width="90" height="42" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="68" y="507" font-size="15" fill="#1a5fd0">Cancelar</text><rect x="56" y="534" width="1168" height="64" rx="8" fill="#1f6feb" stroke="#d6d9e0"/><text x="68" y="562" font-size="16" fill="#ffffff" font-weight="700">Imprimir una copia en Office</text><text x="40" y="652" font-size="19" fill="#16181d" font-weight="700">D · Recomendado: abrir Recibo directamente</text><rect x="40" y="684" width="1200" height="582" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="56" y="714" font-size="16" fill="#1a5fd0" font-weight="700">Restaurante Olivo S.L.</text><text x="56" y="746" font-size="17" fill="#16181d" font-weight="700">Factura simplificada S/318 · 14,50 € · Español · 1 comensal</text><rect x="56" y="782" width="1168" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="68" y="808" font-size="16" fill="#16181d" font-weight="700">Recibo · Factura simplificada</text><text x="68" y="834" font-size="15" fill="#5c626e">La misma S/318; no se emite una factura completa</text><rect x="56" y="882" width="1168" height="88" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="68" y="908" font-size="16" fill="#16181d" font-weight="700">Impresora de recibos ▸ · Cambiar</text><text x="68" y="934" font-size="15" fill="#5c626e">Patio receipt · elección actual de Equipo</text><rect x="56" y="982" width="1168" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="68" y="1008" font-size="16" fill="#16181d" font-weight="700">Desplegar para cambiar impresora</text><text x="68" y="1034" font-size="15" fill="#5c626e">Bar receipt / Patio receipt</text><text x="56" y="1090" font-size="16" fill="#5c626e">Abre este formulario directamente. Conserva los datos guardados y la elección de idioma ofrecida. Imprimir requiere pulsar el botón final. Elegir o plegar no imprime.</text><rect x="56" y="1128" width="90" height="42" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="68" y="1155" font-size="15" fill="#1a5fd0">Cancelar</text><rect x="56" y="1182" width="1168" height="64" rx="8" fill="#1f6feb" stroke="#d6d9e0"/><text x="68" y="1210" font-size="16" fill="#ffffff" font-weight="700">Imprimir una copia en Patio receipt</text><text x="40" y="1300" font-size="19" fill="#16181d" font-weight="700">D · Alternativa: elegir el documento</text><rect x="40" y="1332" width="1200" height="482" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="56" y="1362" font-size="16" fill="#1a5fd0" font-weight="700">Restaurante Olivo S.L.</text><text x="56" y="1394" font-size="17" fill="#16181d" font-weight="700">La misma S/318 · antes del formulario</text><rect x="56" y="1430" width="1168" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="68" y="1456" font-size="16" fill="#16181d" font-weight="700">● Recibo</text><text x="68" y="1482" font-size="15" fill="#5c626e">El único documento disponible</text><rect x="56" y="1530" width="1168" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="68" y="1556" font-size="16" fill="#16181d" font-weight="700">Factura · no disponible</text><text x="68" y="1582" font-size="15" fill="#5c626e">Reimprimir no emite una factura completa</text><text x="56" y="1638" font-size="16" fill="#5c626e">Añade este paso y después abre el mismo formulario. La pregunta es si ayuda esa elección adicional. Ninguna alternativa convierte la venta.</text><rect x="56" y="1676" width="90" height="42" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="68" y="1703" font-size="15" fill="#1a5fd0">Cancelar</text><rect x="56" y="1730" width="1168" height="64" rx="8" fill="#1f6feb" stroke="#d6d9e0"/><text x="68" y="1758" font-size="16" fill="#ffffff" font-weight="700">Continuar con Recibo</text><text x="40" y="1848" font-size="14" fill="#5c626e">D no está aprobada. En el dispositivo se usa la lista de recibos y un solo ajuste de Equipo. El panel sigue B: todas las impresoras activas del local de la venta. Almacenamiento, alternativas</text><text x="40" y="1872" font-size="14" fill="#5c626e">y uso de portátiles siguen abiertos. Dibujos estáticos, sin pruebas del producto ni del papel.</text></g></svg>