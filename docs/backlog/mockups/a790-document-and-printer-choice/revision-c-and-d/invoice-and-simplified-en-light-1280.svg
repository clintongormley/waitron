<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1916" viewBox="0 0 1280 1916"><title>A790 · Invoice agreed; simplified sale next</title><rect width="1280" height="1916" fill="#f7f7f8"/><g font-family="Arial, sans-serif"><text x="40" y="32" font-size="21" fill="#16181d" font-weight="700">A790 · Invoice agreed; simplified sale next</text><text x="40" y="60" font-size="14" fill="#1a5fd0">C approved · D is one question · no product build</text><text x="40" y="104" font-size="19" fill="#16181d" font-weight="700">C · Agreed: Invoice stays inline</text><rect x="40" y="136" width="1200" height="482" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="56" y="166" font-size="16" fill="#1a5fd0" font-weight="700">Restaurante Olivo S.L.</text><text x="56" y="198" font-size="17" fill="#16181d" font-weight="700">Full invoice F/1042 · Invoice chosen</text><rect x="56" y="234" width="1168" height="88" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="68" y="260" font-size="16" fill="#16181d" font-weight="700">Invoice printer ▸ · Change</text><text x="68" y="286" font-size="15" fill="#5c626e">Office · A4</text><rect x="56" y="334" width="1168" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="68" y="360" font-size="16" fill="#16181d" font-weight="700">When expanded, in this same form</text><text x="68" y="386" font-size="15" fill="#5c626e">Office · A4 / Terrace belt · receipt paper</text><text x="56" y="442" font-size="16" fill="#5c626e">The folded printer row stays beside the named final print action. No separate printer step. This example assumes Office is eligible; it approves no invoice memory.</text><rect x="56" y="480" width="90" height="42" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="68" y="507" font-size="15" fill="#1a5fd0">Cancel</text><rect x="56" y="534" width="1168" height="64" rx="8" fill="#1f6feb" stroke="#d6d9e0"/><text x="68" y="562" font-size="16" fill="#ffffff" font-weight="700">Print a copy on Office</text><text x="40" y="652" font-size="19" fill="#16181d" font-weight="700">D · Recommended: open Receipt directly</text><rect x="40" y="684" width="1200" height="582" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="56" y="714" font-size="16" fill="#1a5fd0" font-weight="700">Restaurante Olivo S.L.</text><text x="56" y="746" font-size="17" fill="#16181d" font-weight="700">Simplified invoice S/318 · €14.50 · Spanish · 1 guest</text><rect x="56" y="782" width="1168" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="68" y="808" font-size="16" fill="#16181d" font-weight="700">Receipt · Simplified invoice</text><text x="68" y="834" font-size="15" fill="#5c626e">Same recorded S/318; no full invoice is issued</text><rect x="56" y="882" width="1168" height="88" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="68" y="908" font-size="16" fill="#16181d" font-weight="700">Receipt printer ▸ · Change</text><text x="68" y="934" font-size="15" fill="#5c626e">Patio receipt · current Equipment choice</text><rect x="56" y="982" width="1168" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="68" y="1008" font-size="16" fill="#16181d" font-weight="700">Expand to change the printer</text><text x="68" y="1034" font-size="15" fill="#5c626e">Bar receipt / Patio receipt</text><text x="56" y="1090" font-size="16" fill="#5c626e">Open this receipt form directly. Keep the recorded sale facts and the offered language choice. Printing needs the final named press. Selecting or folding never prints.</text><rect x="56" y="1128" width="90" height="42" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="68" y="1155" font-size="15" fill="#1a5fd0">Cancel</text><rect x="56" y="1182" width="1168" height="64" rx="8" fill="#1f6feb" stroke="#d6d9e0"/><text x="68" y="1210" font-size="16" fill="#ffffff" font-weight="700">Print a copy on Patio receipt</text><text x="40" y="1300" font-size="19" fill="#16181d" font-weight="700">D · Alternative: show the document choice</text><rect x="40" y="1332" width="1200" height="482" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="56" y="1362" font-size="16" fill="#1a5fd0" font-weight="700">Restaurante Olivo S.L.</text><text x="56" y="1394" font-size="17" fill="#16181d" font-weight="700">The same S/318 · before its receipt form</text><rect x="56" y="1430" width="1168" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="68" y="1456" font-size="16" fill="#16181d" font-weight="700">● Receipt</text><text x="68" y="1482" font-size="15" fill="#5c626e">The only available document</text><rect x="56" y="1530" width="1168" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="68" y="1556" font-size="16" fill="#16181d" font-weight="700">Invoice · unavailable</text><text x="68" y="1582" font-size="15" fill="#5c626e">This reprint action does not issue a full invoice</text><text x="56" y="1638" font-size="16" fill="#5c626e">Add this document step, then open the same receipt form. The question is whether this extra choice helps. Neither alternative converts the sale.</text><rect x="56" y="1676" width="90" height="42" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="68" y="1703" font-size="15" fill="#1a5fd0">Cancel</text><rect x="56" y="1730" width="1168" height="64" rx="8" fill="#1f6feb" stroke="#d6d9e0"/><text x="68" y="1758" font-size="16" fill="#ffffff" font-weight="700">Continue with Receipt</text><text x="40" y="1848" font-size="14" fill="#5c626e">D is unapproved. Device examples use the receipt list and single Equipment setting. Dashboard uses B: every active printer at the sale venue. Storage, fallback and portable-holder details</text><text x="40" y="1872" font-size="14" fill="#5c626e">remain open. Static drawings only; no product or physical-paper checks.</text></g></svg>