<svg xmlns="http://www.w3.org/2000/svg" width="390" height="2348" viewBox="0 0 390 2348"><title>A790 · Factura acordada; venta simplificada</title><rect width="390" height="2348" fill="#f7f7f8"/><g font-family="Arial, sans-serif"><text x="18" y="32" font-size="21" fill="#16181d" font-weight="700">A790 · Factura acordada; venta</text><text x="18" y="56" font-size="21" fill="#16181d" font-weight="700">simplificada</text><text x="18" y="84" font-size="14" fill="#1a5fd0">C aprobada · D es una pregunta · sin desarrollo</text><text x="18" y="128" font-size="19" fill="#16181d" font-weight="700">C · Acordado: Factura en el formulario</text><rect x="18" y="160" width="354" height="578" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="34" y="190" font-size="16" fill="#1a5fd0" font-weight="700">Restaurante Olivo S.L.</text><text x="34" y="222" font-size="17" fill="#16181d" font-weight="700">Factura completa F/1042 · Factura</text><text x="34" y="246" font-size="17" fill="#16181d" font-weight="700">elegida</text><rect x="34" y="282" width="322" height="88" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="46" y="308" font-size="16" fill="#16181d" font-weight="700">Impresora de facturas ▸ · Cambiar</text><text x="46" y="334" font-size="15" fill="#5c626e">Office · A4</text><rect x="34" y="382" width="322" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="408" font-size="16" fill="#16181d" font-weight="700">Al desplegar, en el mismo formulario</text><text x="46" y="434" font-size="15" fill="#5c626e">Office · A4 / Terrace belt · papel de recibo</text><text x="34" y="490" font-size="16" fill="#5c626e">La fila plegada sigue junto al botón final con</text><text x="34" y="514" font-size="16" fill="#5c626e">el nombre. Sin otro paso para elegir</text><text x="34" y="538" font-size="16" fill="#5c626e">impresora. Office se supone válida; no se</text><text x="34" y="562" font-size="16" fill="#5c626e">aprueba otra memoria de facturas.</text><rect x="34" y="600" width="90" height="42" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="627" font-size="15" fill="#1a5fd0">Cancelar</text><rect x="34" y="654" width="322" height="64" rx="8" fill="#1f6feb" stroke="#d6d9e0"/><text x="46" y="682" font-size="16" fill="#ffffff" font-weight="700">Imprimir una copia en Office</text><text x="18" y="772" font-size="19" fill="#16181d" font-weight="700">D · Recomendado: abrir Recibo</text><text x="18" y="796" font-size="19" fill="#16181d" font-weight="700">directamente</text><rect x="18" y="828" width="354" height="702" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="34" y="858" font-size="16" fill="#1a5fd0" font-weight="700">Restaurante Olivo S.L.</text><text x="34" y="890" font-size="17" fill="#16181d" font-weight="700">Factura simplificada S/318 · 14,50 € ·</text><text x="34" y="914" font-size="17" fill="#16181d" font-weight="700">Español · 1 comensal</text><rect x="34" y="950" width="322" height="112" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="976" font-size="16" fill="#16181d" font-weight="700">Recibo · Factura simplificada</text><text x="46" y="1002" font-size="15" fill="#5c626e">La misma S/318; no se emite una factura</text><text x="46" y="1026" font-size="15" fill="#5c626e">completa</text><rect x="34" y="1074" width="322" height="88" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="46" y="1100" font-size="16" fill="#16181d" font-weight="700">Impresora de recibos ▸ · Cambiar</text><text x="46" y="1126" font-size="15" fill="#5c626e">Patio receipt · elección actual de Equipo</text><rect x="34" y="1174" width="322" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="1200" font-size="16" fill="#16181d" font-weight="700">Desplegar para cambiar impresora</text><text x="46" y="1226" font-size="15" fill="#5c626e">Bar receipt / Patio receipt</text><text x="34" y="1282" font-size="16" fill="#5c626e">Abre este formulario directamente. Conserva</text><text x="34" y="1306" font-size="16" fill="#5c626e">los datos guardados y la elección de idioma</text><text x="34" y="1330" font-size="16" fill="#5c626e">ofrecida. Imprimir requiere pulsar el botón</text><text x="34" y="1354" font-size="16" fill="#5c626e">final. Elegir o plegar no imprime.</text><rect x="34" y="1392" width="90" height="42" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="1419" font-size="15" fill="#1a5fd0">Cancelar</text><rect x="34" y="1446" width="322" height="64" rx="8" fill="#1f6feb" stroke="#d6d9e0"/><text x="46" y="1474" font-size="16" fill="#ffffff" font-weight="700">Imprimir una copia en Patio receipt</text><text x="18" y="1564" font-size="19" fill="#16181d" font-weight="700">D · Alternativa: elegir el documento</text><rect x="18" y="1596" width="354" height="554" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="34" y="1626" font-size="16" fill="#1a5fd0" font-weight="700">Restaurante Olivo S.L.</text><text x="34" y="1658" font-size="17" fill="#16181d" font-weight="700">La misma S/318 · antes del formulario</text><rect x="34" y="1694" width="322" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="1720" font-size="16" fill="#16181d" font-weight="700">● Recibo</text><text x="46" y="1746" font-size="15" fill="#5c626e">El único documento disponible</text><rect x="34" y="1794" width="322" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="1820" font-size="16" fill="#16181d" font-weight="700">Factura · no disponible</text><text x="46" y="1846" font-size="15" fill="#5c626e">Reimprimir no emite una factura completa</text><text x="34" y="1902" font-size="16" fill="#5c626e">Añade este paso y después abre el mismo</text><text x="34" y="1926" font-size="16" fill="#5c626e">formulario. La pregunta es si ayuda esa</text><text x="34" y="1950" font-size="16" fill="#5c626e">elección adicional. Ninguna alternativa</text><text x="34" y="1974" font-size="16" fill="#5c626e">convierte la venta.</text><rect x="34" y="2012" width="90" height="42" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="2039" font-size="15" fill="#1a5fd0">Cancelar</text><rect x="34" y="2066" width="322" height="64" rx="8" fill="#1f6feb" stroke="#d6d9e0"/><text x="46" y="2094" font-size="16" fill="#ffffff" font-weight="700">Continuar con Recibo</text><text x="18" y="2184" font-size="14" fill="#5c626e">D no está aprobada. En el dispositivo se usa la lista de</text><text x="18" y="2208" font-size="14" fill="#5c626e">recibos y un solo ajuste de Equipo. El panel sigue B:</text><text x="18" y="2232" font-size="14" fill="#5c626e">todas las impresoras activas del local de la venta.</text><text x="18" y="2256" font-size="14" fill="#5c626e">Almacenamiento, alternativas y uso de portátiles siguen</text><text x="18" y="2280" font-size="14" fill="#5c626e">abiertos. Dibujos estáticos, sin pruebas del producto ni</text><text x="18" y="2304" font-size="14" fill="#5c626e">del papel.</text></g></svg>