<svg xmlns="http://www.w3.org/2000/svg" width="390" height="2348" viewBox="0 0 390 2348"><title>A790 · Invoice agreed; simplified sale next</title><rect width="390" height="2348" fill="#f7f7f8"/><g font-family="Arial, sans-serif"><text x="18" y="32" font-size="21" fill="#16181d" font-weight="700">A790 · Invoice agreed; simplified</text><text x="18" y="56" font-size="21" fill="#16181d" font-weight="700">sale next</text><text x="18" y="84" font-size="14" fill="#1a5fd0">C approved · D is one question · no product build</text><text x="18" y="128" font-size="19" fill="#16181d" font-weight="700">C · Agreed: Invoice stays inline</text><rect x="18" y="160" width="354" height="554" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="34" y="190" font-size="16" fill="#1a5fd0" font-weight="700">Restaurante Olivo S.L.</text><text x="34" y="222" font-size="17" fill="#16181d" font-weight="700">Full invoice F/1042 · Invoice chosen</text><rect x="34" y="258" width="322" height="88" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="46" y="284" font-size="16" fill="#16181d" font-weight="700">Invoice printer ▸ · Change</text><text x="46" y="310" font-size="15" fill="#5c626e">Office · A4</text><rect x="34" y="358" width="322" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="384" font-size="16" fill="#16181d" font-weight="700">When expanded, in this same form</text><text x="46" y="410" font-size="15" fill="#5c626e">Office · A4 / Terrace belt · receipt paper</text><text x="34" y="466" font-size="16" fill="#5c626e">The folded printer row stays beside the</text><text x="34" y="490" font-size="16" fill="#5c626e">named final print action. No separate printer</text><text x="34" y="514" font-size="16" fill="#5c626e">step. This example assumes Office is</text><text x="34" y="538" font-size="16" fill="#5c626e">eligible; it approves no invoice memory.</text><rect x="34" y="576" width="90" height="42" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="603" font-size="15" fill="#1a5fd0">Cancel</text><rect x="34" y="630" width="322" height="64" rx="8" fill="#1f6feb" stroke="#d6d9e0"/><text x="46" y="658" font-size="16" fill="#ffffff" font-weight="700">Print a copy on Office</text><text x="18" y="748" font-size="19" fill="#16181d" font-weight="700">D · Recommended: open Receipt</text><text x="18" y="772" font-size="19" fill="#16181d" font-weight="700">directly</text><rect x="18" y="804" width="354" height="702" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="34" y="834" font-size="16" fill="#1a5fd0" font-weight="700">Restaurante Olivo S.L.</text><text x="34" y="866" font-size="17" fill="#16181d" font-weight="700">Simplified invoice S/318 · €14.50 ·</text><text x="34" y="890" font-size="17" fill="#16181d" font-weight="700">Spanish · 1 guest</text><rect x="34" y="926" width="322" height="112" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="952" font-size="16" fill="#16181d" font-weight="700">Receipt · Simplified invoice</text><text x="46" y="978" font-size="15" fill="#5c626e">Same recorded S/318; no full invoice is</text><text x="46" y="1002" font-size="15" fill="#5c626e">issued</text><rect x="34" y="1050" width="322" height="88" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="46" y="1076" font-size="16" fill="#16181d" font-weight="700">Receipt printer ▸ · Change</text><text x="46" y="1102" font-size="15" fill="#5c626e">Patio receipt · current Equipment choice</text><rect x="34" y="1150" width="322" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="1176" font-size="16" fill="#16181d" font-weight="700">Expand to change the printer</text><text x="46" y="1202" font-size="15" fill="#5c626e">Bar receipt / Patio receipt</text><text x="34" y="1258" font-size="16" fill="#5c626e">Open this receipt form directly. Keep the</text><text x="34" y="1282" font-size="16" fill="#5c626e">recorded sale facts and the offered language</text><text x="34" y="1306" font-size="16" fill="#5c626e">choice. Printing needs the final named press.</text><text x="34" y="1330" font-size="16" fill="#5c626e">Selecting or folding never prints.</text><rect x="34" y="1368" width="90" height="42" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="1395" font-size="15" fill="#1a5fd0">Cancel</text><rect x="34" y="1422" width="322" height="64" rx="8" fill="#1f6feb" stroke="#d6d9e0"/><text x="46" y="1450" font-size="16" fill="#ffffff" font-weight="700">Print a copy on Patio receipt</text><text x="18" y="1540" font-size="19" fill="#16181d" font-weight="700">D · Alternative: show the document</text><text x="18" y="1564" font-size="19" fill="#16181d" font-weight="700">choice</text><rect x="18" y="1596" width="354" height="578" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="34" y="1626" font-size="16" fill="#1a5fd0" font-weight="700">Restaurante Olivo S.L.</text><text x="34" y="1658" font-size="17" fill="#16181d" font-weight="700">The same S/318 · before its receipt form</text><rect x="34" y="1694" width="322" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="1720" font-size="16" fill="#16181d" font-weight="700">● Receipt</text><text x="46" y="1746" font-size="15" fill="#5c626e">The only available document</text><rect x="34" y="1794" width="322" height="112" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="1820" font-size="16" fill="#16181d" font-weight="700">Invoice · unavailable</text><text x="46" y="1846" font-size="15" fill="#5c626e">This reprint action does not issue a full</text><text x="46" y="1870" font-size="15" fill="#5c626e">invoice</text><text x="34" y="1926" font-size="16" fill="#5c626e">Add this document step, then open the same</text><text x="34" y="1950" font-size="16" fill="#5c626e">receipt form. The question is whether this</text><text x="34" y="1974" font-size="16" fill="#5c626e">extra choice helps. Neither alternative</text><text x="34" y="1998" font-size="16" fill="#5c626e">converts the sale.</text><rect x="34" y="2036" width="90" height="42" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="2063" font-size="15" fill="#1a5fd0">Cancel</text><rect x="34" y="2090" width="322" height="64" rx="8" fill="#1f6feb" stroke="#d6d9e0"/><text x="46" y="2118" font-size="16" fill="#ffffff" font-weight="700">Continue with Receipt</text><text x="18" y="2208" font-size="14" fill="#5c626e">D is unapproved. Device examples use the receipt list</text><text x="18" y="2232" font-size="14" fill="#5c626e">and single Equipment setting. Dashboard uses B: every</text><text x="18" y="2256" font-size="14" fill="#5c626e">active printer at the sale venue. Storage, fallback and</text><text x="18" y="2280" font-size="14" fill="#5c626e">portable-holder details remain open. Static drawings</text><text x="18" y="2304" font-size="14" fill="#5c626e">only; no product or physical-paper checks.</text></g></svg>