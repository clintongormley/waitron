e="14">A4</text><text x="211.0" y="519" fill="#eceef2" font-size="14" font-weight="700">F/1042</text><text x="211.0" y="551" fill="#eceef2" font-size="14">Mar Azul SL</text><text x="211.0" y="583" fill="#eceef2" font-size="14">86,40 €</text><text x="36" y="636" fill="#a1a7b3" font-size="16">Propuesta: ambos conservan F/1042 y los</text><text x="36" y="660" fill="#a1a7b3" font-size="16">datos del cliente. La lista de facturas incluye</text><text x="36" y="684" fill="#a1a7b3" font-size="16">A4 y papel de recibo. Una sola opción</text><text x="36" y="708" fill="#a1a7b3" font-size="16">Factura completa o un recibo de pago</text><text x="36" y="732" fill="#a1a7b3" font-size="16">separado son las alternativas.</text><rect x="36" y="776" width="80" height="44" rx="8" fill="#191c22" stroke="#333945"/><text x="48" y="804" fill="#78a9ff" font-size="16">Cancelar</text><rect x="36" y="832" width="318" height="52" rx="8" fill="#4c8dff" stroke="#333945"/><text x="48" y="864" fill="#06101f" font-size="15">Elegir impresora</text></g></g></svg>