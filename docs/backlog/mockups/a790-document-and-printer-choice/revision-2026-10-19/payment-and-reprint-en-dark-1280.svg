<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1792" viewBox="0 0 1280 1792"><title>A790 · receipt printers stay in the form</title><rect width="1280" height="1792" fill="#101216"/><g font-family="Arial, sans-serif"><text x="40" y="32" font-size="21" fill="#eceef2" font-weight="700">A790 · receipt printers stay in the form</text><text x="40" y="60" font-size="14" fill="#78a9ff">A approved · B, C, D and storage still pending</text><text x="40" y="104" font-size="19" fill="#eceef2" font-weight="700">1 · Payment · equipment collapsed</text><rect x="40" y="136" width="1200" height="382" rx="8" fill="#22262e" stroke="#333945"/><text x="56" y="166" font-size="16" fill="#78a9ff" font-weight="700">Restaurante Olivo S.L.</text><text x="56" y="198" font-size="17" fill="#eceef2" font-weight="700">Table 12 · €86.40</text><rect x="56" y="234" width="1168" height="88" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="68" y="260" font-size="16" fill="#eceef2" font-weight="700">Equipment ▸</text><text x="68" y="286" font-size="15" fill="#a1a7b3">Reader: Terrace reader · Receipt: Bar receipt</text><text x="56" y="342" font-size="16" fill="#a1a7b3">The last-used eligible receipt printer is selected. Expand only to change it. The payment press confirms the displayed receipt destination.</text><rect x="56" y="380" width="90" height="42" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="407" font-size="15" fill="#78a9ff">Cancel</text><rect x="56" y="434" width="1168" height="64" rx="8" fill="#4c8dff" stroke="#333945"/><text x="68" y="462" font-size="16" fill="#06101f" font-weight="700">Pay €86.40</text><text x="40" y="552" font-size="19" fill="#eceef2" font-weight="700">2 · The same payment form · expanded</text><rect x="40" y="584" width="1200" height="482" rx="8" fill="#22262e" stroke="#333945"/><text x="56" y="614" font-size="16" fill="#78a9ff" font-weight="700">Restaurante Olivo S.L.</text><text x="56" y="646" font-size="17" fill="#eceef2" font-weight="700">Table 12 · €86.40</text><rect x="56" y="682" width="1168" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="708" font-size="16" fill="#eceef2" font-weight="700">Card reader</text><text x="68" y="734" font-size="15" fill="#a1a7b3">Terrace reader ▾</text><rect x="56" y="782" width="1168" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="808" font-size="16" fill="#eceef2" font-weight="700">Receipt printer</text><text x="68" y="834" font-size="15" fill="#a1a7b3">Bar receipt ▾</text><text x="56" y="890" font-size="16" fill="#a1a7b3">Both selectors belong here. A796 owns the card reader. A790 follows its receipt-printer choice. Changing a row never sends payment or prints.</text><rect x="56" y="928" width="90" height="42" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="955" font-size="15" fill="#78a9ff">Cancel</text><rect x="56" y="982" width="1168" height="64" rx="8" fill="#4c8dff" stroke="#333945"/><text x="68" y="1010" font-size="16" fill="#06101f" font-weight="700">Pay €86.40</text><text x="40" y="1100" font-size="19" fill="#eceef2" font-weight="700">3 · After payment · Print/reprint</text><rect x="40" y="1132" width="1200" height="582" rx="8" fill="#22262e" stroke="#333945"/><text x="56" y="1162" font-size="16" fill="#78a9ff" font-weight="700">Restaurante Olivo S.L.</text><text x="56" y="1194" font-size="17" fill="#eceef2" font-weight="700">Full invoice F/1042 · Mar Azul SL</text><rect x="56" y="1230" width="1168" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="1256" font-size="16" fill="#eceef2" font-weight="700">● Receipt</text><text x="68" y="1282" font-size="15" fill="#a1a7b3">Compact F/1042 · receipt-printer list</text><rect x="56" y="1330" width="1168" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="1356" font-size="16" fill="#eceef2" font-weight="700">○ Invoice</text><text x="68" y="1382" font-size="15" fill="#a1a7b3">Same F/1042 · invoice-printer list</text><rect x="56" y="1430" width="1168" height="88" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="68" y="1456" font-size="16" fill="#eceef2" font-weight="700">Receipt printer ▸</text><text x="68" y="1482" font-size="15" fill="#a1a7b3">Bar receipt · last used</text><text x="56" y="1538" font-size="16" fill="#a1a7b3">Receipt uses an inline collapsible selector, with no extra printer screen. This proposed document layout still needs C. The named press queues this copy.</text><rect x="56" y="1576" width="90" height="42" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="1603" font-size="15" fill="#78a9ff">Cancel</text><rect x="56" y="1630" width="1168" height="64" rx="8" fill="#4c8dff" stroke="#333945"/><text x="68" y="1658" font-size="16" fill="#06101f" font-weight="700">Print a copy on Bar receipt</text><text x="40" y="1748" font-size="14" fill="#a1a7b3">Static design aid. Spanish wording and remaining design choices need agreement. No product or paper test.</text></g></svg>