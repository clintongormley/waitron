<svg xmlns="http://www.w3.org/2000/svg" width="390" height="2104" viewBox="0 0 390 2104"><title>A790 · receipt printers stay in the form</title><rect width="390" height="2104" fill="#f7f7f8"/><g font-family="Arial, sans-serif"><text x="18" y="32" font-size="21" fill="#16181d" font-weight="700">A790 · receipt printers stay in the</text><text x="18" y="56" font-size="21" fill="#16181d" font-weight="700">form</text><text x="18" y="84" font-size="14" fill="#1a5fd0">A approved · B, C, D and storage still pending</text><text x="18" y="128" font-size="19" fill="#16181d" font-weight="700">1 · Payment · equipment collapsed</text><rect x="18" y="160" width="354" height="454" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="34" y="190" font-size="16" fill="#1a5fd0" font-weight="700">Restaurante Olivo S.L.</text><text x="34" y="222" font-size="17" fill="#16181d" font-weight="700">Table 12 · €86.40</text><rect x="34" y="258" width="322" height="88" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="46" y="284" font-size="16" fill="#16181d" font-weight="700">Equipment ▸</text><text x="46" y="310" font-size="15" fill="#5c626e">Reader: Terrace reader · Receipt: Bar receipt</text><text x="34" y="366" font-size="16" fill="#5c626e">The last-used eligible receipt printer is</text><text x="34" y="390" font-size="16" fill="#5c626e">selected. Expand only to change it. The</text><text x="34" y="414" font-size="16" fill="#5c626e">payment press confirms the displayed receipt</text><text x="34" y="438" font-size="16" fill="#5c626e">destination.</text><rect x="34" y="476" width="90" height="42" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="503" font-size="15" fill="#1a5fd0">Cancel</text><rect x="34" y="530" width="322" height="64" rx="8" fill="#1f6feb" stroke="#d6d9e0"/><text x="46" y="558" font-size="16" fill="#ffffff" font-weight="700">Pay €86.40</text><text x="18" y="648" font-size="19" fill="#16181d" font-weight="700">2 · The same payment form ·</text><text x="18" y="672" font-size="19" fill="#16181d" font-weight="700">expanded</text><rect x="18" y="704" width="354" height="554" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="34" y="734" font-size="16" fill="#1a5fd0" font-weight="700">Restaurante Olivo S.L.</text><text x="34" y="766" font-size="17" fill="#16181d" font-weight="700">Table 12 · €86.40</text><rect x="34" y="802" width="322" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="828" font-size="16" fill="#16181d" font-weight="700">Card reader</text><text x="46" y="854" font-size="15" fill="#5c626e">Terrace reader ▾</text><rect x="34" y="902" width="322" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="928" font-size="16" fill="#16181d" font-weight="700">Receipt printer</text><text x="46" y="954" font-size="15" fill="#5c626e">Bar receipt ▾</text><text x="34" y="1010" font-size="16" fill="#5c626e">Both selectors belong here. A796 owns the</text><text x="34" y="1034" font-size="16" fill="#5c626e">card reader. A790 follows its receipt-printer</text><text x="34" y="1058" font-size="16" fill="#5c626e">choice. Changing a row never sends</text><text x="34" y="1082" font-size="16" fill="#5c626e">payment or prints.</text><rect x="34" y="1120" width="90" height="42" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="1147" font-size="15" fill="#1a5fd0">Cancel</text><rect x="34" y="1174" width="322" height="64" rx="8" fill="#1f6feb" stroke="#d6d9e0"/><text x="46" y="1202" font-size="16" fill="#ffffff" font-weight="700">Pay €86.40</text><text x="18" y="1292" font-size="19" fill="#16181d" font-weight="700">3 · After payment · Print/reprint</text><rect x="18" y="1324" width="354" height="654" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="34" y="1354" font-size="16" fill="#1a5fd0" font-weight="700">Restaurante Olivo S.L.</text><text x="34" y="1386" font-size="17" fill="#16181d" font-weight="700">Full invoice F/1042 · Mar Azul SL</text><rect x="34" y="1422" width="322" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="1448" font-size="16" fill="#16181d" font-weight="700">● Receipt</text><text x="46" y="1474" font-size="15" fill="#5c626e">Compact F/1042 · receipt-printer list</text><rect x="34" y="1522" width="322" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="1548" font-size="16" fill="#16181d" font-weight="700">○ Invoice</text><text x="46" y="1574" font-size="15" fill="#5c626e">Same F/1042 · invoice-printer list</text><rect x="34" y="1622" width="322" height="88" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="46" y="1648" font-size="16" fill="#16181d" font-weight="700">Receipt printer ▸</text><text x="46" y="1674" font-size="15" fill="#5c626e">Bar receipt · last used</text><text x="34" y="1730" font-size="16" fill="#5c626e">Receipt uses an inline collapsible selector,</text><text x="34" y="1754" font-size="16" fill="#5c626e">with no extra printer screen. This proposed</text><text x="34" y="1778" font-size="16" fill="#5c626e">document layout still needs C. The named</text><text x="34" y="1802" font-size="16" fill="#5c626e">press queues this copy.</text><rect x="34" y="1840" width="90" height="42" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="1867" font-size="15" fill="#1a5fd0">Cancel</text><rect x="34" y="1894" width="322" height="64" rx="8" fill="#1f6feb" stroke="#d6d9e0"/><text x="46" y="1922" font-size="16" fill="#ffffff" font-weight="700">Print a copy on Bar receipt</text><text x="18" y="2012" font-size="14" fill="#5c626e">Static design aid. Spanish wording and remaining</text><text x="18" y="2036" font-size="14" fill="#5c626e">design choices need agreement. No product or paper</text><text x="18" y="2060" font-size="14" fill="#5c626e">test.</text></g></svg>