<svg xmlns="http://www.w3.org/2000/svg" width="390" height="2056" viewBox="0 0 390 2056"><title>A790 · la impresora está en el formulario</title><rect width="390" height="2056" fill="#f7f7f8"/><g font-family="Arial, sans-serif"><text x="18" y="32" font-size="21" fill="#16181d" font-weight="700">A790 · la impresora está en el</text><text x="18" y="56" font-size="21" fill="#16181d" font-weight="700">formulario</text><text x="18" y="84" font-size="14" fill="#1a5fd0">A aprobada · B, C, D y almacenamiento pendientes</text><text x="18" y="128" font-size="19" fill="#16181d" font-weight="700">1 · Cobro · equipo plegado</text><rect x="18" y="160" width="354" height="454" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="34" y="190" font-size="16" fill="#1a5fd0" font-weight="700">Restaurante Olivo S.L.</text><text x="34" y="222" font-size="17" fill="#16181d" font-weight="700">Mesa 12 · 86,40 €</text><rect x="34" y="258" width="322" height="88" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="46" y="284" font-size="16" fill="#16181d" font-weight="700">Equipo ▸</text><text x="46" y="310" font-size="15" fill="#5c626e">Lector: Terrace reader · Recibo: Bar receipt</text><text x="34" y="366" font-size="16" fill="#5c626e">Se selecciona la última impresora de recibos</text><text x="34" y="390" font-size="16" fill="#5c626e">permitida. Despliega para cambiarla. Al</text><text x="34" y="414" font-size="16" fill="#5c626e">cobrar confirmas el destino del recibo</text><text x="34" y="438" font-size="16" fill="#5c626e">mostrado.</text><rect x="34" y="476" width="90" height="42" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="503" font-size="15" fill="#1a5fd0">Cancelar</text><rect x="34" y="530" width="322" height="64" rx="8" fill="#1f6feb" stroke="#d6d9e0"/><text x="46" y="558" font-size="16" fill="#ffffff" font-weight="700">Cobrar 86,40 €</text><text x="18" y="648" font-size="19" fill="#16181d" font-weight="700">2 · El mismo formulario · desplegado</text><rect x="18" y="680" width="354" height="530" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="34" y="710" font-size="16" fill="#1a5fd0" font-weight="700">Restaurante Olivo S.L.</text><text x="34" y="742" font-size="17" fill="#16181d" font-weight="700">Mesa 12 · 86,40 €</text><rect x="34" y="778" width="322" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="804" font-size="16" fill="#16181d" font-weight="700">Lector de tarjetas</text><text x="46" y="830" font-size="15" fill="#5c626e">Terrace reader ▾</text><rect x="34" y="878" width="322" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="904" font-size="16" fill="#16181d" font-weight="700">Impresora de recibos</text><text x="46" y="930" font-size="15" fill="#5c626e">Bar receipt ▾</text><text x="34" y="986" font-size="16" fill="#5c626e">Ambos selectores están aquí. A796 define el</text><text x="34" y="1010" font-size="16" fill="#5c626e">lector. A790 sigue su elección de impresora.</text><text x="34" y="1034" font-size="16" fill="#5c626e">Elegir una opción no cobra ni imprime.</text><rect x="34" y="1072" width="90" height="42" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="1099" font-size="15" fill="#1a5fd0">Cancelar</text><rect x="34" y="1126" width="322" height="64" rx="8" fill="#1f6feb" stroke="#d6d9e0"/><text x="46" y="1154" font-size="16" fill="#ffffff" font-weight="700">Cobrar 86,40 €</text><text x="18" y="1244" font-size="19" fill="#16181d" font-weight="700">3 · Tras el pago · imprimir de nuevo</text><rect x="18" y="1276" width="354" height="654" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="34" y="1306" font-size="16" fill="#1a5fd0" font-weight="700">Restaurante Olivo S.L.</text><text x="34" y="1338" font-size="17" fill="#16181d" font-weight="700">Factura F/1042 · Mar Azul SL</text><rect x="34" y="1374" width="322" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="1400" font-size="16" fill="#16181d" font-weight="700">● Recibo</text><text x="46" y="1426" font-size="15" fill="#5c626e">F/1042 compacta · lista de recibos</text><rect x="34" y="1474" width="322" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="1500" font-size="16" fill="#16181d" font-weight="700">○ Factura</text><text x="46" y="1526" font-size="15" fill="#5c626e">Misma F/1042 · lista de facturas</text><rect x="34" y="1574" width="322" height="88" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="46" y="1600" font-size="16" fill="#16181d" font-weight="700">Impresora de recibos ▸</text><text x="46" y="1626" font-size="15" fill="#5c626e">Bar receipt · última utilizada</text><text x="34" y="1682" font-size="16" fill="#5c626e">Recibo usa un selector plegable, sin otra</text><text x="34" y="1706" font-size="16" fill="#5c626e">pantalla. La disposición del documento aún</text><text x="34" y="1730" font-size="16" fill="#5c626e">requiere C. El botón con nombre envía esta</text><text x="34" y="1754" font-size="16" fill="#5c626e">copia a la cola.</text><rect x="34" y="1792" width="90" height="42" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="1819" font-size="15" fill="#1a5fd0">Cancelar</text><rect x="34" y="1846" width="322" height="64" rx="8" fill="#1f6feb" stroke="#d6d9e0"/><text x="46" y="1874" font-size="16" fill="#ffffff" font-weight="700">Imprimir una copia en Bar receipt</text><text x="18" y="1964" font-size="14" fill="#5c626e">Diseño estático. Textos propuestos y decisiones</text><text x="18" y="1988" font-size="14" fill="#5c626e">pendientes. No es una prueba del producto ni del</text><text x="18" y="2012" font-size="14" fill="#5c626e">papel.</text></g></svg>