<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1792" viewBox="0 0 1280 1792"><title>A790 · la impresora está en el formulario</title><rect width="1280" height="1792" fill="#101216"/><g font-family="Arial, sans-serif"><text x="40" y="32" font-size="21" fill="#eceef2" font-weight="700">A790 · la impresora está en el formulario</text><text x="40" y="60" font-size="14" fill="#78a9ff">A aprobada · B, C, D y almacenamiento pendientes</text><text x="40" y="104" font-size="19" fill="#eceef2" font-weight="700">1 · Cobro · equipo plegado</text><rect x="40" y="136" width="1200" height="382" rx="8" fill="#22262e" stroke="#333945"/><text x="56" y="166" font-size="16" fill="#78a9ff" font-weight="700">Restaurante Olivo S.L.</text><text x="56" y="198" font-size="17" fill="#eceef2" font-weight="700">Mesa 12 · 86,40 €</text><rect x="56" y="234" width="1168" height="88" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="68" y="260" font-size="16" fill="#eceef2" font-weight="700">Equipo ▸</text><text x="68" y="286" font-size="15" fill="#a1a7b3">Lector: Terrace reader · Recibo: Bar receipt</text><text x="56" y="342" font-size="16" fill="#a1a7b3">Se selecciona la última impresora de recibos permitida. Despliega para cambiarla. Al cobrar confirmas el destino del recibo mostrado.</text><rect x="56" y="380" width="90" height="42" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="407" font-size="15" fill="#78a9ff">Cancelar</text><rect x="56" y="434" width="1168" height="64" rx="8" fill="#4c8dff" stroke="#333945"/><text x="68" y="462" font-size="16" fill="#06101f" font-weight="700">Cobrar 86,40 €</text><text x="40" y="552" font-size="19" fill="#eceef2" font-weight="700">2 · El mismo formulario · desplegado</text><rect x="40" y="584" width="1200" height="482" rx="8" fill="#22262e" stroke="#333945"/><text x="56" y="614" font-size="16" fill="#78a9ff" font-weight="700">Restaurante Olivo S.L.</text><text x="56" y="646" font-size="17" fill="#eceef2" font-weight="700">Mesa 12 · 86,40 €</text><rect x="56" y="682" width="1168" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="708" font-size="16" fill="#eceef2" font-weight="700">Lector de tarjetas</text><text x="68" y="734" font-size="15" fill="#a1a7b3">Terrace reader ▾</text><rect x="56" y="782" width="1168" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="808" font-size="16" fill="#eceef2" font-weight="700">Impresora de recibos</text><text x="68" y="834" font-size="15" fill="#a1a7b3">Bar receipt ▾</text><text x="56" y="890" font-size="16" fill="#a1a7b3">Ambos selectores están aquí. A796 define el lector. A790 sigue su elección de impresora. Elegir una opción no cobra ni imprime.</text><rect x="56" y="928" width="90" height="42" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="955" font-size="15" fill="#78a9ff">Cancelar</text><rect x="56" y="982" width="1168" height="64" rx="8" fill="#4c8dff" stroke="#333945"/><text x="68" y="1010" font-size="16" fill="#06101f" font-weight="700">Cobrar 86,40 €</text><text x="40" y="1100" font-size="19" fill="#eceef2" font-weight="700">3 · Tras el pago · imprimir de nuevo</text><rect x="40" y="1132" width="1200" height="582" rx="8" fill="#22262e" stroke="#333945"/><text x="56" y="1162" font-size="16" fill="#78a9ff" font-weight="700">Restaurante Olivo S.L.</text><text x="56" y="1194" font-size="17" fill="#eceef2" font-weight="700">Factura F/1042 · Mar Azul SL</text><rect x="56" y="1230" width="1168" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="1256" font-size="16" fill="#eceef2" font-weight="700">● Recibo</text><text x="68" y="1282" font-size="15" fill="#a1a7b3">F/1042 compacta · lista de recibos</text><rect x="56" y="1330" width="1168" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="1356" font-size="16" fill="#eceef2" font-weight="700">○ Factura</text><text x="68" y="1382" font-size="15" fill="#a1a7b3">Misma F/1042 · lista de facturas</text><rect x="56" y="1430" width="1168" height="88" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="68" y="1456" font-size="16" fill="#eceef2" font-weight="700">Impresora de recibos ▸</text><text x="68" y="1482" font-size="15" fill="#a1a7b3">Bar receipt · última utilizada</text><text x="56" y="1538" font-size="16" fill="#a1a7b3">Recibo usa un selector plegable, sin otra pantalla. La disposición del documento aún requiere C. El botón con nombre envía esta copia a la cola.</text><rect x="56" y="1576" width="90" height="42" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="1603" font-size="15" fill="#78a9ff">Cancelar</text><rect x="56" y="1630" width="1168" height="64" rx="8" fill="#4c8dff" stroke="#333945"/><text x="68" y="1658" font-size="16" fill="#06101f" font-weight="700">Imprimir una copia en Bar receipt</text><text x="40" y="1748" font-size="14" fill="#a1a7b3">Diseño estático. Textos propuestos y decisiones pendientes. No es una prueba del producto ni del papel.</text></g></svg>