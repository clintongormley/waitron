<svg xmlns="http://www.w3.org/2000/svg" width="390" height="2572" viewBox="0 0 390 2572"><title>A790 · Compartir y volver a abrir</title><rect width="390" height="2572" fill="#f7f7f8"/><g font-family="Arial, sans-serif"><text x="18" y="32" font-size="21" fill="#16181d" font-weight="700">A790 · Compartir y volver a abrir</text><text x="18" y="60" font-size="14" fill="#1a5fd0">H acordada · I es una pregunta · solo diseño</text><text x="18" y="104" font-size="19" fill="#16181d" font-weight="700">H · Acordado: compartir en este</text><text x="18" y="128" font-size="19" fill="#16181d" font-weight="700">navegador</text><rect x="18" y="160" width="354" height="726" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="34" y="190" font-size="16" fill="#1a5fd0" font-weight="700">Restaurante Olivo S.L.</text><text x="34" y="222" font-size="17" fill="#16181d" font-weight="700">Harbour F/1042 · Recibo · mismo</text><text x="34" y="246" font-size="17" fill="#16181d" font-weight="700">navegador</text><rect x="34" y="282" width="322" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="308" font-size="16" fill="#16181d" font-weight="700">Luis imprimió antes en Bar receipt</text><text x="46" y="334" font-size="15" fill="#5c626e">Ana imprimió después en Patio receipt</text><rect x="34" y="382" width="322" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="408" font-size="16" fill="#16181d" font-weight="700">El servidor aceptó la solicitud de Ana</text><text x="46" y="434" font-size="15" fill="#5c626e">Ana sale; Luis inicia sesión</text><rect x="34" y="482" width="322" height="88" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="46" y="508" font-size="16" fill="#16181d" font-weight="700">Ambas válidas · Patio elegida para Luis</text><text x="46" y="534" font-size="15" fill="#5c626e">Imprimir una copia en Patio receipt</text><text x="34" y="590" font-size="16" fill="#5c626e">El navegador comparte las elecciones</text><text x="34" y="614" font-size="16" fill="#5c626e">aceptadas entre personas. Factura de</text><text x="34" y="638" font-size="16" fill="#5c626e">Harbour y Hillside siguen separados. La</text><text x="34" y="662" font-size="16" fill="#5c626e">memoria no da permisos: solo se muestran</text><text x="34" y="686" font-size="16" fill="#5c626e">impresoras válidas para Luis. Entrar no</text><text x="34" y="710" font-size="16" fill="#5c626e">imprime.</text><rect x="34" y="748" width="90" height="42" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="775" font-size="15" fill="#1a5fd0">Cancelar</text><rect x="34" y="802" width="322" height="64" rx="8" fill="#1f6feb" stroke="#d6d9e0"/><text x="46" y="830" font-size="16" fill="#ffffff" font-weight="700">Solo ejemplo · no imprime</text><text x="18" y="920" font-size="19" fill="#16181d" font-weight="700">I · Recomendado: recordar al volver</text><rect x="18" y="952" width="354" height="702" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="34" y="982" font-size="16" fill="#1a5fd0" font-weight="700">Restaurante Olivo S.L.</text><text x="34" y="1014" font-size="17" fill="#16181d" font-weight="700">Cerrar todas las ventanas y volver a</text><text x="34" y="1038" font-size="17" fill="#16181d" font-weight="700">abrir</text><rect x="34" y="1074" width="322" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="1100" font-size="16" fill="#16181d" font-weight="700">Antes de cerrar · destino aceptado</text><text x="46" y="1126" font-size="15" fill="#5c626e">Patio receipt · Recibo de Harbour</text><rect x="34" y="1174" width="322" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="1200" font-size="16" fill="#16181d" font-weight="700">Mismo navegador normal; entra Luis</text><text x="46" y="1226" font-size="15" fill="#5c626e">Bar y Patio siguen siendo válidas</text><rect x="34" y="1274" width="322" height="88" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="46" y="1300" font-size="16" fill="#16181d" font-weight="700">Recordar · Patio preseleccionada</text><text x="46" y="1326" font-size="15" fill="#5c626e">Imprimir una copia en Patio receipt</text><text x="34" y="1382" font-size="16" fill="#5c626e">Conservar el último destino aceptado al</text><text x="34" y="1406" font-size="16" fill="#5c626e">volver al puesto. En este ejemplo se</text><text x="34" y="1430" font-size="16" fill="#5c626e">conservan los datos del sitio. Aún hay que</text><text x="34" y="1454" font-size="16" fill="#5c626e">confirmar con el botón. No describe</text><text x="34" y="1478" font-size="16" fill="#5c626e">navegación privada ni datos borrados.</text><rect x="34" y="1516" width="90" height="42" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="1543" font-size="15" fill="#1a5fd0">Cancelar</text><rect x="34" y="1570" width="322" height="64" rx="8" fill="#1f6feb" stroke="#d6d9e0"/><text x="46" y="1598" font-size="16" fill="#ffffff" font-weight="700">Solo ejemplo · no imprime</text><text x="18" y="1688" font-size="19" fill="#16181d" font-weight="700">I · Alternativa: olvidar al cerrar</text><rect x="18" y="1720" width="354" height="678" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="34" y="1750" font-size="16" fill="#1a5fd0" font-weight="700">Restaurante Olivo S.L.</text><text x="34" y="1782" font-size="17" fill="#16181d" font-weight="700">Misma impresión aceptada; cerrar todo</text><rect x="34" y="1818" width="322" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="1844" font-size="16" fill="#16181d" font-weight="700">Nueva sesión · sin elección recordada</text><text x="46" y="1870" font-size="15" fill="#5c626e">Bar y Patio siguen siendo válidas</text><rect x="34" y="1918" width="322" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="1944" font-size="16" fill="#16181d" font-weight="700">Propuesta cuando hay varias válidas</text><text x="46" y="1970" font-size="15" fill="#5c626e">Elegir una impresora</text><rect x="34" y="2018" width="322" height="88" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="46" y="2044" font-size="16" fill="#16181d" font-weight="700">Después de que Luis elija Patio</text><text x="46" y="2070" font-size="15" fill="#5c626e">Imprimir una copia en Patio receipt</text><text x="34" y="2126" font-size="16" fill="#5c626e">H comparte elecciones durante una sesión</text><text x="34" y="2150" font-size="16" fill="#5c626e">del navegador. Salir de la cuenta no es cerrar</text><text x="34" y="2174" font-size="16" fill="#5c626e">el navegador. I solo pregunta qué pasa al</text><text x="34" y="2198" font-size="16" fill="#5c626e">volver; el mecanismo técnico se decidirá</text><text x="34" y="2222" font-size="16" fill="#5c626e">después. Ninguna selección imprime.</text><rect x="34" y="2260" width="90" height="42" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="2287" font-size="15" fill="#1a5fd0">Cancelar</text><rect x="34" y="2314" width="322" height="64" rx="8" fill="#1f6feb" stroke="#d6d9e0"/><text x="46" y="2342" font-size="16" fill="#ffffff" font-weight="700">Solo ejemplo · no imprime</text><text x="18" y="2432" font-size="14" fill="#5c626e">Panel sin perfil de dispositivo. I es una propuesta.</text><text x="18" y="2456" font-size="14" fill="#5c626e">Almacenamiento, caducidad, solicitudes tardías,</text><text x="18" y="2480" font-size="14" fill="#5c626e">memoria de Factura y portátiles siguen abiertos.</text><text x="18" y="2504" font-size="14" fill="#5c626e">Equipo sigue A796. Dibujos sin pruebas del producto ni</text><text x="18" y="2528" font-size="14" fill="#5c626e">del papel.</text></g></svg>