<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="2188" viewBox="0 0 1280 2188"><title>A790 · Compartir y volver a abrir</title><rect width="1280" height="2188" fill="#f7f7f8"/><g font-family="Arial, sans-serif"><text x="40" y="32" font-size="21" fill="#16181d" font-weight="700">A790 · Compartir y volver a abrir</text><text x="40" y="60" font-size="14" fill="#1a5fd0">H acordada · I es una pregunta · solo diseño</text><text x="40" y="104" font-size="19" fill="#16181d" font-weight="700">H · Acordado: compartir en este navegador</text><rect x="40" y="136" width="1200" height="606" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="56" y="166" font-size="16" fill="#1a5fd0" font-weight="700">Restaurante Olivo S.L.</text><text x="56" y="198" font-size="17" fill="#16181d" font-weight="700">Harbour F/1042 · Recibo · mismo navegador</text><rect x="56" y="234" width="1168" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="68" y="260" font-size="16" fill="#16181d" font-weight="700">Luis imprimió antes en Bar receipt</text><text x="68" y="286" font-size="15" fill="#5c626e">Ana imprimió después en Patio receipt</text><rect x="56" y="334" width="1168" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="68" y="360" font-size="16" fill="#16181d" font-weight="700">El servidor aceptó la solicitud de Ana</text><text x="68" y="386" font-size="15" fill="#5c626e">Ana sale; Luis inicia sesión</text><rect x="56" y="434" width="1168" height="88" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="68" y="460" font-size="16" fill="#16181d" font-weight="700">Ambas válidas · Patio elegida para Luis</text><text x="68" y="486" font-size="15" fill="#5c626e">Imprimir una copia en Patio receipt</text><text x="56" y="542" font-size="16" fill="#5c626e">El navegador comparte las elecciones aceptadas entre personas. Factura de Harbour y Hillside siguen separados. La memoria no da permisos: solo se muestran</text><text x="56" y="566" font-size="16" fill="#5c626e">impresoras válidas para Luis. Entrar no imprime.</text><rect x="56" y="604" width="90" height="42" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="68" y="631" font-size="15" fill="#1a5fd0">Cancelar</text><rect x="56" y="658" width="1168" height="64" rx="8" fill="#1f6feb" stroke="#d6d9e0"/><text x="68" y="686" font-size="16" fill="#ffffff" font-weight="700">Solo ejemplo · no imprime</text><text x="40" y="776" font-size="19" fill="#16181d" font-weight="700">I · Recomendado: recordar al volver</text><rect x="40" y="808" width="1200" height="606" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="56" y="838" font-size="16" fill="#1a5fd0" font-weight="700">Restaurante Olivo S.L.</text><text x="56" y="870" font-size="17" fill="#16181d" font-weight="700">Cerrar todas las ventanas y volver a abrir</text><rect x="56" y="906" width="1168" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="68" y="932" font-size="16" fill="#16181d" font-weight="700">Antes de cerrar · destino aceptado</text><text x="68" y="958" font-size="15" fill="#5c626e">Patio receipt · Recibo de Harbour</text><rect x="56" y="1006" width="1168" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="68" y="1032" font-size="16" fill="#16181d" font-weight="700">Mismo navegador normal; entra Luis</text><text x="68" y="1058" font-size="15" fill="#5c626e">Bar y Patio siguen siendo válidas</text><rect x="56" y="1106" width="1168" height="88" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="68" y="1132" font-size="16" fill="#16181d" font-weight="700">Recordar · Patio preseleccionada</text><text x="68" y="1158" font-size="15" fill="#5c626e">Imprimir una copia en Patio receipt</text><text x="56" y="1214" font-size="16" fill="#5c626e">Conservar el último destino aceptado al volver al puesto. En este ejemplo se conservan los datos del sitio. Aún hay que confirmar con el botón. No describe</text><text x="56" y="1238" font-size="16" fill="#5c626e">navegación privada ni datos borrados.</text><rect x="56" y="1276" width="90" height="42" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="68" y="1303" font-size="15" fill="#1a5fd0">Cancelar</text><rect x="56" y="1330" width="1168" height="64" rx="8" fill="#1f6feb" stroke="#d6d9e0"/><text x="68" y="1358" font-size="16" fill="#ffffff" font-weight="700">Solo ejemplo · no imprime</text><text x="40" y="1448" font-size="19" fill="#16181d" font-weight="700">I · Alternativa: olvidar al cerrar</text><rect x="40" y="1480" width="1200" height="606" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="56" y="1510" font-size="16" fill="#1a5fd0" font-weight="700">Restaurante Olivo S.L.</text><text x="56" y="1542" font-size="17" fill="#16181d" font-weight="700">Misma impresión aceptada; cerrar todo</text><rect x="56" y="1578" width="1168" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="68" y="1604" font-size="16" fill="#16181d" font-weight="700">Nueva sesión · sin elección recordada</text><text x="68" y="1630" font-size="15" fill="#5c626e">Bar y Patio siguen siendo válidas</text><rect x="56" y="1678" width="1168" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="68" y="1704" font-size="16" fill="#16181d" font-weight="700">Propuesta cuando hay varias válidas</text><text x="68" y="1730" font-size="15" fill="#5c626e">Elegir una impresora</text><rect x="56" y="1778" width="1168" height="88" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="68" y="1804" font-size="16" fill="#16181d" font-weight="700">Después de que Luis elija Patio</text><text x="68" y="1830" font-size="15" fill="#5c626e">Imprimir una copia en Patio receipt</text><text x="56" y="1886" font-size="16" fill="#5c626e">H comparte elecciones durante una sesión del navegador. Salir de la cuenta no es cerrar el navegador. I solo pregunta qué pasa al volver; el mecanismo técnico se</text><text x="56" y="1910" font-size="16" fill="#5c626e">decidirá después. Ninguna selección imprime.</text><rect x="56" y="1948" width="90" height="42" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="68" y="1975" font-size="15" fill="#1a5fd0">Cancelar</text><rect x="56" y="2002" width="1168" height="64" rx="8" fill="#1f6feb" stroke="#d6d9e0"/><text x="68" y="2030" font-size="16" fill="#ffffff" font-weight="700">Solo ejemplo · no imprime</text><text x="40" y="2120" font-size="14" fill="#5c626e">Panel sin perfil de dispositivo. I es una propuesta. Almacenamiento, caducidad, solicitudes tardías, memoria de Factura y portátiles siguen abiertos. Equipo sigue A796. Dibujos sin pruebas</text><text x="40" y="2144" font-size="14" fill="#5c626e">del producto ni del papel.</text></g></svg>