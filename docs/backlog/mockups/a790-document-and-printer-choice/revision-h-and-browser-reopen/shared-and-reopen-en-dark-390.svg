<svg xmlns="http://www.w3.org/2000/svg" width="390" height="2572" viewBox="0 0 390 2572"><title>A790 · Shared choices; reopening the browser</title><rect width="390" height="2572" fill="#101216"/><g font-family="Arial, sans-serif"><text x="18" y="32" font-size="21" fill="#eceef2" font-weight="700">A790 · Shared choices; reopening</text><text x="18" y="56" font-size="21" fill="#eceef2" font-weight="700">the browser</text><text x="18" y="84" font-size="14" fill="#78a9ff">H agreed · I is one question · design only</text><text x="18" y="128" font-size="19" fill="#eceef2" font-weight="700">H · Agreed: this browser shares</text><text x="18" y="152" font-size="19" fill="#eceef2" font-weight="700">choices</text><rect x="18" y="184" width="354" height="678" rx="8" fill="#22262e" stroke="#333945"/><text x="34" y="214" font-size="16" fill="#78a9ff" font-weight="700">Restaurante Olivo S.L.</text><text x="34" y="246" font-size="17" fill="#eceef2" font-weight="700">Harbour F/1042 Receipt · same browser</text><rect x="34" y="282" width="322" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="308" font-size="16" fill="#eceef2" font-weight="700">Luis earlier printed on Bar receipt</text><text x="46" y="334" font-size="15" fill="#a1a7b3">Ana later printed on Patio receipt</text><rect x="34" y="382" width="322" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="408" font-size="16" fill="#eceef2" font-weight="700">Server accepted Ana’s Patio request</text><text x="46" y="434" font-size="15" fill="#a1a7b3">Ana logs out; Luis signs in</text><rect x="34" y="482" width="322" height="88" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="46" y="508" font-size="16" fill="#eceef2" font-weight="700">Both eligible · Patio selected for Luis</text><text x="46" y="534" font-size="15" fill="#a1a7b3">Print a copy on Patio receipt</text><text x="34" y="590" font-size="16" fill="#a1a7b3">The browser shares accepted choices</text><text x="34" y="614" font-size="16" fill="#a1a7b3">between logins. Harbour’s Invoice and</text><text x="34" y="638" font-size="16" fill="#a1a7b3">Hillside remain separate. Memory grants no</text><text x="34" y="662" font-size="16" fill="#a1a7b3">permission: only printers currently eligible to</text><text x="34" y="686" font-size="16" fill="#a1a7b3">Luis may be shown. Signing in never prints.</text><rect x="34" y="724" width="90" height="42" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="751" font-size="15" fill="#78a9ff">Cancel</text><rect x="34" y="778" width="322" height="64" rx="8" fill="#4c8dff" stroke="#333945"/><text x="46" y="806" font-size="16" fill="#06101f" font-weight="700">Example only · no printing</text><text x="18" y="896" font-size="19" fill="#eceef2" font-weight="700">I · Recommended: remember after</text><text x="18" y="920" font-size="19" fill="#eceef2" font-weight="700">closing</text><rect x="18" y="952" width="354" height="702" rx="8" fill="#22262e" stroke="#333945"/><text x="34" y="982" font-size="16" fill="#78a9ff" font-weight="700">Restaurante Olivo S.L.</text><text x="34" y="1014" font-size="17" fill="#eceef2" font-weight="700">All browser windows close, then reopen</text><rect x="34" y="1050" width="322" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="1076" font-size="16" fill="#eceef2" font-weight="700">Before closing · accepted destination</text><text x="46" y="1102" font-size="15" fill="#a1a7b3">Patio receipt · Harbour Receipt</text><rect x="34" y="1150" width="322" height="112" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="1176" font-size="16" fill="#eceef2" font-weight="700">Reopen same normal browser; Luis</text><text x="46" y="1200" font-size="16" fill="#eceef2" font-weight="700">signs in</text><text x="46" y="1226" font-size="15" fill="#a1a7b3">Bar and Patio are both still eligible</text><rect x="34" y="1274" width="322" height="88" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="46" y="1300" font-size="16" fill="#eceef2" font-weight="700">Retain choice · Patio preselected</text><text x="46" y="1326" font-size="15" fill="#a1a7b3">Print a copy on Patio receipt</text><text x="34" y="1382" font-size="16" fill="#a1a7b3">Keep the last accepted destination when</text><text x="34" y="1406" font-size="16" fill="#a1a7b3">returning to this workstation. Site data is</text><text x="34" y="1430" font-size="16" fill="#a1a7b3">retained in this example. Final named</text><text x="34" y="1454" font-size="16" fill="#a1a7b3">confirmation still required. No claim about</text><text x="34" y="1478" font-size="16" fill="#a1a7b3">private browsing or cleared data.</text><rect x="34" y="1516" width="90" height="42" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="1543" font-size="15" fill="#78a9ff">Cancel</text><rect x="34" y="1570" width="322" height="64" rx="8" fill="#4c8dff" stroke="#333945"/><text x="46" y="1598" font-size="16" fill="#06101f" font-weight="700">Example only · no printing</text><text x="18" y="1688" font-size="19" fill="#eceef2" font-weight="700">I · Alternative: forget on browser close</text><rect x="18" y="1720" width="354" height="678" rx="8" fill="#22262e" stroke="#333945"/><text x="34" y="1750" font-size="16" fill="#78a9ff" font-weight="700">Restaurante Olivo S.L.</text><text x="34" y="1782" font-size="17" fill="#eceef2" font-weight="700">Same accepted print; close all windows</text><rect x="34" y="1818" width="322" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="1844" font-size="16" fill="#eceef2" font-weight="700">New browser session · no memory</text><text x="46" y="1870" font-size="15" fill="#a1a7b3">Bar and Patio are both still eligible</text><rect x="34" y="1918" width="322" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="1944" font-size="16" fill="#eceef2" font-weight="700">Proposed several-printer fallback</text><text x="46" y="1970" font-size="15" fill="#a1a7b3">Choose a printer</text><rect x="34" y="2018" width="322" height="88" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="46" y="2044" font-size="16" fill="#eceef2" font-weight="700">After Luis selects Patio explicitly</text><text x="46" y="2070" font-size="15" fill="#a1a7b3">Print a copy on Patio receipt</text><text x="34" y="2126" font-size="16" fill="#a1a7b3">H still shares choices during a browser</text><text x="34" y="2150" font-size="16" fill="#a1a7b3">session. Logout alone is not browser close. I</text><text x="34" y="2174" font-size="16" fill="#a1a7b3">asks about reopening only; technical storage</text><text x="34" y="2198" font-size="16" fill="#a1a7b3">and unusual browser lifecycles need a later</text><text x="34" y="2222" font-size="16" fill="#a1a7b3">builder proposal. No action prints by itself.</text><rect x="34" y="2260" width="90" height="42" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="2287" font-size="15" fill="#78a9ff">Cancel</text><rect x="34" y="2314" width="322" height="64" rx="8" fill="#4c8dff" stroke="#333945"/><text x="46" y="2342" font-size="16" fill="#06101f" font-weight="700">Example only · no printing</text><text x="18" y="2432" font-size="14" fill="#a1a7b3">Dashboard without a device profile. I is a proposal only.</text><text x="18" y="2456" font-size="14" fill="#a1a7b3">Storage, expiry/reset, late requests, device Invoice</text><text x="18" y="2480" font-size="14" fill="#a1a7b3">memory and portable receipt holding stay open. Phone</text><text x="18" y="2504" font-size="14" fill="#a1a7b3">Equipment follows A796. Static drawings, no runtime or</text><text x="18" y="2528" font-size="14" fill="#a1a7b3">paper evidence.</text></g></svg>