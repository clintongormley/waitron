<svg xmlns="http://www.w3.org/2000/svg" width="390" height="2548" viewBox="0 0 390 2548"><title>A790 · Volver y varias impresoras</title><rect width="390" height="2548" fill="#f7f7f8"/><g font-family="Arial, sans-serif"><text x="18" y="32" font-size="21" fill="#16181d" font-weight="700">A790 · Volver y varias impresoras</text><text x="18" y="60" font-size="14" fill="#1a5fd0">I acordada · J es una pregunta · dibujo estático</text><text x="18" y="104" font-size="19" fill="#16181d" font-weight="700">I · Acordado: conservar la elección</text><rect x="18" y="136" width="354" height="702" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="34" y="166" font-size="16" fill="#1a5fd0" font-weight="700">Restaurante Olivo S.L.</text><text x="34" y="198" font-size="17" fill="#16181d" font-weight="700">Mismo navegador normal · Harbour</text><text x="34" y="222" font-size="17" fill="#16181d" font-weight="700">F/1042 · Recibo</text><rect x="34" y="258" width="322" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="284" font-size="16" fill="#16181d" font-weight="700">Ana imprimió en Patio receipt</text><text x="46" y="310" font-size="15" fill="#5c626e">El servidor aceptó antes de cerrar todo</text><rect x="34" y="358" width="322" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="384" font-size="16" fill="#16181d" font-weight="700">Luis vuelve al mismo navegador</text><text x="46" y="410" font-size="15" fill="#5c626e">Bar y Patio siguen activas y válidas</text><rect x="34" y="458" width="322" height="88" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="46" y="484" font-size="16" fill="#16181d" font-weight="700">Se conserva la elección aceptada</text><text x="46" y="510" font-size="15" fill="#5c626e">Patio receipt seleccionada</text><text x="34" y="566" font-size="16" fill="#5c626e">Volver o iniciar sesión no imprime. Borrar los</text><text x="34" y="590" font-size="16" fill="#5c626e">datos del sitio olvida la elección. Factura de</text><text x="34" y="614" font-size="16" fill="#5c626e">Harbour y Hillside siguen separados. El</text><text x="34" y="638" font-size="16" fill="#5c626e">almacenamiento y los casos privados o</text><text x="34" y="662" font-size="16" fill="#5c626e">inusuales requieren un diseño posterior.</text><rect x="34" y="700" width="90" height="42" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="727" font-size="15" fill="#1a5fd0">Cancelar</text><rect x="34" y="754" width="322" height="64" rx="8" fill="#1f6feb" stroke="#d6d9e0"/><text x="46" y="782" font-size="16" fill="#ffffff" font-weight="700">Imprimir una copia en Patio receipt</text><text x="18" y="872" font-size="19" fill="#16181d" font-weight="700">J · Recomendado: eliges tú</text><rect x="18" y="904" width="354" height="726" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="34" y="934" font-size="16" fill="#1a5fd0" font-weight="700">Restaurante Olivo S.L.</text><text x="34" y="966" font-size="17" fill="#16181d" font-weight="700">Formulario nuevo · Harbour F/1042 ·</text><text x="34" y="990" font-size="17" fill="#16181d" font-weight="700">Recibo</text><rect x="34" y="1026" width="322" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="1052" font-size="16" fill="#16181d" font-weight="700">Bar receipt ya no está disponible</text><text x="46" y="1078" font-size="15" fill="#5c626e">Office · A4 y Patio receipt son válidas</text><rect x="34" y="1126" width="322" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="1152" font-size="16" fill="#16181d" font-weight="700">Impresora *</text><text x="46" y="1178" font-size="15" fill="#5c626e">Elige una impresora</text><rect x="34" y="1226" width="322" height="88" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="46" y="1252" font-size="16" fill="#16181d" font-weight="700">Sin destino seleccionado</text><text x="46" y="1278" font-size="15" fill="#5c626e">Imprimir espera tu elección</text><text x="34" y="1334" font-size="16" fill="#5c626e">Solo propuesta: tú eliges, no el orden de los</text><text x="34" y="1358" font-size="16" fill="#5c626e">nombres. Si Luis elige Patio receipt, el botón</text><text x="34" y="1382" font-size="16" fill="#5c626e">dice “Imprimir una copia en Patio receipt”</text><text x="34" y="1406" font-size="16" fill="#5c626e">cuando el servidor indica copia. El primer</text><text x="34" y="1430" font-size="16" fill="#5c626e">uso no inventa un aviso de impresora</text><text x="34" y="1454" font-size="16" fill="#5c626e">anterior.</text><rect x="34" y="1492" width="90" height="42" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="1519" font-size="15" fill="#1a5fd0">Cancelar</text><rect x="34" y="1546" width="322" height="64" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="1574" font-size="16" fill="#5c626e" font-weight="700">Imprimir</text><text x="18" y="1664" font-size="19" fill="#16181d" font-weight="700">J · Alternativa: primera por nombre</text><rect x="18" y="1696" width="354" height="702" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="34" y="1726" font-size="16" fill="#1a5fd0" font-weight="700">Restaurante Olivo S.L.</text><text x="34" y="1758" font-size="17" fill="#16181d" font-weight="700">Mismo formulario · dos impresoras</text><text x="34" y="1782" font-size="17" fill="#16181d" font-weight="700">válidas</text><rect x="34" y="1818" width="322" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="1844" font-size="16" fill="#16181d" font-weight="700">Bar receipt ya no está disponible</text><text x="46" y="1870" font-size="15" fill="#5c626e">Office · A4 es la primera por nombre</text><rect x="34" y="1918" width="322" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="1944" font-size="16" fill="#16181d" font-weight="700">Impresora *</text><text x="46" y="1970" font-size="15" fill="#5c626e">Office · A4 preseleccionada</text><rect x="34" y="2018" width="322" height="88" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="46" y="2044" font-size="16" fill="#16181d" font-weight="700">A4 es válida para Recibo según B</text><text x="46" y="2070" font-size="15" fill="#5c626e">Puedes elegir Patio de forma explícita</text><text x="34" y="2126" font-size="16" fill="#5c626e">Solo propuesta. Aún hay que confirmar con</text><text x="34" y="2150" font-size="16" fill="#5c626e">el botón. Elegir, plegar o leer no imprime ni</text><text x="34" y="2174" font-size="16" fill="#5c626e">cambia la memoria. F recuerda tras aceptar</text><text x="34" y="2198" font-size="16" fill="#5c626e">el servidor. G solo resuelve el caso de una</text><text x="34" y="2222" font-size="16" fill="#5c626e">impresora; aquí hay dos.</text><rect x="34" y="2260" width="90" height="42" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="2287" font-size="15" fill="#1a5fd0">Cancelar</text><rect x="34" y="2314" width="322" height="64" rx="8" fill="#1f6feb" stroke="#d6d9e0"/><text x="46" y="2342" font-size="16" fill="#ffffff" font-weight="700">Imprimir una copia en Office · A4</text><text x="18" y="2432" font-size="14" fill="#5c626e">Panel sin perfil de dispositivo. Se comprueban permisos</text><text x="18" y="2456" font-size="14" fill="#5c626e">e impresoras válidas. Memorias por local de venta y</text><text x="18" y="2480" font-size="14" fill="#5c626e">documento. Nada aquí ejecuta acciones: son dibujos,</text><text x="18" y="2504" font-size="14" fill="#5c626e">no pruebas del producto ni del papel.</text></g></svg>