<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="2188" viewBox="0 0 1280 2188"><title>A790 · Volver y varias impresoras</title><rect width="1280" height="2188" fill="#101216"/><g font-family="Arial, sans-serif"><text x="40" y="32" font-size="21" fill="#eceef2" font-weight="700">A790 · Volver y varias impresoras</text><text x="40" y="60" font-size="14" fill="#78a9ff">I acordada · J es una pregunta · dibujo estático</text><text x="40" y="104" font-size="19" fill="#eceef2" font-weight="700">I · Acordado: conservar la elección</text><rect x="40" y="136" width="1200" height="606" rx="8" fill="#22262e" stroke="#333945"/><text x="56" y="166" font-size="16" fill="#78a9ff" font-weight="700">Restaurante Olivo S.L.</text><text x="56" y="198" font-size="17" fill="#eceef2" font-weight="700">Mismo navegador normal · Harbour F/1042 · Recibo</text><rect x="56" y="234" width="1168" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="260" font-size="16" fill="#eceef2" font-weight="700">Ana imprimió en Patio receipt</text><text x="68" y="286" font-size="15" fill="#a1a7b3">El servidor aceptó antes de cerrar todo</text><rect x="56" y="334" width="1168" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="360" font-size="16" fill="#eceef2" font-weight="700">Luis vuelve al mismo navegador</text><text x="68" y="386" font-size="15" fill="#a1a7b3">Bar y Patio siguen activas y válidas</text><rect x="56" y="434" width="1168" height="88" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="68" y="460" font-size="16" fill="#eceef2" font-weight="700">Se conserva la elección aceptada</text><text x="68" y="486" font-size="15" fill="#a1a7b3">Patio receipt seleccionada</text><text x="56" y="542" font-size="16" fill="#a1a7b3">Volver o iniciar sesión no imprime. Borrar los datos del sitio olvida la elección. Factura de Harbour y Hillside siguen separados. El almacenamiento y los casos</text><text x="56" y="566" font-size="16" fill="#a1a7b3">privados o inusuales requieren un diseño posterior.</text><rect x="56" y="604" width="90" height="42" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="631" font-size="15" fill="#78a9ff">Cancelar</text><rect x="56" y="658" width="1168" height="64" rx="8" fill="#4c8dff" stroke="#333945"/><text x="68" y="686" font-size="16" fill="#06101f" font-weight="700">Imprimir una copia en Patio receipt</text><text x="40" y="776" font-size="19" fill="#eceef2" font-weight="700">J · Recomendado: eliges tú</text><rect x="40" y="808" width="1200" height="606" rx="8" fill="#22262e" stroke="#333945"/><text x="56" y="838" font-size="16" fill="#78a9ff" font-weight="700">Restaurante Olivo S.L.</text><text x="56" y="870" font-size="17" fill="#eceef2" font-weight="700">Formulario nuevo · Harbour F/1042 · Recibo</text><rect x="56" y="906" width="1168" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="932" font-size="16" fill="#eceef2" font-weight="700">Bar receipt ya no está disponible</text><text x="68" y="958" font-size="15" fill="#a1a7b3">Office · A4 y Patio receipt son válidas</text><rect x="56" y="1006" width="1168" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="1032" font-size="16" fill="#eceef2" font-weight="700">Impresora *</text><text x="68" y="1058" font-size="15" fill="#a1a7b3">Elige una impresora</text><rect x="56" y="1106" width="1168" height="88" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="68" y="1132" font-size="16" fill="#eceef2" font-weight="700">Sin destino seleccionado</text><text x="68" y="1158" font-size="15" fill="#a1a7b3">Imprimir espera tu elección</text><text x="56" y="1214" font-size="16" fill="#a1a7b3">Solo propuesta: tú eliges, no el orden de los nombres. Si Luis elige Patio receipt, el botón dice “Imprimir una copia en Patio receipt” cuando el servidor indica copia.</text><text x="56" y="1238" font-size="16" fill="#a1a7b3">El primer uso no inventa un aviso de impresora anterior.</text><rect x="56" y="1276" width="90" height="42" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="1303" font-size="15" fill="#78a9ff">Cancelar</text><rect x="56" y="1330" width="1168" height="64" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="1358" font-size="16" fill="#a1a7b3" font-weight="700">Imprimir</text><text x="40" y="1448" font-size="19" fill="#eceef2" font-weight="700">J · Alternativa: primera por nombre</text><rect x="40" y="1480" width="1200" height="606" rx="8" fill="#22262e" stroke="#333945"/><text x="56" y="1510" font-size="16" fill="#78a9ff" font-weight="700">Restaurante Olivo S.L.</text><text x="56" y="1542" font-size="17" fill="#eceef2" font-weight="700">Mismo formulario · dos impresoras válidas</text><rect x="56" y="1578" width="1168" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="1604" font-size="16" fill="#eceef2" font-weight="700">Bar receipt ya no está disponible</text><text x="68" y="1630" font-size="15" fill="#a1a7b3">Office · A4 es la primera por nombre</text><rect x="56" y="1678" width="1168" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="1704" font-size="16" fill="#eceef2" font-weight="700">Impresora *</text><text x="68" y="1730" font-size="15" fill="#a1a7b3">Office · A4 preseleccionada</text><rect x="56" y="1778" width="1168" height="88" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="68" y="1804" font-size="16" fill="#eceef2" font-weight="700">A4 es válida para Recibo según B</text><text x="68" y="1830" font-size="15" fill="#a1a7b3">Puedes elegir Patio de forma explícita</text><text x="56" y="1886" font-size="16" fill="#a1a7b3">Solo propuesta. Aún hay que confirmar con el botón. Elegir, plegar o leer no imprime ni cambia la memoria. F recuerda tras aceptar el servidor. G solo resuelve el</text><text x="56" y="1910" font-size="16" fill="#a1a7b3">caso de una impresora; aquí hay dos.</text><rect x="56" y="1948" width="90" height="42" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="1975" font-size="15" fill="#78a9ff">Cancelar</text><rect x="56" y="2002" width="1168" height="64" rx="8" fill="#4c8dff" stroke="#333945"/><text x="68" y="2030" font-size="16" fill="#06101f" font-weight="700">Imprimir una copia en Office · A4</text><text x="40" y="2120" font-size="14" fill="#a1a7b3">Panel sin perfil de dispositivo. Se comprueban permisos e impresoras válidas. Memorias por local de venta y documento. Nada aquí ejecuta acciones: son dibujos, no pruebas del producto</text><text x="40" y="2144" font-size="14" fill="#a1a7b3">ni del papel.</text></g></svg>