<svg xmlns="http://www.w3.org/2000/svg" width="390" height="2644" viewBox="0 0 390 2644"><title>A790 · Reopening and several printers</title><rect width="390" height="2644" fill="#101216"/><g font-family="Arial, sans-serif"><text x="18" y="32" font-size="21" fill="#eceef2" font-weight="700">A790 · Reopening and several</text><text x="18" y="56" font-size="21" fill="#eceef2" font-weight="700">printers</text><text x="18" y="84" font-size="14" fill="#78a9ff">I agreed · J is one question · static design only</text><text x="18" y="128" font-size="19" fill="#eceef2" font-weight="700">I · Agreed: keep the accepted choice</text><rect x="18" y="160" width="354" height="726" rx="8" fill="#22262e" stroke="#333945"/><text x="34" y="190" font-size="16" fill="#78a9ff" font-weight="700">Restaurante Olivo S.L.</text><text x="34" y="222" font-size="17" fill="#eceef2" font-weight="700">Same normal browser · Harbour F/1042</text><text x="34" y="246" font-size="17" fill="#eceef2" font-weight="700">· Receipt</text><rect x="34" y="282" width="322" height="112" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="308" font-size="16" fill="#eceef2" font-weight="700">Ana printed on Patio receipt</text><text x="46" y="334" font-size="15" fill="#a1a7b3">The server accepted before all windows</text><text x="46" y="358" font-size="15" fill="#a1a7b3">closed</text><rect x="34" y="406" width="322" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="432" font-size="16" fill="#eceef2" font-weight="700">Luis reopens the same browser</text><text x="46" y="458" font-size="15" fill="#a1a7b3">Bar and Patio remain active and eligible</text><rect x="34" y="506" width="322" height="88" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="46" y="532" font-size="16" fill="#eceef2" font-weight="700">Accepted choice remembered</text><text x="46" y="558" font-size="15" fill="#a1a7b3">Patio receipt selected</text><text x="34" y="614" font-size="16" fill="#a1a7b3">Reopening and signing in never print.</text><text x="34" y="638" font-size="16" fill="#a1a7b3">Clearing site data forgets the choice.</text><text x="34" y="662" font-size="16" fill="#a1a7b3">Harbour’s Invoice and Hillside stay separate.</text><text x="34" y="686" font-size="16" fill="#a1a7b3">Technical storage and unusual/private</text><text x="34" y="710" font-size="16" fill="#a1a7b3">browser behavior need a later design.</text><rect x="34" y="748" width="90" height="42" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="775" font-size="15" fill="#78a9ff">Cancel</text><rect x="34" y="802" width="322" height="64" rx="8" fill="#4c8dff" stroke="#333945"/><text x="46" y="830" font-size="16" fill="#06101f" font-weight="700">Print a copy on Patio receipt</text><text x="18" y="920" font-size="19" fill="#eceef2" font-weight="700">J · Recommended: choose for</text><text x="18" y="944" font-size="19" fill="#eceef2" font-weight="700">yourself</text><rect x="18" y="976" width="354" height="702" rx="8" fill="#22262e" stroke="#333945"/><text x="34" y="1006" font-size="16" fill="#78a9ff" font-weight="700">Restaurante Olivo S.L.</text><text x="34" y="1038" font-size="17" fill="#eceef2" font-weight="700">New form · Harbour F/1042 · Receipt</text><rect x="34" y="1074" width="322" height="112" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="1100" font-size="16" fill="#eceef2" font-weight="700">Previous printer Bar receipt is</text><text x="46" y="1124" font-size="16" fill="#eceef2" font-weight="700">unavailable</text><text x="46" y="1150" font-size="15" fill="#a1a7b3">Office · A4 and Patio receipt are eligible</text><rect x="34" y="1198" width="322" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="1224" font-size="16" fill="#eceef2" font-weight="700">Printer *</text><text x="46" y="1250" font-size="15" fill="#a1a7b3">Choose a printer</text><rect x="34" y="1298" width="322" height="88" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="46" y="1324" font-size="16" fill="#eceef2" font-weight="700">No destination selected</text><text x="46" y="1350" font-size="15" fill="#a1a7b3">Print waits for your choice</text><text x="34" y="1406" font-size="16" fill="#a1a7b3">Only a proposal: ask you to choose instead of</text><text x="34" y="1430" font-size="16" fill="#a1a7b3">letting names decide. If Luis selects Patio</text><text x="34" y="1454" font-size="16" fill="#a1a7b3">receipt, the action becomes “Print a copy on</text><text x="34" y="1478" font-size="16" fill="#a1a7b3">Patio receipt” when server-designated. First</text><text x="34" y="1502" font-size="16" fill="#a1a7b3">use invents no previous-printer warning.</text><rect x="34" y="1540" width="90" height="42" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="1567" font-size="15" fill="#78a9ff">Cancel</text><rect x="34" y="1594" width="322" height="64" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="1622" font-size="16" fill="#a1a7b3" font-weight="700">Print</text><text x="18" y="1712" font-size="19" fill="#eceef2" font-weight="700">J · Alternative: first printer by name</text><rect x="18" y="1744" width="354" height="726" rx="8" fill="#22262e" stroke="#333945"/><text x="34" y="1774" font-size="16" fill="#78a9ff" font-weight="700">Restaurante Olivo S.L.</text><text x="34" y="1806" font-size="17" fill="#eceef2" font-weight="700">Same new form · same two eligible</text><text x="34" y="1830" font-size="17" fill="#eceef2" font-weight="700">printers</text><rect x="34" y="1866" width="322" height="112" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="1892" font-size="16" fill="#eceef2" font-weight="700">Previous printer Bar receipt is</text><text x="46" y="1916" font-size="16" fill="#eceef2" font-weight="700">unavailable</text><text x="46" y="1942" font-size="15" fill="#a1a7b3">Office · A4 comes first by name</text><rect x="34" y="1990" width="322" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="2016" font-size="16" fill="#eceef2" font-weight="700">Printer *</text><text x="46" y="2042" font-size="15" fill="#a1a7b3">Office · A4 preselected</text><rect x="34" y="2090" width="322" height="88" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="46" y="2116" font-size="16" fill="#eceef2" font-weight="700">A4 is valid for Receipt under B</text><text x="46" y="2142" font-size="15" fill="#a1a7b3">You can explicitly select Patio instead</text><text x="34" y="2198" font-size="16" fill="#a1a7b3">Only a proposal. Named final confirmation</text><text x="34" y="2222" font-size="16" fill="#a1a7b3">still required; selecting, folding and reading</text><text x="34" y="2246" font-size="16" fill="#a1a7b3">never print or update memory. F remembers</text><text x="34" y="2270" font-size="16" fill="#a1a7b3">only after server acceptance. G’s sole-printer</text><text x="34" y="2294" font-size="16" fill="#a1a7b3">rule cannot decide this two-printer case.</text><rect x="34" y="2332" width="90" height="42" rx="8" fill="#191c22" stroke="#333945"/><text x="46" y="2359" font-size="15" fill="#78a9ff">Cancel</text><rect x="34" y="2386" width="322" height="64" rx="8" fill="#4c8dff" stroke="#333945"/><text x="46" y="2414" font-size="16" fill="#06101f" font-weight="700">Print a copy on Office · A4</text><text x="18" y="2504" font-size="14" fill="#a1a7b3">Dashboard without a device profile. Current</text><text x="18" y="2528" font-size="14" fill="#a1a7b3">authorization and printer eligibility still apply. Separate</text><text x="18" y="2552" font-size="14" fill="#a1a7b3">memories per sale venue and document. No action</text><text x="18" y="2576" font-size="14" fill="#a1a7b3">here runs: these are drawings, not runtime or paper</text><text x="18" y="2600" font-size="14" fill="#a1a7b3">evidence.</text></g></svg>