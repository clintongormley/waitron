<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="2188" viewBox="0 0 1280 2188"><title>A790 · Reopening and several printers</title><rect width="1280" height="2188" fill="#f7f7f8"/><g font-family="Arial, sans-serif"><text x="40" y="32" font-size="21" fill="#16181d" font-weight="700">A790 · Reopening and several printers</text><text x="40" y="60" font-size="14" fill="#1a5fd0">I agreed · J is one question · static design only</text><text x="40" y="104" font-size="19" fill="#16181d" font-weight="700">I · Agreed: keep the accepted choice</text><rect x="40" y="136" width="1200" height="606" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="56" y="166" font-size="16" fill="#1a5fd0" font-weight="700">Restaurante Olivo S.L.</text><text x="56" y="198" font-size="17" fill="#16181d" font-weight="700">Same normal browser · Harbour F/1042 · Receipt</text><rect x="56" y="234" width="1168" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="68" y="260" font-size="16" fill="#16181d" font-weight="700">Ana printed on Patio receipt</text><text x="68" y="286" font-size="15" fill="#5c626e">The server accepted before all windows closed</text><rect x="56" y="334" width="1168" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="68" y="360" font-size="16" fill="#16181d" font-weight="700">Luis reopens the same browser</text><text x="68" y="386" font-size="15" fill="#5c626e">Bar and Patio remain active and eligible</text><rect x="56" y="434" width="1168" height="88" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="68" y="460" font-size="16" fill="#16181d" font-weight="700">Accepted choice remembered</text><text x="68" y="486" font-size="15" fill="#5c626e">Patio receipt selected</text><text x="56" y="542" font-size="16" fill="#5c626e">Reopening and signing in never print. Clearing site data forgets the choice. Harbour’s Invoice and Hillside stay separate. Technical storage and unusual/private</text><text x="56" y="566" font-size="16" fill="#5c626e">browser behavior need a later design.</text><rect x="56" y="604" width="90" height="42" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="68" y="631" font-size="15" fill="#1a5fd0">Cancel</text><rect x="56" y="658" width="1168" height="64" rx="8" fill="#1f6feb" stroke="#d6d9e0"/><text x="68" y="686" font-size="16" fill="#ffffff" font-weight="700">Print a copy on Patio receipt</text><text x="40" y="776" font-size="19" fill="#16181d" font-weight="700">J · Recommended: choose for yourself</text><rect x="40" y="808" width="1200" height="606" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="56" y="838" font-size="16" fill="#1a5fd0" font-weight="700">Restaurante Olivo S.L.</text><text x="56" y="870" font-size="17" fill="#16181d" font-weight="700">New form · Harbour F/1042 · Receipt</text><rect x="56" y="906" width="1168" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="68" y="932" font-size="16" fill="#16181d" font-weight="700">Previous printer Bar receipt is unavailable</text><text x="68" y="958" font-size="15" fill="#5c626e">Office · A4 and Patio receipt are eligible</text><rect x="56" y="1006" width="1168" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="68" y="1032" font-size="16" fill="#16181d" font-weight="700">Printer *</text><text x="68" y="1058" font-size="15" fill="#5c626e">Choose a printer</text><rect x="56" y="1106" width="1168" height="88" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="68" y="1132" font-size="16" fill="#16181d" font-weight="700">No destination selected</text><text x="68" y="1158" font-size="15" fill="#5c626e">Print waits for your choice</text><text x="56" y="1214" font-size="16" fill="#5c626e">Only a proposal: ask you to choose instead of letting names decide. If Luis selects Patio receipt, the action becomes “Print a copy on Patio receipt” when</text><text x="56" y="1238" font-size="16" fill="#5c626e">server-designated. First use invents no previous-printer warning.</text><rect x="56" y="1276" width="90" height="42" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="68" y="1303" font-size="15" fill="#1a5fd0">Cancel</text><rect x="56" y="1330" width="1168" height="64" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="68" y="1358" font-size="16" fill="#5c626e" font-weight="700">Print</text><text x="40" y="1448" font-size="19" fill="#16181d" font-weight="700">J · Alternative: first printer by name</text><rect x="40" y="1480" width="1200" height="606" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="56" y="1510" font-size="16" fill="#1a5fd0" font-weight="700">Restaurante Olivo S.L.</text><text x="56" y="1542" font-size="17" fill="#16181d" font-weight="700">Same new form · same two eligible printers</text><rect x="56" y="1578" width="1168" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="68" y="1604" font-size="16" fill="#16181d" font-weight="700">Previous printer Bar receipt is unavailable</text><text x="68" y="1630" font-size="15" fill="#5c626e">Office · A4 comes first by name</text><rect x="56" y="1678" width="1168" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="68" y="1704" font-size="16" fill="#16181d" font-weight="700">Printer *</text><text x="68" y="1730" font-size="15" fill="#5c626e">Office · A4 preselected</text><rect x="56" y="1778" width="1168" height="88" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="68" y="1804" font-size="16" fill="#16181d" font-weight="700">A4 is valid for Receipt under B</text><text x="68" y="1830" font-size="15" fill="#5c626e">You can explicitly select Patio instead</text><text x="56" y="1886" font-size="16" fill="#5c626e">Only a proposal. Named final confirmation still required; selecting, folding and reading never print or update memory. F remembers only after server acceptance. G’s</text><text x="56" y="1910" font-size="16" fill="#5c626e">sole-printer rule cannot decide this two-printer case.</text><rect x="56" y="1948" width="90" height="42" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="68" y="1975" font-size="15" fill="#1a5fd0">Cancel</text><rect x="56" y="2002" width="1168" height="64" rx="8" fill="#1f6feb" stroke="#d6d9e0"/><text x="68" y="2030" font-size="16" fill="#ffffff" font-weight="700">Print a copy on Office · A4</text><text x="40" y="2120" font-size="14" fill="#5c626e">Dashboard without a device profile. Current authorization and printer eligibility still apply. Separate memories per sale venue and document. No action here runs: these are drawings, not</text><text x="40" y="2144" font-size="14" fill="#5c626e">runtime or paper evidence.</text></g></svg>