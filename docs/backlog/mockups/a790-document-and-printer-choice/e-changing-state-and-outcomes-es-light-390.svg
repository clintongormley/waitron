<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1168" viewBox="0 0 390 1168"><title>A790 e-changing-state-and-outcomes es light</title><rect width="390" height="1168" fill="#f7f7f8"/><g font-family="Arial, sans-serif"><text x="18" y="25" fill="#1a5fd0" font-size="13">PROPUESTA · pendiente de acuerdo</text><g transform="translate(0 -3061)"><text x="18" y="3134" fill="#16181d" font-size="22" font-weight="700">05 · Estados y resultados</text><rect x="18" y="3164" width="354" height="1020" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="36" y="3196" fill="#1a5fd0" font-size="17" font-weight="700">Restaurante Olivo S.L.</text><text x="36" y="3232" fill="#16181d" font-size="17" font-weight="700">F/1042 · destino: Office</text><text x="36" y="3264" fill="#16181d" font-size="19" font-weight="700">Cada estado es un ejemplo</text><text x="36" y="3288" fill="#16181d" font-size="19" font-weight="700">separado</text><rect x="36" y="3322" width="318" height="94" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="74" y="3350" fill="#16181d" font-size="17" font-weight="700">Cargando</text><text x="74" y="3378" fill="#5c626e" font-size="15">Leyendo las impresoras permitidas…</text><rect x="36" y="3428" width="318" height="118" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="74" y="3456" fill="#16181d" font-size="17" font-weight="700">Lectura fallida</text><text x="74" y="3484" fill="#5c626e" font-size="15">No se cargaron las impresoras.</text><text x="74" y="3508" fill="#5c626e" font-size="15">Reintentar.</text><rect x="36" y="3558" width="318" height="94" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="74" y="3586" fill="#16181d" font-size="17" font-weight="700">Impresora eliminada</text><text x="74" y="3614" fill="#5c626e" font-size="15">Elige otra impresora permitida.</text><rect x="36" y="3664" width="318" height="118" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="74" y="3692" fill="#16181d" font-size="17" font-weight="700">Solicitud aceptada</text><text x="74" y="3720" fill="#5c626e" font-size="15">Estado no disponible. Consulta la</text><text x="74" y="3744" fill="#5c626e" font-size="15">solicitud.</text><rect x="36" y="3794" width="318" height="94" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="74" y="3822" fill="#16181d" font-size="17" font-weight="700">Resultado desconocido</text><text x="74" y="3850" fill="#5c626e" font-size="15">La primera solicitud aún podría imprimir.</text><text x="36" y="3912" fill="#5c626e" font-size="16">No tener destinos es distinto de una lectura</text><text x="36" y="3936" fill="#5c626e" font-size="16">fallida. Si el original pasa a copia, se</text><text x="36" y="3960" fill="#5c626e" font-size="16">confirma otra vez. No cambiar de impresora</text><text x="36" y="3984" fill="#5c626e" font-size="16">ni repetir una escritura incierta</text><text x="36" y="4008" fill="#5c626e" font-size="16">automáticamente.</text><rect x="36" y="4052" width="80" height="44" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="48" y="4080" fill="#1a5fd0" font-size="16">Cancelar</text><rect x="36" y="4108" width="318" height="52" rx="8" fill="#1f6feb" stroke="#d6d9e0"/><text x="48" y="4140" fill="#ffffff" font-size="15">Consultar solicitud</text></g></g></svg>