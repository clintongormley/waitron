<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="582" viewBox="0 0 1280 582"><title>A790 d-simplified-copy es dark</title><rect width="1280" height="582" fill="#101216"/><g font-family="Arial, sans-serif"><text x="40" y="25" fill="#78a9ff" font-size="13">PROPUESTA · pendiente de acuerdo</text><g transform="translate(0 -1967)"><text x="40" y="2040" fill="#eceef2" font-size="22" font-weight="700">04 · Una venta simplificada</text><rect x="40" y="2070" width="1200" height="434" rx="8" fill="#22262e" stroke="#333945"/><text x="58" y="2102" fill="#78a9ff" font-size="17" font-weight="700">Restaurante Olivo S.L.</text><text x="58" y="2138" fill="#eceef2" font-size="17" font-weight="700">Recibo S/318 · 14,50 € · español · 1 comensal</text><text x="58" y="2170" fill="#eceef2" font-size="19" font-weight="700">Propuesta: solo Recibo</text><text x="58" y="2204" fill="#eceef2" font-size="16" font-weight="700">Recibo: Misma venta, número e importes</text><rect x="58" y="2242" width="1164" height="94" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="70" y="2270" fill="#78a9ff" font-size="16">●</text><text x="96" y="2270" fill="#eceef2" font-size="17" font-weight="700">Patio receipt</text><text x="96" y="2298" fill="#a1a7b3" font-size="15">Elegida · también se ofrece Bar receipt</text><text x="58" y="2360" fill="#a1a7b3" font-size="16">Omitir la elección de un único documento. Con una impresora, mostrar su nombre y confirmar. Sin impresoras, explicar por qué y no permitir imprimir. Mantener cada</text><text x="58" y="2384" fill="#a1a7b3" font-size="16">selector requiere más pulsaciones.</text><rect x="58" y="2428" width="80" height="44" rx="8" fill="#191c22" stroke="#333945"/><text x="70" y="2456" fill="#78a9ff" font-size="16">Cancelar</text><rect x="862" y="2428" width="360" height="52" rx="8" fill="#4c8dff" stroke="#333945"/><text x="874" y="2460" fill="#06101f" font-size="16">Imprimir una copia en Patio receipt</text></g></g></svg>