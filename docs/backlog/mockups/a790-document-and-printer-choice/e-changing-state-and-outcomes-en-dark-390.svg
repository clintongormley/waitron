<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1096" viewBox="0 0 390 1096"><title>A790 e-changing-state-and-outcomes en dark</title><rect width="390" height="1096" fill="#101216"/><g font-family="Arial, sans-serif"><text x="18" y="25" fill="#78a9ff" font-size="13">PROPOSAL · awaiting owner agreement</text><g transform="translate(0 -3085)"><text x="18" y="3158" fill="#eceef2" font-size="22" font-weight="700">05 · Changing state and outcomes</text><rect x="18" y="3188" width="354" height="948" rx="8" fill="#22262e" stroke="#333945"/><text x="36" y="3220" fill="#78a9ff" font-size="17" font-weight="700">Restaurante Olivo S.L.</text><text x="36" y="3256" fill="#eceef2" font-size="17" font-weight="700">F/1042 · destination: Office</text><text x="36" y="3288" fill="#eceef2" font-size="19" font-weight="700">Each status is a separate example</text><rect x="36" y="3322" width="318" height="94" rx="8" fill="#191c22" stroke="#333945"/><text x="74" y="3350" fill="#eceef2" font-size="17" font-weight="700">Loading</text><text x="74" y="3378" fill="#a1a7b3" font-size="15">Reading the permitted printer list…</text><rect x="36" y="3428" width="318" height="94" rx="8" fill="#191c22" stroke="#333945"/><text x="74" y="3456" fill="#eceef2" font-size="17" font-weight="700">Read failed</text><text x="74" y="3484" fill="#a1a7b3" font-size="15">Could not load printers. Try again.</text><rect x="36" y="3534" width="318" height="94" rx="8" fill="#191c22" stroke="#333945"/><text x="74" y="3562" fill="#eceef2" font-size="17" font-weight="700">Printer removed</text><text x="74" y="3590" fill="#a1a7b3" font-size="15">Choose another eligible printer.</text><rect x="36" y="3640" width="318" height="94" rx="8" fill="#191c22" stroke="#333945"/><text x="74" y="3668" fill="#eceef2" font-size="17" font-weight="700">Request accepted</text><text x="74" y="3696" fill="#a1a7b3" font-size="15">Status unavailable. Check this request.</text><rect x="36" y="3746" width="318" height="94" rx="8" fill="#191c22" stroke="#333945"/><text x="74" y="3774" fill="#eceef2" font-size="17" font-weight="700">Outcome unknown</text><text x="74" y="3802" fill="#a1a7b3" font-size="15">The first request may still print.</text><text x="36" y="3864" fill="#a1a7b3" font-size="16">No destinations is different from a failed</text><text x="36" y="3888" fill="#a1a7b3" font-size="16">read. An original that becomes a copy needs</text><text x="36" y="3912" fill="#a1a7b3" font-size="16">confirmation again. Do not silently change</text><text x="36" y="3936" fill="#a1a7b3" font-size="16">printer or send a fresh request after an</text><text x="36" y="3960" fill="#a1a7b3" font-size="16">uncertain write.</text><rect x="36" y="4004" width="80" height="44" rx="8" fill="#191c22" stroke="#333945"/><text x="48" y="4032" fill="#78a9ff" font-size="16">Cancel</text><rect x="36" y="4060" width="318" height="52" rx="8" fill="#4c8dff" stroke="#333945"/><text x="48" y="4092" fill="#06101f" font-size="16">Check request</text></g></g></svg>