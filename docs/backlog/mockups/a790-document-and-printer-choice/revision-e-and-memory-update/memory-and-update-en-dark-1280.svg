<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="2188" viewBox="0 0 1280 2188"><title>A790 · Separate printers; when to remember?</title><rect width="1280" height="2188" fill="#101216"/><g font-family="Arial, sans-serif"><text x="40" y="32" font-size="21" fill="#eceef2" font-weight="700">A790 · Separate printers; when to remember?</text><text x="40" y="60" font-size="14" fill="#78a9ff">E agreed · F is one question · design only</text><text x="40" y="104" font-size="19" fill="#eceef2" font-weight="700">E · Agreed: separate by document and venue</text><rect x="40" y="136" width="1200" height="606" rx="8" fill="#22262e" stroke="#333945"/><text x="56" y="166" font-size="16" fill="#78a9ff" font-weight="700">Restaurante Olivo S.L.</text><text x="56" y="198" font-size="17" fill="#eceef2" font-weight="700">Harbour F/1042 · this browser · no device profile</text><rect x="56" y="234" width="1168" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="260" font-size="16" fill="#eceef2" font-weight="700">Receipt remembered</text><text x="68" y="286" font-size="15" fill="#a1a7b3">Bar receipt</text><rect x="56" y="334" width="1168" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="360" font-size="16" fill="#eceef2" font-weight="700">Invoice remembered</text><text x="68" y="386" font-size="15" fill="#a1a7b3">Office · A4</text><rect x="56" y="434" width="1168" height="88" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="68" y="460" font-size="16" fill="#eceef2" font-weight="700">Open Receipt again</text><text x="68" y="486" font-size="15" fill="#a1a7b3">Bar receipt stays selected</text><text x="56" y="542" font-size="16" fill="#a1a7b3">Hillside has its own Receipt and Invoice choices. All active Harbour printers remain offered, including A4 and portable printers. Changing Invoice leaves Receipt</text><text x="56" y="566" font-size="16" fill="#a1a7b3">alone.</text><rect x="56" y="604" width="90" height="42" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="631" font-size="15" fill="#78a9ff">Cancel</text><rect x="56" y="658" width="1168" height="64" rx="8" fill="#4c8dff" stroke="#333945"/><text x="68" y="686" font-size="16" fill="#06101f" font-weight="700">Example only · no printing</text><text x="40" y="776" font-size="19" fill="#eceef2" font-weight="700">F · Recommended: remember after acceptance</text><rect x="40" y="808" width="1200" height="606" rx="8" fill="#22262e" stroke="#333945"/><text x="56" y="838" font-size="16" fill="#78a9ff" font-weight="700">Restaurante Olivo S.L.</text><text x="56" y="870" font-size="17" fill="#eceef2" font-weight="700">Choose Patio receipt, then Cancel</text><rect x="56" y="906" width="1168" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="932" font-size="16" fill="#eceef2" font-weight="700">Before opening · Receipt memory</text><text x="68" y="958" font-size="15" fill="#a1a7b3">Bar receipt</text><rect x="56" y="1006" width="1168" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="1032" font-size="16" fill="#eceef2" font-weight="700">In the form · select Patio receipt</text><text x="68" y="1058" font-size="15" fill="#a1a7b3">Selection alone does not print</text><rect x="56" y="1106" width="1168" height="88" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="68" y="1132" font-size="16" fill="#eceef2" font-weight="700">Cancel, then open Receipt again</text><text x="68" y="1158" font-size="15" fill="#a1a7b3">Bar receipt remains remembered</text><text x="56" y="1214" font-size="16" fill="#a1a7b3">Remember Patio only after the server accepts its print request. Later paper failure still leaves Patio remembered. A refusal does not change it. An unknown response</text><text x="56" y="1238" font-size="16" fill="#a1a7b3">needs reconciliation of the same request.</text><rect x="56" y="1276" width="90" height="42" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="1303" font-size="15" fill="#78a9ff">Cancel</text><rect x="56" y="1330" width="1168" height="64" rx="8" fill="#4c8dff" stroke="#333945"/><text x="68" y="1358" font-size="16" fill="#06101f" font-weight="700">Example only · no printing</text><text x="40" y="1448" font-size="19" fill="#eceef2" font-weight="700">F · Alternative: remember on selection</text><rect x="40" y="1480" width="1200" height="606" rx="8" fill="#22262e" stroke="#333945"/><text x="56" y="1510" font-size="16" fill="#78a9ff" font-weight="700">Restaurante Olivo S.L.</text><text x="56" y="1542" font-size="17" fill="#eceef2" font-weight="700">The same choice followed by Cancel</text><rect x="56" y="1578" width="1168" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="1604" font-size="16" fill="#eceef2" font-weight="700">Before opening · Receipt memory</text><text x="68" y="1630" font-size="15" fill="#a1a7b3">Bar receipt</text><rect x="56" y="1678" width="1168" height="88" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="1704" font-size="16" fill="#eceef2" font-weight="700">Select Patio receipt, then Cancel</text><text x="68" y="1730" font-size="15" fill="#a1a7b3">Memory changes without a print</text><rect x="56" y="1778" width="1168" height="88" rx="8" fill="#2f3a4d" stroke="#333945"/><text x="68" y="1804" font-size="16" fill="#eceef2" font-weight="700">Open Receipt again</text><text x="68" y="1830" font-size="15" fill="#a1a7b3">Patio receipt is now suggested</text><text x="56" y="1886" font-size="16" fill="#a1a7b3">This treats the last selected printer as the preference, even when no print was requested. Neither alternative changes Invoice memory, Hillside choices or phone</text><text x="56" y="1910" font-size="16" fill="#a1a7b3">Equipment. F is unapproved.</text><rect x="56" y="1948" width="90" height="42" rx="8" fill="#191c22" stroke="#333945"/><text x="68" y="1975" font-size="15" fill="#78a9ff">Cancel</text><rect x="56" y="2002" width="1168" height="64" rx="8" fill="#4c8dff" stroke="#333945"/><text x="68" y="2030" font-size="16" fill="#06101f" font-weight="700">Example only · no printing</text><text x="40" y="2120" font-size="14" fill="#a1a7b3">Dashboard only. Storage, expiry, first use, unavailable-printer fallback, concurrent requests and portable receipt holding remain open. Phone Equipment follows A796. These static drawings</text><text x="40" y="2144" font-size="14" fill="#a1a7b3">supply no runtime or paper evidence.</text></g></svg>