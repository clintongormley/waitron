<svg xmlns="http://www.w3.org/2000/svg" width="390" height="2548" viewBox="0 0 390 2548"><title>A790 · Separate printers; when to remember?</title><rect width="390" height="2548" fill="#f7f7f8"/><g font-family="Arial, sans-serif"><text x="18" y="32" font-size="21" fill="#16181d" font-weight="700">A790 · Separate printers; when to</text><text x="18" y="56" font-size="21" fill="#16181d" font-weight="700">remember?</text><text x="18" y="84" font-size="14" fill="#1a5fd0">E agreed · F is one question · design only</text><text x="18" y="128" font-size="19" fill="#16181d" font-weight="700">E · Agreed: separate by document and</text><text x="18" y="152" font-size="19" fill="#16181d" font-weight="700">venue</text><rect x="18" y="184" width="354" height="678" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="34" y="214" font-size="16" fill="#1a5fd0" font-weight="700">Restaurante Olivo S.L.</text><text x="34" y="246" font-size="17" fill="#16181d" font-weight="700">Harbour F/1042 · this browser · no</text><text x="34" y="270" font-size="17" fill="#16181d" font-weight="700">device profile</text><rect x="34" y="306" width="322" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="332" font-size="16" fill="#16181d" font-weight="700">Receipt remembered</text><text x="46" y="358" font-size="15" fill="#5c626e">Bar receipt</text><rect x="34" y="406" width="322" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="432" font-size="16" fill="#16181d" font-weight="700">Invoice remembered</text><text x="46" y="458" font-size="15" fill="#5c626e">Office · A4</text><rect x="34" y="506" width="322" height="88" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="46" y="532" font-size="16" fill="#16181d" font-weight="700">Open Receipt again</text><text x="46" y="558" font-size="15" fill="#5c626e">Bar receipt stays selected</text><text x="34" y="614" font-size="16" fill="#5c626e">Hillside has its own Receipt and Invoice</text><text x="34" y="638" font-size="16" fill="#5c626e">choices. All active Harbour printers remain</text><text x="34" y="662" font-size="16" fill="#5c626e">offered, including A4 and portable printers.</text><text x="34" y="686" font-size="16" fill="#5c626e">Changing Invoice leaves Receipt alone.</text><rect x="34" y="724" width="90" height="42" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="751" font-size="15" fill="#1a5fd0">Cancel</text><rect x="34" y="778" width="322" height="64" rx="8" fill="#1f6feb" stroke="#d6d9e0"/><text x="46" y="806" font-size="16" fill="#ffffff" font-weight="700">Example only · no printing</text><text x="18" y="896" font-size="19" fill="#16181d" font-weight="700">F · Recommended: remember after</text><text x="18" y="920" font-size="19" fill="#16181d" font-weight="700">acceptance</text><rect x="18" y="952" width="354" height="678" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="34" y="982" font-size="16" fill="#1a5fd0" font-weight="700">Restaurante Olivo S.L.</text><text x="34" y="1014" font-size="17" fill="#16181d" font-weight="700">Choose Patio receipt, then Cancel</text><rect x="34" y="1050" width="322" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="1076" font-size="16" fill="#16181d" font-weight="700">Before opening · Receipt memory</text><text x="46" y="1102" font-size="15" fill="#5c626e">Bar receipt</text><rect x="34" y="1150" width="322" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="1176" font-size="16" fill="#16181d" font-weight="700">In the form · select Patio receipt</text><text x="46" y="1202" font-size="15" fill="#5c626e">Selection alone does not print</text><rect x="34" y="1250" width="322" height="88" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="46" y="1276" font-size="16" fill="#16181d" font-weight="700">Cancel, then open Receipt again</text><text x="46" y="1302" font-size="15" fill="#5c626e">Bar receipt remains remembered</text><text x="34" y="1358" font-size="16" fill="#5c626e">Remember Patio only after the server accepts</text><text x="34" y="1382" font-size="16" fill="#5c626e">its print request. Later paper failure still</text><text x="34" y="1406" font-size="16" fill="#5c626e">leaves Patio remembered. A refusal does not</text><text x="34" y="1430" font-size="16" fill="#5c626e">change it. An unknown response needs</text><text x="34" y="1454" font-size="16" fill="#5c626e">reconciliation of the same request.</text><rect x="34" y="1492" width="90" height="42" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="1519" font-size="15" fill="#1a5fd0">Cancel</text><rect x="34" y="1546" width="322" height="64" rx="8" fill="#1f6feb" stroke="#d6d9e0"/><text x="46" y="1574" font-size="16" fill="#ffffff" font-weight="700">Example only · no printing</text><text x="18" y="1664" font-size="19" fill="#16181d" font-weight="700">F · Alternative: remember on selection</text><rect x="18" y="1696" width="354" height="678" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="34" y="1726" font-size="16" fill="#1a5fd0" font-weight="700">Restaurante Olivo S.L.</text><text x="34" y="1758" font-size="17" fill="#16181d" font-weight="700">The same choice followed by Cancel</text><rect x="34" y="1794" width="322" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="1820" font-size="16" fill="#16181d" font-weight="700">Before opening · Receipt memory</text><text x="46" y="1846" font-size="15" fill="#5c626e">Bar receipt</text><rect x="34" y="1894" width="322" height="88" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="1920" font-size="16" fill="#16181d" font-weight="700">Select Patio receipt, then Cancel</text><text x="46" y="1946" font-size="15" fill="#5c626e">Memory changes without a print</text><rect x="34" y="1994" width="322" height="88" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="46" y="2020" font-size="16" fill="#16181d" font-weight="700">Open Receipt again</text><text x="46" y="2046" font-size="15" fill="#5c626e">Patio receipt is now suggested</text><text x="34" y="2102" font-size="16" fill="#5c626e">This treats the last selected printer as the</text><text x="34" y="2126" font-size="16" fill="#5c626e">preference, even when no print was</text><text x="34" y="2150" font-size="16" fill="#5c626e">requested. Neither alternative changes</text><text x="34" y="2174" font-size="16" fill="#5c626e">Invoice memory, Hillside choices or phone</text><text x="34" y="2198" font-size="16" fill="#5c626e">Equipment. F is unapproved.</text><rect x="34" y="2236" width="90" height="42" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46" y="2263" font-size="15" fill="#1a5fd0">Cancel</text><rect x="34" y="2290" width="322" height="64" rx="8" fill="#1f6feb" stroke="#d6d9e0"/><text x="46" y="2318" font-size="16" fill="#ffffff" font-weight="700">Example only · no printing</text><text x="18" y="2408" font-size="14" fill="#5c626e">Dashboard only. Storage, expiry, first use,</text><text x="18" y="2432" font-size="14" fill="#5c626e">unavailable-printer fallback, concurrent requests and</text><text x="18" y="2456" font-size="14" fill="#5c626e">portable receipt holding remain open. Phone Equipment</text><text x="18" y="2480" font-size="14" fill="#5c626e">follows A796. These static drawings supply no runtime</text><text x="18" y="2504" font-size="14" fill="#5c626e">or paper evidence.</text></g></svg>