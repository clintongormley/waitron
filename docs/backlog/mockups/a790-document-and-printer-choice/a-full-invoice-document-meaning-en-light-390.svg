<svg xmlns="http://www.w3.org/2000/svg" width="390" height="942" viewBox="0 0 390 942"><title>A790 a-full-invoice-document-meaning en light</title><rect width="390" height="942" fill="#f7f7f8"/><g font-family="Arial, sans-serif"><text x="18" y="25" fill="#1a5fd0" font-size="13">PROPOSAL · awaiting owner agreement</text><g transform="translate(0 -35)"><text x="18" y="108" fill="#16181d" font-size="22" font-weight="700">01 · What does Receipt mean?</text><rect x="18" y="138" width="354" height="794" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="36" y="170" fill="#1a5fd0" font-size="17" font-weight="700">Restaurante Olivo S.L.</text><text x="36" y="206" fill="#16181d" font-size="17" font-weight="700">Table 12 · F/1042 · €86.40</text><text x="36" y="238" fill="#16181d" font-size="19" font-weight="700">Same full invoice · Mar Azul SL</text><rect x="36" y="272" width="318" height="94" rx="8" fill="#e3ebfb" stroke="#d6d9e0"/><text x="48" y="300" fill="#1a5fd0" font-size="16">●</text><text x="74" y="300" fill="#16181d" font-size="17" font-weight="700">Receipt</text><text x="74" y="328" fill="#5c626e" font-size="15">Compact full invoice · receipt list</text><rect x="36" y="378" width="318" height="94" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="48" y="406" fill="#1a5fd0" font-size="16">○</text><text x="74" y="406" fill="#16181d" font-size="17" font-weight="700">Invoice</text><text x="74" y="434" fill="#5c626e" font-size="15">Full invoice · invoice printer list</text><rect x="36.0" y="484" width="153.0" height="148" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="46.0" y="511" fill="#16181d" font-size="14">Receipt paper</text><text x="46.0" y="543" fill="#16181d" font-size="14" font-weight="700">F/1042</text><text x="46.0" y="575" fill="#16181d" font-size="14">Mar Azul SL</text><text x="46.0" y="607" fill="#16181d" font-size="14">€86.40</text><rect x="201.0" y="484" width="153.0" height="148" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="211.0" y="511" fill="#16181d" font-size="14">A4</text><text x="211.0" y="543" fill="#16181d" font-size="14" font-weight="700">F/1042</text><text x="211.0" y="575" fill="#16181d" font-size="14">Mar Azul SL</text><text x="211.0" y="607" fill="#16181d" font-size="14">€86.40</text><text x="36" y="660" fill="#5c626e" font-size="16">Proposal: both retain F/1042 and the</text><text x="36" y="684" fill="#5c626e" font-size="16">customer details. Invoice printers may use</text><text x="36" y="708" fill="#5c626e" font-size="16">A4 or receipt paper. One Full invoice choice</text><text x="36" y="732" fill="#5c626e" font-size="16">or a separate payment receipt are the</text><text x="36" y="756" fill="#5c626e" font-size="16">alternatives.</text><rect x="36" y="800" width="80" height="44" rx="8" fill="#ffffff" stroke="#d6d9e0"/><text x="48" y="828" fill="#1a5fd0" font-size="16">Cancel</text><rect x="36" y="856" width="318" height="52" rx="8" fill="#1f6feb" stroke="#d6d9e0"/><text x="48" y="888" fill="#ffffff" font-size="16">Choose printer</text></g></g></svg>