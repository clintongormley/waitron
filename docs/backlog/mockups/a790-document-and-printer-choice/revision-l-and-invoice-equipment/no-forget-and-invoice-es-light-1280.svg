<text x="442" y="699" fill="#5c626e" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">Office · A4 y Terrace belt están en la lista</text>
<text x="442" y="720" fill="#5c626e" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">de facturas del perfil actual. Recibo sigue</text>
<text x="442" y="741" fill="#5c626e" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">en Bar receipt en ambas opciones. Guardado,</text>
<text x="442" y="762" fill="#5c626e" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">permisos y concurrencia quedan por diseñar.</text>
<text x="860" y="674" fill="#16181d" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600">Elegir y guardar nunca imprimen</text>
