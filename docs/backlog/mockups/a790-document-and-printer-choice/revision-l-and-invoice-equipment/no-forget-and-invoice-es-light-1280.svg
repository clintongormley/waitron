<text x="24" y="699" fill="#5c626e" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">Borrar datos del sitio queda fuera de la UI.</text>
<text x="24" y="720" fill="#5c626e" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">No cancela impresiones pendientes ni permite</text>
