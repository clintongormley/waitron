<text x="860" y="741" fill="#5c626e" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">Otro ajuste no redirige F/1042 ya enviada.</text>
<text x="860" y="762" fill="#5c626e" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">M no concede nuevos permisos de Equipo.</text>
