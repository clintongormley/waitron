<title id="title">Sin botón de olvidar. ¿Un ajuste de Factura?</title>
<desc id="desc">L acordado · M solo propuesto · 19 oct 2026. Static design snapshots: dashboard has no Forget control; proposed device Invoice setting alternatives. UI cards and design explanation are labelled separately. No runtime verification.</desc>
