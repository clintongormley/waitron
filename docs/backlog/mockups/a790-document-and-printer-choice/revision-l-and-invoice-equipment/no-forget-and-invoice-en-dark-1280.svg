<text x="24" y="699" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">Site-data clearing stays outside the form.</text>
<text x="24" y="720" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">It cancels no pending print and must not</text>
