<text x="442" y="699" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">Both Office · A4 and Terrace belt are in the</text>
<text x="442" y="720" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">current profile’s invoice list. Receipt stays</text>
<text x="442" y="741" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">Bar receipt in both alternatives. Save timing,</text>
<text x="442" y="762" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">permissions and concurrency still need design.</text>
<text x="860" y="674" fill="#eceef2" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600">Choosing and saving never print</text>
<text x="860" y="699" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">Saving is unconfirmed; refusal is not saved.</text>
<text x="860" y="720" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">No combined save-and-print promise. A later</text>
<text x="860" y="741" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">setting change cannot reroute submitted F/1042.</text>
<text x="860" y="762" fill="#a1a7b3" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">M grants no new Equipment permission.</text>
