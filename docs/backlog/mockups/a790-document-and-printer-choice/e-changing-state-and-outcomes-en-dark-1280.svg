<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="968" viewBox="0 0 1280 968"><title>A790 e-changing-state-and-outcomes en dark</title><rect width="1280" height="968" fill="#101216"/><g font-family="Arial, sans-serif"><text x="40" y="25" fill="#78a9ff" font-size="13">PROPOSAL · awaiting owner agreement</text><g transform="translate(0 -2477)"><text x="40" y="2550" fill="#eceef2" font-size="22" font-weight="700">05 · Changing state and outcomes</text><rect x="40" y="2580" width="1200" height="820" rx="8" fill="#22262e" stroke="#333945"/><text x="58" y="2612" fill="#78a9ff" font-size="17" font-weight="700">Restaurante Olivo S.L.</text><text x="58" y="2648" fill="#eceef2" font-size="17" font-weight="700">F/1042 · destination: Office</text><text x="58" y="2680" fill="#eceef2" font-size="19" font-weight="700">Each status is a separate example</text><rect x="58" y="2714" width="1164" height="94" rx="8" fill="#191c22" stroke="#333945"/><text x="96" y="2742" fill="#eceef2" font-size="17" font-weight="700">Loading</text><text x="96" y="2770" fill="#a1a7b3" font-size="15">Reading the permitted printer list…</text><rect x="58" y="2820" width="1164" height="94" rx="8" fill="#191c22" stroke="#333945"/><text x="96" y="2848" fill="#eceef2" font-size="17" font-weight="700">Read failed</text><text x="96" y="2876" fill="#a1a7b3" font-size="15">Could not load printers. Try again.</text><rect x="58" y="2926" width="1164" height="94" rx="8" fill="#191c22" stroke="#333945"/><text x="96" y="2954" fill="#eceef2" font-size="17" font-weight="700">Printer removed</text><text x="96" y="2982" fill="#a1a7b3" font-size="15">Choose another eligible printer.</text><rect x="58" y="3032" width="1164" height="94" rx="8" fill="#191c22" stroke="#333945"/><text x="96" y="3060" fill="#eceef2" font-size="17" font-weight="700">Request accepted</text><text x="96" y="3088" fill="#a1a7b3" font-size="15">Status unavailable. Check this request.</text><rect x="58" y="3138" width="1164" height="94" rx="8" fill="#191c22" stroke="#333945"/><text x="96" y="3166" fill="#eceef2" font-size="17" font-weight="700">Outcome unknown</text><text x="96" y="3194" fill="#a1a7b3" font-size="15">The first request may still print.</text><text x="58" y="3256" fill="#a1a7b3" font-size="16">No destinations is different from a failed read. An original that becomes a copy needs confirmation again. Do not silently change printer or send a fresh request after</text><text x="58" y="3280" fill="#a1a7b3" font-size="16">an uncertain write.</text><rect x="58" y="3324" width="80" height="44" rx="8" fill="#191c22" stroke="#333945"/><text x="70" y="3352" fill="#78a9ff" font-size="16">Cancel</text><rect x="862" y="3324" width="360" height="52" rx="8" fill="#4c8dff" stroke="#333945"/><text x="874" y="3356" fill="#06101f" font-size="16">Check request</text></g></g></svg>