# Project-scoped Codex config. Codex reads AGENTS.md (a symlink to CLAUDE.md here) up to
# project_doc_max_bytes and silently drops whatever lies beyond it. The default cap is below
# that file's size, so leaving it unset would truncate the later sections.
project_doc_max_bytes = 131072

model = "gpt-6-astra"
model_reasoning_effort = "high"

[sandbox_workspace_write]
# Closed by default. The real-Postgres suites need the Docker socket and pnpm needs DNS;
# measured 2026-09-05: without this, docker and DNS both fail inside the sandbox.
network_access = true
