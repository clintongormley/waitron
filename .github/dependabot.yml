# Weekly dependency update pull requests; how to land one: docs/developers/workflow-guide.md →
# Dependabot pull requests.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Vitest majors wait for the Stryker retry: docs/backlog/dependencies.md → A Vitest 5 retry.
    ignore:
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
    groups:
      # No update-types, so once the ignore above goes a major moves vitest and @vitest/* together:
      # @vitest/browser-playwright 5 fails at startup beside vitest 4 (#766).
      # Must precede npm-minor-and-patch, since a dependency joins the first group it matches.
      vitest:
        applies-to: version-updates
        patterns: [vitest, "@vitest/*"]
      npm-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    groups:
      docker-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  - package-ecosystem: docker-compose
    directories: [/, /deploy]
    schedule:
      interval: weekly
    groups:
      compose-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
