# Weekly dependency update pull requests. Dependabot's pull requests are expected to fail the
# required sign-off check; how to land one: docs/developers/workflow-guide.md → Dependabot pull
# requests.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    groups:
      docker-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  - package-ecosystem: docker-compose
    directories: [/, /deploy]
    schedule:
      interval: weekly
    groups:
      compose-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
