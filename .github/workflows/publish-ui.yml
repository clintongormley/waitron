name: Publish shared packages

on:
  push:
    branches: [main]
    paths: ["packages/ui-core/**", "packages/contract/**"]

concurrency:
  group: ui-core-publication
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [ui-core, contract]
    env:
      PACKAGE: ${{ matrix.package }}
    steps:
      # Bounded checkout attempts: docs/developers/ci-and-gates.md, "Every checkout is bounded".
      - id: checkout
        name: Check out the code
        uses: actions/checkout@v7
        timeout-minutes: 2
        continue-on-error: true
        with:
          persist-credentials: false
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: 1000
          GIT_HTTP_LOW_SPEED_TIME: 20
          GIT_TRACE2_EVENT: 1
      - name: Stop the first checkout's leftover git
        if: steps.checkout.outcome == 'failure'
        run: for p in $(pgrep '^git(-remote-https?)?$'); do [ "$(readlink /proc/$p/cwd)" = "$GITHUB_WORKSPACE" ] && kill -9 "$p" && echo "stopped git $p"; done; true
      - name: Check out the code, second attempt
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v7
        timeout-minutes: 2
        with:
          persist-credentials: false
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: 1000
          GIT_HTTP_LOW_SPEED_TIME: 20
          GIT_TRACE2_EVENT: 1
      - run: bash scripts/ci-setup-pnpm.sh
        timeout-minutes: 5
      - id: setup-node
        uses: actions/setup-node@v7
        timeout-minutes: 2
        continue-on-error: true
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: "@waitron-io"
          package-manager-cache: false
      - name: Set up Node, second attempt
        if: steps.setup-node.outcome == 'failure'
        uses: actions/setup-node@v7
        timeout-minutes: 2
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: "@waitron-io"
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        if: matrix.package == 'ui-core'
        run: |
          for attempt in 1 2 3; do
            timeout 180 pnpm --filter "@waitron/$PACKAGE" exec playwright install chromium && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 5
          done
      - id: checks
        name: Check the source package
        run: |
          set -euo pipefail
          for check in typecheck lint test:coverage test:package; do
            pnpm --filter "@waitron/$PACKAGE" ls --depth -1 --json \
              | node scripts/changed-packages.mjs runnable "$check"
          done
          pnpm --filter "@waitron/$PACKAGE" typecheck
          pnpm --filter "@waitron/$PACKAGE" lint
          node scripts/run-with-deadline.mjs 360 --diagnostics -- pnpm --filter "@waitron/$PACKAGE" test:coverage \
            --reporter=default --reporter="$GITHUB_WORKSPACE/scripts/vitest-file-progress.mjs"
      - id: prepare
        name: Prepare the numbered release
        run: |
          mkdir "$RUNNER_TEMP/shared-release"
          node scripts/release/prepare-ui.mjs "$GITHUB_WORKSPACE" "$RUNNER_TEMP/shared-release" \
            --release-version "0.2.$GITHUB_RUN_NUMBER" --source-commit "$GITHUB_SHA" --package "$PACKAGE"
      - id: consumer
        name: Check the prepared package in an independent consumer
        env:
          UI_PACKAGE_TARBALL: ${{ runner.temp }}/shared-release/waitron-io-${{ matrix.package }}-0.2.${{ github.run_number }}.tgz
          UI_PACKAGE_RELEASE_VERSION: 0.2.${{ github.run_number }}
          UI_PACKAGE_SOURCE_COMMIT: ${{ github.sha }}
          CONTRACT_PACKAGE_TARBALL: ${{ runner.temp }}/shared-release/waitron-io-${{ matrix.package }}-0.2.${{ github.run_number }}.tgz
          CONTRACT_PACKAGE_RELEASE_VERSION: 0.2.${{ github.run_number }}
          CONTRACT_PACKAGE_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          pnpm --filter "@waitron/$PACKAGE" test:package
      - id: publish
        name: Publish the private package
        timeout-minutes: 2
        env:
          NODE_AUTH_TOKEN: ${{ secrets.UI_PACKAGES_WRITE_TOKEN }}
        run: |
          if [ "$PACKAGE" = contract ]; then
            node --input-type=module -e '
              import { checkPackageAccess } from "./scripts/release/package-access.mjs";
              console.log(JSON.stringify(await checkPackageAccess(process.env.NODE_AUTH_TOKEN)));
            '
          fi
          npm publish "$RUNNER_TEMP/shared-release/waitron-io-$PACKAGE-0.2.$GITHUB_RUN_NUMBER.tgz" \
            --registry=https://npm.pkg.github.com --access=restricted --ignore-scripts
          if [ "$PACKAGE" = contract ]; then
            node --input-type=module -e '
              import { checkPackageAccess } from "./scripts/release/package-access.mjs";
              console.log(JSON.stringify(await checkPackageAccess(process.env.NODE_AUTH_TOKEN, { published: true })));
            '
            npm view "@waitron-io/contract@0.2.$GITHUB_RUN_NUMBER" \
              dist.integrity waitronSource.commit repository.url --json --registry=https://npm.pkg.github.com
          fi
