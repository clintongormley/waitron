name: Publish upgrade offer
on:
  workflow_dispatch:
    inputs:
      offer:
        description: JSON with format, entries and default
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: publish-upgrade-offer
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      # See docs/developers/ci-and-gates.md, "Every checkout is bounded".
      - id: checkout
        name: Check out the code
        uses: actions/checkout@v7
        timeout-minutes: 2
        continue-on-error: true
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: 1000
          GIT_HTTP_LOW_SPEED_TIME: 20
      - name: Stop the first checkout's leftover git
        if: steps.checkout.outcome == 'failure'
        run: for p in $(pgrep '^git(-remote-https?)?$'); do [ "$(readlink /proc/$p/cwd)" = "$GITHUB_WORKSPACE" ] && kill -9 "$p" && echo "stopped git $p"; done; true
      - name: Check out the code, second attempt
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v7
        timeout-minutes: 2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: 1000
          GIT_HTTP_LOW_SPEED_TIME: 20
      - id: setup-node
        name: Set up Node
        uses: actions/setup-node@v7
        timeout-minutes: 2
        continue-on-error: true
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false
      - name: Set up Node, second attempt
        if: steps.setup-node.outcome == 'failure'
        uses: actions/setup-node@v7
        timeout-minutes: 2
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false
      - name: Publish and read back the offer
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          OFFER_INPUT: ${{ inputs.offer }}
          WAITRON_RELEASE_SIGNING_KEY: ${{ secrets.WAITRON_RELEASE_SIGNING_KEY }}
        run: node scripts/release/publish-upgrade-offer.mjs
