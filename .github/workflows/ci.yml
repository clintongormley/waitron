      - id: download
        name: Download the venue-service coverage blobs
        run: node scripts/download-coverage-blobs.mjs 'venue-service-blob-*' 'packages/venue-service/.vitest-reports' 4
        timeout-minutes: 1
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Clear the partial artifact download
        if: steps.download.outcome == 'failure'
        timeout-minutes: 1
        run: rm -rf -- "packages/venue-service/.vitest-reports"

