name: CI
run-name: A1473 owned automatic overflow target
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: a1473-owned-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo 'A1473 bootstrap only; no product checks or publishing'
  lint:
    needs: changes
    runs-on: ${{ github.run_attempt == 1 && fromJSON(vars.DISPOSABLE_TESTS_HOSTED_ATTEMPTS || '{}')[github.run_id] != github.run_attempt && fromJSON(format('["self-hosted","dt-{0}-{1}-{2}-lint-1"]', github.repository_id, github.run_id, github.run_attempt)) || 'ubuntu-latest' }}
    timeout-minutes: 2
    steps:
      - run: echo 'A1473 owned target executed'
  ci:
    needs: [changes, lint]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          RESULT: ${{ needs.lint.result }}
        run: test "$RESULT" = success
