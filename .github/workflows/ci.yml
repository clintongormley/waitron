              if [ "$total" -eq -1 ]; then total=$next_total; fi
              if [ "$next_total" -ne "$total" ]; then echo "Inventory poll $polls page $page: total changed from $total to $next_total" >&2; complete=false; break; fi
              size=$(jq '.jobs | length' "$scratch/response")
              if [ "$size" -eq 0 ] || [ "$size" -gt 30 ]; then echo "Inventory poll $polls page $page: invalid page size $size" >&2; complete=false; break; fi
