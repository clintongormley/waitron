name: CI

# `ci` is the only job in this file that branch protection requires. Ruleset 19899160 requires
# exactly three contexts — read back on 2026-07-31 with:
#
#   gh api repos/:owner/:repo/rulesets/19899160 \
#     --jq '.rules[] | select(.type=="required_status_checks") | .parameters.required_status_checks[].context'
#
#   LICENSE is unmodified Elastic License 2.0
#   Every commit is signed off
#   ci
#
# The other two are produced by licence.yml, whose `licence-integrity` and `dco` jobs set those
# strings as their `name:` — licence.yml:13 and :35, re-read on 2026-08-01 with
# `grep -n 'name:' .github/workflows/licence.yml`. (`:35` was `:23` until this branch put a comment
# block above the `dco:` job, which is how a line citation goes stale in a file the same change
# edits.) So `ci` is this file's entire interface to branch protection.
#
# The job ids below are therefore NOT a stable public interface, and removing that property is the
# whole point of the `ci` job. Until the ruleset was changed, five ids here were required by name:
# renaming one silently broke the ruleset, and skipping one left a pull request waiting for a status
# that would never report. Both of those are now free moves, which is what makes the scoping in
# docs/superpowers/specs/2026-07-31-scoped-ci-design.md possible at all.
#
# The one rule that replaces it: every other job in this file must appear in `ci`'s `needs`. A job
# that does not is reporting to nothing — it could fail while the pull request stays green.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on feature branches / PRs (a force-push should supersede its own old run,
  # saving CI minutes) but NEVER on `main`. The push-to-`main` run is the UNFILTERED full-suite
  # verification CLAUDE.md §2 relies on to catch what a scoped PR run missed (a cross-package guard, a
  # package outside the PR's scope). Our workflow lands a `docs(backlog)` commit directly to `main`
  # within ~3min of every code merge, and the parallel feature track pushes too; with unconditional
  # `cancel-in-progress: true` that next `main` push cancelled the code merge's run mid-`test-light`
  # every time (verified: #123's `6b97612` run was cancelled 3m30s in, test-light/test-heavy never
  # finished; the superseding docs commit's own run skips the shards), so §2's safety net never
  # actually completed. Keeping `main` runs alive costs at most two concurrent full runs when two
  # `main` pushes land close together — cheap next to a verification that never runs.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Works out what the rest of the workflow needs to do. Everything below gates on its outputs.
  #
  # Two independent decisions, deliberately not merged into one (design §3.2):
  #   `code`  — is there anything here that is not prose? If not, only `lint` runs, on pull requests
  #             AND on main, so a documentation merge costs nothing in either place.
  #   `scope` — on a pull request, narrow the test shards to the packages that changed and the
  #             packages that depend on them. On main, run everything, because that unfiltered run
  #             is what verifies the narrowing was right.
  #
  # Both come out of ONE `scripts/changed-packages.mjs` call, which is the same call and the same
  # file `.husky/pre-push` runs. Until 2026-08-01 this job resolved the scope a second way — pnpm's
  # own changed-since filter, `pnpm --filter "...[origin/$BASE_REF]" ls` — and the two mechanisms
  # disagreed in the silent direction. Reproduced on 2026-08-01 in a `git clone --no-hardlinks` of
  # this repository, one commit on top of `main` touching only `tsconfig.base.json`:
  #
  #   git diff --name-only main...HEAD               → tsconfig.base.json
  #   pnpm --filter "...[main]" ls --depth -1 --json → one entry, {"name": "waitron"}
  #   … | node .github/scripts/changed-scope.mjs gates
  #                                                  → heavy=false light=true verifactu=false
  #                                                    shared=false
  #
  # (that last command is spelled as it was on `main` at the time — the file has since moved to
  # `scripts/` and lost the `gates` subcommand, in the same change as this comment)
  #
  # A `pnpm-lock.yaml`-only commit gave byte-identical output; a `packages/ui`-only commit gave one
  # entry and a `packages/shared` one gave twelve, so the narrowing itself was right — it was
  # unattributable paths that resolved to the workspace ROOT, the one member that runs no tests.
  # `test-heavy` and both mutation jobs skipped outright, and `test-light` was gated true but
  # selected nothing to run: `pnpm --filter "waitron" --no-sort format:check` prints `No projects
  # matched the filters in "…"` and exits 0 (run in this workspace, same date). So on a
  # root-config-only or lockfile-only pull request, no package's suite ran at all.
  #
  # scripts/changed-packages.mjs attributes each path to the workspace member whose directory
  # contains it and fails CLOSED — anything outside every member is `scope=global`, which is no
  # filter at all. Expanding a changed package to its DEPENDENTS is still pnpm's job, via the
  # `--filter "...<pkg>"` arguments built below.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
      scope: ${{ steps.classify.outputs.scope }}
      packages: ${{ steps.classify.outputs.packages }}
      heavy: ${{ steps.gates.outputs.heavy }}
      ui: ${{ steps.gates.outputs.ui }}
      till: ${{ steps.gates.outputs.till }}
      dashboard: ${{ steps.gates.outputs.dashboard }}
      server: ${{ steps.gates.outputs.server }}
      fiscal_verifactu: ${{ steps.gates.outputs.fiscal_verifactu }}
      light_a: ${{ steps.gates.outputs.light_a }}
      light_b: ${{ steps.gates.outputs.light_b }}
      verifactu: ${{ steps.gates.outputs.verifactu }}
      shared: ${{ steps.gates.outputs.shared }}
    steps:
      # fetch-depth: 0 is load-bearing. The default is 1, which leaves no merge base to diff
      # against and no history for pnpm's own change detection — both would then silently report
      # "nothing changed" and skip the entire suite.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Needed for the two `pnpm ls` queries below — the workspace layout the classifier resolves,
      # and the membership query that answers the gates. No `pnpm install` is required: `pnpm ls`
      # resolves from the workspace manifests alone, filtered or not (measured on 2026-08-01 in a
      # `git clone --no-hardlinks` with no node_modules anywhere in it — `pnpm ls -r --depth -1
      # --json` exited 0 with all 16 entries).
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      # `package-manager-cache: false` is REQUIRED here, and dropping `cache: pnpm` is not enough —
      # that input defaults to true in actions/setup-node@v5, which then auto-detects pnpm and
      # caches anyway. This is the only job in the file that never runs `pnpm install`, so the pnpm
      # store never exists, and setup-node's post-job cache-SAVE fails on the missing path:
      #
      #   ##[error]Path Validation Error: Path(s) specified in the action for caching
      #   do(es) not exist, hence no cache is being saved.
      #
      # That fails the job AFTER its outputs are already set, so `changes` reports failure while
      # having computed every gate correctly, and every downstream job skips.
      #
      # It is worth knowing WHY this took two attempts, because the first fix looked like it worked.
      # Whether the post-step saves at all depends on the RESTORE outcome, so the bug only fires on
      # a cold cache:
      #
      #   run 30651421691  `Cache hit …` → post-step `not saving cache` → job PASSED
      #   run 30652021468  `pnpm cache is not found` → post-step saves → Path Validation → job FAILED
      #
      # Both ran a `changes` job with no `cache:` input. The first passed only because another job
      # had already warmed that key; the second was a pull request whose base was not `main`, so it
      # had a different cache scope and started cold. A job that passes or fails on whether a cache
      # happens to be warm is a false green, so the cache is turned off outright rather than left to
      # chance. Nothing here is worth caching: the job runs `pnpm ls` and one node script, both of
      # which read the workspace manifests only.
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false

      - id: classify
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [ "$EVENT" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF"
            paths=$(git diff --name-only "origin/$BASE_REF...HEAD")
          else
            case "$BEFORE" in
              # An all-zero `before` means a new branch or a force-push: no usable base, so no diff.
              # Emit nothing and let the classifier fail closed to a full run.
              *[!0]*) paths=$(git diff --name-only "$BEFORE" "$SHA") ;;
              *) echo "no usable base ref ($BEFORE) — running everything" >&2; paths="" ;;
            esac
          fi

          # Three lines out — `code=`, `scope=` (one of documentation, global, packages) and
          # `packages=` — from ONE classifier call, which is also the one `.husky/pre-push` makes.
          # Its reason goes to stderr, so it lands in this job's log rather than in $GITHUB_OUTPUT.
          #
          # `set -e` is what makes a classifier that cannot run FAIL this step rather than quietly
          # emit nothing, and it is load-bearing for ONE of the three outputs rather than a nicety
          # for all of them. An empty `scope` would be safe: it is not the literal `packages`, so
          # every branch below falls through to running everything. An empty `code` would NOT be —
          # all nine gated jobs test `needs.changes.outputs.code == 'true'` (bundle-smoke, typecheck,
          # all five test shards, both mutation runs), so an empty value skips every one of them, and
          # the `ci` aggregate counts a skip as a pass by design. That is a green pull request with
          # nothing run.
          #
          # It cannot happen today, and here is the code that says so rather than an impression:
          # `formatScope` (scripts/changed-packages.mjs) builds `code=` from
          # `kind !== "documentation"`, a boolean that always renders, and `scopeForPaths` always
          # returns a `kind` — so a node that exits 0 always emits the line. A node that exits
          # NON-zero is caught by `set -o pipefail` plus `set -e` on the `out=$(…)` assignment
          # below, which fails the step. Both halves have to hold; neither is a property of this
          # shell script alone.
          out=$(printf '%s\n' "$paths" | node scripts/changed-packages.mjs)
          code=$(printf '%s\n' "$out" | sed -n 's/^code=//p')
          scope=$(printf '%s\n' "$out" | sed -n 's/^scope=//p')
          packages=$(printf '%s\n' "$out" | sed -n 's/^packages=//p')

          # main always runs the full suite: it is what verifies the pull request's narrowing. The
          # docs verdict is left alone, so a documentation-only merge is still cheap there too.
          if [ "$EVENT" != "pull_request" ]; then
            scope="global"
            packages=""
          fi

          {
            echo "code=$code"
            echo "scope=$scope"
            echo "packages=$packages"
          } >> "$GITHUB_OUTPUT"

      # Which gated jobs have anything to do? Seven today — all five test shards and the two
      # mutation runs — and none of them CAN be expressed as a filter on the job itself; see
      # gateOutputs' own comment for the two wrong formulations and why each fails.
      #
      # Six of the seven ask whether one named package is in the resolved scope. `light` does not:
      # test-light's own filters SUBTRACT every package that has a shard of its own, so it has work
      # when the scope holds a package that is neither one of those nor one of the members with no
      # test script — which is why a gate is a predicate over the scope rather than a package name.
      # See SCOPE_GATES and OWN_SHARD_PACKAGES in scripts/changed-scope.mjs.
      #
      # ONE `pnpm ls` for all seven. Not mainly for the time — measured locally, the query is 0.20s
      # against the node script's 0.04s, so seven of them would cost only a second or two — but
      # because all seven gates are answers about the SAME resolved scope. Resolving it once makes
      # them consistent by construction, and keeps this step from growing a stanza per gated job.
      #
      # That query is where the EXPANSION happens, and it is still pnpm's: one `--filter "...<pkg>"`
      # per attributed package, whose LEFT-hand ellipsis selects that package AND ITS DEPENDENTS
      # (`<pkg>...` is the other direction, a package and its dependencies, and would gate on the
      # wrong set). Only the attribution moved out of pnpm's hands.
      #
      # Anything that is not `scope=packages` runs unscoped: `global` because an unattributable path
      # could affect anything, `documentation` because the gates are ANDed with `code` anyway, and an
      # empty or unexpected value because a scope nobody can read is not a reason to skip a suite.
      # The `--unscoped` flag emits every gate as true from the script's own SCOPE_GATES list, so a
      # gate added there does not also need adding here. Getting that wrong would leave a new job
      # never running on main, which is the direction nothing else would notice.
      - id: gates
        env:
          SCOPE: ${{ steps.classify.outputs.scope }}
          PACKAGES: ${{ steps.classify.outputs.packages }}
        run: |
          set -euo pipefail
          if [ "$SCOPE" != "packages" ] || [ -z "$PACKAGES" ]; then
            node scripts/changed-scope.mjs --unscoped >> "$GITHUB_OUTPUT"
          else
            # The filters are accumulated as POSITIONAL PARAMETERS rather than concatenated into a
            # string for `eval`, exactly as .husky/pre-push does. That removes the SECOND shell
            # pass, so a quote, a `$` or a backtick in a package name reaches pnpm literally — but
            # it leaves the FIRST one: `$PACKAGES` is unquoted here on purpose (the classifier
            # separates names with a single space), and an unquoted expansion undergoes PATHNAME
            # EXPANSION as well as field splitting. `set -f` turns that off for the loop and
            # `set +f` turns it back on; the receipt, run in three shells including bash 5.3.15, is
            # in .husky/pre-push beside the same loop.
            #
            # It matters more here than in the hook, because here NOTHING catches it. Measured end
            # to end on 2026-08-01 in a throwaway pnpm workspace holding a member named `pack*`:
            # the rewritten filters `--filter "...package.json" --filter "...packages"` make
            # `pnpm ls --depth -1 --json` print zero bytes on both streams at exit 0, and piping
            # that into `node scripts/changed-scope.mjs` prints
            # every gate false — because `packagesInScope("")` is the empty Set, the DEFINITE answer
            # "nothing matched", not the `null` that fails closed. Re-run on 2026-08-08 against the
            # tree as it now stands, `printf '' | node scripts/changed-scope.mjs` prints `heavy=false
            # ui=false till=false dashboard=false light=false verifactu=false shared=false` on stderr
            # and the same seven lines on stdout, exit 0. (The pnpm half of that end-to-end run is
            # quoted above and is unaffected by adding a gate; only the line COUNT here moved, which
            # is why this half was re-measured rather than re-worded.) With every scope gate false,
            # all five test shards and both mutation jobs skip — every job in this file that runs a
            # test — while `bundle-smoke` and `typecheck` still run, because they gate on `code`
            # alone. `ci` counts a skip as a pass by design, so that is a green pull request whose
            # tests never ran.
            #
            # The hook's version of this loop is followed by a "scope is runnable" step, which
            # exits 1 when the corrupted name was the whole scope. This job has no equivalent.
            set -f
            set --
            for pkg in $PACKAGES; do set -- "$@" --filter "...$pkg"; done
            set +f

            # stderr is deliberately NOT discarded: only stdout is piped, so anything pnpm says goes
            # to the job log where it can be read, and cannot reach the classifier. An earlier
            # version sent it to /dev/null and bought nothing but a harder debugging session.
            pnpm "$@" ls --depth -1 --json \
              | node scripts/changed-scope.mjs >> "$GITHUB_OUTPUT"
          fi

  # Always runs, on every path, including a documentation-only change — Prettier is the only tool
  # here that reads prose, and the repo-level suite is what proves the `changes` job's own
  # classifier still works. Both are cheap enough that gating them would save nothing.
  #
  # Worth knowing precisely what `format:check` covers: .prettierignore lists `docs/`, so
  # root-level Markdown (CLAUDE.md, README.md, CONTRIBUTING.md) IS checked and nothing under docs/
  # is. Established by malforming a file in each location — `prettier --check` reports an ignored
  # path and a clean path identically, so the obvious probe proves nothing.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm format:check

      # The repo-level project only (`vitest run` at the root, NOT `pnpm test`, which would also run
      # every package). Three reasons it belongs in the one job nothing gates:
      #
      #   the two CLASSIFIERS under `scripts/` — if either is wrong, every gating decision below is
      #   wrong, so they must run even on the paths they would otherwise skip;
      #   the two repo-wide GUARDS, `scripts/guarded-teardowns.test.ts` and
      #   `scripts/english-only.test.ts`, which read `packages/` and `apps/` whole. They lived in
      #   `packages/db` until 2026-08-01, where `test-heavy`'s own gate decided whether they ran —
      #   so a pull request touching only `packages/payments` ran neither, and their first run was
      #   the unfiltered `main` merge;
      #   `scripts/check-signoff.test.mjs`, which covers the script licence.yml's `dco` job runs and
      #   runs that job's own step, extracted from the workflow file rather than transcribed.
      - run: pnpm vitest run --coverage

  # The bundles operators actually run. Nothing else in this workflow builds them: dist/ is
  # gitignored, both bin.ts files are excluded from coverage, and typecheck and test run against
  # TypeScript source. Gated on `code` because a Markdown edit cannot change an esbuild bundle.
  bundle-smoke:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Nothing else in this workflow builds packages/credentials's bundle: dist/ is gitignored,
      # bin.ts is excluded from coverage, and the SDD ledger records this exact artifact shipping
      # broken twice during development (a duplicated shebang, then pg's CJS require failing under
      # --format=esm). typecheck and test both run against TypeScript source, never the bundle
      # operators actually run — this is the one gate that would have caught either break.
      - run: pnpm --filter @waitron/credentials build

      # A smoke test, not a full run: confirms the BUILT bundle actually executes under Node with no
      # real database available. DATABASE_URL absent is the cheapest failure to trigger without
      # provisioning Postgres, and bin.ts's own contract is to fail fast with a specific message and
      # a non-zero exit code rather than crash with a raw, unformatted stack trace.
      - name: Smoke-test the credentials CLI bundle (no DATABASE_URL)
        run: |
          set +e
          output=$(node packages/credentials/dist/bin.js list 2>&1)
          code=$?
          set -e
          echo "$output"
          if [ "$code" -eq 0 ]; then
            echo "expected a non-zero exit code with no DATABASE_URL set, got 0" >&2
            exit 1
          fi
          if ! grep -q "DATABASE_URL is not set" <<< "$output"; then
            echo "expected the 'DATABASE_URL is not set' message, got: $output" >&2
            exit 1
          fi

      # apps/server has the HARDER version of the problem above. Every *_MIGRATIONS descriptor
      # computes its folder from its own import.meta.url, and esbuild collapses all five onto the
      # bundle's directory, so a mistake in the migrations-root resolution works in development and
      # fails only at boot, in the shipped artefact — the worst available failure mode. Nothing else
      # in this workflow builds this bundle: dist/ is gitignored, src/bin.ts is excluded from
      # coverage, and typecheck/test both run against TypeScript source, never the bundle operators
      # actually run.
      - run: pnpm --filter @waitron/server build

      # scripts/copy-migrations.mjs (invoked by the build script above) is the fix for the collapse:
      # it copies each package's drizzle/ folder in beside dist/server.js. This confirms it actually
      # ran rather than merely that `build` exited zero — a broken copy step would otherwise only
      # surface as a missing folder the first time something tries to boot the bundle for real.
      - name: Assert the built bundle carries its migrations
        run: |
          if [ ! -f apps/server/dist/drizzle/core/meta/_journal.json ]; then
            echo "expected apps/server/dist/drizzle/core/meta/_journal.json beside dist/server.js" >&2
            exit 1
          fi

      # The same shape of check as above, for the OTHER file scripts/copy-migrations.mjs writes
      # (I11, 2026-07-27 pre-merge review) — confirms the write actually ran and named the module
      # system correctly, not just that `build` exited zero.
      - name: Assert the built bundle carries a dist/package.json declaring ESM
        run: |
          if [ ! -f apps/server/dist/package.json ]; then
            echo "expected apps/server/dist/package.json beside dist/server.js" >&2
            exit 1
          fi
          if ! grep -q '"type":"module"' apps/server/dist/package.json; then
            echo "expected {\"type\":\"module\"} in apps/server/dist/package.json, got: $(cat apps/server/dist/package.json)" >&2
            exit 1
          fi

      # Same shape as the credentials smoke test above: DATABASE_URL absent is the cheapest failure
      # to trigger with no Postgres available, and boot.ts's contract (see its own doc comment) is to
      # let a boot failure escape and exit non-zero rather than half-start. AppError's message IS the
      # code (packages/shared/src/errors.ts's own comment), so grepping stderr for the literal code
      # confirms the bundle failed for THIS reason and not, say, a dependency the bundler forgot to
      # inline.
      - name: Smoke-test the server bundle (no DATABASE_URL)
        run: |
          set +e
          output=$(node apps/server/dist/server.js 2>&1)
          code=$?
          set -e
          echo "$output"
          if [ "$code" -eq 0 ]; then
            echo "expected a non-zero exit code with no DATABASE_URL set, got 0" >&2
            exit 1
          fi
          if ! grep -q "server.config_missing" <<< "$output"; then
            echo "expected the 'server.config_missing' code in output, got: $output" >&2
            exit 1
          fi

      # I11 (2026-07-27 pre-merge review): dist/server.js is ESM. A bare .js file's module system
      # is normally decided by Node walking up for the nearest package.json — today that walk finds
      # apps/server/package.json's own "type": "module" purely because dist/ lives two directories
      # under it, not because the bundle carries that fact itself. scripts/copy-migrations.mjs now
      # also writes dist/package.json so dist/ is portable ALONE — copied into a Docker image with
      # nothing else from this package, say. Proven here by copying JUST dist/ out to a directory
      # with no ancestor package.json at all (mktemp -d, off the checkout entirely) and running it
      # from there. This runner's own Node (this workflow's .nvmrc) auto-detects ES module syntax
      # even with no package.json at all, so this step passing does not by itself prove
      # dist/package.json is load-bearing on THIS Node — it is confirmed load-bearing on a Node
      # build with that detection disabled (`--no-experimental-detect-module`; see
      # scripts/copy-migrations.mjs's own comment). What this step actually guards is dist/ staying
      # portable and self-describing going forward — a regression here (the write silently dropped,
      # or a future esbuild option this detection cannot sniff) would otherwise only surface off
      # this specific Node version, in whatever environment an operator's Dockerfile happens to run.
      - name: Smoke-test dist/ copied out on its own, with no ancestor package.json
        run: |
          standalone=$(mktemp -d)
          cp -r apps/server/dist/. "$standalone/"
          set +e
          output=$(node "$standalone/server.js" 2>&1)
          code=$?
          set -e
          echo "$output"
          if [ "$code" -eq 0 ]; then
            echo "expected a non-zero exit code with no DATABASE_URL set, got 0" >&2
            exit 1
          fi
          if ! grep -q "server.config_missing" <<< "$output"; then
            echo "expected the 'server.config_missing' code in output, got: $output" >&2
            exit 1
          fi

  # TypeScript project-wide type check. No Playwright/Chromium involved.
  typecheck:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

  # packages/db alone. It is 189s of the old 387s `pnpm test:coverage` step AND a topological
  # barrier: `pnpm -r` orders by dependency, so seven packages could not start until it finished.
  # On its own runner it stops blocking anything.
  test-heavy:
    needs: changes
    # Gated on `heavy`, not on the scope filter. Two inclusion filters are OR-ed rather than
    # intersected, so adding `--filter "@waitron/db"` to the scope's own filters would run this 189s
    # suite on every code change; and `@waitron/db[<base>]` — pnpm's changed-since form, which this
    # workflow no longer uses at all — misses db when one of db's own dependencies changed. The
    # `changes` job resolves membership properly and answers here with a boolean.
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    env:
      # packages/db's harness skips its real-Postgres target when Docker is absent. That is right on
      # a laptop and wrong here: the skipped target is the only one that can observe lock contention
      # and non-superuser RLS, so a runner without Docker would report green having checked neither.
      REQUIRE_DOCKER: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # No scope filter here: the `changes` job already decided this shard has work to do, so the
      # only question left is which package, and that is always packages/db.
      #
      # The guard first, for the reason in its own doc comment: pnpm answers "nothing to do" with
      # exit 0 and a line on stdout, so a shard whose filter selects nothing — or selects something
      # with no `test:coverage` script — reports success having run no tests. That is what happened
      # to test-light on a root-config pull request before this branch, and it costs nothing to
      # refuse it here too.
      - name: Run the db shard
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: |
          set -euo pipefail
          pnpm --filter "@waitron/db" ls --depth -1 --json \
            | node scripts/changed-packages.mjs runnable test:coverage
          pnpm --filter "@waitron/db" test:coverage

  # apps/server alone: the workspace's LARGEST suite, split out of test-light on a measurement.
  #
  # On the unfiltered `main` run 32417600304 (`gh run view 32417600304 --json jobs`) apps/server was
  # 341.7s of test-light's 358s wall-clock — 63 files, 277s of it test execution — so it alone set
  # that shard's floor, and re-sharding the other twenty packages could not drop test-light below it.
  # A runner of its own stops it being that floor. Unlike test-ui/till/dashboard this is a PERFORMANCE
  # split, not a browser-hang mitigation — apps/server touches no browser. See SERVER_PACKAGE in
  # scripts/changed-scope.mjs.
  #
  # The dedicated runner also lets apps/server run MULTI-FORK (apps/server/vitest.config.ts's
  # poolOptions): the @vitest/coverage-v8 branch under-merge that held it to singleFork is a `pnpm -r`
  # contention artifact a runner it has to itself does not have.
  #
  # REQUIRE_DOCKER + TESTCONTAINERS_RYUK_DISABLED exactly as test-heavy, and as test-light before it:
  # apps/server's global-setup (src/testing/global-setup.ts) boots a shared Postgres container its
  # real-PG suites clone from via useTemplateDb, so REQUIRE_DOCKER makes a runner without Docker fail
  # loudly instead of skipping those suites.
  test-server:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    env:
      REQUIRE_DOCKER: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The guard first, same reason as the other shards: pnpm answers "nothing to do" with exit 0
      # and a line on stdout, so a shard whose filter selects nothing reports success having run no
      # tests.
      - name: Run the server shard
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: |
          set -euo pipefail
          pnpm --filter "@waitron/server" ls --depth -1 --json \
            | node scripts/changed-packages.mjs runnable test:coverage
          pnpm --filter "@waitron/server" test:coverage

  # packages/fiscal-verifactu alone. It is a maxForks:4 suite — thousands of real AEAT fixtures across
  # 33 files — so, like the other two (packages/db → test-heavy, apps/server → test-server), it wants
  # all four of a runner's cores and belongs on its own; it was the last maxForks:4 package still
  # sharing, in the light shards, where it oversubscribed its bin-mates. Measured on the two-shard run
  # 32425078097 it was 219s inside test-light-a's 270s while the lighter test-light-b packed ten
  # packages into 127s. A runner of its own lets its maxForks:4 run uncontended AND stops it inflating
  # its bin-mates. Unlike apps/server this needed no config change: fiscal-verifactu already
  # multi-forks (packages/fiscal-verifactu/vitest.config.ts). See FISCAL_VERIFACTU_PACKAGE in
  # scripts/changed-scope.mjs.
  #
  # REQUIRE_DOCKER + TESTCONTAINERS_RYUK_DISABLED as the other real-Postgres shards: it clones from
  # @waitron/db's shared container. NOT the mutation-verifactu job — that is the separate
  # packages/verifactu.
  test-fiscal-verifactu:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.fiscal_verifactu == 'true'
    runs-on: ubuntu-latest
    env:
      REQUIRE_DOCKER: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The guard first, same reason as every shard: pnpm answers "nothing to do" with exit 0 and a
      # line on stdout, so a shard whose filter selects nothing reports success having run no tests.
      - name: Run the fiscal-verifactu shard
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: |
          set -euo pipefail
          pnpm --filter "@waitron/fiscal-verifactu" ls --depth -1 --json \
            | node scripts/changed-packages.mjs runnable test:coverage
          pnpm --filter "@waitron/fiscal-verifactu" test:coverage

  # packages/ui alone, and the only job in this file that needs a browser.
  #
  # It was part of test-light until 2026-08-01, when that shard HUNG on it twice — the receipts, and
  # what they do and do not establish, are on UI_PACKAGE in scripts/changed-scope.mjs. In short:
  # both times Chromium had installed, the other twelve packages finished, @waitron/ui printed
  # passing test files and then stopped, and the runner named `chrome-headless-shell` among the
  # orphan processes it killed at cancellation. Whether isolating it FIXES that can only be read off
  # future runs; nothing here demonstrates it.
  #
  # What isolating it does buy with certainty is that a wedged browser can no longer take twelve
  # other packages' results down with it — before this, the whole shard reported nothing.
  #
  # No REQUIRE_DOCKER and no TESTCONTAINERS_RYUK_DISABLED, unlike the other two shards: packages/ui
  # drives Chromium through Playwright and touches no database. Checked rather than assumed —
  # `grep -rn REQUIRE_DOCKER packages apps scripts` on 2026-08-01 answers only in packages/db (its
  # harness, its suites and its README) and in the two workflows that set it, and `packages/ui`'s
  # only runtime dependency is `lit`.
  test-ui:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Resolve installed Playwright version
        id: playwright-version
        run: echo "version=$(pnpm --filter @waitron/ui exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # `pnpm exec` at the repo root does not resolve a bin scoped to a workspace member (only
      # `pnpm -w exec` walks up for root-level bins), so plain `pnpm exec playwright ...` fails here
      # with "Command \"playwright\" not found". Scoping the exec to the @waitron/ui workspace
      # (where playwright is a devDependency) resolves it correctly without needing a
      # working-directory override.
      #
      # No `--with-deps`: the ubuntu-latest image already ships every shared library Chromium needs to
      # launch, so the apt-get that `--with-deps` runs on every job buys nothing but wall-clock. That
      # apt step is NOT covered by the browser cache above — GitHub boots a clean VM per run, so apt
      # state is never part of what actions/cache restored — and it was the step's long pole: 12-17s on
      # a cache-warm run, and minutes on a slow one (run 32277880914's three browser shards spent
      # 94s / 261s / 601s here). Dropping it leaves a plain `playwright install chromium`, which the
      # cache turns into a near-instant binary check on a hit and a browser download on a miss. The
      # receipt for "the image already has the libraries" is a real passing run, not an assertion: on
      # run 32304169675 (a `.github/` change → global scope, so all three browser shards ran) each
      # launched Chromium and passed with `--with-deps` gone, and this step fell to 1s from the 12-17s
      # it took cache-warm with the flag (run 32282128111: 12s / 13s / 12s for ui / till / dashboard).
      #
      # Kept simple deliberately. Running `--with-deps` on cache-miss only would NOT be a safer
      # variant: the browser cache and the VM's apt state are independent (a fresh VM every run, hit or
      # miss), so a library missing from the image would still break every cache-HIT run — passing on
      # the version-bump PR that misses the cache, then failing everything after it. If a future image
      # or Playwright bump does drop a library Chromium needs, these shards fail to launch it and go red
      # loudly; the fix is to restore `--with-deps` here, or apt-get the one missing library.
      - run: pnpm --filter @waitron/ui exec playwright install chromium

      # The guard first, for the same reason as the other two shards: pnpm answers "nothing to do"
      # with exit 0 and a line on stdout, so a shard whose filter selects nothing reports success
      # having run no tests.
      - name: Run the ui shard
        run: |
          set -euo pipefail
          pnpm --filter "@waitron/ui" ls --depth -1 --json \
            | node scripts/changed-packages.mjs runnable test:coverage
          pnpm --filter "@waitron/ui" test:coverage

  # apps/till alone: the Counter POS browser app, the workspace's SECOND Chromium consumer after
  # packages/ui. It has a shard of its own for the same reason test-ui does — a @vitest/browser +
  # Playwright package sharing test-light with the rest of the workspace is the shape that hung that
  # shard on packages/ui, twice (the receipts are on UI_PACKAGE in scripts/changed-scope.mjs). This
  # split is PREEMPTIVE: apps/till has never run in test-light and so has never hung it, and nothing
  # here proves it would — see TILL_PACKAGE in scripts/changed-scope.mjs for the honest framing. What
  # it buys with certainty is that a second wedged browser can never take the other packages'
  # test-light results down with it.
  #
  # No REQUIRE_DOCKER and no TESTCONTAINERS_RYUK_DISABLED, exactly as test-ui: apps/till drives
  # Chromium through Playwright and touches no database.
  test-till:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.till == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Resolve installed Playwright version
        id: playwright-version
        run: echo "version=$(pnpm --filter @waitron/till exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # Same as test-ui: scope the exec to the @waitron/till workspace (where playwright is a
      # devDependency) — plain `pnpm exec` at the repo root does not resolve a member-scoped bin —
      # and no `--with-deps`, because the ubuntu-latest image already ships Chromium's shared
      # libraries; see the test-ui step above for the full rationale and the receipt.
      - run: pnpm --filter @waitron/till exec playwright install chromium

      # The guard first, for the same reason as the other shards: pnpm answers "nothing to do" with
      # exit 0 and a line on stdout, so a shard whose filter selects nothing reports success having
      # run no tests.
      - name: Run the till shard
        run: |
          set -euo pipefail
          pnpm --filter "@waitron/till" ls --depth -1 --json \
            | node scripts/changed-packages.mjs runnable test:coverage
          pnpm --filter "@waitron/till" test:coverage

  # apps/dashboard alone: the admin/reporting dashboard app, the workspace's THIRD Chromium consumer
  # after packages/ui and apps/till. It has a shard of its own for the same reason test-till does — a
  # @vitest/browser + Playwright package sharing test-light with the rest of the workspace is the
  # shape that hung that shard on packages/ui, twice (the receipts are on UI_PACKAGE in
  # scripts/changed-scope.mjs). This split is PREEMPTIVE: apps/dashboard has never run in test-light
  # and so has never hung it, and nothing here proves it would — see DASHBOARD_PACKAGE in
  # scripts/changed-scope.mjs for the honest framing. What it buys with certainty is that a third
  # wedged browser can never take the other packages' test-light results down with it.
  #
  # No REQUIRE_DOCKER and no TESTCONTAINERS_RYUK_DISABLED, exactly as test-ui and test-till:
  # apps/dashboard drives Chromium through Playwright and touches no database.
  test-dashboard:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Resolve installed Playwright version
        id: playwright-version
        run: echo "version=$(pnpm --filter @waitron/dashboard exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # Same as test-ui and test-till: scope the exec to the @waitron/dashboard workspace (where
      # playwright is a devDependency) — plain `pnpm exec` at the repo root does not resolve a
      # member-scoped bin — and no `--with-deps`, because the ubuntu-latest image already ships
      # Chromium's shared libraries; see the test-ui step above for the full rationale and the receipt.
      - run: pnpm --filter @waitron/dashboard exec playwright install chromium

      # The guard first, for the same reason as the other shards: pnpm answers "nothing to do" with
      # exit 0 and a line on stdout, so a shard whose filter selects nothing reports success having
      # run no tests.
      - name: Run the dashboard shard
        run: |
          set -euo pipefail
          pnpm --filter "@waitron/dashboard" ls --depth -1 --json \
            | node scripts/changed-packages.mjs runnable test:coverage
          pnpm --filter "@waitron/dashboard" test:coverage

  # The "everything else" packages, split into two balanced halves run on separate free 4-vCPU
  # runners IN PARALLEL — test-light-a and test-light-b. --no-sort removes the dependency ordering,
  # which earns nothing for tests: every member resolves to ./src/*.ts and no test imports a
  # sibling's dist/, so nothing here consumes a build artefact. (`build` DOES need the ordering —
  # this flag is on the test invocation only.)
  #
  # WHY TWO. test-light was CPU-bound, and its wall-clock floor is total-work ÷ the runner's cores,
  # NOT the size of its biggest package. On one free 4-vCPU runner its ~1340s of v8-coverage work
  # floored it near 390s, and splitting apps/server out (test-server) barely moved it — on PR #126's
  # run 32421460693 test-light was still 391s with apps/server already gone. Two free 4-vCPU runners
  # give 8 effective cores for $0 (larger runners are billed per-minute even on a public repo), so
  # halving the work across them roughly halves the floor. Membership and the balance rationale live
  # on LIGHT_A_PACKAGES / LIGHT_B_PACKAGES in scripts/changed-scope.mjs.
  #
  # NO PLAYWRIGHT STEPS in either: the browser packages (ui/till/dashboard) each have their own
  # shard, so nothing here launches Chromium.
  #
  # EACH SHARD SUBTRACTS ITS BIN'S COMPLEMENT — every package in OWN_SHARD_PACKAGES plus every
  # package in the OTHER bin — rather than including its own bin. Subtraction is what INTERSECTS with
  # the scope on a pull request: `--filter "...$pkg"` per changed package selects the scope, then
  # `--filter "!<pkg>"` per complement package pares it down to this bin's share of it. An include
  # list would UNION instead, running the whole bin for a one-package PR. Measured that subtraction
  # subtracts rather than OR-s on 2026-08-05: `--filter "...@waitron/db"` gives 17 packages and
  # adding `--filter "!@waitron/db"` gives the same 17 minus db. On a GLOBAL scope (main, an
  # unattributable path, a diff we could not work out) the `...$pkg` includes are empty, so the
  # complement subtraction alone selects the bin — the fail-CLOSED direction.
  #
  # scripts/ci-workflow.test.mjs asserts each shard's `!` filters equal OWN_SHARD_PACKAGES ∪ the
  # other bin AND that the shards partition every test package exactly once, both against the real
  # `pnpm ls` — so a bin-list edit here that disagrees with changed-scope.mjs cannot land silently.
  #
  # The guard runs BEFORE the tests so it fails in a second rather than after the suite: pnpm reports
  # both "No projects matched the filters" and `None of the selected packages has a "test:coverage"
  # script` on stdout with exit 0 (measured 2026-08-01, pnpm 9.15.0), so without it a shard can
  # report success having run nothing. Read off run 30653487133, from when this was a single `light`
  # gated on `code` alone: it was that run's longest job at 48s and printed exactly that message — a
  # runner and a `pnpm install` for zero test execution, reported as success.
  #
  # REQUIRE_DOCKER + TESTCONTAINERS_RYUK_DISABLED as the old single shard set them: both bins hold
  # real-Postgres packages that clone from @waitron/db's shared container.
  test-light-a:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.light_a == 'true'
    runs-on: ubuntu-latest
    env:
      REQUIRE_DOCKER: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run the light-a shard
        env:
          SCOPE: ${{ needs.changes.outputs.scope }}
          PACKAGES: ${{ needs.changes.outputs.packages }}
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: |
          set -euo pipefail
          # `set -f` for the same reason as the `changes` job's gates step: `$PACKAGES` is unquoted
          # so it field-splits, and an unquoted expansion globs too. Restored immediately after.
          set -f
          set --
          if [ "$SCOPE" = "packages" ] && [ -n "$PACKAGES" ]; then
            for pkg in $PACKAGES; do set -- "$@" --filter "...$pkg"; done
          fi
          set +f
          # OWN_SHARD_PACKAGES — subtracted by both light shards.
          set -- "$@" --filter "!@waitron/db"
          set -- "$@" --filter "!@waitron/ui"
          set -- "$@" --filter "!@waitron/till"
          set -- "$@" --filter "!@waitron/dashboard"
          set -- "$@" --filter "!@waitron/server"
          set -- "$@" --filter "!@waitron/fiscal-verifactu"
          # LIGHT_B_PACKAGES — the other bin, subtracted so what remains is bin A.
          set -- "$@" --filter "!@waitron/payments-stripe"
          set -- "$@" --filter "!@waitron/identity"
          set -- "$@" --filter "!@waitron/workforce"
          set -- "$@" --filter "!@waitron/credentials"
          set -- "$@" --filter "!@waitron/catalogue"
          set -- "$@" --filter "!@waitron/recipes"
          set -- "$@" --filter "!@waitron/workforce-es"
          set -- "$@" --filter "!@waitron/layouts"
          set -- "$@" --filter "!@waitron/verifactu"
          set -- "$@" --filter "!@waitron/bench-pglite"

          pnpm "$@" ls --depth -1 --json \
            | node scripts/changed-packages.mjs runnable test:coverage
          pnpm "$@" --no-sort test:coverage

  # The mirror of test-light-a: the other balanced half. See test-light-a's comment for the full
  # rationale (why two shards, why each subtracts its bin's complement rather than including its own
  # bin, and the guard). This shard subtracts OWN_SHARD_PACKAGES ∪ LIGHT_A_PACKAGES so what remains
  # is bin B.
  test-light-b:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.light_b == 'true'
    runs-on: ubuntu-latest
    env:
      REQUIRE_DOCKER: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run the light-b shard
        env:
          SCOPE: ${{ needs.changes.outputs.scope }}
          PACKAGES: ${{ needs.changes.outputs.packages }}
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: |
          set -euo pipefail
          set -f
          set --
          if [ "$SCOPE" = "packages" ] && [ -n "$PACKAGES" ]; then
            for pkg in $PACKAGES; do set -- "$@" --filter "...$pkg"; done
          fi
          set +f
          # OWN_SHARD_PACKAGES — subtracted by both light shards.
          set -- "$@" --filter "!@waitron/db"
          set -- "$@" --filter "!@waitron/ui"
          set -- "$@" --filter "!@waitron/till"
          set -- "$@" --filter "!@waitron/dashboard"
          set -- "$@" --filter "!@waitron/server"
          set -- "$@" --filter "!@waitron/fiscal-verifactu"
          # LIGHT_A_PACKAGES — the other bin, subtracted so what remains is bin B.
          set -- "$@" --filter "!@waitron/core"
          set -- "$@" --filter "!@waitron/payments"
          set -- "$@" --filter "!@waitron/provisioning"
          set -- "$@" --filter "!@waitron/reporting"
          set -- "$@" --filter "!@waitron/scheduler"
          set -- "$@" --filter "!@waitron/purchasing"
          set -- "$@" --filter "!@waitron/sync"
          set -- "$@" --filter "!@waitron/migrations"
          set -- "$@" --filter "!@waitron/fiscal"
          set -- "$@" --filter "!@waitron/shared"

          pnpm "$@" ls --depth -1 --json \
            | node scripts/changed-packages.mjs runnable test:coverage
          pnpm "$@" --no-sort test:coverage

  # Mutation testing for packages/verifactu only. Unlike packages/ui — whose
  # mutation run is weekly in mutation.yml because each mutant reruns the full
  # real-Chromium suite — this package is pure Node with no browser, so a run
  # is cheap enough to gate every PR. It is also the package where a hollow
  # test means an unverifiable hash chain rather than a misaligned button,
  # which is why it carries a hard threshold (break: 90) while packages/ui
  # publishes a score without failing on it.
  #
  # "Cheap enough to gate every PR" was true of the job in isolation and false of the workflow.
  # Read off this branch's first scoped run with
  # `gh run view 30650089655 --json createdAt,updatedAt,jobs` (head 4926cf5): the run spanned 4m8s,
  # THIS JOB ran 17:10:35→17:14:01 of it (3m26s), and every other job was finished by 17:11:40 —
  # 1m39s in, with test-heavy skipped outright. Gated on `code` alone it ran on any code change at
  # all, so it set the floor for every pull request in the repository, including the ones nowhere
  # near packages/verifactu.
  #
  # So it now gates on membership of the resolved scope, exactly as test-heavy does, and for the
  # same reason a filter on the job cannot express it (see gateOutputs in
  # scripts/changed-scope.mjs). On main the scope is `global` and this always runs.
  mutation-verifactu:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.verifactu == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @waitron/verifactu mutation

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-verifactu
          path: packages/verifactu/reports/mutation/
          retention-days: 30

  # packages/shared is pure functions over strings and BigInt: no browser, no database, no
  # async. That makes it the cheapest mutation target in the repo — cheaper than
  # packages/verifactu — so it runs at break: 90 rather than publishing a score the way packages/ui
  # does. Contrast packages/db, where every test boots PGlite and the cost profile resembles
  # packages/ui's weekly ungated run.
  #
  # It gated every pull request until this gate was added; it now gates the ones whose resolved
  # scope contains packages/shared, by the same membership mechanism as mutation-verifactu above.
  # Cheapness is not on its own a reason to run: this job took 55s on run 30650089655 (17:10:36 →
  # 17:11:31) and was nowhere near that run's critical path — but a job the diff could not have
  # affected has nothing to say about it, whatever it costs, and scoping only the expensive one of a
  # matched pair would leave the mechanism reading as a special case rather than as the rule.
  mutation-shared:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @waitron/shared mutation

  # The aggregate gate. This file's header covers what branch protection requires and why the job
  # ids above are free to change; what follows is only how this job itself works.
  #
  # `if: always()` is here to make this job REPORT AT ALL, not to make it report failures. A job
  # whose `needs` were skipped is skipped itself by default, and a skipped check never satisfies
  # branch protection — so on a documentation-only change, where most of this workflow skips, `ci`
  # would never report and the pull request would wait for a status that is not coming. That is the
  # same deadlock the five-required-ids arrangement had, and `always()` is what stops the fix for it
  # reintroducing it one layer up.
  #
  # Because the job therefore always runs, its own `if` cannot be what decides pass or fail. The
  # step below is: it reads `needs.*.result` and exits non-zero itself.
  ci:
    if: always()
    needs:
      - changes
      - lint
      - bundle-smoke
      - typecheck
      - test-heavy
      - test-server
      - test-fiscal-verifactu
      - test-ui
      - test-till
      - test-dashboard
      - test-light-a
      - test-light-b
      - mutation-verifactu
      - mutation-shared
    runs-on: ubuntu-latest
    steps:
      # `skipped` must PASS: scoping works by skipping, and a skipped job means "this change could
      # not affect that check", not "that check did not run". `cancelled` must FAIL: ci.yml sets
      # cancel-in-progress, and a superseded run reporting green would let a stale result satisfy
      # branch protection. Getting that pair backwards turns this job into a rubber stamp.
      #
      # These expressions only evaluate on GitHub, so there is no local way to check them. Both
      # directions were therefore run against the real workflow, on PR #25:
      #
      #   run 30642999746 — typecheck FAILED, the other four succeeded, and `ci` FAILED.
      #   run 30643556188 — mutation-shared SKIPPED, everything else succeeded, and `ci` PASSED.
      #
      # `cancelled` is the untested half of the pair: it is the second `contains(...)` in the same
      # `if` below and has never been observed firing, because provoking it means racing a
      # superseding push.
      - name: Fail if any needed job did not succeed
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled')
        run: |
          echo "A required job did not succeed:"
          echo '${{ toJSON(needs) }}'
          exit 1
