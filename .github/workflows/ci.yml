name: CI

# `ci` is the only job in this file that branch protection requires. Ruleset 19899160 requires
# exactly three contexts — read back on 2026-07-31 with:
#
#   gh api repos/:owner/:repo/rulesets/19899160 \
#     --jq '.rules[] | select(.type=="required_status_checks") | .parameters.required_status_checks[].context'
#
#   LICENSE is unmodified Elastic License 2.0
#   Every commit is signed off
#   ci
#
# The other two are produced by licence.yml, whose `licence-integrity` and `dco` jobs set those
# strings as their `name:` (licence.yml:13 and :23), so `ci` is this file's entire interface to
# branch protection.
#
# The job ids below are therefore NOT a stable public interface, and removing that property is the
# whole point of the `ci` job. Until the ruleset was changed, five ids here were required by name:
# renaming one silently broke the ruleset, and skipping one left a pull request waiting for a status
# that would never report. Both of those are now free moves, which is what makes the scoping in
# docs/superpowers/specs/2026-07-31-scoped-ci-design.md possible at all.
#
# The one rule that replaces it: every other job in this file must appear in `ci`'s `needs`. A job
# that does not is reporting to nothing — it could fail while the pull request stays green.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Works out what the rest of the workflow needs to do. Everything below gates on its outputs.
  #
  # Two independent decisions, deliberately not merged into one (design §3.2):
  #   `code`  — is there anything here that is not prose? If not, only `lint` runs, on pull requests
  #             AND on main, so a documentation merge costs nothing in either place.
  #   `scope` — on a pull request, narrow the test shards to the packages that changed and the
  #             packages that depend on them. On main, run everything, because that unfiltered run
  #             is what verifies the narrowing was right.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
      scope: ${{ steps.classify.outputs.scope }}
      heavy: ${{ steps.heavy.outputs.heavy }}
    steps:
      # fetch-depth: 0 is load-bearing. The default is 1, which leaves no merge base to diff
      # against and no history for pnpm's own change detection — both would then silently report
      # "nothing changed" and skip the entire suite.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Needed for the `pnpm ls` membership query below. No `pnpm install` is required — `pnpm ls
      # --filter` resolves from the workspace manifests alone (verified in a clone with no
      # node_modules present).
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - id: classify
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF"
            paths=$(git diff --name-only "origin/$BASE_REF...HEAD")
            # Changed packages AND THEIR DEPENDENTS. The ellipsis goes on the LEFT — `[ref]...`
            # is the other direction (a package and its dependencies) and would test the wrong set.
            scope="...[origin/$BASE_REF]"
          else
            case "$BEFORE" in
              # An all-zero `before` means a new branch or a force-push: no usable base, so no diff.
              # Emit nothing and let the classifier fail closed to a full run.
              *[!0]*) paths=$(git diff --name-only "$BEFORE" "$SHA") ;;
              *) echo "no usable base ref ($BEFORE) — running everything" >&2; paths="" ;;
            esac
            # main always runs the full suite: it is what verifies the pull request's narrowing.
            scope=""
          fi

          printf '%s\n' "$paths" | node .github/scripts/changed-scope.mjs >> "$GITHUB_OUTPUT"
          echo "scope=$scope" >> "$GITHUB_OUTPUT"

      # Does the heavy shard have anything to do? This CANNOT be expressed as a filter on the shard
      # itself — see needsHeavyShard's own comment for the two wrong formulations and why each
      # fails. An unscoped run (main) always needs it.
      - id: heavy
        env:
          SCOPE: ${{ steps.classify.outputs.scope }}
        run: |
          set -euo pipefail
          if [ -z "$SCOPE" ]; then
            echo "heavy=true" >> "$GITHUB_OUTPUT"
          else
            pnpm --filter "$SCOPE" ls --depth -1 --json 2>/dev/null \
              | node .github/scripts/changed-scope.mjs heavy >> "$GITHUB_OUTPUT"
          fi

  # Always runs, on every path, including a documentation-only change — Prettier is the only tool
  # here that reads prose, and the repo-level suite is what proves the `changes` job's own
  # classifier still works. Both are cheap enough that gating them would save nothing.
  #
  # Worth knowing precisely what `format:check` covers: .prettierignore lists `docs/`, so
  # root-level Markdown (CLAUDE.md, README.md, CONTRIBUTING.md) IS checked and nothing under docs/
  # is. Established by malforming a file in each location — `prettier --check` reports an ignored
  # path and a clean path identically, so the obvious probe proves nothing.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm format:check

      # The repo-level project only (`vitest run` at the root, NOT `pnpm test`, which would also run
      # every package). Covers .github/scripts/changed-scope.mjs — if the classifier is wrong, every
      # gating decision below is wrong, so it must run even on the paths it would otherwise skip.
      - run: pnpm vitest run --coverage

  # The bundles operators actually run. Nothing else in this workflow builds them: dist/ is
  # gitignored, both bin.ts files are excluded from coverage, and typecheck and test run against
  # TypeScript source. Gated on `code` because a Markdown edit cannot change an esbuild bundle.
  bundle-smoke:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Nothing else in this workflow builds packages/credentials's bundle: dist/ is gitignored,
      # bin.ts is excluded from coverage, and the SDD ledger records this exact artifact shipping
      # broken twice during development (a duplicated shebang, then pg's CJS require failing under
      # --format=esm). typecheck and test both run against TypeScript source, never the bundle
      # operators actually run — this is the one gate that would have caught either break.
      - run: pnpm --filter @waitron/credentials build

      # A smoke test, not a full run: confirms the BUILT bundle actually executes under Node with no
      # real database available. DATABASE_URL absent is the cheapest failure to trigger without
      # provisioning Postgres, and bin.ts's own contract is to fail fast with a specific message and
      # a non-zero exit code rather than crash with a raw, unformatted stack trace.
      - name: Smoke-test the credentials CLI bundle (no DATABASE_URL)
        run: |
          set +e
          output=$(node packages/credentials/dist/bin.js list 2>&1)
          code=$?
          set -e
          echo "$output"
          if [ "$code" -eq 0 ]; then
            echo "expected a non-zero exit code with no DATABASE_URL set, got 0" >&2
            exit 1
          fi
          if ! grep -q "DATABASE_URL is not set" <<< "$output"; then
            echo "expected the 'DATABASE_URL is not set' message, got: $output" >&2
            exit 1
          fi

      # apps/server has the HARDER version of the problem above. Every *_MIGRATIONS descriptor
      # computes its folder from its own import.meta.url, and esbuild collapses all five onto the
      # bundle's directory, so a mistake in the migrations-root resolution works in development and
      # fails only at boot, in the shipped artefact — the worst available failure mode. Nothing else
      # in this workflow builds this bundle: dist/ is gitignored, src/bin.ts is excluded from
      # coverage, and typecheck/test both run against TypeScript source, never the bundle operators
      # actually run.
      - run: pnpm --filter @waitron/server build

      # scripts/copy-migrations.mjs (invoked by the build script above) is the fix for the collapse:
      # it copies each package's drizzle/ folder in beside dist/server.js. This confirms it actually
      # ran rather than merely that `build` exited zero — a broken copy step would otherwise only
      # surface as a missing folder the first time something tries to boot the bundle for real.
      - name: Assert the built bundle carries its migrations
        run: |
          if [ ! -f apps/server/dist/drizzle/core/meta/_journal.json ]; then
            echo "expected apps/server/dist/drizzle/core/meta/_journal.json beside dist/server.js" >&2
            exit 1
          fi

      # The same shape of check as above, for the OTHER file scripts/copy-migrations.mjs writes
      # (I11, 2026-07-27 pre-merge review) — confirms the write actually ran and named the module
      # system correctly, not just that `build` exited zero.
      - name: Assert the built bundle carries a dist/package.json declaring ESM
        run: |
          if [ ! -f apps/server/dist/package.json ]; then
            echo "expected apps/server/dist/package.json beside dist/server.js" >&2
            exit 1
          fi
          if ! grep -q '"type":"module"' apps/server/dist/package.json; then
            echo "expected {\"type\":\"module\"} in apps/server/dist/package.json, got: $(cat apps/server/dist/package.json)" >&2
            exit 1
          fi

      # Same shape as the credentials smoke test above: DATABASE_URL absent is the cheapest failure
      # to trigger with no Postgres available, and boot.ts's contract (see its own doc comment) is to
      # let a boot failure escape and exit non-zero rather than half-start. AppError's message IS the
      # code (packages/shared/src/errors.ts's own comment), so grepping stderr for the literal code
      # confirms the bundle failed for THIS reason and not, say, a dependency the bundler forgot to
      # inline.
      - name: Smoke-test the server bundle (no DATABASE_URL)
        run: |
          set +e
          output=$(node apps/server/dist/server.js 2>&1)
          code=$?
          set -e
          echo "$output"
          if [ "$code" -eq 0 ]; then
            echo "expected a non-zero exit code with no DATABASE_URL set, got 0" >&2
            exit 1
          fi
          if ! grep -q "server.config_missing" <<< "$output"; then
            echo "expected the 'server.config_missing' code in output, got: $output" >&2
            exit 1
          fi

      # I11 (2026-07-27 pre-merge review): dist/server.js is ESM. A bare .js file's module system
      # is normally decided by Node walking up for the nearest package.json — today that walk finds
      # apps/server/package.json's own "type": "module" purely because dist/ lives two directories
      # under it, not because the bundle carries that fact itself. scripts/copy-migrations.mjs now
      # also writes dist/package.json so dist/ is portable ALONE — copied into a Docker image with
      # nothing else from this package, say. Proven here by copying JUST dist/ out to a directory
      # with no ancestor package.json at all (mktemp -d, off the checkout entirely) and running it
      # from there. This runner's own Node (this workflow's .nvmrc) auto-detects ES module syntax
      # even with no package.json at all, so this step passing does not by itself prove
      # dist/package.json is load-bearing on THIS Node — it is confirmed load-bearing on a Node
      # build with that detection disabled (`--no-experimental-detect-module`; see
      # scripts/copy-migrations.mjs's own comment). What this step actually guards is dist/ staying
      # portable and self-describing going forward — a regression here (the write silently dropped,
      # or a future esbuild option this detection cannot sniff) would otherwise only surface off
      # this specific Node version, in whatever environment an operator's Dockerfile happens to run.
      - name: Smoke-test dist/ copied out on its own, with no ancestor package.json
        run: |
          standalone=$(mktemp -d)
          cp -r apps/server/dist/. "$standalone/"
          set +e
          output=$(node "$standalone/server.js" 2>&1)
          code=$?
          set -e
          echo "$output"
          if [ "$code" -eq 0 ]; then
            echo "expected a non-zero exit code with no DATABASE_URL set, got 0" >&2
            exit 1
          fi
          if ! grep -q "server.config_missing" <<< "$output"; then
            echo "expected the 'server.config_missing' code in output, got: $output" >&2
            exit 1
          fi

  # TypeScript project-wide type check. No Playwright/Chromium involved.
  typecheck:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

  # packages/db alone. It is 189s of the old 387s `pnpm test:coverage` step AND a topological
  # barrier: `pnpm -r` orders by dependency, so seven packages could not start until it finished.
  # On its own runner it stops blocking anything.
  test-heavy:
    needs: changes
    # Gated on `heavy`, not on the scope filter. Two inclusion filters are OR-ed rather than
    # intersected, so `--filter "$SCOPE" --filter "@waitron/db"` would run this 189s suite on every
    # code change; and `@waitron/db[<base>]` misses db when one of db's own dependencies changed.
    # The `changes` job resolves membership properly and answers here with a boolean.
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    env:
      # packages/db's harness skips its real-Postgres target when Docker is absent. That is right on
      # a laptop and wrong here: the skipped target is the only one that can observe lock contention
      # and non-superuser RLS, so a runner without Docker would report green having checked neither.
      REQUIRE_DOCKER: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # No scope filter here: the `changes` job already decided this shard has work to do, so the
      # only question left is which package, and that is always packages/db.
      - name: Run the db shard
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: pnpm --filter "@waitron/db" test:coverage

  # Everything except packages/db. --no-sort removes the dependency ordering, which earns nothing
  # for tests: all 15 workspace members resolve to ./src/*.ts and no test imports a sibling's dist/,
  # so nothing here consumes a build artefact. (`build` DOES need the ordering — this flag is on the
  # test invocation only.)
  test-light:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      REQUIRE_DOCKER: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Resolve installed Playwright version
        id: playwright-version
        run: echo "version=$(pnpm --filter @waitron/ui exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # Only this shard needs a browser — @waitron/ui is the sole Chromium consumer, and test-heavy
      # pays nothing for it.
      #
      # `pnpm exec` at the repo root does not resolve a bin scoped to a
      # workspace member (only `pnpm -w exec` walks up for root-level bins),
      # so plain `pnpm exec playwright ...` fails here with "Command
      # \"playwright\" not found". Scoping the exec to the @waitron/ui
      # workspace (where playwright is a devDependency) resolves it
      # correctly without needing a working-directory override.
      #
      # Always run, cache hit or not: Playwright's own install logic detects
      # a matching browser binary already present under the cached
      # ~/.cache/ms-playwright and skips re-downloading it, but the
      # `--with-deps` OS package install still needs to happen every run —
      # GitHub-hosted runners start from a clean VM each time, so apt state
      # is never part of what actions/cache restored above.
      - run: pnpm --filter @waitron/ui exec playwright install --with-deps chromium

      # Exclusions SUBTRACT from the scoped set rather than being OR-ed with it — measured: with one
      # commit touching packages/db, `--filter "...[main]"` gives 11 packages and adding
      # `--filter "!@waitron/db"` gives the same 11 minus db. That is what makes this shard "the
      # scoped set, minus what test-heavy already ran".
      #
      # The `-n "$SCOPE"` guard is load-bearing, not defensive decoration: on main SCOPE is the
      # empty string, and `pnpm --filter ""` is neither "no filter" nor "match nothing". Measured on
      # pnpm 9.15.0 with this workspace: it exits 1 with
      # `ERROR  Unsupported package selector: {"exclude":false,…}` before selecting anything, so
      # without the guard every main run would fail this shard outright.
      - name: Run the light shard
        env:
          SCOPE: ${{ needs.changes.outputs.scope }}
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: |
          set -euo pipefail
          if [ -n "$SCOPE" ]; then
            pnpm --filter "$SCOPE" --filter "!@waitron/db" --no-sort test:coverage
          else
            pnpm --filter "!@waitron/db" --no-sort test:coverage
          fi

  # Mutation testing for packages/verifactu only. Unlike packages/ui — whose
  # mutation run is weekly in mutation.yml because each mutant reruns the full
  # real-Chromium suite — this package is pure Node with no browser, so a run
  # is cheap enough to gate every PR. It is also the package where a hollow
  # test means an unverifiable hash chain rather than a misaligned button,
  # which is why it carries a hard threshold (break: 90) while packages/ui
  # publishes a score without failing on it.
  mutation-verifactu:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @waitron/verifactu mutation

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-verifactu
          path: packages/verifactu/reports/mutation/
          retention-days: 30

  # packages/shared is pure functions over strings and BigInt: no browser, no database, no
  # async. That makes it the cheapest mutation target in the repo — cheaper than
  # packages/verifactu — so it gates every PR at break: 90. Contrast packages/db, where every
  # test boots PGlite and the cost profile resembles packages/ui's weekly ungated run.
  mutation-shared:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @waitron/shared mutation

  # INTENDED to become the single required status check. It is not one yet: as of this commit
  # ruleset 19899160 still requires the five upstream job ids by name, and swapping it to require
  # only `ci` is a separate repo-admin action taken after this merges. Anyone debugging required
  # checks before then should read the ruleset, not this comment.
  #
  # Once that swap happens, every id above this point becomes free to add, rename, shard or
  # conditionally skip without touching branch protection — which is what makes the scoping in
  # docs/superpowers/specs/2026-07-31-scoped-ci-design.md possible at all. Today each id is required
  # by name, so any rename silently breaks the ruleset and any skipped job leaves a pull request
  # waiting for a status that will never report.
  #
  # `if: always()` is what makes it report at all when something upstream is skipped: without it,
  # GitHub skips a job whose `needs` were skipped, and a skipped required check never satisfies
  # branch protection.
  ci:
    if: always()
    needs:
      - static-analysis
      - typecheck
      - test
      - mutation-verifactu
      - mutation-shared
    runs-on: ubuntu-latest
    steps:
      # `skipped` must PASS: scoping works by skipping, and a skipped job means "this change could
      # not affect that check", not "that check did not run". `cancelled` must FAIL: ci.yml sets
      # cancel-in-progress, and a superseded run reporting green would let a stale result satisfy
      # branch protection. Getting that pair backwards turns this job into a rubber stamp, which is
      # why Task 3 verifies both directions against the real workflow rather than reasoning about
      # them.
      - name: Fail if any needed job did not succeed
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled')
        run: |
          echo "A required job did not succeed:"
          echo '${{ toJSON(needs) }}'
          exit 1
