            done
            if [ "$complete" = true ] && state=$(printf '%s' "$pages" | jq -ers '
              [.[].jobs[]] as $jobs
              | if ($jobs | length) != .[0].total_count or
                   ($jobs | map(.id) | unique | length) != ($jobs | length) or
                   any($jobs[]; (.id | type) != "number" or .id <= 0 or (.id | floor) != .id)
                then error("incomplete or duplicate job inventory") else . end
              | ($ENV.FAMILIES | fromjson | map(select(.enabled))) as $families
              | if ($families | length) == 0 then error("no enabled test families") else . end
              | [$families[] as $family
                 | [$jobs[] | select(if $family.matrix then
                     (.name | test("^" + $family.id + " \\([0-9]+\\)$"))
                     else .name == $family.id end)] as $members
                 | if (if $family.matrix then
                       ($members | map(.name | capture("\\((?<n>[0-9]+)\\)$").n | tonumber) | sort) !=
                         [range(1; $family.count + 1)]
                       else ($members | length) != 1 end) or
                       any($members[]; .run_id != ($ENV.RUN_ID | tonumber) or
                           .run_attempt != ($ENV.RUN_ATTEMPT | tonumber) or .head_sha != $ENV.HEAD_SHA or
                           (.labels | type) != "array")
                   then error("missing or foreign " + $family.id + " job") else . end
                 | [$members[] | select(.labels | index("self-hosted"))] as $routed
                 | if any($routed[]; . as $job |
                     ([($ENV.RUN_ATTEMPT | tonumber)] + (if $job.status == "completed" then
                       [range(1; ($ENV.RUN_ATTEMPT | tonumber))] else [] end)) as $attempts |
                     all($attempts[]; . as $attempt |
                     ($ENV.LABEL_PREFIX + "-" + $ENV.REPO_ID + "-" + $ENV.RUN_ID + "-" + ($attempt | tostring) +
                      "-" + $family.id + "-" + (if $family.matrix then
                        ($job.name | capture("\\((?<n>[0-9]+)\\)$").n) else "1" end)) as $label |
                     ($job.labels | index($label)) == null))
                   then error("unexpected " + $family.id + " routing label") else . end
                 | {id: $family.id, state: (if ($routed | length) == 0 then "empty"
                     elif all($routed[]; .status == "completed" or
                       (.status == "in_progress" and (.runner_id | type) == "number" and .runner_id > 0))
                     then "assigned" else "waiting" end)}] as $states
              | if any($states[]; .state == "empty") then
                  "empty:" + ([$states[] | select(.state == "empty") | .id] | join(", "))
                elif all($states[]; .state == "assigned") then "assigned"
                else "waiting:" + ([$states[] | select(.state == "waiting") | .id] | join(", ")) end
            '); then
              if [ "$state" = assigned ]; then exit 0; fi
              if [[ "$state" == empty:* ]]; then echo "No disposable jobs in enabled families: ${state#empty:}" >&2; exit 1; fi
              valid_inventory=true
              waiting=${state#waiting:}
            fi
            if [ "$final" = true ]; then break; fi
            remaining=$((queue_end - $(date +%s)))
            if [ "$remaining" -gt 30 ]; then remaining=30; fi
            if [ "$remaining" -gt 0 ]; then sleep "$remaining"; fi
          done
          if ! request "$end" "repos/$REPO/actions/runs/$RUN_ID" ||
             ! jq -e '.id == ($ENV.RUN_ID | tonumber) and .run_attempt == ($ENV.RUN_ATTEMPT | tonumber) and .head_sha == $ENV.HEAD_SHA' "$scratch/response"; then
            echo 'Cannot confirm this run attempt before requesting a health check' >&2; exit 1
          fi
          if jq -e '.status == "completed"' "$scratch/response" > /dev/null; then exit 0; fi
          for attempt in 1 2; do
            if request "$end" --method POST "repos/$REPO/actions/workflows/server-health.yml/dispatches" -f ref=main; then
              echo "Server health check requested because $waiting jobs are still queued; it reports stopped server activity" >&2
              [ "$valid_inventory" = true ]
              exit $?
            fi
            if grep -q 'HTTP 409' "$scratch/error" && request "$end" "repos/$REPO/actions/runs/$RUN_ID" &&
               jq -e '.id == ($ENV.RUN_ID | tonumber) and .run_attempt == ($ENV.RUN_ATTEMPT | tonumber) and .head_sha == $ENV.HEAD_SHA and .status == "completed"' "$scratch/response"; then exit 0; fi
          done
          echo "Could not request a server health check for the queued $waiting jobs" >&2
          exit 1
          WATCHDOG

  server-probe:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.server_probe }}
    runs-on: ${{ github.run_attempt == 1 && fromJSON(format('["self-hosted",{0}]', toJSON(format('{0}-{1}-{2}-{3}-server-probe-1', vars.DISPOSABLE_TESTS_LABEL_PREFIX || 'dt', github.repository_id, github.run_id, github.run_attempt)))) || 'ubuntu-latest' }}
    timeout-minutes: 2
    steps:
      - name: Verify server pickup
        run: node -e 'require("node:assert/strict").equal(2 + 2, 4); console.log("Server pickup probe executed")'

  # The aggregate gate. This file's header covers what branch protection requires and why the job
  # ids above are free to change; what follows is only how this job itself works.
  #
  # `if: always()` is here to make this job REPORT AT ALL, not to make it report failures. A job
  # whose `needs` were skipped is skipped itself by default, and a skipped check never satisfies
  # branch protection — so on a documentation-only change, where most of this workflow skips, `ci`
  # would never report and the pull request would wait for a status that is not coming. That is the
  # same deadlock the five-required-ids arrangement had, and `always()` is what stops the fix for it
  # reintroducing it one layer up.
  #
  # The two gate steps decide pass or fail; the duration warning is advisory.
  ci:
    if: always()
    needs:
      - server-probe
      - changes
      - lint
      - root-guards
      - bundle-smoke
      - image
      - typecheck
      - test-heavy
      - test-heavy-merge
      - test-server
      - server-queue-watchdog
      - test-server-stream
      - test-server-merge
      - test-fiscal-verifactu
      - test-fiscal-verifactu-merge
      - test-ui
      - test-till
      - test-till-merge
      - test-dashboard
      - test-dashboard-merge
      - test-setup
      - test-venue-service
      - test-venue-service-merge
      - test-bookings
      - test-media
      - test-payments-stripe
      - test-payments-sumup
      - test-adjustments
      - test-staffing
      - test-provisioning
      - test-provisioning-merge
      - test-identity
      - test-workforce
      - test-light-a
      - test-light-b
      - mutation-shared
      - mutation-shared-aggregate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Naming a permission drops the workflow's defaults. This job checks nothing out, so it holds
    # `actions: read` alone for its two jobs-API reads.
    permissions:
      actions: read
    steps:
      # An ALLOWLIST: `success` and `skipped` pass, and every other result fails, including one
      # nobody anticipated. `skipped` must pass because scoping works by skipping a check this
      # change could not affect; a job skipped because something it needs failed is caught by that
      # failure. The step has no `if:`, so it always runs and prints what each needed job reported.
      #
      # One exception to "skipped passes": a score job skipped while `changes` selected its
      # package fails, because then that package's floor was never checked. The table at the
      # top of the script names each merge job's gate and package. When a job also failed, that
      # failure's message is the one printed.
      #
      # A job GitHub cancelled because no runner picked it up reached `ci` as neither `failure` nor
      # `cancelled`, so this step can pass it. The next step reads each needed job's conclusion
      # from GitHub's jobs API as well as `needs`. See docs/developers/ci-and-gates.md, "The
      # `ci` check passes only when every needed job succeeded or was skipped".
      - name: Fail unless every needed job succeeded or was skipped, and no selected package's merge job was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
          SERVER_PROBE: ${{ inputs.server_probe }}
        run: |
          if [ "$SERVER_PROBE" = true ]; then
            printf '%s' "$NEEDS" | jq -e '."server-probe".result == "success"'
            exit $?
          fi
          jq --unbuffered -nr '
            {
              "test-heavy-merge": { gate: "heavy", package: "@waitron/db" },
              "test-fiscal-verifactu-merge": { gate: "fiscal_verifactu", package: "@waitron/fiscal-verifactu" },
              "test-provisioning-merge": { gate: "provisioning", package: "@waitron/provisioning" },
              "test-server-merge": { gate: "server", package: "@waitron/server" },
              "test-till-merge": { gate: "till", package: "@waitron/till" },
              "test-dashboard-merge": { gate: "dashboard", package: "@waitron/dashboard" },
              "test-venue-service-merge": { gate: "venue_service", package: "@waitron/venue-service" },
              "mutation-shared-aggregate": { gate: "shared", package: "@waitron/shared", kind: "mutation score" },
            } as $merges
            | $ENV.NEEDS | fromjson
            | if type != "object" or length == 0 then error("no needed job results to read") else . end
            | (.changes.outputs // {}) as $scope
            | if has("changes") and ($scope.full != "true" and $scope.full != "false")
              then error("changes must name the full coverage mode") else . end
            | to_entries
            | (.[] | "\(.key): \(.value.result)"),
              (map(select(.value.result != "success" and .value.result != "skipped") | .key)
               | if length > 0 then error("not succeeded or skipped: \(join(", "))") else empty end),
              (map(select(.value.result == "skipped" and $merges[.key] != null
                          and ($merges[.key].kind == "mutation score" or $scope.full == "true")
                          and $scope.code == "true" and $scope[$merges[.key].gate] == "true")
                   | "\($merges[.key].package) was selected but its \($merges[.key].kind // "coverage merge") job \(.key) was skipped")
               | if length > 0 then error(join("; ")) else empty end)
          '

      # An absent record may trust exact needs skipped; present records receive every API check.
      - name: Fail unless GitHub's jobs API reports every needed job succeeded or skipped
        if: always()
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          tries="${JOBS_API_TRIES:-21}"
          delay="${JOBS_API_DELAY:-30}"

          if ! jq -en '$ENV.NEEDS | fromjson | type == "object" and length > 0' >/dev/null; then
            echo "::error::no needed job results to read"
            exit 1
          fi

          judge='
            def finished($need):
              try (
                $need.result == "success" and .status == "in_progress" and has("conclusion") and .conclusion == null
                and (.id | type == "number" and . > 0 and floor == .)
                and (.runner_id | type == "number" and . > 0)
                and ($ENV.RUN_ID | test("^[1-9][0-9]*$"))
                and ($ENV.RUN_ATTEMPT | test("^[1-9][0-9]*$"))
                and ($ENV.HEAD_SHA | test("^[a-f0-9]{40}$"))
                and .run_id == ($ENV.RUN_ID | tonumber)
                and .run_attempt == ($ENV.RUN_ATTEMPT | tonumber)
                and .head_sha == $ENV.HEAD_SHA
                and (.steps as $steps
                     | ($steps | type == "array" and length >= 2)
                     and $steps[0].name == "Set up job" and $steps[0].conclusion == "success"
                     and $steps[-1].name == "Complete job" and $steps[-1].conclusion == "success"
                     and ([$steps[] | select(.name == "Complete job")] | length == 1)
                     and all(range(0; $steps | length); . as $i | $steps[$i] as $step
                       | ($step.name | type == "string" and test("\\S"))
                         and $step.status == "completed"
                         and ($step.conclusion == "success" or $step.conclusion == "skipped")
                         and ($step.number | type == "number" and . > 0 and floor == .)
                         and ($i == 0 or $step.number > $steps[$i - 1].number)))
              ) catch false;
            ($ENV.NEEDS | fromjson) as $needs
            | ($needs | keys_unsorted) as $ids
            | (map(.jobs[])) as $jobs
            | [$ids[] as $id
               | {id: $id,
                  jobs: [$jobs[] | select(.name == $id or (.name | startswith("\($id) (") or startswith("\($id) / ")))
                         | if finished($needs[$id]) then . + {status: "completed", conclusion: "success", from_steps: true} else . end]}]
            | {lines: [.[] | if (.jobs | length) == 0 then
                               if $needs[.id].result == "skipped"
                               then "\(.id): skipped (needs; absent from jobs API)"
                               else "\(.id): not in the jobs API" end
                             else (.jobs[] | "\(.name): \(if .from_steps then "success (final needs and completed steps; run \(.run_id), attempt \(.run_attempt), \(.head_sha))" elif .status == "completed" then .conclusion else .status end)") end],
               bad: [($needs | to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key),
                     (.[].jobs[] | select(.status == "completed" and .conclusion != "success" and .conclusion != "skipped") | .name)],
               duplicate: [([.[].jobs] | add | (group_by(.name)[] | select(length > 1) | .[0].name),
                            (map(select(.id | type == "number")) | group_by(.id)[] | select(length > 1) | .[0].name))],
               missing: [.[] | select((.jobs | length) == 0
                                      and $needs[.id].result != "skipped") | .id],
               pending: [.[].jobs[] | select(.status != "completed") | .name],
               read: ($jobs | length),
               total: $pages[0].total_count,
               changed_total: any($pages[]; .total_count != $pages[0].total_count)}
            | . + if (.bad | length) > 0 then {verdict: "fail", reason: "not succeeded or skipped: \(.bad | join(", "))"}
                  elif (.duplicate | length) > 0 then {verdict: "retry", reason: "duplicate job evidence: \(.duplicate | unique | join(", "))"}
                  elif .changed_total then {verdict: "retry", reason: "job count changed between pages"}
                  elif .read != .total then {verdict: "retry", reason: "read \(.read) of \(.total) jobs"}
                  elif (.missing | length) > 0 then {verdict: "retry", reason: "no job in the jobs API for: \(.missing | join(", "))"}
                  elif (.pending | length) > 0 then {verdict: "retry", reason: "not completed: \(.pending | join(", "))"}
                  else {verdict: "pass", reason: ""} end
          '

          for ((try = 1; try <= tries; try++)); do
            if ((try > 1)); then sleep "$delay"; fi
            verdict=retry
            report=""
            if ! pages=$(gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs?per_page=30"); then
              reason="the jobs API call failed"
            elif ! report=$(jq -sc '. as $pages | '"$judge" <<<"$pages"); then
              reason="the jobs API answer could not be read"
            else
              verdict=$(jq -r .verdict <<<"$report")
              reason=$(jq -r .reason <<<"$report")
              if [[ $verdict != retry ]]; then break; fi
            fi
            echo "Try $try of $tries: $reason"
          done

          if [[ -n $report ]]; then jq -r '.lines[]' <<<"$report"; fi
          if [[ $verdict != pass ]]; then
            echo "::error::$reason"
            exit 1
          fi

      - name: Warn about slow server test jobs
        if: always()
        timeout-minutes: 1
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          unavailable() { echo "::warning::Server job durations unavailable: $1"; }
          if ! selected=$(jq -c '[to_entries[] | select((.key == "test-server" or .key == "test-server-stream") and .value.result != "skipped") | .key]' <<<"$NEEDS"); then
            unavailable "needed jobs could not be read"
            exit 0
          fi
          if [[ $selected == '[]' ]]; then exit 0; fi
          if ! api_timeout=$(command -v gnutimeout || command -v gtimeout || command -v timeout); then
            unavailable "no API timeout command"
            exit 0
          fi
          if ! pages=$("$api_timeout" -k 2s "${SHARD_DURATION_API_TIMEOUT:-45}" gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs?per_page=30"); then
            unavailable "jobs API failed or timed out"
            exit 0
          fi
          if ! report=$(jq -sc --argjson selected "$selected" '
            . as $pages
            | if length == 0 or any(.[]; (.jobs | type) != "array" or (.total_count | type) != "number") then error("invalid pages") else . end
            | [.[].jobs[]] as $jobs
            | if any($pages[]; .total_count != ($jobs | length)) then error("incomplete pages") else . end
            | [$selected[] as $family
               | [$jobs[] | select(.name == $family or (.name | startswith($family + " (")))] as $matches
               | if ($matches | length) == 0 then {warning: ("metadata unavailable for " + $family)}
                 else $matches[]
                   | select(.conclusion != "skipped")
                   | select(.conclusion != "cancelled" or (.runner_id // 0) > 0)
                   | if .status != "completed" then {warning: ("metadata unavailable for " + .name)}
                     else (try ((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)) catch null) as $seconds
                       | if $seconds == null or $seconds < 0 then {warning: ("metadata unavailable for " + .name)}
                         else (.name + ": " + ($seconds | tostring) + "s") as $line
                           | {line: $line} + if $seconds > 240 then {warning: $line} else {} end
                         end
                     end
                 end]
            | {lines: map(.line // empty), warnings: map(.warning // empty)}
          ' <<<"$pages"); then
            unavailable "jobs API metadata could not be read"
            exit 0
          fi
          jq -r '.lines[] | "[shard-duration] " + .' <<<"$report"
          message=$(jq -r '.warnings | join("; ")' <<<"$report")
          if [[ -n $message ]]; then
            message=${message//%/%25}
            message=${message//$'\r'/%0D}
            message=${message//$'\n'/%0A}
            echo "::warning::Inspect server test job timing: $message"
          fi

  # Publishes the image to GHCR — a POST-GATE LEAF, downstream of the WHOLE suite rather than of the
  # image smoke alone. It runs only on a full run: the nightly schedule or a manual run on `main`, or
  # a `v*` tag. `needs: [changes, ci]` waits on the `ci` aggregate, so such a run whose CI gate goes
  # red never ships `:main` / `:sha-…` / `:<version>` to a box that follows it via
  # `docker compose pull` (spec §10). `changes` is needed for its `full` output.
  #
  # It cannot appear in `ci`'s `needs` — that would be a cycle — so it and `release` are the jobs
  # the "every other job is in ci's needs" rule excepts; scripts/ci-workflow.test.mjs pins it downstream
  # of `ci` (needs `ci`, `if:` reads `needs.ci.result`) rather than merely absent.
  publish:
    needs: [changes, ci]
    # Intentional upstream skips must not suppress publishing after the aggregate succeeds.
    if: needs.changes.outputs.full == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && needs.ci.result == 'success' && always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Runs for one release tag publish one at a time, so a later one finds the version published. Every
    # other run keeps a group of its own: a group holds one waiting run and cancels an older waiting one.
    concurrency:
      group: ${{ github.workflow }}-publish-${{ startsWith(github.ref, 'refs/tags/v') && github.ref || github.run_id }}
      cancel-in-progress: false
    # Naming any permission drops every default. `packages: write` is for the GHCR push.
    permissions:
      contents: read
      packages: write
    outputs:
      release_version: ${{ steps.tags.outputs.release_version }}
      release_image: ${{ steps.tags.outputs.release_image }}
    steps:
      - id: checkout
        name: Check out the code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
        timeout-minutes: 2
        continue-on-error: true
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: 1000
          GIT_HTTP_LOW_SPEED_TIME: 20
          GIT_TRACE2_EVENT: 1
      - name: Stop the first checkout's leftover git
        if: steps.checkout.outcome == 'failure'
        run: for p in $(pgrep '^git(-remote-https?)?$'); do [ "$(readlink /proc/$p/cwd)" = "$GITHUB_WORKSPACE" ] && kill -9 "$p" && echo "stopped git $p"; done; true
      - name: Check out the code, second attempt
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
        timeout-minutes: 2
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: 1000
          GIT_HTTP_LOW_SPEED_TIME: 20
          GIT_TRACE2_EVENT: 1
      - name: Measure checkout objects
        run: |
          git rev-parse --is-shallow-repository
          find "$(git rev-parse --git-path objects)/pack" -type f -name '*.pack' -exec wc -c {} +

      # The checkout is one commit deep, and a shallow fetch of main answers "not an ancestor" for a
      # tag behind main's tip, so main is fetched whole.
      - name: Refuse a release tag that is not on main
        if: startsWith(github.ref, 'refs/tags/v')
        timeout-minutes: 4
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: 1000
          GIT_HTTP_LOW_SPEED_TIME: 20
        run: |
          set -euo pipefail
          fetched=0
          for attempt in 1 2; do
            if timeout 90 git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main; then
              fetched=1
              break
            fi
            echo "fetching main failed (attempt $attempt)" >&2
            for p in $(pgrep '^git(-remote-https?)?$'); do [ "$(readlink /proc/$p/cwd)" = "$GITHUB_WORKSPACE" ] && kill -9 "$p" && echo "stopped git $p"; done; true
          done
          [ "$fetched" -eq 1 ] || exit 1
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "the tag $GITHUB_REF_NAME is on $GITHUB_SHA, which is not a commit of main" >&2
            exit 1
          fi
          echo "the tag $GITHUB_REF_NAME is on a commit of main"

      # The release image carries the software producer's settings from three repository secrets. A
      # fork has none of them until it sets its own, so its publish stops here.
      - name: Refuse to publish without the producer's three settings
        env:
          WAITRON_PRODUCER_NAME: ${{ secrets.WAITRON_PRODUCER_NAME }}
          WAITRON_PRODUCER_TAX_ID: ${{ secrets.WAITRON_PRODUCER_TAX_ID }}
          WAITRON_PRODUCER_ADDRESS: ${{ secrets.WAITRON_PRODUCER_ADDRESS }}
        run: |
          set -euo pipefail
          missing=0
          for name in WAITRON_PRODUCER_NAME WAITRON_PRODUCER_TAX_ID WAITRON_PRODUCER_ADDRESS; do
            value=${!name}
            echo "$name: ${#value} characters"
            if [ -z "$value" ]; then
              echo "the repository secret $name is empty or not set" >&2
              missing=1
            fi
          done
          exit "$missing"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags to publish
        id: tags
        env:
          OWNER: ${{ github.repository_owner }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAIN_TAG_GUARD_ENV_OUT: ${{ runner.temp }}/main-image.env
        run: |
          set -euo pipefail
          # GHCR refuses an uppercase path, and github.repository_owner keeps the account's casing.
          repo="ghcr.io/$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')/waitron"
          # The print-agent image is the app repo with a `-print-agent` suffix, so the casing fold is shared.
          agent_repo="$repo-print-agent"
          # Always the immutable one, so a box can be pinned to an exact commit.
          short="sha-$(printf '%s' "$SHA" | cut -c1-7)"
          tags="$repo:$short"
          agent_tags="$agent_repo:$short"
          release_version=""
          release_image=""
          case "$REF" in
            # What deploy/compose.yml defaults to: `docker compose pull` on a box follows main.
            # Full runs can overlap; never move the stable tag behind an already published commit.
            # `hold` still publishes this commit's immutable `sha-` tag; it only declines to move
            # `:main` backwards. Guard: `scripts/main-tag-guard.sh` and its suite.
            refs/heads/main)
              # Assigned on its own line, deliberately: `errexit` is SUSPENDED for a command inside
              # an `if` condition, so a failing guard would read there as "do not move the tag" and
              # turn an error into a silently skipped tag move. As an assignment it fails the step.
              # The time limit fails the step, as any other failure of the guard does.
              decision=$(timeout 120 scripts/main-tag-guard.sh "$repo:main" "$REPOSITORY" "$SHA")
              case "$decision" in
                move)
                  tags="$tags,$repo:main"
                  agent_tags="$agent_tags,$agent_repo:main"
                  ;;
                hold) echo "leaving :main alone - it is already built from a newer commit than $SHA" ;;
                # Neither answer means the guard changed under this step. Refusing here is what
                # stops an unreadable answer from being read as `hold` for ever after.
                *) echo "main-tag-guard.sh answered '$decision', which is neither move nor hold" >&2; exit 1 ;;
              esac
              ;;
            refs/tags/v*)
              release_version=${REF#refs/tags/v}
              # The same form the bundle build accepts (`isReleaseVersion`), refused here before any read.
              if ! [[ $release_version =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || [ "${#release_version}" -gt 50 ]; then
                echo "the tag ${REF#refs/tags/} is not a release: a release tag is v followed by X.Y.Z" >&2
                exit 1
              fi
              release_image="$repo:$release_version"
              # A release tag moves no `:main`, but the producer guard below still compares with
              # `:main`'s settings: the same single registry read, with no decision. Exit 3 means
              # nothing is published under `:main` yet, which leaves the file empty.
              read_status=0
              timeout 120 scripts/published-image-env.sh "$repo:main" >"$MAIN_TAG_GUARD_ENV_OUT" || read_status=$?
              if [ "$read_status" -ne 0 ] && [ "$read_status" -ne 3 ]; then
                echo "cannot read :main's settings for the producer guard (exit $read_status)" >&2
                exit 1
              fi
              tags="$tags,$release_image"; agent_tags="$agent_tags,$agent_repo:$release_version"
              ;;
          esac
          echo "$tags"; echo "$agent_tags"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "agent_tags=$agent_tags" >> "$GITHUB_OUTPUT"
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
          echo "release_image=$release_image" >> "$GITHUB_OUTPUT"

      # A production box refuses to start on a chain made under another producer tax number
      # (`sif.producer_changed`), and nothing can open the new installation a new producer needs
      # until A993. So a new tax number reaches an image only when the repository variable
      # WAITRON_PRODUCER_CHANGE_ALLOWED holds that new number. A value left set lets through only a
      # change to that same number, later ones included. A change of name or address alone is not compared.
      - name: Refuse a change of the producer's tax number that nobody allowed
        env:
          REF: ${{ github.ref }}
          MAIN_IMAGE_ENV: ${{ runner.temp }}/main-image.env
          WAITRON_PRODUCER_TAX_ID: ${{ secrets.WAITRON_PRODUCER_TAX_ID }}
          WAITRON_PRODUCER_CHANGE_ALLOWED: ${{ vars.WAITRON_PRODUCER_CHANGE_ALLOWED }}
        run: |
          set -euo pipefail
          if [ ! -f "$MAIN_IMAGE_ENV" ]; then
            # The step above writes it on every run that publishes: the nightly schedule or a manual
            # run on main (through main-tag-guard.sh), or a `v*` tag (directly).
            echo "no read of :main's settings to compare the producer tax number with on $REF" >&2
            exit 1
          fi
          # A box trims this setting, so padding is not a different number. (It refuses a line break: software-producer.ts.)
          # This is that trim's list of characters, as UTF-8 bytes: `[[:space:]]` varies by locale and
          # misses the no-break spaces. Guard: `scripts/ci-workflow.test.mjs`, against JavaScript's own.
          LC_ALL=C
          shopt -s extglob
          blank=$'[\t\n\v\f\r ]|\xc2\xa0|\xe1\x9a\x80|\xe2\x80[\x80-\x8a\xa8\xa9\xaf]|\xe2\x81\x9f|\xe3\x80\x80|\xef\xbb\xbf'
          trimmed() {
            local value=$1
            value=${value##+($blank)}
            value=${value%%+($blank)}
            printf '%s' "$value"
          }
          published=$(sed -n 's/^WAITRON_PRODUCER_TAX_ID=//p' "$MAIN_IMAGE_ENV" | head -n 1)
          published=$(trimmed "$published")
          tax_id=$(trimmed "$WAITRON_PRODUCER_TAX_ID")
          allowed=$(trimmed "${WAITRON_PRODUCER_CHANGE_ALLOWED:-}")
          if [ -z "$published" ]; then
            echo ":main carries no producer tax number yet, so this is not a change"
          elif [ "$published" = "$tax_id" ]; then
            echo "the producer tax number is the one :main carries"
          elif [ -n "$allowed" ] && [ "$allowed" = "$tax_id" ]; then
            echo "the producer tax number changes from :main's; WAITRON_PRODUCER_CHANGE_ALLOWED allows it"
          else
            echo "the secret WAITRON_PRODUCER_TAX_ID differs from the one :main carries, and production" >&2
            echo "boxes refuse to start on it until A993. To publish it anyway, set the repository" >&2
            echo "variable WAITRON_PRODUCER_CHANGE_ALLOWED to the new tax number, then start a new run" >&2
            echo "(a re-run of this job may not read a variable set after its first attempt)." >&2
            exit 1
          fi

      # Single platform: amd64 is what every box runs. The runner is x86, so a second platform would
      # be built under QEMU. Pay that on a release tag, not on every full run on `main` — and re-add
      # `docker/setup-qemu-action` when you do, since buildx alone registers no binfmt handler and an
      # emulated stage would fail at its first `RUN`.
      - name: Record image build time
        id: provenance
        run: |
          set -euo pipefail
          echo "created=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          mkdir -p build
          git show -s --format='%H:%ct' "$GITHUB_SHA" > build/source-metadata

      # Loaded into the runner's Docker, which takes one platform; a second platform needs this
      # rechecked. The push below is built again from the builder's cache rather than `docker push`ed,
      # so the published index keeps its provenance attestation.
      - name: Build the app image for checking
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          load: true
          tags: waitron-publish-check:local
          build-args: |
            WAITRON_BUILD_ID=${{ github.sha }}
            WAITRON_RELEASE_VERSION=${{ steps.tags.outputs.release_version }}
            WAITRON_PRODUCER_NAME=${{ secrets.WAITRON_PRODUCER_NAME }}
            WAITRON_PRODUCER_TAX_ID=${{ secrets.WAITRON_PRODUCER_TAX_ID }}
            WAITRON_PRODUCER_ADDRESS=${{ secrets.WAITRON_PRODUCER_ADDRESS }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.provenance.outputs.created }}
            org.opencontainers.image.ref.name=${{ github.head_ref || github.ref_name }}

      - name: Check the producer's settings inside the built image
        env:
          CHECK_IMAGE: waitron-publish-check:local
          WAITRON_PRODUCER_NAME: ${{ secrets.WAITRON_PRODUCER_NAME }}
          WAITRON_PRODUCER_TAX_ID: ${{ secrets.WAITRON_PRODUCER_TAX_ID }}
          WAITRON_PRODUCER_ADDRESS: ${{ secrets.WAITRON_PRODUCER_ADDRESS }}
        run: |
          set -euo pipefail
          # Compared here and never printed: GitHub masks a secret only where it appears verbatim.
          failed=0
          for name in WAITRON_PRODUCER_NAME WAITRON_PRODUCER_TAX_ID WAITRON_PRODUCER_ADDRESS; do
            expected=${!name}
            status=0
            inside=$(timeout 60 docker run --rm --pull never --entrypoint printenv "$CHECK_IMAGE" "$name") || status=$?
            if [ "$status" -ne 0 ]; then
              echo "could not read $name inside the built image (exit $status)" >&2
              failed=1
            elif [ "$inside" != "$expected" ]; then
              echo "$name inside the built image differs from its secret (${#inside} characters, the secret ${#expected})" >&2
              failed=1
            else
              echo "$name inside the built image matches its secret (${#inside} characters)"
            fi
          done
          exit "$failed"

      # The image's server program runs each fiscal module's start-up check of the settings, for
      # production. It prints error codes, setting names and reasons, never a value.
      - name: Run the box's own checks of the producer's settings in the built image
        env:
          CHECK_IMAGE: waitron-publish-check:local
        run: |
          set -euo pipefail
          timeout 120 docker run --rm --pull never --network none --entrypoint node "$CHECK_IMAGE" /app/server.js check-producer

      - name: Check the release inside the built image
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CHECK_IMAGE: waitron-publish-check:local
          RELEASE_VERSION: ${{ steps.tags.outputs.release_version }}
        run: |
          set -euo pipefail
          timeout 120 docker run --rm --pull never --network none --entrypoint node "$CHECK_IMAGE" /app/server.js check-release "$RELEASE_VERSION"

      # A published release is never replaced. Only these words mean "not published" (measured with
      # docker 29.9.3 against ghcr.io, 2026-11-12: a missing tag answers `manifest unknown`;
      # `no such manifest: ` is accepted as the same answer, unmeasured); any
      # other failure, such as `denied`, stops the publish. The app image is pushed last, so a version
      # whose app image exists is a whole publication and a retry after any failed push redoes both.
      - name: Refuse a release version the registry already holds
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_IMAGE: ${{ steps.tags.outputs.release_image }}
        run: |
          set -euo pipefail
          errors=$(mktemp)
          status=0
          timeout 60 docker manifest inspect "$RELEASE_IMAGE" >/dev/null 2>"$errors" || status=$?
          if [ "$status" -eq 0 ]; then
            echo "$RELEASE_IMAGE is already published; a release is never published twice" >&2
            exit 1
          elif grep -qE '^(manifest unknown|no such manifest: )' "$errors"; then
            echo "$RELEASE_IMAGE is not published yet"
          else
            cat "$errors" >&2
            echo "cannot ask the registry whether $RELEASE_IMAGE is published (exit $status)" >&2
            exit 1
          fi

      - name: Publish the print-agent image to GHCR
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          target: print-agent
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.agent_tags }}
          build-args: |
            WAITRON_BUILD_ID=${{ github.sha }}
            WAITRON_RELEASE_VERSION=${{ steps.tags.outputs.release_version }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.provenance.outputs.created }}
            org.opencontainers.image.ref.name=${{ github.head_ref || github.ref_name }}

      - name: Publish to GHCR
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            WAITRON_BUILD_ID=${{ github.sha }}
            WAITRON_RELEASE_VERSION=${{ steps.tags.outputs.release_version }}
            WAITRON_PRODUCER_NAME=${{ secrets.WAITRON_PRODUCER_NAME }}
            WAITRON_PRODUCER_TAX_ID=${{ secrets.WAITRON_PRODUCER_TAX_ID }}
            WAITRON_PRODUCER_ADDRESS=${{ secrets.WAITRON_PRODUCER_ADDRESS }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.provenance.outputs.created }}
            org.opencontainers.image.ref.name=${{ github.head_ref || github.ref_name }}

  # The GitHub Release's two files are copied out of the image publish pushed, so they are the box's
  # own, byte for byte. A re-run of this job alone replaces them; a re-run of the whole workflow
  # stops at publish, which refuses a version the registry already holds.
  release:
    needs: [publish]
    # As publish does, so an intended upstream skip cannot drop it.
    if: always() && !cancelled() && needs.publish.result == 'success' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job given `contents: write`, which making a Release needs.
    permissions:
      contents: write
      packages: read
    steps:
      - id: checkout
        name: Check out the code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
        timeout-minutes: 2
        continue-on-error: true
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: 1000
          GIT_HTTP_LOW_SPEED_TIME: 20
          GIT_TRACE2_EVENT: 1
      - name: Stop the first checkout's leftover git
        if: steps.checkout.outcome == 'failure'
        run: for p in $(pgrep '^git(-remote-https?)?$'); do [ "$(readlink /proc/$p/cwd)" = "$GITHUB_WORKSPACE" ] && kill -9 "$p" && echo "stopped git $p"; done; true
      - name: Check out the code, second attempt
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
        timeout-minutes: 2
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: 1000
          GIT_HTTP_LOW_SPEED_TIME: 20
          GIT_TRACE2_EVENT: 1
      - name: Measure checkout objects
        run: |
          git rev-parse --is-shallow-repository
          find "$(git rev-parse --git-path objects)/pack" -type f -name '*.pack' -exec wc -c {} +

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the published release image
        timeout-minutes: 6
        env:
          RELEASE_IMAGE: ${{ needs.publish.outputs.release_image }}
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            if timeout 150 docker pull "$RELEASE_IMAGE"; then
              exit 0
            fi
            echo "pulling $RELEASE_IMAGE failed (attempt $attempt)" >&2
          done
          exit 1

      - name: Attach the declaration to the GitHub Release
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.publish.outputs.release_version }}
          RELEASE_IMAGE: ${{ needs.publish.outputs.release_image }}
        run: |
          set -euo pipefail
          timeout 150 scripts/release/github-release.sh "$RELEASE_VERSION" "$RELEASE_IMAGE"
