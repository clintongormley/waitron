name: Server health
on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "5,10,20,25,35,40,50,55 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: write
  pull-requests: read
concurrency:
  group: server-health
  cancel-in-progress: false
jobs:
  check:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      LABEL_PREFIX: ${{ vars.DISPOSABLE_TESTS_LABEL_PREFIX || 'dt' }}
      HOSTED_ATTEMPTS: ${{ vars.DISPOSABLE_TESTS_HOSTED_ATTEMPTS }}
      CAPACITY: ${{ vars.DISPOSABLE_TESTS_CAPACITY }}
    steps:
      - id: checkout
        name: Check out the code
        uses: actions/checkout@v7
        timeout-minutes: 2
        continue-on-error: true
        with:
          ref: ${{ github.sha }}
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: 1000
          GIT_HTTP_LOW_SPEED_TIME: 20
          GIT_TRACE2_EVENT: 1
      - name: Stop the first checkout's leftover git
        if: steps.checkout.outcome == 'failure'
        run: for p in $(pgrep '^git(-remote-https?)?$'); do [ "$(readlink /proc/$p/cwd)" = "$GITHUB_WORKSPACE" ] && kill -9 "$p" && echo "stopped git $p"; done; true
      - name: Check out the code, second attempt
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v7
        timeout-minutes: 2
        with:
          ref: ${{ github.sha }}
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: 1000
          GIT_HTTP_LOW_SPEED_TIME: 20
          GIT_TRACE2_EVENT: 1
      - id: setup-node
        name: Set up Node
        uses: actions/setup-node@v7
        timeout-minutes: 2
        continue-on-error: true
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false
      - name: Set up Node, second attempt
        if: steps.setup-node.outcome == 'failure'
        uses: actions/setup-node@v7
        timeout-minutes: 2
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false

      - name: Recover untouched PR planning jobs
        timeout-minutes: 5
        run: node scripts/ci-server-health.mjs recover-planners
      - name: Check for a stalled server queue
        if: always()
        timeout-minutes: 5
        run: node scripts/ci-server-health.mjs check
      - name: Probe an idle server
        if: always() && github.event_name == 'schedule' && github.event.schedule == '*/15 * * * *' && vars.DISPOSABLE_TESTS_MODE == 'server'
        timeout-minutes: 3
        run: node scripts/ci-server-health.mjs probe
