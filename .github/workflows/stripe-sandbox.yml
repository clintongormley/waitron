name: stripe-sandbox

# The nightly-only counterpart to ci.yml's test-heavy/test-light shards: drives real Stripe
# test-mode against a simulated Terminal reader
# (packages/payments-stripe/src/collect.sandbox.test.ts), never as part of
# per-PR CI — network + secret dependent, so it runs on a cadence instead of gating merges. No
# Playwright/Chromium step: this suite is pure Node + the `stripe` SDK, no browser involved.

on:
  schedule:
    - cron: "0 4 * * *" # nightly, 04:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stripe-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Each checkout is three steps: docs/developers/ci-and-gates.md, "Every checkout is bounded".
      - id: checkout
        name: Check out the code
        uses: actions/checkout@v7
        timeout-minutes: 2
        continue-on-error: true
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: 1000
          GIT_HTTP_LOW_SPEED_TIME: 20
      - name: Stop the first checkout's leftover git
        if: steps.checkout.outcome == 'failure'
        run: for p in $(pgrep '^git(-remote-https?)?$'); do [ "$(readlink /proc/$p/cwd)" = "$GITHUB_WORKSPACE" ] && kill -9 "$p" && echo "stopped git $p"; done; true
      - name: Check out the code, second attempt
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v7
        timeout-minutes: 2
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: 1000
          GIT_HTTP_LOW_SPEED_TIME: 20

      - name: Set up pnpm
        timeout-minutes: 5
        run: bash scripts/ci-setup-pnpm.sh

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Self-skips cleanly (describe.skip) when STRIPE_SANDBOX_SECRET_KEY isn't configured as a
      # repository secret — see packages/payments-stripe/src/collect.sandbox.test.ts. The repo owner
      # must add that secret (a Stripe TEST-mode key) for this job to actually exercise Stripe rather
      # than report a skipped suite every night.
      - run: pnpm --filter @waitron/payments-stripe test:sandbox
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SANDBOX_SECRET_KEY }}
