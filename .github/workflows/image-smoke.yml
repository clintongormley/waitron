name: image-smoke

# The box image a restaurant actually runs: built, brought up on blank volumes, and smoke-tested.
# A REUSABLE workflow (`workflow_call`) with no trigger of its own, called from two places so its
# steps exist once: ci.yml's `image` job (scoped to image-input changes on a pull request, and gating
# `publish` on every main push) and image-nightly.yml (the scheduled + on-request safety net).
#
# It earns its place by proving two things no developer's machine can. First, the print agent
# reaches a stand-in BlueZ (scripts/fake-bluez.py) under its own AppArmor profile, an option Docker Desktop ignores (measured on 29.3.0;
# deploy/compose.yml). Second, the runner is real Linux, so deploy/compose.yml's `network_mode: host` is the SHIPPED profile here — and that namespace keeps
# the kernel's ip_unprivileged_port_start=1024, so a non-root process reaches 443 only because the
# image sets cap_net_bind_service on node. Docker Desktop's "host" network is its own Linux VM's, so
# a Mac stack-up has to override the file to bridge + published ports, and Docker's bridge namespace
# sets that floor to 0 — it binds 443 with no capability at all. The shape assertions below exist
# because that override is the easy mistake to make here: a job that smoke-tests a bridge stack
# passes everything and proves only what a laptop already proved.

on:
  workflow_call:

jobs:
  smoke:
    runs-on: ubuntu-latest
    # Naming any permission drops every default, so `contents: read` is restated. This job pushes
    # nothing to a registry — the GHCR publish is ci.yml's `publish` job, which holds `packages: write`.
    permissions:
      contents: read
    # Every compose invocation below reads these, so none of them can drift onto the wrong file or
    # the wrong project. The env file is deploy/.env — where waitron.sh puts a real box's, and
    # gitignored — so compose picks it up with no flag and interpolation cannot fail on a later
    # `ps` or `down`.
    env:
      COMPOSE_FILE: deploy/compose.yml
      COMPOSE_PROJECT_NAME: waitron-ci
    steps:
      - uses: actions/checkout@v7

      # deploy/.env is where waitron.sh puts a real box's and it is gitignored, so compose reads it
      # with no flag. It carries the two tags this job builds, so compose runs those rather than
      # resolving the published `:main` images and pulling them, and the AppArmor profile line
      # waitron.sh writes on a box with AppArmor. It is written first so every later step reads the
      # same file, the `if: always()` teardown included.
      - name: Point compose at the images this job builds
        run: |
          set -euo pipefail
          {
            echo "WAITRON_IMAGE=waitron:ci"
            echo "WAITRON_PRINT_AGENT_IMAGE=waitron-print-agent:ci"
            echo "WAITRON_PRINT_AGENT_APPARMOR=waitron-print-agent"
          } > deploy/.env

      # What waitron.sh does on a box with AppArmor, so the stack below runs the agent under the
      # shipped profile; compose would refuse to start it otherwise. The stand-in BlueZ is for the
      # Bluetooth check further down: the runner has no Bluetooth hardware or kernel module.
      - name: Load the print agent's AppArmor profile, and put a stand-in BlueZ on the system bus
        run: |
          set -euo pipefail
          [ "$(cat /sys/module/apparmor/parameters/enabled)" = "Y" ]
          sudo apparmor_parser -r deploy/apparmor/waitron-print-agent
          sudo apt-get install -y --no-install-recommends bluez python3-dbus python3-gi
          # The log path goes in as an argument: sudo drops RUNNER_TEMP from the root shell's environment.
          sudo sh -c 'python3 scripts/fake-bluez.py > "$1" 2>&1 &' sh "$RUNNER_TEMP/fake-bluez.log"
          for _ in $(seq 1 40); do grep -q "fake bluez ready" "$RUNNER_TEMP/fake-bluez.log" && break; sleep 0.25; done
          grep -q "fake bluez ready" "$RUNNER_TEMP/fake-bluez.log" || { cat "$RUNNER_TEMP/fake-bluez.log"; exit 1; }

      # These ports are bound in the HOST namespace — not by every container this job starts, but by
      # whichever services declare `network_mode: host` in deploy/compose.yml. A bridged service
      # publishes on loopback instead and is not what this check is about. A process already holding
      # one of these leaves the host-networked container that wants it unable to bind, and the
      # stack-up step further down then fails on its 300-second health timeout, naming neither the
      # port nor what is holding it.
      - name: Refuse to smoke against something already listening
        run: |
          set -euo pipefail
          for port in 443 9110; do
            if ss -ltn "( sport = :$port )" | grep -q LISTEN; then
              ss -ltn
              echo "port $port is already in use — the host-networked container that binds it would fail to start, and the stack-up below would report only a health timeout" >&2
              exit 1
            fi
          done

      # The default builder uses the `docker` driver, which does not serve the `cache-to: type=gha`
      # export below.
      - uses: docker/setup-buildx-action@v4

      # Loaded into the runner's daemon so `docker compose` can run it — this job never pushes. That
      # is ci.yml's `publish`, which therefore builds a second time on its own runner: it is gated on
      # the whole `ci` aggregate (its header says why), and this job also runs on pull requests,
      # which must not publish. Its build is the same single platform, so these are the layers it
      # looks for in the shared GHA cache scope.
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          load: true
          tags: waitron:ci
          build-args: WAITRON_BUILD_ID=${{ github.sha }}
          cache-from: type=gha
          # ignore-error, because a cache EXPORT failure is a slow build, not a broken image, and
          # this job gates the pull request.
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Build the print-agent image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          target: print-agent
          platforms: linux/amd64
          load: true
          tags: waitron-print-agent:ci
          build-args: WAITRON_BUILD_ID=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      # `--wait` blocks on the compose healthcheck, which passes on EITHER /health or
      # /setup-api/status — /health is 503 by design on a setup box, so waiting on that alone would
      # sit here for the whole timeout and then call a healthy box broken.
      - name: Bring the node up on blank volumes
        run: docker compose up -d --wait --wait-timeout 300

      - name: The setup surface answers over the box's own TLS
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"

          # -k, because the leaf is the box's own and serving the CA that signed it is exactly what
          # /setup-api/ca.crt is for — a client that already trusted it would not need the endpoint.
          code=$(curl -sk -o status.json -w '%{http_code}' https://127.0.0.1/setup-api/status)
          cat status.json
          echo
          [ "$code" = "200" ]
          # A blank box is unprovisioned and PREPRODUCTION: production is only ever reached by an
          # owner choosing it in the wizard, and an image that came up live would file for real.
          [ "$(jq -r .provisioned status.json)" = "false" ]
          [ "$(jq -r .environment status.json)" = "preproduction" ]

          code=$(curl -sk -o ca.crt -w '%{http_code}' https://127.0.0.1/setup-api/ca.crt)
          [ "$code" = "200" ]
          # A 200 carrying an error page would satisfy a status check on its own, so the body is
          # parsed and then checked against the leaf the box just served: this endpoint is worth
          # nothing unless what it hands back is the issuer a phone needs in order to trust that
          # leaf.
          openssl x509 -in ca.crt -noout -subject -issuer
          openssl x509 -in ca.crt -noout -text | grep -q "CA:TRUE"
          openssl s_client -connect 127.0.0.1:443 -showcerts </dev/null 2>/dev/null \
            | openssl x509 > leaf.pem
          openssl verify -CAfile ca.crt leaf.pem

      - name: The box binds 443 as a non-root process, under host networking
        run: |
          set -euo pipefail
          app=$(docker compose ps -q app)
          # The whole reason this job exists on a Linux runner. Everything above passes just as well
          # against a bridge network with `ports: ["443:443"]`, which proves nothing a Mac cannot.
          [ "$(docker inspect -f '{{.HostConfig.NetworkMode}}' "$app")" = "host" ]
          [ "$(docker exec "$app" id -u)" = "10001" ]
          docker exec "$app" getcap /usr/local/bin/node | grep -q cap_net_bind_service

      # The server loads sharp only when a photo is uploaded, so the healthy boot above proves nothing
      # about it. This loads it from /app the way the bundle does, and shrinks one generated picture.
      - name: The image carries a working sharp beside the bundle
        run: |
          set -euo pipefail
          app=$(docker compose ps -q app)
          docker exec "$app" node --input-type=module -e "
            const { default: sharp } = await import('sharp');
            const input = await sharp({ create: { width: 3200, height: 2400, channels: 3, background: 'tan' } }).jpeg().toBuffer();
            const { info } = await sharp(input).resize(1600, 1600, { fit: 'inside' }).webp().toBuffer({ resolveWithObject: true });
            if (info.format !== 'webp' || info.width !== 1600) throw new Error('unexpected ' + JSON.stringify(info));
            console.log('sharp', sharp.versions.sharp, 'libvips', sharp.versions.vips, info.width + 'x' + info.height);
          "
          docker exec "$app" sh -c 'test -s /app/third-party/licenses/LGPL-3.0.txt \
            && test -s /app/third-party/licenses/GPL-3.0.txt \
            && grep -q libvips /app/third-party/libvips/NOTICES.md \
            && test -s /app/third-party/libvips/versions.json \
            && grep -q "Written offer of source code" /app/third-party/README.md'

      # The build's own `litestream version` ran in the full node:26 stage as root. This runs the copy
      # the slim runtime carries, found on PATH the way the server's default finds it, as the user
      # the server runs as. The boot above configures no bucket, so the server never started it.
      - name: The image carries the pinned Litestream, runnable by the app user
        run: |
          set -euo pipefail
          app=$(docker compose ps -q app)
          pinned=$(sed -nE 's/^export const LITESTREAM_VERSION = "([0-9.]+)";$/\1/p' packages/stream/src/litestream.ts)
          [ -n "$pinned" ]
          [ "$(docker exec "$app" id -u)" = "10001" ]
          reported=$(docker exec "$app" litestream version)
          echo "litestream in the image: $reported; pinned: $pinned"
          [ "$reported" = "$pinned" ]
          docker exec "$app" sh -c 'test -s /app/third-party/licenses/Apache-2.0.txt \
            && grep -q "^## Litestream" /app/third-party/README.md'
          docker exec "$app" grep -qx "Litestream version: $pinned" /app/third-party/litestream/NOTICES.txt

      - name: The image carries the licence of the font printed text is drawn in
        run: |
          set -euo pipefail
          app=$(docker compose ps -q app)
          docker exec "$app" sh -c 'test -s /app/third-party/iosevka/LICENSE.md \
            && grep -q "SIL Open Font License" /app/third-party/iosevka/LICENSE.md \
            && grep -q "^## Iosevka" /app/third-party/README.md'

      - name: The print agent came up and picked up its server URL
        run: |
          set -euo pipefail
          # The whole point of the compose wiring: the agent process is running (the read-only /dev
          # mount, not a hard `devices:` line, is what lets it start on this printer-less runner), its
          # setup page answers on 9110, and it received WAITRON_SERVER_URL=https://127.0.0.1 from
          # compose. A failed CA fetch would still leave the page answering, so this asserts the
          # wiring, and the live box check (plan Task 9) asserts the join.
          agent=$(docker compose ps -q print-agent)
          [ "$(docker inspect -f '{{.State.Health.Status}}' "$agent")" = "healthy" ]
          code=$(curl -s -o status.json -w '%{http_code}' http://127.0.0.1:9110/status.json)
          cat status.json; echo
          [ "$code" = "200" ]
          [ "$(jq -r .serverUrl status.json)" = "https://127.0.0.1" ]

      # The agent here is never approved, so its job poll, which lists Bluetooth only once approved,
      # has not run: `bluetooth` in status.json can be set only by bin.ts's check at start-up or by
      # its timer. `available: true` proves one of the two ran in the agent's own process, under the
      # profile, and reached the stand-in BlueZ started before the stack; it does not say which of
      # the two. The 40 seconds cover one 30-second back-off after a failed first check, the timer's
      # 5-second tick and the listing's 3-second kill.
      - name: The print agent reports Bluetooth available before it has joined
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          for _ in $(seq 1 40); do
            if curl -s -o status.json http://127.0.0.1:9110/status.json \
              && jq -e '.bluetooth.available == true' status.json > /dev/null; then
              cat status.json; echo
              exit 0
            fi
            sleep 1
          done
          cat status.json; echo
          exit 1

      # The owner's box, 2026-09-29: under Docker's default profile the bus refused the agent's
      # `Hello` and bluetoothctl aborted, so no Bluetooth printer could ever appear. The agent here
      # runs under the shipped profile, as the unprivileged user, with compose's own socket mount;
      # the control is the same image and mount under docker-default, which must still be refused.
      - name: The print agent reaches a stand-in BlueZ under its profile, and Docker's default profile does not
        run: |
          set -euo pipefail
          agent=$(docker compose ps -q print-agent)
          [ "$(docker inspect -f '{{.AppArmorProfile}}' "$agent")" = "waitron-print-agent" ]
          docker exec "$agent" bluetoothctl --timeout 5 list | tee "$RUNNER_TEMP/bt-list.txt"
          grep -q "Controller 00:11:22:33:44:55 waitron-ci" "$RUNNER_TEMP/bt-list.txt"
          docker exec "$agent" bluetoothctl --timeout 5 devices Paired | tee "$RUNNER_TEMP/bt-paired.txt"
          grep -q "Device 66:55:44:33:22:11 CI Printer" "$RUNNER_TEMP/bt-paired.txt"
          # What the agent's scan asks of a listed device, to tell a printer from other devices.
          docker exec "$agent" bluetoothctl info 66:55:44:33:22:11 | tee "$RUNNER_TEMP/bt-info.txt"
          grep -q "Icon: printer" "$RUNNER_TEMP/bt-info.txt"
          # A device found during a scan, and a changed property, arrive only as BlueZ's signals.
          docker exec "$agent" bluetoothctl --timeout 3 scan on | tee "$RUNNER_TEMP/bt-scan.txt"
          grep -q "Device 11:22:33:44:55:66 Found" "$RUNNER_TEMP/bt-scan.txt"
          grep -q "Discovering: yes" "$RUNNER_TEMP/bt-scan.txt"

          set +e
          docker run --rm -u node --security-opt apparmor=docker-default \
            -v /run/dbus/system_bus_socket:/run/dbus/system_bus_socket \
            waitron-print-agent:ci bluetoothctl --timeout 5 devices Paired > "$RUNNER_TEMP/bt-control.txt" 2>&1
          control=$?
          set -e
          cat "$RUNNER_TEMP/bt-control.txt"
          [ "$control" -ne 0 ]
          grep -q 'connection != NULL' "$RUNNER_TEMP/bt-control.txt"
          if grep -q "CI Printer" "$RUNNER_TEMP/bt-control.txt"; then exit 1; fi

      # What an operator's interactive `scan off` and the agent's Pair and Forget run, under the shipped
      # profile: interactive bluetoothctl over pipes stops a scan it started and answers the stand-in's
      # PIN request, the stand-in follows the pairing with its `Disconnected` signals, and `remove`
      # forgets the printer again. A D-Bus refusal reaches the kernel log through the kernel's printk
      # rate limit, which drops lines: in
      # probe run 36585218089, under the previous rules in complain mode, one pairing and two removes
      # logged one AppArmor line with the limit on and nine with it off. So it is switched off first. `trust`, which the profile does
      # not allow, is the control: it must never reach the stand-in, its refusal must reach the log,
      # and it must be the only refusal logged since the count was taken.
      - name: The print agent stops a scan, pairs a PIN printer and forgets it under its profile, and is still refused what the profile does not list
        run: |
          set -euo pipefail
          agent=$(docker compose ps -q print-agent)
          sudo sysctl -w kernel.printk_ratelimit=0
          refusals() { sudo dmesg | grep 'apparmor="DENIED"' | grep 'label="waitron-print-agent"' || true; }
          before=$(refusals | wc -l)

          stops() { grep -c "fake bluez: StopDiscovery /org/bluez/hci0" "$RUNNER_TEMP/fake-bluez.log" || true; }
          stopped=$(stops)
          { sleep 2; echo "scan on"; sleep 2; echo "scan off"; sleep 2; echo quit; } \
            | docker exec -i "$agent" bluetoothctl > "$RUNNER_TEMP/bt-scan-off.txt" 2>&1
          cat "$RUNNER_TEMP/bt-scan-off.txt"
          [ "$(stops)" -gt "$stopped" ]
          grep -q "Discovery stopped" "$RUNNER_TEMP/bt-scan-off.txt"

          docker cp scripts/bluetoothctl-pair.mjs "$agent:/tmp/bluetoothctl-pair.mjs"
          docker exec "$agent" node /tmp/bluetoothctl-pair.mjs 86:67:7A:00:00:01 1234 | tee "$RUNNER_TEMP/bt-pair.txt"
          grep -q "Pairing successful" "$RUNNER_TEMP/bt-pair.txt"
          grep -qF "[SIGNAL] org.bluez.Bearer.BREDR1.Disconnected" "$RUNNER_TEMP/bt-pair.txt"
          grep -qF "[SIGNAL] org.bluez.Device1.Disconnected" "$RUNNER_TEMP/bt-pair.txt"
          grep -q "fake bluez: RequestPinCode reply '1234'" "$RUNNER_TEMP/fake-bluez.log"
          grep -q "fake bluez: Disconnected /org/bluez/hci0/dev_86_67_7A_00_00_01" "$RUNNER_TEMP/fake-bluez.log"

          docker exec "$agent" bluetoothctl remove 86:67:7A:00:00:01 | tee "$RUNNER_TEMP/bt-forget.txt"
          grep -q "Device has been removed" "$RUNNER_TEMP/bt-forget.txt"
          grep -q "fake bluez: RemoveDevice /org/bluez/hci0/dev_86_67_7A_00_00_01" "$RUNNER_TEMP/fake-bluez.log"

          set +e
          docker exec "$agent" bluetoothctl trust 66:55:44:33:22:11 > "$RUNNER_TEMP/bt-trust.txt" 2>&1
          trusted=$?
          set -e
          cat "$RUNNER_TEMP/bt-trust.txt"
          [ "$trusted" -ne 0 ]
          grep -q "org.freedesktop.DBus.Error.AccessDenied" "$RUNNER_TEMP/bt-trust.txt"
          if grep -q "fake bluez: Set " "$RUNNER_TEMP/fake-bluez.log"; then exit 1; fi
          for _ in $(seq 1 20); do
            [ "$(refusals | wc -l)" -gt "$before" ] && break
            sleep 0.25
          done
          refusals | tail -n +"$((before + 1))" | tee "$RUNNER_TEMP/bt-refusals.txt"
          grep -q 'member="Set"' "$RUNNER_TEMP/bt-refusals.txt"
          if grep -v 'member="Set"' "$RUNNER_TEMP/bt-refusals.txt"; then exit 1; fi

      # The agent's Bluetooth sender, invoked directly with its own arguments (not through
      # RfcommTransport), under the shipped profile. The runner's kernel has no Bluetooth at all
      # (probe run 36656859928 on 6.17.0-1022-azure: `modprobe bluetooth` found no module), so the
      # socket can never open here and Python reports errno 97 — which is also what a container
      # outside the host's network namespace gets on a kernel with Bluetooth (`bt_sock_create`,
      # net/bluetooth/af_bluetooth.c:118 on torvalds/linux master, read 2026-09-30), so this step
      # cannot tell those apart. A profile refusal reports errno 13 instead, as the same probe
      # printed under the profile plus `deny network bluetooth`; that is the one socket error this
      # step tells apart. A job reaching a real printer is checked only on the box.
      - name: The print agent's Bluetooth sender runs in the image, and its profile does not refuse the socket
        run: |
          set -euo pipefail
          agent=$(docker compose ps -q print-agent)
          set +e
          printf 'x' | docker exec -i "$agent" python3 /app/rfcomm-send.py 66:55:44:33:22:11 1 5 > "$RUNNER_TEMP/bt-send.txt" 2>&1
          sent=$?
          set -e
          cat "$RUNNER_TEMP/bt-send.txt"
          [ "$sent" -eq 1 ]
          grep -qF "rfcomm 66:55:44:33:22:11 channel 1: [Errno " "$RUNNER_TEMP/bt-send.txt"
          if grep -qF "[Errno 13]" "$RUNNER_TEMP/bt-send.txt"; then exit 1; fi

      - name: The print-agent image carries its Python's copyright files
        run: |
          set -euo pipefail
          agent=$(docker compose ps -q print-agent)
          docker exec "$agent" cat /app/third-party/python3-minimal/PACKAGES.txt
          docker exec "$agent" sh -c "grep -q '^python3-minimal ' /app/third-party/python3-minimal/PACKAGES.txt \
            && test -s /app/third-party/python3-minimal/python3-minimal/copyright"

      - name: Tear the stack down, volumes and all
        if: always()
        run: docker compose down -v --remove-orphans
