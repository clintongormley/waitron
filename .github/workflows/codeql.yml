name: CodeQL

# Nightly on the default branch and on request only, never on a push or a pull request (owner,
# 2026-10-11, A488), and it caches nothing: docs/developers/ci-and-gates.md, "CodeQL scans `main`
# nightly, and nothing waits for it".

on:
  schedule:
    - cron: "37 1 * * *" # nightly, 01:37 UTC — clear of image-nightly (03:00), stripe-sandbox (04:00) and mutation (05:00)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CODEQL_OVERLAY_DATABASE_MODE: none

jobs:
  analyze:
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, c-cpp, javascript-typescript, python]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          trap-caching: false

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
