name: licence

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  licence-integrity:
    name: LICENSE is unmodified Elastic License 2.0
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Verify LICENSE byte-for-byte
        run: |
          echo "48255018b41fc0e965b1115af7e6779bc218bb8a6747d561da800d5022622aa2  LICENSE" \
            | sha256sum -c -

  # `name:` IS the interface to branch protection. Ruleset 19899160 requires the context "Every
  # commit is signed off" (read back on 2026-08-01 with `gh api repos/:owner/:repo/rulesets/
  # 19899160`), which is this string — renaming the job silently stops it matching, and a required
  # check that never reports leaves every pull request waiting for a status that is not coming.
  #
  # The predicate and the per-commit walk are scripts/check-signoff.sh, which .husky/pre-push runs
  # too. Until 2026-08-01 the two carried byte-identical copies of
  # `grep -qiE '^Signed-off-by: .+ <.+@.+>'` and of the loop around it; the whole value of the hook's
  # copy is that it agrees with this one, and two copies is not how that is kept true.
  #
  # This job installs nothing — no pnpm, no setup-node — which is why the shared file is `sh` and
  # not `.mjs`. See scripts/check-signoff.test.mjs's header for that decision and the tests.
  #
  # It checks every push to main as well as every pull request: documentation goes to main by a
  # direct push, and the hook's sign-off check can be skipped or fooled locally.
  dco:
    name: Every commit is signed off
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check Signed-off-by trailers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Both refusals below fail closed: a range that cannot be listed is not a passed check.
          case "$BASE_SHA" in
          *[!0]*) ;;
          *)
            echo "::error::This push names no earlier tip (before is all zeros), so its commits cannot be listed"
            exit 1
            ;;
          esac
          if ! commits=$(git rev-list "$BASE_SHA".."$HEAD_SHA"); then
            echo "::error::Could not enumerate the commits in $BASE_SHA..$HEAD_SHA"
            exit 1
          fi
          # The range stays here rather than in the script: this one is a pull request's or a push's,
          # and the hook's is accumulated per pushed ref. Only the predicate and the walk are shared.
          if missing=$(printf '%s\n' "$commits" | scripts/check-signoff.sh); then
            echo "All commits signed off."
            exit 0
          fi
          # One annotation per failing commit, which is this job's own reporting — the script writes
          # the commits and nothing else to stdout precisely so this can wrap them.
          printf '%s\n' "$missing" | while IFS= read -r line; do
            if [ -n "$line" ]; then echo "::error::Missing Signed-off-by: $line"; fi
          done
          echo "Sign off with: git commit -s   (or: git rebase --signoff <base>)"
          exit 1
