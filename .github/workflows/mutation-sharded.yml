name: Sharded mutation testing

on:
  workflow_call:
    inputs:
      package:
        type: string
        required: true
      shards:
        type: string
        required: true
      browser:
        type: boolean
        required: true
      minutes:
        type: number
        required: true

permissions:
  contents: read

env:
  PACKAGE: ${{ inputs.package }}
  SHARDS: ${{ inputs.shards }}

jobs:
  mutation:
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.shards) }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.minutes }}
    steps:
      - id: checkout
        name: Check out the code
        uses: actions/checkout@v7
        timeout-minutes: 2
        continue-on-error: true
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: 1000
          GIT_HTTP_LOW_SPEED_TIME: 20
      - name: Stop the first checkout's leftover git
        if: steps.checkout.outcome == 'failure'
        run: for p in $(pgrep '^git(-remote-https?)?$'); do [ "$(readlink /proc/$p/cwd)" = "$GITHUB_WORKSPACE" ] && kill -9 "$p" && echo "stopped git $p"; done; true
      - name: Check out the code, second attempt
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v7
        timeout-minutes: 2
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: 1000
          GIT_HTTP_LOW_SPEED_TIME: 20

      - name: Set up pnpm
        timeout-minutes: 5
        run: bash scripts/ci-setup-pnpm.sh

      - id: setup-node
        name: Set up Node
        uses: actions/setup-node@v7
        timeout-minutes: 2
        continue-on-error: true
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - name: Set up Node, second attempt
        if: steps.setup-node.outcome == 'failure'
        uses: actions/setup-node@v7
        timeout-minutes: 2
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Resolve installed Playwright version
        if: inputs.browser
        id: playwright-version
        run: echo "version=$(pnpm --filter "@waitron/$PACKAGE" exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: inputs.browser
        uses: actions/cache@v6
        id: browser-cache
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Clear incomplete browser cache
        if: steps.browser-cache.outcome == 'failure'
        timeout-minutes: 1
        run: rm -rf -- "$HOME/.cache/ms-playwright"

      - name: Install Chromium
        if: inputs.browser
        run: pnpm --filter "@waitron/$PACKAGE" exec playwright install chromium

      - name: Run mutation shard ${{ matrix.shard }} of ${{ strategy.job-total }}
        env:
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ strategy.job-total }}
        run: |
          set -euo pipefail
          FILES=$(node scripts/mutation-shard.mjs "$PACKAGE" "$SHARD" "$TOTAL")
          if [ -z "$FILES" ]; then
            echo "shard $SHARD/$TOTAL selected no files — refusing to run stryker with an empty --mutate" >&2
            exit 1
          fi
          echo "Shard $SHARD/$TOTAL mutates: $FILES"
          pnpm --filter "@waitron/$PACKAGE" exec stryker run --mutate "$FILES"

      - id: upload_blob
        name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        timeout-minutes: 1
        continue-on-error: true
        with:
          name: mutation-report-${{ inputs.package }}-shard-${{ matrix.shard }}
          path: packages/${{ inputs.package }}/reports/mutation/
          retention-days: 30

      - name: Retry artifact upload
        if: always() && steps.upload_blob.outcome == 'failure'
        uses: actions/upload-artifact@v7
        timeout-minutes: 1
        with:
          name: mutation-report-${{ inputs.package }}-shard-${{ matrix.shard }}
          path: packages/${{ inputs.package }}/reports/mutation/
          retention-days: 30
          overwrite: true

  aggregate:
    needs: mutation
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: checkout
        name: Check out the code
        uses: actions/checkout@v7
        timeout-minutes: 2
        continue-on-error: true
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: 1000
          GIT_HTTP_LOW_SPEED_TIME: 20
      - name: Stop the first checkout's leftover git
        if: steps.checkout.outcome == 'failure'
        run: for p in $(pgrep '^git(-remote-https?)?$'); do [ "$(readlink /proc/$p/cwd)" = "$GITHUB_WORKSPACE" ] && kill -9 "$p" && echo "stopped git $p"; done; true
      - name: Check out the code, second attempt
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v7
        timeout-minutes: 2
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: 1000
          GIT_HTTP_LOW_SPEED_TIME: 20

      - id: setup-node
        name: Set up Node
        uses: actions/setup-node@v7
        timeout-minutes: 2
        continue-on-error: true
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false
      - name: Set up Node, second attempt
        if: steps.setup-node.outcome == 'failure'
        uses: actions/setup-node@v7
        timeout-minutes: 2
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false

      - id: download
        name: Download every shard report
        uses: actions/download-artifact@v8
        timeout-minutes: 1
        continue-on-error: true
        with:
          pattern: mutation-report-${{ inputs.package }}-shard-*
          path: mutation-reports

      - name: Clear the partial artifact download
        if: steps.download.outcome == 'failure'
        timeout-minutes: 1
        run: rm -rf -- "mutation-reports"

      - name: Download every shard report, second attempt
        if: steps.download.outcome == 'failure'
        uses: actions/download-artifact@v8
        timeout-minutes: 1
        with:
          pattern: mutation-report-${{ inputs.package }}-shard-*
          path: mutation-reports

      - name: Score the package
        run: |
          set -euo pipefail
          TOTAL=$(node -e 'console.log(JSON.parse(process.env.SHARDS).length)')
          node scripts/mutation-aggregate.mjs mutation-reports --package "$PACKAGE" --shards "$TOTAL" --break 90
