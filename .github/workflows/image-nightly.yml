name: image-nightly

# Manual image qualification; full ci.yml now owns the nightly smoke.

on:
  workflow_dispatch:

# A newer manual check of the same ref supersedes its previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    permissions:
      contents: read
    uses: ./.github/workflows/image-smoke.yml
