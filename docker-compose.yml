# Local development Postgres for `pnpm dev:setup` / `pnpm dev`.
#
# Throwaway PREPRODUCTION data only — never point real/production data at this container. The named
# volume persists the provisioned venue across restarts (so `dev:setup` reuses it rather than minting
# a new fiscal chain); `docker compose down -v` wipes it, which is the sanctioned "start over" that
# `pnpm dev:reset` runs.
services:
  db:
    # `wa-wt` starts this service under the fixed `waitron` Compose project. Keeping Mailpit as its
    # dependency makes the email sink shared too, without letting each worktree's `pnpm dev` create
    # a competing container on the fixed SMTP/UI ports.
    depends_on:
      - mailpit
    image: postgres:18-alpine
    # Native logical replication (swap step 4): `wal_level=logical` + `track_commit_timestamp=on` are
    # RESTART-required cluster settings (`PGC_POSTMASTER`), so they live here rather than in an
    # `ALTER SYSTEM` (which dev-setup's replication bootstrap does for the reloadable
    # `max_slot_wal_keep_size`). This makes a dev box publishable/subscribable, matching the box
    # image's `postgresql.conf`.
    command:
      [
        "postgres",
        "-c",
        "wal_level=logical",
        "-c",
        "track_commit_timestamp=on",
        "-c",
        "max_slot_wal_keep_size=4GB",
      ]
    environment:
      POSTGRES_PASSWORD: pg
    ports:
      - "5432:5432"
    # Postgres 18+ places its data in a SUBDIRECTORY of /var/lib/postgresql (not directly in
    # /var/lib/postgresql/data as ≤17 did) — mounting the volume at the old /data path makes the
    # container detect "data in an unused mount" and exit(1). Mount the parent, per the image's own
    # 18+ guidance (docker-library/postgres#37).
    volumes:
      - waitron-dev-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Development-only SMTP capture. Waitron submits mail on 1025; open http://localhost:8025 to read
  # invitations and password resets without sending anything to the public internet.
  mailpit:
    image: axllent/mailpit:v1.31.1
    environment:
      MP_MAX_MESSAGE_SIZE: 1
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  waitron-dev-db:
