# Local development services for `pnpm dev:setup` / `pnpm dev`.
#
# Mailpit is the only one. A dev venue is a DIRECTORY of SQLite files on the host — no server and no
# container — so nothing here holds data: `pnpm dev:reset` removes that directory itself
# (`resetVenueDir`, `apps/server/scripts/dev-setup.ts`) and this file has no volume to reset.
# Compose is still in the loop for one reason: the dev email flow needs somewhere to deliver to.
services:
  # Development-only SMTP capture. Waitron submits mail on 1025; open http://localhost:8025 to read
  # invitations and password resets without sending anything to the public internet.
  #
  # `wa-wt` starts this under the fixed `waitron` Compose project, because Compose otherwise names
  # the project after the directory and each worktree would race for the fixed SMTP and UI ports.
  mailpit:
    image: axllent/mailpit:v1.31.1
    environment:
      MP_MAX_MESSAGE_SIZE: 1
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
